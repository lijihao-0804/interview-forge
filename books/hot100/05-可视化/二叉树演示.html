<script id="hot100-embed-bootstrap">
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('embed') !== '1') return;
  document.documentElement.classList.add('hot100-embedded');
  if (params.has('panel')) document.documentElement.classList.add('hot100-single-panel');
})();
</script>

<script>
/* ===== 二叉树演示：14 道题 · 统一框架 ===== */
var TREE = [3, 9, 20, null, null, 15, 7];          // 示例 1 通用树（105/226 等共用变体见各题）

/* 数组(层序) → 树；节点带 id（层序编号）便于高亮 */
function toTree(arr) {
  if (!arr.length) return null;
  var root = { val: arr[0], id: "0", left: null, right: null };
  var queue = [root], i = 1;
  while (queue.length && i < arr.length) {
    var n = queue.shift();
    if (i < arr.length && arr[i] !== null) {
      n.left = { val: arr[i], id: String(i), left: null, right: null };
      queue.push(n.left);
    }
    i++;
    if (i < arr.length && arr[i] !== null) {
      n.right = { val: arr[i], id: String(i), left: null, right: null };
      queue.push(n.right);
    }
    i++;
  }
  return root;
}
function height(n) { return n ? 1 + Math.max(height(n.left), height(n.right)) : 0; }

/* 树渲染：SVG。view = { tree, hl:[id], done:[id], cur:id, side:{标题:内容}, path:[id] } */
function drawTree(view, stage) {
  var root = view.tree;
  // 增量建树的题目（105/108）一开始树还是空的，给个占位，别让舞台一片空白。
  if (!root) {
    stage.textContent = "";
    var empty = document.createElement("div");
    empty.style.cssText = "height:100%;display:flex;align-items:center;justify-content:center;color:var(--dk-muted);font-size:13px";
    empty.textContent = "树还是空的 —— 下一步就会长出第一个节点";
    stage.appendChild(empty);
    return;
  }
  var H = height(root) || 1;
  // 宽度按节点数给足，否则四层以上的树会把节点挤成一团（viewBox 会自动缩放回容器）。
  var N = countNodes(root);
  var W = Math.max(560, stage.clientWidth || 640, N * 48 + 90);
  var rowH = Math.min(74, 360 / H);
  var pos = {};
  var col = 0;
  (function assign(n, d) {
    if (!n) return;
    assign(n.left, d + 1);
    pos[n.id] = { x: 46 + (col++) * ((W - 90) / Math.max(1, N - 1) || 60), y: 40 + d * rowH };
    assign(n.right, d + 1);
  })(root, 0);
  function countNodes(n) { return n ? 1 + countNodes(n.left) + countNodes(n.right) : 0; }
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  var Ht = 40 + (H - 1) * rowH + 62;   // 最后一行只需留住节点半径和标签，不必再空一整行
  svg.setAttribute("width", "100%"); svg.setAttribute("height", Ht);
  svg.setAttribute("viewBox", "0 0 " + W + " " + Ht);
  var hl = view.hl || [], done = view.done || [], path = view.path || [];
  // 连线和节点都必须属于 SVG 命名空间；DemoKit.el 使用的是 HTML
  // document.createElement，不能用来创建 SVG 的 <g> 容器。
  var edges = document.createElementNS(svgNS, "g");
  (function drawEdges(n) {
    if (!n) return;
    [[n.left, "L"], [n.right, "R"]].forEach(function (p) {
      if (!p[0]) return;
      var a = pos[n.id], b = pos[p[0].id];
      var onPath = path.indexOf(n.id) >= 0 && path.indexOf(p[0].id) >= 0;
      var line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", a.x); line.setAttribute("y1", a.y + 16);
      line.setAttribute("x2", b.x); line.setAttribute("y2", b.y - 16);
      line.style.stroke = onPath ? "var(--dk-brand)" : "var(--dk-line)";
      line.style.strokeWidth = onPath ? 2.6 : 1.6;
      edges.appendChild(line);
    });
    drawEdges(n.left); drawEdges(n.right);
  })(root);
  svg.appendChild(edges);
  (function drawNodes(n) {
    if (!n) return;
    var p = pos[n.id];
    var isCur = view.cur === n.id, inHl = hl.indexOf(n.id) >= 0, inDone = done.indexOf(n.id) >= 0;
    var g = document.createElementNS(svgNS, "g");
    var c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 17);
    c.style.fill = isCur ? "var(--dk-brand)" : inHl ? "var(--dk-brand-soft)"
      : inDone ? "color-mix(in srgb, var(--dk-ok) 16%, var(--dk-panel))" : "var(--dk-panel)";
    c.style.stroke = isCur ? "var(--dk-brand-strong)" : inDone ? "var(--dk-ok)"
      : inHl ? "var(--dk-brand)" : "var(--dk-line)";
    c.style.strokeWidth = isCur ? 2.6 : 1.6;
    g.appendChild(c);
    var label = n.val === null ? "null" : String(n.val);
    var tx = document.createElementNS(svgNS, "text");
    tx.setAttribute("x", p.x); tx.setAttribute("y", p.y + 5);
    tx.setAttribute("text-anchor", "middle");
    tx.style.fill = inDone ? "var(--dk-muted)" : "var(--dk-text)";
    tx.setAttribute("font-size", 13); tx.setAttribute("font-weight", 650);
    tx.textContent = label;
    g.appendChild(tx);
    if (view.cur === n.id) {
      var tag = document.createElementNS(svgNS, "text");
      tag.setAttribute("x", p.x); tag.setAttribute("y", p.y - 24);
      tag.setAttribute("text-anchor", "middle");
      tag.style.fill = "var(--dk-brand)"; tag.setAttribute("font-size", 12); tag.setAttribute("font-weight", 700);
      tag.textContent = "◀ 当前";
      g.appendChild(tag);
    }
    svg.appendChild(g);
    drawNodes(n.left); drawNodes(n.right);
  })(root);
  stage.textContent = "";
  stage.appendChild(svg);
  if (view.phase) {
    var phase = document.createElement("div");
    phase.className = "teaching-phase";
    phase.textContent = String(view.phase);
    stage.appendChild(phase);
  }
  if (view.side) {
    var box = document.createElement("div");
    box.style.cssText = "margin-top:12px;display:flex;gap:8px;flex-wrap:wrap";
    Object.keys(view.side).forEach(function (k) {
      var n = document.createElement("span");
      n.className = "dk-var";
      n.innerHTML = "<b>" + k + ":</b> " + String(view.side[k]);
      box.appendChild(n);
    });
    stage.appendChild(box);
  }
}

function treeOf(arr) { return { tree: toTree(arr) }; }
var el = DemoKit.el;   // 页面级别名：drawTree 里使用 kit 的 DOM 构造器

/* ===== 14 个题的演示定义 ===== */
/* ===== 题例数据：一律用四层以上的树，浅树看不出算法在做什么 ===== */
var T94  = [6, 3, 8, 2, 5, 7, 9, 1];                       // 四层 BST，中序恰好升序
var T98  = [8, 4, 12, 2, 6, 9, 14, null, null, 5, 11];     // 11 > 祖先 8：局部合法、全局非法

var T104 = [3, 9, 20, null, null, 15, 7, null, null, 6, 2];// 左 2 层右 4 层，极不平衡
var P105 = [1, 2, 4, 5, 8, 9, 3, 6, 7];                    // 前序

var T114 = [1, 2, 5, 3, 4, null, 6, 7, 8];                 // 四层，展开中间态才有看头

var T230 = [8, 4, 12, 2, 6, 10, 14, 1, 3, 5, 7];           // 11 节点四层 BST
var T236 = [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4];
var T437 = [10, 5, -3, 3, 2, null, 11, 3, -2, null, 1];
var T543 = [1, 2, 3, 4, 5, null, null, 6, null, null, 7, 8, null, null, 9]; // 直径不经过根

var DEMOS = {
  /* ── 94 中序遍历 ─────────────────────────────────────────────────────────
     题例换成四层 BST，中序结果恰好是 1..9 的升序，方便当场验证"BST 中序 = 升序"。 */
  "0094": {

    code: {

        ],

          "void inorder(TreeNode* n) {",
          "  if (n == nullptr) return;",
          "  inorder(n->left);      // 左",

          "  inorder(n->right);     // 右",

        ],

          "    inorder(n.left)          # 左",

          "    inorder(n.right)         # 右",
          "# 递归返回，就是回到父节点"
        ],
        go: [
          "func inorder(n *TreeNode) {",
          "    if n == nil { return }",
          "    inorder(n.Left)          // 左",
          "    out = append(out, n.Val) // 根",
          "    inorder(n.Right)         // 右",
          "}"
        ],
        c: [
          "void inorder(struct TreeNode* n) {",
          "    if (n == NULL) return;",

    },
    invariants: [
      { label: "输出始终升序（BST 性质）", test: function (v) { return v.out.every(function (x, i) { return i === 0 || v.out[i - 1] < x; }); } },
      { label: "已输出", test: function (v) { return v.out.length + " / 8 个节点"; } }
    ],
    compare: {
      label: "写错顺序：先根后左（其实是前序）",
      build: function (ctx) {
        var root = toTree(T94), out = [], done = [];
        (function go(n) {
          if (!n) return;
          out.push(n.val); done.push(n.id);
          ctx.step("先访问 " + n.val + " 再下潜 → 输出 " + out.join(","),
            { tree: root, cur: n.id, done: done.slice(), out: out.slice(), side: { 输出: out.join(",") } });
          go(n.left); go(n.right);
        })(root);
        ctx.step("输出 " + out.join(",") + "：不是升序，说明这不是中序", { tree: root, done: done, out: out, side: { 输出: out.join(",") } });
      }
    },
    build: function (ctx) {
      var root = toTree(T94), out = [], done = [], stack = [];
      function V(extra) {
        var v = { tree: root, done: done.slice(), out: out.slice(),
          side: { 调用栈: stack.join("→") || "空", 输出: out.join(",") || "空" } };
        Object.keys(extra || {}).forEach(function (k) { v[k] = extra[k]; });
        return v;
      }
      ctx.step("中序 = 左 → 根 → 右。这是一棵 BST，所以输出必然是升序，可以当场验算", V(), { line: 1 });
      (function go(n) {
        stack.push(n.val);
        ctx.phase("recursive_enter", "进入 " + n.val + "：" + (n.left ? "左边还有 " + n.left.val + "，先下潜" : "左边是空的，马上就能访问自己"),

        ctx.phase("visit", "左子树彻底结束 → 现在才轮到 " + n.val + "，写入输出", V({ cur: n.id, hl: [n.id] }), { line: 4 });

        }
        stack.pop();
        ctx.phase("recursive_return", n.val + " 的左右都完成，回到父节点", V(), { line: 6 });
      })(root);
      ctx.phase("done", "完成！输出 " + out.join(",") + " —— 严格升序，印证了 BST 的中序性质", V({ done: done }), { line: 6 });
    },
    render: drawTree

  /* ── 98 验证 BST ─────────────────────────────────────────────────────────
     关键坑：只比较父子是不够的。这里的 11 相对父节点 6 合法，却大于祖先 8。 */
  "0098": {
    no: "98", title: "验证二叉搜索树", tag: "二叉树 · 递归 + 值域",
    example: "输入：root = [8,4,12,2,6,9,14,null,null,5,11]　输出：false（11 > 祖先 8）",
    code: {
      title: "值域递归",

          "    if (n == null) return true;",
          "    if (n.val <= lo || n.val >= hi)",
          "        return false;          // 越界即失败",
          "    return valid(n.left,  lo, n.val)",
          "        && valid(n.right, n.val, hi);",
          "}"
        ],
        cpp: [
          "bool valid(TreeNode* n, long lo, long hi) {",
          "  if (n == nullptr) return true;",
          "  if (n->val <= lo || n->val >= hi)",
          "    return false;          // 越界即失败",
          "  return valid(n->left,  lo, n->val)",

        ],

          "    if not (lo < n.val < hi):",

          "    return (valid(n.left,  lo, n.val)",

          "    if n == nil { return true }",
          "    if n.Val <= lo || n.Val >= hi {",
          "        return false }         // 越界即失败",

    ],

            { tree: root, cur: n.id, done: checked.slice(), ok: okL && okR, side: { 判定: okL && okR ? "通过" : "失败" } });

    },
    build: function (ctx) {

      (function go(n, lo, hi) {

        var rng = "(" + fmt(lo) + ", " + fmt(hi) + ")";

          ctx.step("往左走：" + n.left.val + " 的上界收紧为 " + n.val, { tree: root, cur: n.id, ok: true, range: rng }, { line: 5 });
          go(n.left, lo, n.val);

     主线用满四层的对称树；反例用"左右子树形状相同但不是镜像"的经典错例。 */
  "0101": {
    no: "101", title: "对称二叉树", tag: "二叉树 · 镜像递归",
