<script>
/* ===== 二叉树演示：14 道题 · 统一框架 ===== */
var TREE = [3, 9, 20, null, null, 15, 7];          // 示例 1 通用树（105/226 等共用变体见各题）

/* 数组(层序) → 树；节点带 id（层序编号）便于高亮 */
function toTree(arr) {
  if (!arr.length) return null;
  var root = { val: arr[0], id: "0", left: null, right: null };
  var queue = [root], i = 1;
  while (queue.length && i < arr.length) {
    var n = queue.shift();
    if (i < arr.length && arr[i] !== null) {
      n.left = { val: arr[i], id: String(i), left: null, right: null };
      queue.push(n.left);
    }
    i++;
    if (i < arr.length && arr[i] !== null) {
      n.right = { val: arr[i], id: String(i), left: null, right: null };
      queue.push(n.right);
    }
    i++;
  }
  return root;
}
function height(n) { return n ? 1 + Math.max(height(n.left), height(n.right)) : 0; }

/* 树渲染：SVG。view = { tree, hl:[id], done:[id], cur:id, side:{标题:内容}, path:[id] } */
function drawTree(view, stage) {
  var root = view.tree;
  var H = height(root) || 1;
  var W = Math.max(560, stage.clientWidth || 640);
  var rowH = Math.min(74, 340 / H);
  var pos = {};
  var col = 0;
  (function assign(n, d) {
    if (!n) return;
    assign(n.left, d + 1);
    pos[n.id] = { x: 46 + (col++) * ((W - 90) / Math.max(1, countNodes(root) - 1) || 60), y: 40 + d * rowH };
    assign(n.right, d + 1);
  })(root, 0);
  function countNodes(n) { return n ? 1 + countNodes(n.left) + countNodes(n.right) : 0; }
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  var Ht = 40 + H * rowH + 46;
  svg.setAttribute("width", "100%"); svg.setAttribute("height", Ht);
  svg.setAttribute("viewBox", "0 0 " + W + " " + Ht);
  var hl = view.hl || [], done = view.done || [], path = view.path || [];
  var edges = el("g");
  (function drawEdges(n) {
    if (!n) return;
    [[n.left, "L"], [n.right, "R"]].forEach(function (p) {
      if (!p[0]) return;
      var a = pos[n.id], b = pos[p[0].id];
      var onPath = path.indexOf(n.id) >= 0 && path.indexOf(p[0].id) >= 0;
      var line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", a.x); line.setAttribute("y1", a.y + 16);
      line.setAttribute("x2", b.x); line.setAttribute("y2", b.y - 16);
      line.style.stroke = onPath ? "var(--dk-brand)" : "var(--dk-line)";
      line.style.strokeWidth = onPath ? 2.6 : 1.6;
      edges.appendChild(line);
    });
    drawEdges(n.left); drawEdges(n.right);
  })(root);
  svg.appendChild(edges);
  (function drawNodes(n) {
    if (!n) return;

  "0236": { no: "236", title: "二叉树的最近公共祖先", tag: "二叉树 · 后序递归",

      var target = 8, count = 0;
      var prefix = { 0: 1 }, cur = 0;
      var order = [];
      function go(n) {
        if (!n) { ctx.step("空节点，返回", { tree: root, side: { 路径和: cur, 计数: count } }); return; }
        cur += n.val; order.push(n.id);
        var need = cur - target;
        var hit = prefix[need] || 0;
        var before = prefix[cur] || 0;
        count += hit;
        ctx.step("到达 " + n.val + "：前缀和 = " + cur + "，需要历史前缀 " + need + "（出现 " + hit + " 次）→ 找到 " + hit + " 条路径",
          { tree: root, cur: n.id, hl: [n.id], side: { 路径和: cur, 命中: hit, 计数: count } });
        prefix[cur] = (prefix[cur] || 0) + 1;
        ctx.step("登记当前前缀和 " + cur + "，继续向下（回溯时要撤销）", { tree: root, done: order.slice(), side: { 前缀表: JSON.stringify(prefix) } });
        go(n.left); go(n.right);
        prefix[cur] -= 1; cur -= n.val; order.pop();
        ctx.step("回溯离开 " + n.val + "：撤销前缀登记（防止跨分支误配）", { tree: root, side: { 路径和: cur, 计数: count } });
      }
      ctx.step("前缀和 + 回溯：路径和 = cur − 历史前缀 = target 时命中；map 记录历史前缀出现次数", tree);
      go(root);
      ctx.step("完成！和为 " + target + " 的路径共 " + count + " 条", { tree: root, side: { 答案: count } });
    },
    render: drawTree },

  "0543": { no: "543", title: "二叉树的直径", tag: "二叉树 · 后序递归",
    example: "输入：root = [1,2,3,4,5]　输出：3（路径 4→2→1→3 或 5→2→1→3）",
    build: function (ctx) {
      var root = toTree([1, 2, 3, 4, 5]);
      var best = 0, bestPair = [2, 3];
      function go(n, d) {
        if (!n) { ctx.step("空节点，深度 0", { tree: root, side: { 最大直径: best } }); return 0; }
        ctx.step("进入 " + n.val, { tree: root, cur: n.id });
        var L = go(n.left, d + 1), R = go(n.right, d + 1);
        var through = L + R + 1;
        if (through > best) { best = through; bestPair = [n.left ? n.left.val : "—", n.right ? n.right.val : "—"]; }
        ctx.step(n.val + "：左深 " + L + " + 右深 " + R + " + 1 = 经过它的路径长 " + through + "（历史最大 " + best + "）",
          { tree: root, cur: n.id, side: { 左深: L, 右深: R, 最大直径: best } });
        return Math.max(L, R) + 1;
      }
      ctx.step("直径 = 某节点左右子树深度之和最大值；后序遍历自底向上统计", treeOf([1, 2, 3, 4, 5]));
      go(root, 0);
      ctx.step("完成！最大直径 = " + best + "（节点 " + bestPair[0] + " → " + bestPair[1] + "，经过它们的公共祖先）",
        { tree: root, side: { 答案: best } });
    },
    render: drawTree }
};

</script>

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
