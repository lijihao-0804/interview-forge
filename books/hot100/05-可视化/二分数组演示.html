<script>
/* ===== 二分查找 · 数组操作：7 道题 ===== */
var el = DemoKit.el;

function cells(vals, st, ptrs) {
  var wrap = el("div", "dk-cells");
  vals.forEach(function (v, i) {
    var cell = el("div", "dk-cell" + ((st && st[i]) ? " " + st[i] : ""), String(v));
    if (ptrs) ptrs.forEach(function (p) {
      if (p.i === i) cell.appendChild(el("span", "dk-ptr " + (p.c || "c1"), p.label));
    });
    wrap.appendChild(cell);
  });
  return wrap;
}
function row(name, vals, extra) {
  var r = { name: name, vals: vals.slice() };
  if (extra) for (var k in extra) r[k] = extra[k];
  return r;
}
function renderRows(view, stage) {
  stage.textContent = "";
  (view.rows || []).forEach(function (row) {
    var line = document.createElement("div");
    line.style.cssText = "display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:10px 0;position:relative;padding-top:40px";
    line.appendChild(el("span", "dk-var", row.name));
    (row.vals || []).forEach(function (v, i) {
      var st = (row.st && row.st[i]) || "";
      var cell = el("div", "dk-cell" + (st ? " " + st : ""), String(v));
      if (row.ptrs) row.ptrs.forEach(function (p) {
        if (p.i === i) cell.appendChild(el("span", "dk-ptr " + (p.c || "c1"), p.label));
      });
      line.appendChild(cell);
      if (i < row.vals.length - 1) line.appendChild(el("span", "dk-arrow", "→"));
    });
    if (row.tail) line.appendChild(el("span", "dk-note", row.tail));
    stage.appendChild(line);
  });
  if (view.grid) {
    var tbl = document.createElement("table");
    tbl.style.cssText = "border-collapse:separate;border-spacing:5px";
    view.grid.forEach(function (grow) {
      var tr = document.createElement("tr");
      grow.forEach(function (v, c) {
        var td = el("td", "dk-cell" + ((view.gst && view.gst[r0] && 0) ? "" : ""), String(v));
        if (view.gst && view.gst_hl && view.gst_hl.r === arguments) {}
        td.style.minWidth = "44px"; td.style.textAlign = "center";
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    stage.appendChild(tbl);
  }
  if (view.note) stage.appendChild(el("div", "dk-note", view.note));
}
var r0 = 0;

var DEMOS = {

  "0033": { no: "33", title: "搜索旋转排序数组", tag: "二分 · 半有序判断",
    example: "输入：nums = [4,5,6,7,0,1,2]，target = 0　输出：4",
    build: function (ctx) {
      var nums = [4, 5, 6, 7, 0, 1, 2], target = 0;
      var lo = 0, hi = nums.length - 1;
      ctx.step("旋转数组一定有一半是有序的：判断哪半有序，target 在不在那半里", { rows: [row("nums", nums, { st: st1(0, "dim") })] });
      while (lo <= hi) {
        var mid = (lo + hi) >> 1;
        var halfSorted = nums[lo] <= nums[mid];
        ctx.step("lo=" + lo + " hi=" + hi + " mid=" + nums[mid] + "：左半 " + (halfSorted ? "有序" : "无序"),
          { rows: [row("nums", nums, { st: (function () { var m = {}; for (var k = lo; k <= hi; k++) m[k] = "dim"; m[mid] = "hot"; return m; })() })] });
        if (nums[mid] === target) {
          ctx.step("找到 " + target + "，下标 " + mid + " ✓", { rows: [row("nums", nums, { st: st1(mid, "target") })] });
          return;
        }
        if (halfSorted) {
          if (nums[lo] <= target && target < nums[mid]) { hi = mid - 1; ctx.step("target 在有序的左半 → hi=" + hi, { rows: [row("nums", nums, { st: (function () { var m = {}; for (var k = lo; k <= mid; k++) m[k] = "cmp"; return m; })() })] }); }
          else { lo = mid + 1; ctx.step("target 不在左半 → lo=" + lo, { rows: [row("nums", nums, { st: (function () { var m = {}; for (var k = mid; k <= hi + 1 && k < nums.length; k++) m[k] = "dim"; return m; })() })] }); }
        } else {
          if (nums[mid] < target && target <= nums[hi]) { lo = mid + 1; ctx.step("target 在有序的右半 → lo=" + lo, { rows: [row("nums", nums, { st: (function () { var m = {}; for (var k = mid; k <= hi; k++) m[k] = "cmp"; return m; })() })] }); }
          else { hi = mid - 1; ctx.step("target 不在右半 → hi=" + hi, { rows: [row("nums", nums, { st: (function () { var m = {}; for (var k = lo; k <= hi; k++) m[k] = "dim"; return m; })() })] }); }
        }
      }
      ctx.step("lo > hi → 未找到，返回 -1", { rows: [row("nums", nums, { st: st1(0, "dim") })] });
    },
    render: renderRows },

  "0153": { no: "153", title: "寻找旋转排序数组中的最小值", tag: "二分 · 收缩区间",
    example: "输入：nums = [4,5,6,7,0,1,2]　输出：0",
    build: function (ctx) {
      var nums = [4, 5, 6, 7, 0, 1, 2];
      var lo = 0, hi = nums.length - 1;
      ctx.step("最小值是“旋转点”：比较 mid 与 hi，收缩到只剩一个", { rows: [row("nums", nums)] });
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        ctx.step("lo=" + lo + " hi=" + hi + " mid=" + nums[mid] + "：" + (nums[mid] > nums[hi] ? "mid > hi → 最小值在右半" : "mid < hi → 最小值在左半（含 mid）"),
          { rows: [row("nums", nums, { st: (function () { var m = {}; for (var k = lo; k <= hi; k++) m[k] = "dim"; m[mid] = "hot"; return m; })() })] });
        if (nums[mid] > nums[hi]) lo = mid + 1; else hi = mid;
      }
      ctx.step("lo == hi → 最小值 = " + nums[lo] + "，下标 " + lo, { rows: [row("nums", nums, { st: st1(lo, "target") })] });
    },
    render: renderRows },

  "0074": { no: "74", title: "搜索二维矩阵", tag: "二分 · 展平成一维",
    example: "matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]]，target = 3　输出：true",
    build: function (ctx) {
      var g = [[1, 3, 5, 7], [10, 11, 16, 20], [23, 30, 34, 60]];
      var rows = g.length, cols = g[0].length, target = 3;
      var flat = [];
      g.forEach(function (r) { flat = flat.concat(r); });
      var lo = 0, hi = rows * cols - 1;
      ctx.step("每行首 > 前行尾 → 整个矩阵按行拼接就是有序数组，展平后二分（共 " + (rows * cols) + " 个）",
        { rows: [row("展平", flat, { st: null })] });
      while (lo <= hi) {
        var mid = (lo + hi) >> 1;
        var val = flat[mid];
        ctx.step("mid=" + mid + " → 矩阵位置 (" + Math.floor(mid / cols) + "," + (mid % cols) + ") = " + val,
          { rows: [row("展平", flat, { st: (function () { var m = {}; for (var k = lo; k <= hi; k++) m[k] = "dim"; m[mid] = "hot"; return m; })() })] });
        if (val === target) { ctx.step("找到 " + target + " ✓", { rows: [row("展平", flat, { st: st1(mid, "target") })] }); return; }
        if (val < target) { lo = mid + 1; ctx.step(val + " < " + target + " → lo=" + lo, { rows: [row("展平", flat, { st: (function () { var m = {}; for (var k = lo; k <= hi; k++) m[k] = "dim"; return m; })() })] }); }
        else { hi = mid - 1; ctx.step(val + " > " + target + " → hi=" + hi, { rows: [row("展平", flat, { st: (function () { var m = {}; for (var k = lo; k <= hi; k++) m[k] = "dim"; return m; })() })] }); }
      }
      ctx.step("未找到 → false", { rows: [row("展平", flat, { st: st1(0, "dim") })] });
    },
    render: renderRows },

  "0053": { no: "53", title: "最大子数组和", tag: "数组 · Kadane",
    example: "输入：nums = [-2,1,-3,4,-1,2,1,-5,4]　输出：6（子数组 [4,-1,2,1]）",
    build: function (ctx) {
      var nums = [-2, 1, -3, 4, -1, 2, 1, -5, 4];
      var cur = 0, best = -Infinity;
      var dp = [];
      ctx.step("Kadane：cur = max(自己, 前缀+自己)——前缀为负就果断丢弃重开", { rows: [row("nums", nums)] });
      for (var i = 0; i < nums.length; i++) {
        cur = Math.max(nums[i], cur + nums[i]);
        best = Math.max(best, cur);
        dp.push({ v: cur, st: "write" });
        ctx.step("cur[" + i + "] = max(" + nums[i] + "，前缀 " + (cur - nums[i]) + " + " + nums[i] + ") = " + cur + "，全局最大 " + best,
          { table: [dp.map(function (x) { return { v: x.v, st: null }; }), nums.map(function (v, k) { return { v: v, st: k === i ? "cmp" : null }; })] });
      }
      ctx.step("完成！最大子数组和 = " + best, { table: [dp.map(function (x) { return { v: x.v, st: x.v === best ? "target" : "dim" }; }), nums.map(function (v) { return { v: v, st: null }; })] });
    },
    render: function (view, stage) {
      var tbl = document.createElement("table");
      tbl.style.cssText = "border-collapse:separate;border-spacing:5px";
      view.table.forEach(function (row) {
        var tr = document.createElement("tr");
        row.forEach(function (x) {
          var td = el("td", "dk-cell" + (x.st ? " " + x.st : ""), String(x.v));
          td.style.minWidth = "40px"; td.style.textAlign = "center";
          tr.appendChild(td);
        });
        tbl.appendChild(tr);
      });
      stage.textContent = ""; stage.appendChild(tbl);
      if (view.note) stage.appendChild(el("div", "dk-note", view.note));
    } },

  "0056": { no: "56", title: "合并区间", tag: "数组 · 排序 + 扫描",
    example: "输入：intervals = [[1,3],[2,6],[8,10],[15,18]]　输出：[[1,6],[8,10],[15,18]]",
    build: function (ctx) {
      var ivs = [[1, 3], [2, 6], [8, 10], [15, 18]];
      var sorted = ivs.slice().sort(function (a, b) { return a[0] - b[0]; });
      ctx.step("先按左端点排序：[[1,3],[2,6],[8,10],[15,18]]", { rows: [
        row("区间", sorted.map(function (iv) { return "[" + iv[0] + "," + iv[1] + "]"; }), { st: null }) ] });
      var merged = [sorted[0].slice()];
      for (var i = 1; i < sorted.length; i++) {
        var cur = sorted[i], last = merged[merged.length - 1];
        if (cur[0] <= last[1]) {
          last[1] = Math.max(last[1], cur[1]);
          ctx.step("[" + cur[0] + "," + cur[1] + "] 左端 ≤ 当前末尾 " + last[1] + " → 合并（末尾取 max）→ [" + last[0] + "," + last[1] + "]",
            { rows: [row("合并中", merged.map(function (iv) { return "[" + iv[0] + "," + iv[1] + "]"; }), { st: st1(merged.length - 1, "hot") })] });
        } else {
          merged.push(cur.slice());
          ctx.step("[" + cur[0] + "," + cur[1] + "] 不重叠 → 新开一组", { rows: [
            row("合并中", merged.map(function (iv) { return "[" + iv[0] + "," + iv[1] + "]"; }), { st: st1(merged.length - 1, "write") }) ] });
        }
      }
      ctx.step("完成！" + JSON.stringify(merged), { rows: [row("结果", merged.map(function (iv) { return "[" + iv[0] + "," + iv[1] + "]"; }), { st: st1(merged.length - 1, "target") })] });
    },
    render: renderRows },

  "0189": { no: "189", title: "轮转数组", tag: "数组 · 三次翻转",
    example: "输入：nums = [1,2,3,4,5,6,7]，k = 3　输出：[5,6,7,1,2,3,4]",
    build: function (ctx) {
      var nums = [1, 2, 3, 4, 5, 6, 7], k = 3 % nums.length;
      var n = nums.length;
      function rev(l, r) {
        while (l < r) { var t = nums[l]; nums[l] = nums[r]; nums[r] = t; l++; r--; }
      }
      ctx.step("原数组（右移 " + k + " 位）", { rows: [row("nums", nums)] });
      rev(0, n - 1);
      ctx.step("第一步：整体翻转 → [" + nums.join(",") + "]", { rows: [row("nums", nums, { st: (function () { var m = {}; for (var q = 0; q < n; q++) m[q] = "write"; return m; })() })] });
      rev(0, k - 1);
      ctx.step("第二步：翻转前 k 个 → [" + nums.join(",") + "]", { rows: [row("nums", nums, { st: (function () { var m = {}; for (var q = 0; q < k; q++) m[q] = "hot"; return m; })() })] });
      rev(k, n - 1);
      ctx.step("第三步：翻转剩余 → [" + nums.join(",") + "] ✓ 原地 O(1) 空间", { rows: [row("nums", nums, { st: st1(n - 1, "target") })] });
    },
    render: renderRows },

  "0238": { no: "238", title: "除自身以外数组的乘积", tag: "数组 · 前缀 × 后缀",
    example: "输入：nums = [1,2,3,4]　输出：[24,12,8,6]",
    build: function (ctx) {
      var nums = [1, 2, 3, 4], n = nums.length;
      var answer = [], prefix = [], suffix = [];
      prefix[0] = 1;
      for (var i = 1; i < n; i++) prefix[i] = prefix[i - 1] * nums[i - 1];
      suffix[n - 1] = 1;
      for (var i = n - 2; i >= 0; i--) suffix[i] = suffix[i + 1] * nums[i + 1];
      for (var i = 0; i < n; i++) {
        answer[i] = prefix[i] * suffix[i];
        ctx.step("answer[" + i + "] = 左积 " + prefix[i] + " × 右积 " + suffix[i] + " = " + answer[i],
          { rows: [
            row("nums", nums, { st: st1(i, "hot") }),
            row("左积", prefix.slice(), { st: st1(i, "hot") }),
            row("右积", suffix.slice(), { st: st1(i, "hot") }),
            row("answer", answer.concat(nums.slice(i + 1).map(function () { return "·"; })), { st: st1(i, "write") }) ] });
      }
      ctx.step("完成！answer[" + (n - 1) + "] = " + answer[n - 1] + "。两次遍历、无除法、O(1) 额外空间", { rows: [
        row("answer", answer, { st: st1(n - 1, "target") }) ] });
    },
    render: renderRows }
};

(function () {
  var params = new URLSearchParams(location.search);
  var keys = Object.keys(DEMOS);
  var bar = document.createElement("div");
  bar.className = "dk-bar";
  bar.style.marginBottom = "14px";
  var label = document.createElement("span");
  label.className = "dk-var";
  label.textContent = "选择题目";
  bar.appendChild(label);
  var sel = document.createElement("select");
  sel.className = "dk-select";
  keys.forEach(function (k) {
    var d = DEMOS[k];
    var o = document.createElement("option");
    o.value = k;
    o.textContent = (d.no ? d.no + ". " : "") + d.title;
    sel.appendChild(o);
  });
  bar.appendChild(sel);
  if (params.get("embed") === "1") bar.style.display = "none";
  document.getElementById("app").parentNode.insertBefore(bar, document.getElementById("app"));
  function mountDemo(key) {
    var d = DEMOS[key];
    document.title = (d.no ? d.no + ". " : "") + d.title + " · 动画演示";
    DemoKit.mount({
      no: d.no, title: d.title, tag: d.tag, example: d.example,
      sizes: d.sizes, defaultSize: d.defaultSize,
      build: d.build, render: d.render
    });
  }
  var want = params.get("mode");
  if (want && DEMOS[want]) { sel.value = want; mountDemo(want); }
  else mountDemo(keys[0]);
})();
</script>

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
