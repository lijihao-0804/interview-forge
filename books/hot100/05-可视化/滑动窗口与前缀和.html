html[data-theme="light"]{--dk-bg:#f4f6fb;--dk-panel:#ffffff;--dk-soft:#f6f7fb;--dk-text:#1b2434;--dk-muted:#68758c;
--dk-line:#dfe4ee;--dk-brand:#5654d4;--dk-brand-strong:#4543bd;--dk-brand-soft:#eeedff;

font-weight:100 900;font-style:normal;font-display:swap;
unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";src:url("../../assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");
font-weight:100 800;font-style:normal;font-display:swap;
unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

button{border:1px solid var(--dk-line)!important;background:var(--dk-panel)!important;color:var(--dk-text)!important;

<script id="hot100-embed-bootstrap">
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('embed') !== '1') return;
  document.documentElement.classList.add('hot100-embedded');
  if (params.has('panel')) document.documentElement.classList.add('hot100-single-panel');
})();
</script>

<title>滑动窗口与前缀和实验室 · Hot 100</title>

<style id="hot100-polish">
:root {
  color-scheme: light dark;
  --hot-bg: #f4f6fb;
  --hot-surface: #ffffff;
  --hot-surface-soft: #f8f9fd;
  --hot-text: #182235;
  --hot-muted: #66748a;
  --hot-line: #dfe4ee;
  --hot-brand: #5654d4;
  --hot-brand-soft: #eeedff;
  --hot-on-brand: #ffffff;
  --hot-hero-start: #314fc7;
  --hot-hero-end: #5546ca;
  --hot-hero-text: #ffffff;
  --hot-hero-muted: #e7ebff;
  --hot-success: #167a52;
  --hot-success-soft: #def7e9;
  --hot-warning: #934b00;
  --hot-warning-soft: #fff0d8;
  --hot-danger: #b52b3a;
  --hot-danger-soft: #ffe5e9;
  --hot-canvas-bg: #f8fafc;
  --hot-canvas-line: #c9d2df;
  --hot-shadow: 0 12px 34px rgba(33,45,73,.075);
}
@media (prefers-color-scheme: dark) {
  :root {
    --hot-bg: #0f131b;
    --hot-surface: #181e29;
    --hot-surface-soft: #141a24;
    --hot-text: #eaf0fa;
    --hot-muted: #a3afc2;
    --hot-line: #313b4c;
    --hot-brand: #b1afff;
    --hot-brand-soft: #292955;
    --hot-on-brand: #111521;
    --hot-hero-start: #263677;
    --hot-hero-end: #39256f;
    --hot-hero-text: #f8f9ff;
    --hot-hero-muted: #dfe4ff;
    --hot-success: #79d8a8;
    --hot-success-soft: #183c2d;
    --hot-warning: #ffc174;
    --hot-warning-soft: #47311b;
    --hot-danger: #ff9ba6;
    --hot-danger-soft: #47242b;
    /* 旧 Canvas 内部仍使用深色文字，因此绘图区保持柔和浅底以确保可读。 */
    --hot-canvas-bg: #edf2f7;
    --hot-canvas-line: #bac5d2;
    --hot-shadow: 0 16px 42px rgba(0,0,0,.22);
  }
}
* { box-sizing: border-box; }
html { min-width: 0; background: var(--hot-bg) !important; }
body {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 0 34px !important;
  color: var(--hot-text) !important;
  background: radial-gradient(circle at 12% 0%, color-mix(in srgb,var(--hot-brand) 9%,transparent), transparent 34rem), var(--hot-bg) !important;
}
:focus-visible { outline: 3px solid color-mix(in srgb,var(--hot-brand) 48%,transparent) !important; outline-offset: 3px; }
.hot100-topnav {
  width: min(100% - 24px, 1400px);
  margin: 12px auto 16px;
  padding: 10px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--hot-muted);
  background: color-mix(in srgb,var(--hot-surface) 94%,transparent);
  border: 1px solid var(--hot-line);
  border-radius: 13px;
  box-shadow: var(--hot-shadow);
  font: 14px/1.45 system-ui, "Microsoft YaHei", sans-serif;
}
.hot100-topnav .hot100-links { display: flex; gap: 7px; flex-wrap: wrap; }
.hot100-topnav a { padding: 6px 9px; color: var(--hot-brand); background: var(--hot-brand-soft); border-radius: 7px; text-decoration: none; }
.hot100-topnav a:hover { filter: brightness(.97); }
.hot100-topnav strong { min-width: 0; color: var(--hot-text); overflow-wrap: anywhere; }
body > .container, body > .shell, body > main, body > .wrap {
  width: min(100% - 24px, 1400px) !important;
  max-width: 1400px !important;
  margin-left: auto !important;
  margin-right: auto !important;
  padding-bottom: 44px;
}
body > h1, body > h2, body > h3, body > .info, body > .desc, body > .btn-group {
  width: min(100% - 24px, 1400px);
  margin-left: auto !important;
  margin-right: auto !important;
}
canvas, svg, img { max-width: 100% !important; }
button, input, select, textarea { max-width: 100%; }
body h1 {
  margin-top: 0;
  color: var(--hot-text) !important;
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.2;
  letter-spacing: -.02em;
}
body h2 { color: var(--hot-text); line-height: 1.3; }
body h3 { color: var(--hot-text); line-height: 1.4; }
button, input, select, textarea { font: inherit; }
button {
  min-height: 36px;
  padding: 8px 12px;
  color: var(--hot-text);
  background: var(--hot-surface);
  border: 1px solid var(--hot-line) !important;
  border-radius: 9px !important;
  box-shadow: 0 2px 8px rgba(33,45,73,.04);
  transition: transform .16s ease, border-color .16s ease, background-color .16s ease, box-shadow .16s ease;
}
button:hover:not(:disabled) {
  border-color: color-mix(in srgb,var(--hot-brand) 42%,var(--hot-line)) !important;
  background: color-mix(in srgb,var(--hot-brand-soft) 58%,var(--hot-surface));
  box-shadow: 0 5px 14px rgba(33,45,73,.08);
  transform: translateY(-1px);
}
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { opacity: .52; cursor: not-allowed; box-shadow: none; }
button.primary, button.btn-primary, button.btn-apply, .primary, .btn-primary, .btn-apply {
  color: var(--hot-on-brand) !important;
  background: var(--hot-brand) !important;
  border-color: var(--hot-brand) !important;
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), select, textarea {
  min-height: 36px;
  padding: 7px 10px !important;
  color: var(--hot-text) !important;
  background: var(--hot-surface) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 8px !important;
}
input[type="range"] { accent-color: var(--hot-brand); }
.controls, .toolbar, .input-row, .preset-row, .sort-tabs, .ds-tabs, .op-bar, .btn-group, .legend { flex-wrap: wrap !important; }
.controls, .toolbar, .input-row, .preset-row, .op-bar, .btn-group { gap: 9px !important; }
/* 原生实验室也统一成“舞台/状态说明 → 控制条”。历史页面的 toolbar
   有些写在 panel 之前，这里用稳定的视觉顺序兜底；新页面应直接按该顺序写 DOM。 */
body > main.shell { display: flex; flex-direction: column; }
body > main.shell > .panel,
body > main.shell > .layout { order: 20; }
body > main.shell > .toolbar {
  order: 30;
  width: 100%;
  margin: 14px 0 0 !important;
  padding: 12px 0 0 !important;
  border-top: 1px solid var(--hot-line);
  justify-content: flex-start;
}
.sort-tabs, .ds-tabs {
  display: flex;
  gap: 7px !important;
  margin-block: 18px !important;

  border: 1px solid var(--hot-line) !important;
  border-radius: 13px !important;
  box-shadow: 0 6px 20px rgba(33,45,73,.045);
}
.sort-tab, .ds-tab, .code-tab, .preset-btn {
  padding: 8px 11px !important;
  color: var(--hot-muted) !important;
  background: transparent !important;
  border: 1px solid transparent !important;
  border-radius: 9px !important;
  cursor: pointer;
  transition: color .16s ease, background-color .16s ease, border-color .16s ease;
}
.sort-tab:hover, .ds-tab:hover, .code-tab:hover, .preset-btn:hover {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;
}
.sort-tab.active, .ds-tab.active, .code-tab.active, .preset-btn.active {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;
  border-color: color-mix(in srgb,var(--hot-brand) 28%,var(--hot-line)) !important;
  box-shadow: 0 3px 10px rgba(33,45,73,.065);
}
.container, .shell, main, .wrap, .content, .layout, .code-section, .vis-section, .content > *, .layout > *, .wrap > * { min-width: 0 !important; }
.vis-canvas-wrap, .panel, .box, .table-responsive, .code-scroll, .notes-section { max-width: 100%; }
.table-responsive, .code-scroll, .notes-section { overflow: auto; }
.panel { overflow: hidden !important; }
.box { overflow: visible; }
.panel, .box {
  color: var(--hot-text);
  background-color: var(--hot-surface) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 15px !important;

}
.code-section { border-color: var(--hot-line) !important; }
.vis-section { background-color: var(--hot-surface-soft) !important; }
.vis-msg, .target-info, .algo-desc, .desc, .status, .log {
  color: var(--hot-text) !important;
  border-color: var(--hot-line) !important;
}
.vis-msg, .target-info, .algo-desc, .desc {

}
.legend {

}

/* 题头必须使用独立的前景/背景色对；不能继承正文的灰色文字。 */
.panel-header {
  color: var(--hot-hero-text) !important;
  background: linear-gradient(135deg,var(--hot-hero-start),var(--hot-hero-end)) !important;
}
.panel-header h1, .panel-header h2, .panel-header h3 {
  color: inherit !important;
}
.panel-header .sub, .panel-header p, .panel-header .info {
  max-width: 88ch;

  white-space: normal !important;
  overflow-wrap: anywhere;
}
/* 复杂度徽标中的色点不是第二层徽标，避免白块套白块。 */
.complexity .badge-time, .complexity .badge-space {
  display: inline !important;

  padding: 0 !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
}
/* 动画安全区：标签、指针和高亮不再贴边或被相邻区域裁掉。 */
.lane { min-height: 220px !important; padding: 36px 6px !important; row-gap: 52px !important; overflow: visible !important; }
.lane .label.top { bottom: 66px !important; }
.lane .label.bottom { top: 66px !important; }
.bars { height: 300px !important; padding-top: 38px !important; padding-bottom: 34px !important; overflow: visible !important; }
.bars .col { min-width: 0; }
.bars .idx, .bars .answer { z-index: 2; }
.hot100-bar-stage {
  min-height: 300px !important;

.curr, .board-cell.current { box-shadow: inset 0 0 0 2px color-mix(in srgb,var(--hot-brand) 58%,transparent) !important; }
.bar-label, .idx { color: var(--hot-muted) !important; }
pre { max-width: 100%; overflow: auto !important; }
table { max-width: 100%; }

@media (prefers-color-scheme: dark) {
  body > .container > h1, body > .shell > h1, body > main > h1, body > h1, body > h2 { color: var(--hot-text) !important; }
  .panel, .box, .code-section, .vis-section, .notes-section, .input-section, .top-tags,
  .controls, .complexity, .complexity-bar, .code-header, .code-tab, .legend, .algo-desc,
  .op-bar, .map-container, .formula-box, .desc, .false, .token, .status, .log {

  .sub, .muted, .info, .row-label, .step-info, .size-info { color: var(--hot-muted) !important; }
  input, select, textarea { color: var(--hot-text) !important; background: var(--hot-surface) !important; border-color: var(--hot-line) !important; }
  button:not(.primary):not(.btn-primary):not(.active) { color: var(--hot-text); background-color: var(--hot-surface); border-color: var(--hot-line); }
}
/* 状态配色：前景与底色成对定义，避免只改背景造成文字消失。 */
.code-line.highlight-line {
  color: var(--hot-text) !important;
  background: var(--hot-warning-soft) !important;
  box-shadow: inset 3px 0 var(--hot-warning);
}
.code-line.highlight-line .lineno { color: var(--hot-warning) !important; }

}
.header { color: var(--hot-muted) !important; background: transparent !important; border-color: transparent !important; }
.filled, .cell.in, .frontier {

  color: var(--hot-success) !important;

  border-color: color-mix(in srgb,var(--hot-success) 66%,var(--hot-line)) !important;

.val-box.current {

<script>
/* ===== 滑动窗口与前缀和实验室：3 / 560 / 76。共用一套「一排格子 + 辅助表」渲染 ===== */
var el = DemoKit.el;

function renderWin(view, stage) {
  stage.textContent = "";

  if (view.vars && view.vars.length) {
    var vb = el("div", "dk-vars");
    view.vars.forEach(function (v) {
      var s = el("span", "dk-var");
      s.appendChild(el("b", null, v[0] + "："));
      s.appendChild(document.createTextNode(String(v[1])));
      vb.appendChild(s);
    });
    stage.appendChild(vb);
  }

  var line = el("div");
  line.style.cssText = "display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 4px;padding-top:44px";
  (view.vals || []).forEach(function (v, i) {
    var st = (view.st && view.st[i]) || "";
    var cell = el("div", "dk-cell" + (st ? " " + st : ""), String(v));
    cell.appendChild(el("span", "idx", String(i)));
    (view.ptrs || []).forEach(function (p) {
      if (p.i === i) cell.appendChild(el("span", "dk-ptr " + (p.c || "c1"), p.label));
    });
    line.appendChild(cell);
  });
  stage.appendChild(line);

  if (view.pairs) {
    var pw = el("div");
    pw.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px";
    pw.appendChild(el("span", "dk-var", view.pairsTitle || "辅助表"));
    if (!view.pairs.length) pw.appendChild(el("span", "dk-note", "（空）"));
    view.pairs.forEach(function (p) {
      var chip = el("div", "dk-cell" + (p[2] ? " " + p[2] : ""), p[0] + " → " + p[1]);
      chip.style.fontSize = "13px";
      pw.appendChild(chip);
    });
    stage.appendChild(pw);
  }

  if (view.note) stage.appendChild(el("div", "dk-note", view.note));
}

function pairsOf(map, hotKey) {
  return Object.keys(map).map(function (k) {
    return [k, map[k], String(k) === String(hotKey) ? "hot" : ""];
  });
}

var DEMOS = {

  "0003": {
    no: "3", title: "无重复字符的最长子串", tag: "滑动窗口 · left 只进不退",
    example: "输入：字符串 s　输出：最长的、内部没有重复字符的子串长度",
    sizes: [
      { label: "abbacd（第二个 a：left 不能被拉回）", s: "abbacd" },
      { label: "tmmzuxt（末尾 t 的旧位置早已出窗）", s: "tmmzuxt" },
      { label: "abcabcbb（基础款）", s: "abcabcbb" }
    ],
    defaultSize: 0,
    stageHeight: 420,
    code: {
      title: "哈希表记录“最后出现的下标”",
      langs: {
        java: [
          "int left = 0, best = 0;",
          "Map<Character, Integer> last = new HashMap<>();  // 字符 → 最后出现的下标",
          "for (int r = 0; r < s.length(); r++) {",
          "    char c = s.charAt(r);",
          "    if (last.containsKey(c)) left = Math.max(left, last.get(c) + 1);  // 只进不退",
          "    last.put(c, r);",
          "    best = Math.max(best, r - left + 1); }   // 窗口 [left, r] 内保证无重复"
        ],
        cpp: [
          "int left = 0, best = 0;",
          "unordered_map<char, int> last;                  // 字符 → 最后出现的下标",
          "for (int r = 0; r < (int)s.size(); ++r) {",
          "    char c = s[r];",
          "    if (last.count(c)) left = max(left, last[c] + 1);   // 只进不退",
          "    last[c] = r;",
          "    best = max(best, r - left + 1); }        // 窗口 [left, r] 内保证无重复"
        ],
        python: [
          "left = best = 0",
          "last = {}                                    # 字符 → 最后出现的下标",
          "for r in range(len(s)):",
          "    c = s[r]",
          "    if c in last: left = max(left, last[c] + 1)         # 只进不退",
          "    last[c] = r",
          "    best = max(best, r - left + 1)           # 窗口 [left, r] 内保证无重复"
        ],
        go: [
          "left, best := 0, 0",
          "last := map[byte]int{}                       // 字符 → 最后出现的下标",
          "for r := 0; r < len(s); r++ {",
          "    c := s[r]",
          "    if p, ok := last[c]; ok && p+1 > left { left = p + 1 }   // 只进不退",
          "    last[c] = r",
          "    if r-left+1 > best { best = r - left + 1 } }   // 窗口内保证无重复"
        ],
        c: [
          "int left = 0, best = 0, last[128];",
          "memset(last, -1, sizeof(last));              /* 字符 → 最后出现的下标 */",
          "for (int r = 0; s[r]; r++) {",
          "    char c = s[r];",
          "    if (last[(int)c] >= left) left = last[(int)c] + 1;  /* 只进不退 */",
          "    last[(int)c] = r;",
          "    if (r - left + 1 > best) best = r - left + 1; }  /* 窗口内保证无重复 */"
        ]
      }
    },
    invariants: [
      { label: "left 单调不减", test: function (v) {
          return v.left >= v.prevLeft
            ? "上一帧 left=" + v.prevLeft + "，现在 left=" + v.left + "，只会往右"
            : false;
        } },
      /* 「纳入右端字符」和「收左端」是分开的两拍，中间那一拍窗口里本来就允许有一对
         重复 —— 而且只能是刚进来的那个字符。把这一拍写清楚，比假装它不存在更诚实。 */
      { label: "窗口内无重复 —— 只有刚纳入的右端字符可能撞车（下一拍就收 left）", test: function (v) {
          var seen = {}, i, dup = 0;
          for (i = v.left; i <= v.right; i++) {
            if (seen[v.vals[i]]) {
              dup++;
              if (v.vals[i] !== v.vals[v.right]) return false;  // 撞车的不是新字符 → 真出错了
            }
            seen[v.vals[i]] = 1;
          }
          if (dup > 1) return false;
          if (v.right < v.left) return "窗口为空";
          return dup
            ? "刚纳入的 '" + v.vals[v.right] + "' 与窗口里的旧位置撞车，下一拍 left 会跳过去"
            : "s[" + v.left + ".." + v.right + "] 共 " + (v.right - v.left + 1) + " 个字符，两两不同";
        } }
    ],
    build: function (ctx, size) {
      var s = (size && size.s) || "abbacd";
      var arr = s.split("");
      var last = {}, left = 0, best = 0, bestL = 0, prevLeft = 0;

      function V(r, hotKind, note) {
        var st = {}, i;
        for (i = 0; i < arr.length; i++) {
          if (i > r) st[i] = "dim";
          else if (i < left) st[i] = "done";
          else st[i] = "hot";
        }
        if (r >= 0 && hotKind) st[r] = hotKind;
        var ptrs = [];
        if (r >= 0) {
          ptrs.push({ i: left, label: "left", c: "c3" });
          ptrs.push({ i: r, label: "right", c: "c1" });
        }
        return {
          vals: arr, st: st, ptrs: ptrs, note: note,
          left: left, right: r, prevLeft: prevLeft,
          vars: [["left", left], ["right", r < 0 ? "—" : r],
                 ["当前长度", r < 0 ? 0 : r - left + 1], ["历史最长", best]],
          pairs: pairsOf(last, r >= 0 ? arr[r] : null),
          pairsTitle: "last（字符 → 最后下标）"
        };
      }

      ctx.step("窗口为空。right 逐个纳入字符，left 只会前进 —— 这是本题唯一容易写错的地方",
        V(-1, null, "s = \"" + s + "\""), { line: 1 });

      for (var r = 0; r < arr.length; r++) {
        var c = arr[r];
        var prev = Object.prototype.hasOwnProperty.call(last, c) ? last[c] : -1;
        prevLeft = left;
        ctx.step("right=" + r + "：纳入 '" + c + "'", V(r, "cmp", null), { line: 4 });

        if (prev >= left) {
          left = prev + 1;
          ctx.step("'" + c + "' 上次出现在 " + prev + "，还在窗口里 → left 跳到 " + left,
            V(r, "swap", "重复字符必须被挤出去"), { line: 5 });
        } else if (prev >= 0) {
          ctx.step("'" + c + "' 上次出现在 " + prev + "，但 left 已经是 " + left + " —— 旧位置早出窗了，left 不倒退",
            V(r, "cmp", "写成 left = last[c] + 1 就会在这里把窗口拉回去，答案偏大"), { line: 5 });
        }

        last[c] = r;
        var len = r - left + 1;
        if (len > best) {
          best = len; bestL = left;
          ctx.step("窗口 [" + left + ", " + r + "] 长度 " + len + " → 刷新最长记录",
            V(r, "target", null), { line: 7 });
        } else {
          ctx.step("窗口 [" + left + ", " + r + "] 长度 " + len + " ≤ 历史最长 " + best,
            V(r, "hot", null), { line: 7 });
        }
      }

      prevLeft = left;
      ctx.step("完成！最长无重复子串 = \"" + s.slice(bestL, bestL + best) + "\"，长度 " + best,
        V(arr.length - 1, "target", "整趟只有 left、right 各走一遍 → O(n)"), { line: 7 });
    },
    render: renderWin
  },

  "0560": {
    no: "560", title: "和为 K 的子数组", tag: "前缀和 · 历史频次表",
    example: "输入：整数数组 nums（可含负数）与目标 k　输出：和恰好为 k 的连续子数组个数",
    sizes: [
      { label: "[3,4,7,2,-3,1,4,2] k=7（含负数，前缀会回头）", nums: [3, 4, 7, 2, -3, 1, 4, 2], k: 7 },
      { label: "[1,2,3,-3,1,1,1] k=3（同一前缀值出现多次）", nums: [1, 2, 3, -3, 1, 1, 1], k: 3 },
      { label: "[1,1,1] k=2（基础款）", nums: [1, 1, 1], k: 2 }
    ],
    defaultSize: 0,
    stageHeight: 430,
    code: {
      title: "前缀和 + 出现次数哈希表",
      langs: {
        java: [
          "Map<Integer, Integer> cnt = new HashMap<>();",
          "cnt.put(0, 1);        // 前缀和 0 出现 1 次：代表“从下标 0 开始”的子数组",
          "int prefix = 0, ans = 0;",
          "for (int x : nums) {",
          "    prefix += x;                              // prefix = nums[0..i] 的和",
          "    ans += cnt.getOrDefault(prefix - k, 0);   // 有几个旧前缀满足 prefix-旧=k",
          "    cnt.merge(prefix, 1, Integer::sum); }     // 再把当前前缀记进表里"
        ],
        cpp: [
          "unordered_map<int, int> cnt;",
          "cnt[0] = 1;           // 前缀和 0 出现 1 次：代表“从下标 0 开始”的子数组",
          "int prefix = 0, ans = 0;",
          "for (int x : nums) {",
          "    prefix += x;                              // prefix = nums[0..i] 的和",
          "    if (cnt.count(prefix - k)) ans += cnt[prefix - k];  // 旧前缀出现几次",
          "    cnt[prefix]++; }                          // 再把当前前缀记进表里"
        ],
        python: [
          "cnt = defaultdict(int)",
          "cnt[0] = 1            # 前缀和 0 出现 1 次：代表“从下标 0 开始”的子数组",
          "prefix = ans = 0",
          "for x in nums:",
          "    prefix += x                               # prefix = nums[0..i] 的和",
          "    ans += cnt[prefix - k]                    # 有几个旧前缀满足 prefix-旧=k",
          "    cnt[prefix] += 1                          # 再把当前前缀记进表里"
        ],
        go: [
          "cnt := map[int]int{}",
          "cnt[0] = 1            // 前缀和 0 出现 1 次：代表“从下标 0 开始”的子数组",
          "prefix, ans := 0, 0",
          "for _, x := range nums {",
          "    prefix += x                               // prefix = nums[0..i] 的和",
          "    ans += cnt[prefix-k]                      // 有几个旧前缀满足 prefix-旧=k",
          "    cnt[prefix]++ }                           // 再把当前前缀记进表里"
        ],
        c: [
          "HashMap *cnt = map_new();",
          "map_put(cnt, 0, 1);   /* 前缀和 0 出现 1 次：代表“从下标 0 开始”的子数组 */",
          "int prefix = 0, ans = 0;",
          "for (int i = 0; i < n; i++) {",
          "    prefix += nums[i];                        /* prefix = nums[0..i] 的和 */",
          "    ans += map_get(cnt, prefix - k);          /* 旧前缀出现几次 */",
          "    map_put(cnt, prefix, map_get(cnt, prefix) + 1); }  /* 记进表里 */"
        ]
      }
    },
    invariants: [
      { label: "表里的次数总和 = 已处理的前缀个数", test: function (v) {
          var sum = 0, kk;
          for (kk in v.cnt) sum += v.cnt[kk];
          return sum === v.done + 1
            ? "已处理 " + v.done + " 个元素 + 初始的 0 → 表里共 " + sum + " 次"
            : false;
        } },
      { label: "答案只会增加", test: function (v) {
          return v.ans >= v.prevAns ? "上一帧 " + v.prevAns + " → 现在 " + v.ans : false;
        } }
    ],
    build: function (ctx, size) {
      var nums = (size && size.nums) || [3, 4, 7, 2, -3, 1, 4, 2];
      var k = (size && size.k) || 7;
      var cnt = { 0: 1 }, prefix = 0, ans = 0, prevAns = 0, done = 0;

      function V(i, kind, hotKey, note) {
        var st = {}, j;
        for (j = 0; j < nums.length; j++) {
          if (j > i) st[j] = "dim";
          else if (j === i) st[j] = kind || "hot";
          else st[j] = "done";
        }
        return {
          vals: nums, st: st, note: note,
          ptrs: i >= 0 ? [{ i: i, label: "i", c: "c1" }] : [],
          /* cnt 每一帧都要拍快照：直接挂引用的话，后面的 cnt[prefix]++ 会把已经
             录好的旧帧一起改掉，回看时看到的全是最终结果。 */
          cnt: (function () { var c = {}, kk; for (kk in cnt) c[kk] = cnt[kk]; return c; })(),
          ans: ans, prevAns: prevAns, done: done,
          vars: [["i", i < 0 ? "—" : i], ["prefix", prefix], ["k", k], ["答案数", ans]],
          pairs: pairsOf(cnt, hotKey),
          pairsTitle: "cnt（前缀和 → 出现次数）"
        };
      }

      ctx.step("先把前缀和 0 记 1 次 —— 它代表“从下标 0 开始”的那一类子数组，漏了它会少算",
        V(-1, null, 0, "nums = [" + nums.join(", ") + "]，k = " + k), { line: 2 });

      for (var i = 0; i < nums.length; i++) {
        prevAns = ans;
        prefix += nums[i];
        ctx.step("i=" + i + "：prefix += " + nums[i] + " → prefix = " + prefix,
          V(i, "hot", null, "prefix 是 nums[0.." + i + "] 的和"), { line: 5 });

        var need = prefix - k;
        var found = Object.prototype.hasOwnProperty.call(cnt, need) ? cnt[need] : 0;
        ans += found;
        ctx.step("查历史前缀 " + need + "（= prefix − k）：出现 " + found + " 次 → 答案 +" + found + " = " + ans,
          V(i, found ? "target" : "cmp", need,
            found ? "每一次旧前缀 " + need + " 都对应一个以 i=" + i + " 结尾、和为 " + k + " 的子数组"
                  : "没有旧前缀等于 " + need + "，这一轮不贡献答案"), { line: 6 });

        cnt[prefix] = (Object.prototype.hasOwnProperty.call(cnt, prefix) ? cnt[prefix] : 0) + 1;
        done = i + 1;
        ctx.step("把当前前缀 " + prefix + " 记进表：现在出现 " + cnt[prefix] + " 次",
          V(i, "write", prefix,
            cnt[prefix] > 1 ? "同一个前缀值出现多次 —— 正是因为数组里有负数，前缀和会回头" : null), { line: 7 });
      }

      prevAns = ans;
      ctx.step("完成！和为 " + k + " 的子数组共 " + ans + " 个（单遍 O(n)，不需要枚举区间）",
        V(nums.length - 1, "target", null, null), { line: 6 });
    },
    render: renderWin
  },

  "0076": {
    no: "76", title: "最小覆盖子串", tag: "滑动窗口 · 缺口计数 + 收缩",
    example: "输入：s 与 t　输出：s 中涵盖 t 全部字符（含重复次数）的最短子串",
    sizes: [
      { label: "s=ADOBECODEBANC, t=ABC（经典）", s: "ADOBECODEBANC", t: "ABC" },
      { label: "s=AAABBC, t=ABB（t 里有重复字符）", s: "AAABBC", t: "ABB" },
      { label: "s=AB, t=ABC（无解）", s: "AB", t: "ABC" }
    ],
    defaultSize: 0,
    stageHeight: 460,
    code: {
      title: "need 计数 + miss 缺口",
      langs: {
        java: [
          "int[] need = new int[128];  for (char c : t.toCharArray()) need[c]++;",
          "int miss = t.length(), left = 0, bestL = 0, bestLen = Integer.MAX_VALUE;",
          "for (int r = 0; r < s.length(); r++) {",
          "    if (need[s.charAt(r)]-- > 0) miss--;        // 右端字符是“还缺的” → 缺口 −1",
          "    while (miss == 0) {                         // 已覆盖 → 试着收左端",
          "        if (r - left + 1 < bestLen) { bestLen = r - left + 1; bestL = left; }",
          "        if (++need[s.charAt(left++)] > 0) miss++;  // 吐出的是必需字符 → 破功",
          "    }",
          "} return bestLen == Integer.MAX_VALUE ? \"\" : s.substring(bestL, bestL + bestLen);"
        ],
        cpp: [
          "vector<int> need(128, 0);  for (char c : t) need[c]++;",
          "int miss = t.size(), left = 0, bestL = 0, bestLen = INT_MAX;",
          "for (int r = 0; r < (int)s.size(); ++r) {",
          "    if (need[s[r]]-- > 0) --miss;               // 右端字符是“还缺的” → 缺口 −1",
          "    while (miss == 0) {                         // 已覆盖 → 试着收左端",
          "        if (r - left + 1 < bestLen) { bestLen = r - left + 1; bestL = left; }",
          "        if (++need[s[left++]] > 0) ++miss;      // 吐出的是必需字符 → 破功",
          "    }",
          "} return bestLen == INT_MAX ? \"\" : s.substr(bestL, bestLen);"
        ],
        python: [
          "need = Counter(t)",
          "miss, left, best_l, best_len = len(t), 0, 0, inf",
          "for r, c in enumerate(s):",
          "    need[c] -= 1;  miss -= 1 if need[c] >= 0 else 0   # 右端字符是“还缺的”",
          "    while miss == 0:                            # 已覆盖 → 试着收左端",
          "        if r - left + 1 < best_len: best_len, best_l = r - left + 1, left",
          "        need[s[left]] += 1;  miss += 1 if need[s[left]] > 0 else 0;  left += 1",
          "",
          "return \"\" if best_len == inf else s[best_l:best_l + best_len]"
        ],
        go: [
          "need := [128]int{};  for i := 0; i < len(t); i++ { need[t[i]]++ }",
          "miss, left, bestL, bestLen := len(t), 0, 0, math.MaxInt32",
          "for r := 0; r < len(s); r++ {",
          "    if need[s[r]] > 0 { miss-- };  need[s[r]]--   // 右端字符是“还缺的”",
          "    for miss == 0 {                             // 已覆盖 → 试着收左端",
          "        if r-left+1 < bestLen { bestLen, bestL = r-left+1, left }",
          "        need[s[left]]++;  if need[s[left]] > 0 { miss++ };  left++",
          "    }",
          "} ; if bestLen == math.MaxInt32 { return \"\" };  return s[bestL : bestL+bestLen]"
        ],
        c: [
          "int need[128] = {0};  for (int i = 0; t[i]; i++) need[(int)t[i]]++;",
          "int miss = strlen(t), left = 0, bestL = 0, bestLen = INT_MAX;",
          "for (int r = 0; s[r]; r++) {",
          "    if (need[(int)s[r]]-- > 0) miss--;          /* 右端字符是“还缺的” */",
          "    while (miss == 0) {                         /* 已覆盖 → 试着收左端 */",
          "        if (r - left + 1 < bestLen) { bestLen = r - left + 1; bestL = left; }",
          "        if (++need[(int)s[left++]] > 0) miss++; /* 吐出的是必需字符 → 破功 */",
          "    }",
          "} /* bestLen == INT_MAX 说明无解，返回空串 */"
        ]
      }
    },
    invariants: [
      { label: "miss 永远 ≥ 0", test: function (v) {
          return v.miss >= 0 ? "还缺 " + v.miss + " 个必需字符" : false;
        } },
      { label: "miss == 0 时窗口真的覆盖了 t", test: function (v) {
          if (v.miss !== 0) return "尚未覆盖，跳过校验";
          var have = {}, i, c;
          for (i = v.left; i <= v.right; i++) {
            c = v.vals[i];
            have[c] = (have[c] || 0) + 1;
          }
          for (c in v.tNeed) if ((have[c] || 0) < v.tNeed[c]) return false;
          return "s[" + v.left + ".." + v.right + "] 已包含 t 的全部字符";
        } }
    ],
    build: function (ctx, size) {
      var s = (size && size.s) || "ADOBECODEBANC";
      var t = (size && size.t) || "ABC";
      var arr = s.split("");
      var need = {}, tNeed = {}, i;
      for (i = 0; i < t.length; i++) {
        need[t[i]] = (need[t[i]] || 0) + 1;
        tNeed[t[i]] = (tNeed[t[i]] || 0) + 1;
      }
      var miss = t.length, left = 0, bestL = 0, bestLen = Infinity;

      function V(r, kind, hotKey, note) {
        var st = {}, j;
        for (j = 0; j < arr.length; j++) {
          if (j > r) st[j] = "dim";
          else if (j < left) st[j] = "done";
          else st[j] = "hot";
        }
        if (r >= 0 && kind) st[r] = kind;
        if (bestLen !== Infinity) for (j = bestL; j < bestL + bestLen; j++) if (st[j] === "done") st[j] = "write";
        var ptrs = [];
        if (r >= 0) {
          ptrs.push({ i: Math.min(left, arr.length - 1), label: "left", c: "c3" });
          ptrs.push({ i: r, label: "right", c: "c1" });
        }
        var shown = {};
        for (var key in tNeed) shown[key] = need[key];
        return {
          vals: arr, st: st, ptrs: ptrs, note: note,
          left: left, right: r, miss: miss, tNeed: tNeed,
          vars: [["left", left], ["right", r < 0 ? "—" : r], ["缺口 miss", miss],
                 ["最短长度", bestLen === Infinity ? "∞" : bestLen]],
          pairs: pairsOf(shown, hotKey),
          pairsTitle: "need（>0 表示还缺，<0 表示窗口里多了）"
        };
      }

      ctx.step("need 记下 t 里每个字符还缺几个；miss = 还缺的字符总数 " + t.length,
        V(-1, null, null, "s = \"" + s + "\"，t = \"" + t + "\""), { line: 2 });

      for (var r = 0; r < arr.length; r++) {
        var c = arr[r];
        var was = need[c] || 0;
        need[c] = was - 1;
        if (was > 0) {
          miss--;
          ctx.step("right=" + r + " 纳入 '" + c + "'：它是还缺的字符 → miss 降到 " + miss,
            V(r, "cmp", c, null), { line: 4 });
        } else {
          ctx.step("right=" + r + " 纳入 '" + c + "'：t 不需要它（或已经够了）→ miss 不变",
            V(r, "hot", tNeed[c] ? c : null, null), { line: 4 });
        }

        while (miss === 0) {
          var len = r - left + 1;
          if (len < bestLen) {
            bestLen = len; bestL = left;
            ctx.step("miss=0 → 窗口已覆盖 t，长度 " + len + " 刷新最短记录 \"" + s.slice(bestL, bestL + bestLen) + "\"",
              V(r, "target", null, null), { line: 6 });
          } else {
            ctx.step("miss=0，但长度 " + len + " ≥ 已知最短 " + bestLen + " → 只收缩不记录",
              V(r, "hot", null, null), { line: 6 });
          }
          var lc = arr[left];
          need[lc] = (need[lc] || 0) + 1;
          left++;
          if (need[lc] > 0) {
            miss++;
            ctx.step("吐出左端 '" + lc + "'：它是 t 的必需字符 → miss 回到 " + miss + "，窗口不再覆盖",
              V(r, "swap", lc, "所以最短窗口的左右两端一定都是 t 里的字符"), { line: 7 });
          } else {
            ctx.step("吐出左端 '" + lc + "'：窗口里本来就多余 → miss 仍为 0，继续收缩",
              V(r, "done", tNeed[lc] ? lc : null, null), { line: 7 });
          }
        }
      }

      if (bestLen === Infinity) {
        ctx.step("扫完整个 s，miss 从未归零 → 无解，返回空串",
          V(arr.length - 1, "swap", null, "s 里根本凑不齐 t 的全部字符"), { line: 9 });
      } else {
        ctx.step("完成！最小覆盖子串 = \"" + s.slice(bestL, bestL + bestLen) + "\"（下标 " + bestL + " 起，长 " + bestLen + "）",
          V(arr.length - 1, "target", null, "left、right 各只走一遍 → O(|s| + |t|)"), { line: 9 });
      }
    },
    render: renderWin
  }
};

(function () {
  var params = new URLSearchParams(location.search);
  var keys = Object.keys(DEMOS);
  var bar = document.createElement("div");
  bar.className = "dk-bar";
  bar.style.marginBottom = "14px";
  var label = document.createElement("span");
  label.className = "dk-var";
  label.textContent = "选择题目";
  bar.appendChild(label);
  var sel = document.createElement("select");
  sel.className = "dk-select";
  keys.forEach(function (k) {
    var d = DEMOS[k];
    var o = document.createElement("option");
    o.value = k;
    o.textContent = (d.no ? d.no + ". " : "") + d.title;
    sel.appendChild(o);
  });
  bar.appendChild(sel);
  if (params.get("embed") === "1") bar.style.display = "none";
  document.getElementById("app").parentNode.insertBefore(bar, document.getElementById("app"));
  function mountDemo(key) {
    var d = DEMOS[key];
    document.title = (d.no ? d.no + ". " : "") + d.title + " · 动画演示";
    DemoKit.mount({
      no: d.no, title: d.title, tag: d.tag, example: d.example,
      sizes: d.sizes, defaultSize: d.defaultSize,
      stageHeight: d.stageHeight || 440,
      code: d.code, invariants: d.invariants, compare: d.compare,
      build: d.build, render: d.render
    });
  }
  sel.onchange = function () { mountDemo(sel.value); };
  var want = params.get("mode");
  if (want && DEMOS[want]) { sel.value = want; mountDemo(want); }
  else mountDemo(keys[0]);
})();
</script>
