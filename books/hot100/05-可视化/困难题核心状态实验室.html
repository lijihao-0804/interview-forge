<body>
<nav class="hot100-topnav" data-hot100-nav aria-label="学习导航"><strong>困难题核心状态交互演示</strong><span class="hot100-links"><a href="../../../index.html">学习面板</a><a href="index.html">可视化中心</a></span></nav>
<main class="shell">
  <div class="toolbar"><button class="primary" id="step">下一步</button><button id="reset">重置</button></div>
  <section class="panel"><div id="stage" class="stage"></div><div id="status" class="status" aria-live="polite"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const cells=(values,classes=()=>'',small=true)=>`<div class="array">${values.map((v,i)=>`<span class="hard-cell ${classes(i,v)}">${small?`<small>${i}</small>`:''}${esc(v)}</span>`).join('')}</div>`;
const section=(label,html)=>`<div class="section"><div class="label">${label}</div>${html}</div>`;

function windowMaxLab(){
  const a=[1,3,-1,-3,5,3,6,7],k=3;let r=-1,q=[],out=[],msg=`窗口大小 k=${k}，队列保存下标且对应值单调递减。`;
  return{step(){if(r>=a.length-1)return;r++;while(q.length&&q[0]<=r-k)q.shift();const removed=[];while(q.length&&a[q.at(-1)]<=a[r])removed.push(q.pop());q.push(r);if(r>=k-1)out.push(a[q[0]]);msg=`处理下标 ${r}：${removed.length?`弹出更小下标 ${removed.join('、')}；`:''}队首 ${q[0]} 对应当前窗口最大值 ${a[q[0]]}。`;},done:()=>r>=a.length-1,view:()=>section('数组与当前窗口',cells(a,i=>`${i>=Math.max(0,r-k+1)&&i<=r?'is-window ':''}${i===r?'is-current':''}`))+section('单调队列（下标 / 值）',`<div class="tokens">${q.map(i=>`<span class="heap-token">${i} / ${a[i]}</span>`).join('')||'<span class="muted">空</span>'}</div>`)+section('已得到的窗口最大值',cells(out,()=>'',false)),message:()=>msg};
}

function minWindowLab(){
  const s='ADOBECODEBANC',target='ABC',need=new Map([...target].map(ch=>[ch,1]));let have=new Map(),l=0,r=-1,formed=0,phase='expand',best=[-1,-1],msg='右端扩张直到包含 A、B、C，再移动左端压缩。';
  const add=(ch,d)=>{const before=have.get(ch)||0;have.set(ch,before+d);if(need.has(ch)){if(before<need.get(ch)&&before+d>=need.get(ch))formed++;if(before>=need.get(ch)&&before+d<need.get(ch))formed--;}};
  return{step(){if(phase==='expand'){if(r===s.length-1){msg='扫描结束，最短覆盖窗口已经确定。';return}r++;add(s[r],1);msg=`右端纳入 ${s[r]}，已满足 ${formed}/${need.size} 种字符。`;if(formed===need.size)phase='shrink';}else{if(best[0]<0||r-l<best[1]-best[0])best=[l,r];const ch=s[l];add(ch,-1);l++;msg=`左端移出 ${ch}，${formed===need.size?'仍满足，继续缩小':'条件被破坏，恢复右扩'}。`;if(formed<need.size)phase='expand';}},done:()=>phase==='expand'&&r===s.length-1,view:()=>section('字符串与当前窗口',cells([...s],i=>`${i>=l&&i<=r?'is-window ':''}${i===r?'is-current ':''}${best[0]>=0&&i>=best[0]&&i<=best[1]?'is-best':''}`))+section('覆盖状态',`<div class="tokens">${[...need].map(([ch,n])=>`<span class="heap-token">${ch}: ${have.get(ch)||0}/${n}</span>`).join('')}</div>`)+section('当前最短覆盖',`<strong>${best[0]<0?'尚未找到':s.slice(best[0],best[1]+1)}</strong>`),message:()=>msg};
}

function firstMissingLab(){
  let a=[3,4,-1,1],i=0,phase='place',scan=0,answer=null,msg='把值 x 交换到下标 x-1；非法值和重复值直接跳过。';
  return{step(){if(answer!==null)return;if(phase==='place'){if(i>=a.length){phase='scan';msg='放置结束，从左向右寻找第一个值与下标不匹配的位置。';return}const x=a[i];if(x>=1&&x<=a.length&&a[x-1]!==x){[a[i],a[x-1]]=[a[x-1],a[i]];msg=`把 ${x} 放到下标 ${x-1}，当前位置继续检查。`;}else{i++;msg='当前位置无需交换，继续向右。';}}else{if(scan>=a.length){answer=a.length+1;msg=`1..n 都在正确位置，答案是 ${answer}。`;}else if(a[scan]!==scan+1){answer=scan+1;msg=`下标 ${scan} 应为 ${scan+1}，实际为 ${a[scan]}，答案确定。`;}else{scan++;msg='该位置正确，继续扫描。';}}},done:()=>answer!==null,view:()=>section('原地数组',cells(a,j=>`${phase==='place'&&j===i?'is-current ':''}${a[j]===j+1?'is-done ':''}${phase==='scan'&&j===scan?'is-source':''}`))+section('答案',`<strong>${answer??'尚未确定'}</strong>`),message:()=>msg};
}

function reverseKLab(){
  let a=[1,2,3,4,5],start=0,last=[],done=false,msg='先确认剩余节点不少于 k=2，再反转当前组。';const k=2;
  return{step(){if(done)return;if(a.length-start<k){done=true;msg='剩余节点不足 k 个，保持原顺序并结束。';return}const before=a.slice(start,start+k);a.splice(start,k,...before.reverse());last=[start,start+k-1];start+=k;if(a.length-start<k){done=true;msg=`本组反转完成；剩余 ${a.length-start} 个节点不足 k，保持不变。`;}else msg='本组反转并接回链表，继续检测下一组。';},done:()=>done,view:()=>section('链表分组',`<div class="nodes">${a.map((v,i)=>`<span class="node-box ${i>=last[0]&&i<=last[1]?'is-done':''} ${!done&&i>=start&&i<start+k?'is-current':''}">${v}</span>${i<a.length-1?'<span class="arrow">→</span>':''}`).join('')}</div>`),message:()=>msg};
}

function mergeKLab(){
  const lists=[[1,4,5],[1,3,4],[2,6]],pos=[0,0,0],out=[];let heap=lists.map((list,i)=>({v:list[0],i})).sort((a,b)=>a.v-b.v),msg='最小堆只保存每条链表当前尚未合并的头节点。';
  return{step(){if(!heap.length)return;const x=heap.shift();out.push(x.v);pos[x.i]++;if(pos[x.i]<lists[x.i].length){heap.push({v:lists[x.i][pos[x.i]],i:x.i});heap.sort((a,b)=>a.v-b.v);}msg=`弹出 ${x.v} 写入结果，并${pos[x.i]<lists[x.i].length?'把同一链表的后继压入堆':'结束这条链表'}。`;},done:()=>heap.length===0,view:()=>lists.map((list,li)=>`<div class="list-row"><span class="label">L${li+1}</span>${cells(list,i=>`${i<pos[li]?'is-done ':''}${i===pos[li]?'is-current':''}`,false)}</div>`).join('')+section('最小堆',`<div class="tokens">${heap.map(x=>`<span class="heap-token">${x.v}<small> L${x.i+1}</small></span>`).join('')||'<span class="muted">空</span>'}</div>`)+section('合并结果',cells(out,()=>'',false)),message:()=>msg};
}

function maxPathLab(){
  const nodes=[{id:'root',v:-10,x:50,y:14,l:'n9',r:'n20'},{id:'n9',v:9,x:25,y:44},{id:'n20',v:20,x:75,y:44,l:'n15',r:'n7'},{id:'n15',v:15,x:62,y:76},{id:'n7',v:7,x:88,y:76}],order=['n9','n15','n7','n20','root'],by=Object.fromEntries(nodes.map(n=>[n.id,n]));let idx=0,current='',gain={},best=-Infinity,msg='后序处理：向父节点只能返回一条向下分支，全局答案可以同时连接左右分支。';
  return{step(){if(idx>=order.length)return;current=order[idx++];const n=by[current],lg=Math.max(0,gain[n.l]||0),rg=Math.max(0,gain[n.r]||0),through=n.v+lg+rg;gain[current]=n.v+Math.max(lg,rg);best=Math.max(best,through);msg=`节点 ${n.v}：左右贡献 ${lg}、${rg}；穿过当前节点的路径和 ${through}，向上返回 ${gain[current]}。`;},done:()=>idx>=order.length,view:()=>`<svg class="tree" viewBox="0 0 100 100" role="img" aria-label="二叉树最大路径和后序状态"><line x1="50" y1="20" x2="25" y2="38"/><line x1="50" y1="20" x2="75" y2="38"/><line x1="75" y1="50" x2="62" y2="70"/><line x1="75" y1="50" x2="88" y2="70"/>${nodes.map(n=>`<g class="${n.id===current?'is-current ':''}${gain[n.id]!==undefined?'is-done':''}"><circle cx="${n.x}" cy="${n.y}" r="7"/><text x="${n.x}" y="${n.y+1}">${n.v}</text><text class="contrib" x="${n.x}" y="${n.y+11}">${gain[n.id]===undefined?'':`贡献 ${gain[n.id]}`}</text></g>`).join('')}</svg>`+section('当前全局最大值',`<strong>${best===-Infinity?'尚未计算':best}</strong>`),message:()=>msg};
}

function medianTwoLab(){
  const A=[1,2],B=[3,4];let low=0,high=A.length,i=null,j=null,median=null,msg='只在较短数组 A 上二分，寻找同时满足左右有序的分割线。';
  const row=(arr,p)=>`<div class="row">${arr.map((v,k)=>`${k===p?'<span class="divider"></span>':''}<span class="hard-cell">${v}</span>`).join('')}${p===arr.length?'<span class="divider"></span>':''}</div>`;
  return{step(){if(median!==null||low>high)return;i=Math.floor((low+high)/2);j=Math.floor((A.length+B.length+1)/2)-i;const la=i?A[i-1]:-Infinity,ra=i<A.length?A[i]:Infinity,lb=j?B[j-1]:-Infinity,rb=j<B.length?B[j]:Infinity;if(la>rb){high=i-1;msg=`A 左侧 ${la} > B 右侧 ${rb}，A 的分割线左移。`;}else if(lb>ra){low=i+1;msg=`B 左侧 ${lb} > A 右侧 ${ra}，A 的分割线右移。`;}else{median=(Math.max(la,lb)+Math.min(ra,rb))/2;msg=`左右两侧均有序，中位数由左侧最大值与右侧最小值确定：${median}。`;}},done:()=>median!==null,view:()=>section('A 的分割',row(A,i??0))+section('B 的分割',row(B,j??2))+section('中位数',`<strong>${median??'尚未确定'}</strong>`),message:()=>msg};
}

function histogramLab(){
  const raw=[2,1,5,6,2,3],h=[...raw,0];let i=0,stack=[],best=0,rect=null,msg='单调递增栈保存尚未找到右边界的柱子下标，末尾哨兵 0 负责清栈。';
  return{step(){if(i>=h.length)return;if(stack.length&&h[stack.at(-1)]>h[i]){const top=stack.pop(),width=stack.length?i-stack.at(-1)-1:i,area=h[top]*width;best=Math.max(best,area);rect=[i-width,i-1];msg=`弹出高度 ${h[top]}：宽度 ${width}，面积 ${area}，当前最大值 ${best}。`;}else{stack.push(i);msg=`下标 ${i}${i===raw.length?'（哨兵）':''} 入栈，继续向右。`;i++;}},done:()=>i>=h.length,view:()=>`<div class="bars">${raw.map((v,k)=>`<div class="bar-col ${k===i?'is-current ':''}${rect&&k>=rect[0]&&k<=rect[1]?'is-rect':''}"><div class="bar-mark" style="height:${v*23}px">${v}</div><small>${k}</small></div>`).join('')}</div>`+section('单调栈（下标 / 高度）',`<div class="tokens">${stack.filter(x=>x<raw.length).map(x=>`<span class="heap-token">${x} / ${h[x]}</span>`).join('')||'<span class="muted">空</span>'}</div>`)+section('最大面积',`<strong>${best}</strong>`),message:()=>msg};
}

function medianStreamLab(){
  const stream=[5,2,10,4,8,3];let index=0,lower=[],upper=[],median=null,msg='大顶堆保存较小的一半，小顶堆保存较大的一半，大小差不超过 1。';
  const balance=()=>{if(lower.length>upper.length+1){upper.push(lower.shift());upper.sort((a,b)=>a-b);}else if(upper.length>lower.length){lower.push(upper.shift());lower.sort((a,b)=>b-a);}};
  return{step(){if(index>=stream.length)return;const x=stream[index++];if(!lower.length||x<=lower[0]){lower.push(x);lower.sort((a,b)=>b-a);}else{upper.push(x);upper.sort((a,b)=>a-b);}balance();median=lower.length===upper.length?(lower[0]+upper[0])/2:lower[0];msg=`插入 ${x} 并重新平衡，两堆堆顶给出中位数 ${median}。`;},done:()=>index>=stream.length,view:()=>section('数据流',cells(stream,i=>`${i<index?'is-done ':''}${i===index?'is-current':''}`,false))+section('大顶堆｜较小一半',`<div class="tokens">${lower.map(v=>`<span class="heap-token">${v}</span>`).join('')||'<span class="muted">空</span>'}</div>`)+section('小顶堆｜较大一半',`<div class="tokens">${upper.map(v=>`<span class="heap-token">${v}</span>`).join('')||'<span class="muted">空</span>'}</div>`)+section('当前中位数',`<strong>${median??'—'}</strong>`),message:()=>msg};
}

function validParenthesesLab(){
  const s=')()())';let dp=Array(s.length).fill(0),i=1,current=-1,msg='dp[i] 表示以位置 i 的右括号结尾的最长有效括号长度。';
  return{step(){if(i>=s.length)return;current=i;if(s[i]===')'){if(s[i-1]==='('){dp[i]=(i>=2?dp[i-2]:0)+2;msg='当前形成 ()，接上 i-2 位置之前的有效长度。';}else{const j=i-dp[i-1]-1;if(j>=0&&s[j]==='('){dp[i]=dp[i-1]+2+(j>=1?dp[j-1]:0);msg=`跳过前一段长度 ${dp[i-1]}，位置 ${j} 的左括号与当前匹配。`;}else msg='向左跳过已有有效段后没有可匹配的左括号。';}}else msg='左括号不能作为有效段结尾，dp 保持 0。';i++;},done:()=>i>=s.length,view:()=>section('括号串',cells([...s],k=>k===current?'is-current':'',false))+section('dp：以当前位置结尾的最长长度',cells(dp,k=>`${k===current?'is-current ':''}${dp[k]>0?'is-done':''}`,false))+section('当前答案',`<strong>${Math.max(...dp)}</strong>`),message:()=>msg};
}

function editDistanceLab(){
  const a='horse',b='ros',rows=a.length+1,cols=b.length+1,dp=Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,c)=>r===0?c:c===0?r:0));let r=1,c=1,current=[-1,-1],msg='dp[i][j] 表示 a 的前 i 个字符变为 b 的前 j 个字符所需的最少操作数。';
  return{step(){if(r>=rows)return;current=[r,c];if(a[r-1]===b[c-1]){dp[r][c]=dp[r-1][c-1];msg=`字符 ${a[r-1]} 相同，直接继承左上角。`;}else{dp[r][c]=1+Math.min(dp[r-1][c],dp[r][c-1],dp[r-1][c-1]);msg=`字符 ${a[r-1]} 与 ${b[c-1]} 不同，从删除、插入、替换三种来源取最小值再加 1。`;}c++;if(c>=cols){c=1;r++;}},done:()=>r>=rows,view:()=>{let x='<div class="matrix" style="--cols:5"><span class="hard-cell"></span><span class="hard-cell">∅</span>'+[...b].map(ch=>`<span class="hard-cell">${ch}</span>`).join('');for(let i=0;i<rows;i++){x+=`<span class="hard-cell">${i?[...a][i-1]:'∅'}</span>`;for(let j=0;j<cols;j++)x+=`<span class="hard-cell ${current[0]===i&&current[1]===j?'is-current ':''}${i<r||(i===r&&j<c)?'is-done':''}">${dp[i][j]}</span>`;}return x+'</div>'+section('当前最短编辑距离',`<strong>${r>=rows?dp.at(-1).at(-1):'填表中'}</strong>`);},message:()=>msg};
}

const factories={
  'window-max':windowMaxLab,'min-window':minWindowLab,'first-missing':firstMissingLab,'reverse-k':reverseKLab,
  'merge-k':mergeKLab,'max-path':maxPathLab,'median-two':medianTwoLab,'histogram':histogramLab,
  'median-stream':medianStreamLab,'valid-parentheses':validParenthesesLab,'edit-distance':editDistanceLab
};
let lab;
function reset(){const mode=new URLSearchParams(location.search).get('mode')||'window-max';lab=(factories[mode]||windowMaxLab)();render();}
function render(){$('stage').innerHTML=lab.view();$('status').textContent=lab.message();$('step').disabled=lab.done();}
$('step').addEventListener('click',()=>{lab.step();render();});
$('reset').addEventListener('click',reset);
reset();
</script>

    item.addEventListener('keydown', (event) => {

    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')

})();
