--dk-ok:#157a52;--dk-warn:#a85b00;--dk-err:#b3372f;--dk-radius:14px;
--font-sans:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
--font-mono:"JetBrains Mono","Cascadia Code",Consolas,"Microsoft YaHei",monospace}
@media(prefers-color-scheme:dark){:root{--dk-bg:#0f131b;--dk-panel:#181e29;--dk-soft:#141a24;--dk-text:#eaf0fa;
--dk-muted:#9aa6ba;--dk-line:#313b4c;--dk-brand:#b1afff;--dk-brand-strong:#c4c2ff;--dk-brand-soft:#292955;
--dk-ok:#79d8a8;--dk-warn:#ffc174;--dk-err:#ff969d}
html[data-theme="light"]{--dk-bg:#f4f6fb;--dk-panel:#ffffff;--dk-soft:#f6f7fb;--dk-text:#1b2434;--dk-muted:#68758c;
--dk-line:#dfe4ee;--dk-brand:#5654d4;--dk-brand-strong:#4543bd;--dk-brand-soft:#eeedff;
--dk-ok:#157a52;--dk-warn:#a85b00;--dk-err:#b3372f}}
html[data-theme="dark"]{--dk-bg:#0f131b;--dk-panel:#181e29;--dk-soft:#141a24;--dk-text:#eaf0fa;
--dk-muted:#9aa6ba;--dk-line:#313b4c;--dk-brand:#b1afff;--dk-brand-strong:#c4c2ff;--dk-brand-soft:#292955;
--dk-ok:#79d8a8;--dk-warn:#ffc174;--dk-err:#ff969d}
@font-face{font-family:"Inter";src:url("../../assets/fonts/Inter-Variable.woff2") format("woff2");
font-weight:100 900;font-style:normal;font-display:swap;
unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";src:url("../../assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");
font-weight:100 800;font-style:normal;font-display:swap;
unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
body{font-family:var(--font-sans)!important;background:var(--dk-bg)!important;color:var(--dk-text)!important}
button,input,select,textarea{font-family:var(--font-sans)!important;border-radius:9px!important}
button{border:1px solid var(--dk-line)!important;background:var(--dk-panel)!important;color:var(--dk-text)!important;
cursor:pointer;transition:border-color .15s,color .15s,background .15s}
button:hover{border-color:var(--dk-brand)!important;color:var(--dk-brand)!important}
select,input[type=text],input[type=number]{border:1px solid var(--dk-line)!important;
background:var(--dk-panel)!important;color:var(--dk-text)!important;padding:5px 9px}
table{border-collapse:collapse}
th{background:var(--dk-soft)}
th,td{border-color:var(--dk-line)}
h1,h2,h3{letter-spacing:-.01em}
a{color:var(--dk-brand)}
code,pre{font-family:var(--font-mono)!important}
</style>
<script id="hot100-embed-bootstrap">
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('embed') !== '1') return;
  document.documentElement.classList.add('hot100-embedded');
  if (params.has('panel')) document.documentElement.classList.add('hot100-single-panel');
})();
</script>

<title>单调栈实验室 · Hot 100</title>

<style id="hot100-polish">
:root {
  color-scheme: light dark;
  --hot-bg: #f4f6fb;
  --hot-surface: #ffffff;
  --hot-surface-soft: #f8f9fd;
  --hot-text: #182235;
  --hot-muted: #66748a;
  --hot-line: #dfe4ee;
  --hot-brand: #5654d4;
  --hot-brand-soft: #eeedff;
  --hot-on-brand: #ffffff;
  --hot-hero-start: #314fc7;
  --hot-hero-end: #5546ca;
  --hot-hero-text: #ffffff;
  --hot-hero-muted: #e7ebff;
  --hot-success: #167a52;
  --hot-success-soft: #def7e9;
  --hot-warning: #934b00;
  --hot-warning-soft: #fff0d8;
  --hot-danger: #b52b3a;
  --hot-danger-soft: #ffe5e9;
  --hot-canvas-bg: #f8fafc;
  --hot-canvas-line: #c9d2df;
  --hot-shadow: 0 12px 34px rgba(33,45,73,.075);
}
@media (prefers-color-scheme: dark) {
  :root {
    --hot-bg: #0f131b;
    --hot-surface: #181e29;
    --hot-surface-soft: #141a24;
    --hot-text: #eaf0fa;
    --hot-muted: #a3afc2;
    --hot-line: #313b4c;
    --hot-brand: #b1afff;
    --hot-brand-soft: #292955;
    --hot-on-brand: #111521;
    --hot-hero-start: #263677;
    --hot-hero-end: #39256f;
    --hot-hero-text: #f8f9ff;
    --hot-hero-muted: #dfe4ff;
    --hot-success: #79d8a8;
    --hot-success-soft: #183c2d;
    --hot-warning: #ffc174;
    --hot-warning-soft: #47311b;
    --hot-danger: #ff9ba6;
    --hot-danger-soft: #47242b;
    /* 旧 Canvas 内部仍使用深色文字，因此绘图区保持柔和浅底以确保可读。 */
    --hot-canvas-bg: #edf2f7;
    --hot-canvas-line: #bac5d2;
    --hot-shadow: 0 16px 42px rgba(0,0,0,.22);
  }
}
* { box-sizing: border-box; }
html { min-width: 0; background: var(--hot-bg) !important; }
body {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 0 34px !important;
  color: var(--hot-text) !important;
  background: radial-gradient(circle at 12% 0%, color-mix(in srgb,var(--hot-brand) 9%,transparent), transparent 34rem), var(--hot-bg) !important;
}
:focus-visible { outline: 3px solid color-mix(in srgb,var(--hot-brand) 48%,transparent) !important; outline-offset: 3px; }
.hot100-topnav {
  width: min(100% - 24px, 1400px);
  margin: 12px auto 16px;
  padding: 10px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--hot-muted);
  background: color-mix(in srgb,var(--hot-surface) 94%,transparent);
  border: 1px solid var(--hot-line);
  border-radius: 13px;
  box-shadow: var(--hot-shadow);
  font: 14px/1.45 system-ui, "Microsoft YaHei", sans-serif;
}
.hot100-topnav .hot100-links { display: flex; gap: 7px; flex-wrap: wrap; }
.hot100-topnav a { padding: 6px 9px; color: var(--hot-brand); background: var(--hot-brand-soft); border-radius: 7px; text-decoration: none; }
.hot100-topnav a:hover { filter: brightness(.97); }
.hot100-topnav strong { min-width: 0; color: var(--hot-text); overflow-wrap: anywhere; }
body > .container, body > .shell, body > main, body > .wrap {
  width: min(100% - 24px, 1400px) !important;
  max-width: 1400px !important;
  margin-left: auto !important;
  margin-right: auto !important;
  padding-bottom: 44px;
}
body > h1, body > h2, body > h3, body > .info, body > .desc, body > .btn-group {
  width: min(100% - 24px, 1400px);
  margin-left: auto !important;
  margin-right: auto !important;
}
canvas, svg, img { max-width: 100% !important; }
button, input, select, textarea { max-width: 100%; }
body h1 {
  margin-top: 0;
  color: var(--hot-text) !important;
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.2;
  letter-spacing: -.02em;
}
body h2 { color: var(--hot-text); line-height: 1.3; }
body h3 { color: var(--hot-text); line-height: 1.4; }
button, input, select, textarea { font: inherit; }
button {
  min-height: 36px;
  padding: 8px 12px;
  color: var(--hot-text);
  background: var(--hot-surface);
  border: 1px solid var(--hot-line) !important;
  border-radius: 9px !important;
  box-shadow: 0 2px 8px rgba(33,45,73,.04);
  transition: transform .16s ease, border-color .16s ease, background-color .16s ease, box-shadow .16s ease;
}
button:hover:not(:disabled) {
  border-color: color-mix(in srgb,var(--hot-brand) 42%,var(--hot-line)) !important;
  background: color-mix(in srgb,var(--hot-brand-soft) 58%,var(--hot-surface));
  box-shadow: 0 5px 14px rgba(33,45,73,.08);
  transform: translateY(-1px);
}
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { opacity: .52; cursor: not-allowed; box-shadow: none; }
button.primary, button.btn-primary, button.btn-apply, .primary, .btn-primary, .btn-apply {
  color: var(--hot-on-brand) !important;
  background: var(--hot-brand) !important;
  border-color: var(--hot-brand) !important;
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), select, textarea {
  min-height: 36px;
  padding: 7px 10px !important;
  color: var(--hot-text) !important;
  background: var(--hot-surface) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 8px !important;
}
input[type="range"] { accent-color: var(--hot-brand); }
.controls, .toolbar, .input-row, .preset-row, .sort-tabs, .ds-tabs, .op-bar, .btn-group, .legend { flex-wrap: wrap !important; }
.controls, .toolbar, .input-row, .preset-row, .op-bar, .btn-group { gap: 9px !important; }
/* 原生实验室也统一成“舞台/状态说明 → 控制条”。历史页面的 toolbar
   有些写在 panel 之前，这里用稳定的视觉顺序兜底；新页面应直接按该顺序写 DOM。 */
body > main.shell { display: flex; flex-direction: column; }
body > main.shell > .panel,
body > main.shell > .layout { order: 20; }
body > main.shell > .toolbar {
  order: 30;
  width: 100%;
  margin: 14px 0 0 !important;
  padding: 12px 0 0 !important;
  border-top: 1px solid var(--hot-line);
  justify-content: flex-start;
}
.sort-tabs, .ds-tabs {
  display: flex;
  gap: 7px !important;
  margin-block: 18px !important;
  padding: 4px !important;
  background: color-mix(in srgb,var(--hot-surface) 84%,transparent) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 13px !important;
  box-shadow: 0 6px 20px rgba(33,45,73,.045);
}
.sort-tab, .ds-tab, .code-tab, .preset-btn {
  padding: 8px 11px !important;
  color: var(--hot-muted) !important;
  background: transparent !important;
  border: 1px solid transparent !important;
  border-radius: 9px !important;
  cursor: pointer;
  transition: color .16s ease, background-color .16s ease, border-color .16s ease;
}
.sort-tab:hover, .ds-tab:hover, .code-tab:hover, .preset-btn:hover {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;
}
.sort-tab.active, .ds-tab.active, .code-tab.active, .preset-btn.active {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;
  border-color: color-mix(in srgb,var(--hot-brand) 28%,var(--hot-line)) !important;
  box-shadow: 0 3px 10px rgba(33,45,73,.065);
}
.container, .shell, main, .wrap, .content, .layout, .code-section, .vis-section, .content > *, .layout > *, .wrap > * { min-width: 0 !important; }
.vis-canvas-wrap, .panel, .box, .table-responsive, .code-scroll, .notes-section { max-width: 100%; }
.table-responsive, .code-scroll, .notes-section { overflow: auto; }
.panel { overflow: hidden !important; }
.box { overflow: visible; }
.panel, .box {
  color: var(--hot-text);
  background-color: var(--hot-surface) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 15px !important;
  box-shadow: var(--hot-shadow) !important;
}
.code-section { border-color: var(--hot-line) !important; }
.vis-section { background-color: var(--hot-surface-soft) !important; }
.vis-msg, .target-info, .algo-desc, .desc, .status, .log {
  color: var(--hot-text) !important;
  border-color: var(--hot-line) !important;
}
.vis-msg, .target-info, .algo-desc, .desc {
  background: color-mix(in srgb,var(--hot-brand-soft) 48%,var(--hot-surface)) !important;
}
.legend {

  background: var(--hot-surface) !important;
  border-color: var(--hot-line) !important;
}
.step-info, .size-info, .sub, .muted { color: var(--hot-muted) !important; }
/* 题头必须使用独立的前景/背景色对；不能继承正文的灰色文字。 */
.panel-header {
  color: var(--hot-hero-text) !important;
  background: linear-gradient(135deg,var(--hot-hero-start),var(--hot-hero-end)) !important;
}
.panel-header h1, .panel-header h2, .panel-header h3 {
  color: inherit !important;
}
.panel-header .sub, .panel-header p, .panel-header .info {
  max-width: 88ch;

  opacity: 1 !important;
  line-height: 1.65;
  white-space: normal !important;
  overflow-wrap: anywhere;
}
/* 复杂度徽标中的色点不是第二层徽标，避免白块套白块。 */
.complexity .badge-time, .complexity .badge-space {
  display: inline !important;
  margin-right: 6px;
  padding: 0 !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
}
/* 动画安全区：标签、指针和高亮不再贴边或被相邻区域裁掉。 */
.lane { min-height: 220px !important; padding: 36px 6px !important; row-gap: 52px !important; overflow: visible !important; }
.lane .label.top { bottom: 66px !important; }
.lane .label.bottom { top: 66px !important; }
.bars { height: 300px !important; padding-top: 38px !important; padding-bottom: 34px !important; overflow: visible !important; }
.bars .col { min-width: 0; }
.bars .idx, .bars .answer { z-index: 2; }
.hot100-bar-stage {
  min-height: 300px !important;

  overflow-x: auto !important;
  overflow-y: clip !important;

}
.hot100-bar-stage .bar-wrapper { z-index: 2; }
.hot100-bar-stage .water-rect { z-index: 1; }
.hot100-native-canvas {
  min-height: clamp(400px, 48vh, 540px) !important;

/* 高亮使用边框/阴影，不再放大后覆盖相邻格子。 */

.curr, .board-cell.current { box-shadow: inset 0 0 0 2px color-mix(in srgb,var(--hot-brand) 58%,transparent) !important; }
.bar-label, .idx { color: var(--hot-muted) !important; }
pre { max-width: 100%; overflow: auto !important; }
table { max-width: 100%; }

@media (prefers-color-scheme: dark) {
  body > .container > h1, body > .shell > h1, body > main > h1, body > h1, body > h2 { color: var(--hot-text) !important; }
  .panel, .box, .code-section, .vis-section, .notes-section, .input-section, .top-tags,
  .controls, .complexity, .complexity-bar, .code-header, .code-tab, .legend, .algo-desc,

  .sub, .muted, .info, .row-label, .step-info, .size-info { color: var(--hot-muted) !important; }
  input, select, textarea { color: var(--hot-text) !important; background: var(--hot-surface) !important; border-color: var(--hot-line) !important; }
  button:not(.primary):not(.btn-primary):not(.active) { color: var(--hot-text); background-color: var(--hot-surface); border-color: var(--hot-line); }
}
/* 状态配色：前景与底色成对定义，避免只改背景造成文字消失。 */
.code-line.highlight-line {
  color: var(--hot-text) !important;
  background: var(--hot-warning-soft) !important;
  box-shadow: inset 3px 0 var(--hot-warning);
}
.code-line.highlight-line .lineno { color: var(--hot-warning) !important; }
.code .active {
  display: inline-block;

  background-color: var(--hot-surface-soft);
  border-color: color-mix(in srgb,var(--hot-text) 17%,var(--hot-line)) !important;
}
.header { color: var(--hot-muted) !important; background: transparent !important; border-color: transparent !important; }
.filled, .cell.in, .frontier {

  background: var(--hot-brand-soft) !important;

}
.true, .map-pair.found, .op-badge.found, .board-cell.matched, .queen-cell.safe, .cell.visited, .source {
  color: var(--hot-success) !important;
  background: var(--hot-success-soft) !important;
  border-color: color-mix(in srgb,var(--hot-success) 66%,var(--hot-line)) !important;
}

.val-box.current {

<script>
/* ===== 单调栈实验室：739 / 84。柱状图 + 下标栈，逐根结算 ===== */

var DEMOS = {

  "0739": {
    no: "739", title: "每日温度", tag: "单调栈 · 下一个更大元素（栈内温度递减）",
    example: "输入：每天的温度　输出：每天还要等几天才会遇到更高的温度，等不到就是 0",
    sizes: [
      { label: "长降温段（默认：一次弹 5 根）", t: [89, 62, 70, 58, 47, 47, 46, 76, 100, 70] },
      { label: "示例 1（教科书那组）", t: [73, 74, 75, 71, 69, 72, 76, 73] },
      { label: "连续同温（相等不算「更高」）", t: [75, 75, 75, 73, 76] }
    ],
    defaultSize: 0,
    stageHeight: 400,
    code: {
      title: "对照代码",
      langs: {
        java: [
          "Deque<Integer> st = new ArrayDeque<>();   // 栈里放「还没等到更高温度」的下标",
          "for (int i = 0; i < n; i++) {",
          "    while (!st.isEmpty() && T[i] > T[st.peek()]) {   // 严格大于才结算",
          "        int j = st.pop(); ans[j] = i - j; }",
          "    st.push(i); }   // 自己也进去排队",
          "// 留在栈里的下标 ans 保持 0：后面再没有更高的温度"
        ],
        cpp: [
          "stack<int> st;   // 栈里放「还没等到更高温度」的下标",
          "for (int i = 0; i < n; ++i) {",
          "    while (!st.empty() && T[i] > T[st.top()]) {   // 严格大于才结算",
          "        int j = st.top(); st.pop(); ans[j] = i - j; }",
          "    st.push(i); }   // 自己也进去排队",
          "// 留在栈里的下标 ans 保持 0：后面再没有更高的温度"
        ],
        python: [
          "st = []   # 栈里放「还没等到更高温度」的下标",
          "for i in range(n):",
          "    while st and T[i] > T[st[-1]]:   # 严格大于才结算",
          "        j = st.pop(); ans[j] = i - j",
          "    st.append(i)   # 自己也进去排队",
          "# 留在栈里的下标 ans 保持 0：后面再没有更高的温度"
        ],
        go: [
          "st := []int{}   // 栈里放「还没等到更高温度」的下标",
          "for i := 0; i < n; i++ {",
          "    for len(st) > 0 && T[i] > T[st[len(st)-1]] {   // 严格大于才结算",
          "        j := st[len(st)-1]; st = st[:len(st)-1]; ans[j] = i - j }",
          "    st = append(st, i) }   // 自己也进去排队",
          "// 留在栈里的下标 ans 保持 0：后面再没有更高的温度"
        ],
        c: [
          "int st[N], top = 0;   /* 栈里放「还没等到更高温度」的下标 */",
          "for (int i = 0; i < n; i++) {",
          "    while (top > 0 && T[i] > T[st[top-1]]) {   /* 严格大于才结算 */",
          "        int j = st[--top]; ans[j] = i - j; }",
          "    st[top++] = i; }   /* 自己也进去排队 */",
          "/* 留在栈里的下标 ans 保持 0：后面再没有更高的温度 */"
        ]
      }
    },
    invariants: [
      { label: "栈里的温度从栈底到栈顶不升（相等能共存）", test: function (v) {
          for (var i = 1; i < v.stack.length; i++) {
            if (v.t[v.stack[i - 1]] < v.t[v.stack[i]]) return false;
          }
          return v.stack.length < 2 ? "栈里不到两个元素，天然成立"
            : v.stack.map(function (j) { return v.t[j]; }).join(" ≥ ") + "（出栈条件是严格大于，所以相等的会一起留在栈里）";
        } },
      { label: "每个下标最多进栈一次、出栈一次", test: function (v) {
          return "已入栈 " + v.pushes + " 次、已出栈 " + v.pops + " 次，总计 O(n)";
        } }
    ],
    build: function (ctx, size) {
      var T = ((size && size.t) || [89, 62, 70, 58, 47, 47, 46, 76, 100, 70]).slice();
      var n = T.length, ans = [], st = [], pushes = 0, pops = 0, i;
      for (i = 0; i < n; i++) ans.push(0);
      var resolved = [];
      for (i = 0; i < n; i++) resolved.push(false);

      function bars(cur, hot) {
        return T.map(function (v, idx) {
          var cls = null;
          if (hot && hot.indexOf(idx) >= 0) cls = "swap";
          else if (idx === cur) cls = "cmp";
          else if (st.indexOf(idx) >= 0) cls = "target";
          else if (resolved[idx]) cls = "done";
          return { v: v, cls: cls, label: resolved[idx] ? "+" + ans[idx] + " 天" : "" };
        });
      }
      function V(cur, hot, note) {
        return {
          bars: bars(cur, hot), stack: st.slice(), note: note,
          vars: [["i", cur < 0 ? "—" : cur], ["栈深", st.length], ["已结算", resolved.filter(Boolean).length + " / " + n]],
          t: T, pushes: pushes, pops: pops
        };
      }

      ctx.step("栈里只放「还没等到更高温度」的下标，从栈底到栈顶温度严格递减。每来一天，就把栈里所有比它低的日子一次性结算掉。",
        V(-1, null, "蓝色＝还在栈里排队，灰色＝已结算，红色＝这一步刚被弹出。"), { line: 1 });

      for (i = 0; i < n; i++) {
        var popped = [];
        while (st.length && T[i] > T[st[st.length - 1]]) {
          var j = st.pop();
          ans[j] = i - j; resolved[j] = true; pops++; popped.push(j);
          ctx.step("第 " + i + " 天 " + T[i] + "° > 栈顶第 " + j + " 天的 " + T[j] + "° → 第 " + j +
            " 天终于等到了，ans[" + j + "] = " + i + " − " + j + " = " + ans[j] + "，出栈。",
            V(i, [j], popped.length > 1
              ? "这是本轮第 " + popped.length + " 个被弹出的：一根高柱子能一次结算掉整段降温。"
              : "严格大于才结算——相等不算「更高的温度」。"), { line: 4 });
        }
        st.push(i); pushes++;
        ctx.step("第 " + i + " 天 " + T[i] + "° 入栈等待。" + (popped.length
          ? "刚刚一口气结算了 " + popped.length + " 天（" + popped.join("、") + "）。"
          : (st.length > 1 ? "它比栈顶的 " + T[st[st.length - 2]] + "° 低（或相等），弹不动任何人，自己排到最上面。" : "栈是空的，它是第一个排队的。")),
          V(i, null, "栈里温度：" + (st.map(function (k) { return T[k] + "°"; }).join(" ≥ ") || "（空）")), { line: 5 });
      }

      var left = st.slice();
      ctx.step("遍历结束，栈里还剩 " + left.length + " 天（下标 " + left.join("、") + "）。它们后面再没有更高的温度，ans 保持 0。最终答案：[" + ans.join(", ") + "]",
        V(-1, null, "每根柱子下面的 +n 天就是答案；没有标注的就是 0。"), { line: 6 });
    },
    render: renderBars
  },

  "0084": {
    no: "84", title: "柱状图中最大的矩形", tag: "单调栈 · 左右第一个更矮的（栈内高度递增）",
    example: "输入：柱状图高度　输出：能勾出的最大矩形面积。每根柱子当一次「矩形的高」，宽度由左右第一个更矮的柱子夹定",
    sizes: [
      { label: "8 根（默认：答案出在最矮的那根）", h: [6, 7, 5, 2, 4, 5, 9, 3] },
      { label: "示例 1（答案 10）", h: [2, 1, 5, 6, 2, 3] },
      { label: "全递增（没有哨兵就一根都结算不了）", h: [1, 2, 3, 4, 5] }
    ],
    defaultSize: 0,
    stageHeight: 400,
    code: {
      title: "对照代码",
      langs: {
        java: [
          "Deque<Integer> st = new ArrayDeque<>(); int best = 0;",
          "for (int i = 0; i <= n; i++) {          // i == n 时用高度 0 当哨兵",
          "    int h = (i == n) ? 0 : H[i];",
          "    while (!st.isEmpty() && h < H[st.peek()]) {",
          "        int j = st.pop();                 // j 的高度就是矩形的高",
          "        int left = st.isEmpty() ? -1 : st.peek();   // 左边第一个更矮的",
          "        best = Math.max(best, H[j] * (i - left - 1)); }",
          "    st.push(i); }"
        ],
        cpp: [
          "stack<int> st; int best = 0;",
          "for (int i = 0; i <= n; ++i) {          // i == n 时用高度 0 当哨兵",
          "    int h = (i == n) ? 0 : H[i];",
          "    while (!st.empty() && h < H[st.top()]) {",
          "        int j = st.top(); st.pop();       // j 的高度就是矩形的高",
          "        int left = st.empty() ? -1 : st.top();   // 左边第一个更矮的",
          "        best = max(best, H[j] * (i - left - 1)); }",
          "    st.push(i); }"
        ],
        python: [
          "st, best = [], 0",
          "for i in range(n + 1):                  # i == n 时用高度 0 当哨兵",
          "    h = 0 if i == n else H[i]",
          "    while st and h < H[st[-1]]:",
          "        j = st.pop()                      # j 的高度就是矩形的高",
          "        left = st[-1] if st else -1       # 左边第一个更矮的",
          "        best = max(best, H[j] * (i - left - 1))",
          "    st.append(i)"
        ],
        go: [
          "st, best := []int{}, 0",
          "for i := 0; i <= n; i++ {               // i == n 时用高度 0 当哨兵",
          "    h := 0; if i < n { h = H[i] }",
          "    for len(st) > 0 && h < H[st[len(st)-1]] {",
          "        j := st[len(st)-1]; st = st[:len(st)-1]   // j 的高度就是矩形的高",
          "        left := -1; if len(st) > 0 { left = st[len(st)-1] }   // 左边第一个更矮的",
          "        if a := H[j] * (i - left - 1); a > best { best = a } }",
          "    st = append(st, i) }"
        ],
        c: [
          "int st[N], top = 0, best = 0;",
          "for (int i = 0; i <= n; i++) {          /* i == n 时用高度 0 当哨兵 */",
          "    int h = (i == n) ? 0 : H[i];",
          "    while (top > 0 && h < H[st[top-1]]) {",
          "        int j = st[--top];                /* j 的高度就是矩形的高 */",
          "        int left = (top > 0) ? st[top-1] : -1;   /* 左边第一个更矮的 */",
          "        int a = H[j] * (i - left - 1); if (a > best) best = a; }",
          "    st[top++] = i; }"
        ]
      }
    },
    invariants: [
      { label: "栈里的高度从栈底到栈顶不降（相等能共存）", test: function (v) {
          for (var i = 1; i < v.stack.length; i++) {
            if (v.h[v.stack[i - 1]] > v.h[v.stack[i]]) return false;
          }
          return v.stack.length < 2 ? "栈里不到两个元素，天然成立"
            : v.stack.map(function (j) { return v.h[j]; }).join(" ≤ ") + "（出栈条件是严格小于，等高的柱子会一起留着，最后那根仍会量到完整宽度）";
        } },
      { label: "已算出的面积都不超过 best", test: function (v) {
          return v.lastArea <= v.best
            ? "刚算出 " + v.lastArea + "，当前最大 " + v.best
            : false;
        } }
    ],
    build: function (ctx, size) {
      var H = ((size && size.h) || [6, 7, 5, 2, 4, 5, 9, 3]).slice();
      var n = H.length, st = [], best = 0, bestSpan = null, lastArea = 0, i;

      function bars(cur, j, span, seen) {
        return H.map(function (v, idx) {
          var cls = null;
          if (idx === j) cls = "swap";
          else if (span && idx >= span[0] && idx <= span[1]) cls = "write";
          else if (idx === cur) cls = "cmp";
          else if (st.indexOf(idx) >= 0) cls = "target";
          else if (idx < seen) cls = "done";
          return { v: v, cls: cls, label: idx === j ? "高 " + v : "" };
        });
      }
      function V(cur, j, span, note) {
        var seen = cur < 0 ? n : cur;
        return {
          bars: bars(cur, j, span, seen), stack: st.slice(), note: note,
          stackLabel: "栈（下标，高度递增）",
          vars: [["i", cur < 0 ? "—" : (cur >= n ? "n（哨兵）" : cur)], ["栈深", st.length], ["当前最大面积", best]],
          h: H, best: best, lastArea: lastArea
        };
      }

      ctx.step("每根柱子都当一次「矩形的高」。它能往左右伸多远，由左右两边第一个比它矮的柱子夹定。单调栈让高度从栈底到栈顶递增，于是一旦来了更矮的，栈顶那根的右边界就确定了。",
        V(-1, -1, null, "蓝色＝还在栈里（右边界未定），灰色＝已结算。"), { line: 1 });

      for (i = 0; i <= n; i++) {
        var h = (i === n) ? 0 : H[i];
        if (i === n) {
          ctx.step("数组走完了，补一根高度 0 的哨兵。它比谁都矮，能把栈里剩下的 " + st.length + " 根全部逼出来结算。" +
            (st.length ? "没有这一步，" + st.join("、") + " 号柱子的面积就永远算不到。" : ""),
            V(n, -1, null, "哨兵不真的存在，它只负责清栈。"), { line: 2 });
        }
        while (st.length && h < H[st[st.length - 1]]) {
          var j = st.pop();
          var leftIdx = st.length ? st[st.length - 1] : -1;
          var w = i - leftIdx - 1;
          lastArea = H[j] * w;
          var span = [leftIdx + 1, i - 1];
          var isBest = lastArea > best;
          if (isBest) { best = lastArea; bestSpan = span; }
          ctx.step("弹出 " + j + " 号（高 " + H[j] + "）。左边第一个更矮的是 " +
            (leftIdx < 0 ? "——（栈空，说明左边全比它高，能一直伸到 0）" : leftIdx + " 号（高 " + H[leftIdx] + "）") +
            "，右边第一个更矮的是 " + (i === n ? "哨兵" : i + " 号（高 " + H[i] + "）") +
            " → 宽 = " + i + " − " + leftIdx + " − 1 = " + w + "，面积 = " + H[j] + " × " + w + " = " + lastArea + "。" +
            (isBest ? " 刷新最大值！" : " 没超过当前的 " + best + "。"),
            V(i === n ? n : i, j, span, "绿色是这个矩形横跨的 " + w + " 根柱子——注意它们全都不低于 " + H[j] + "。"),
            { line: 7 });
        }
        if (i < n) {
          st.push(i);
          ctx.step(i + " 号（高 " + H[i] + "）入栈。" + (st.length > 1
            ? "它不低于下面那根（" + H[st[st.length - 2]] + "），栈的不降性保住了。"
            : "栈空了，它是新的栈底。") + " 它的右边界还不知道，先挂着。",
            V(i, -1, null, "栈内高度：" + st.map(function (k) { return H[k]; }).join(" ≤ ")), { line: 8 });
        }
      }

      ctx.step("栈清空，答案是 " + best + "（由 " + bestSpan[0] + "～" + bestSpan[1] + " 号这 " +
        (bestSpan[1] - bestSpan[0] + 1) + " 根柱子围出来）。每根柱子只进出栈一次，总复杂度 O(n)。",
        V(-1, -1, bestSpan, "绿色就是最大矩形覆盖的范围。"), { line: 7 });
    },
    render: renderBars
  }
};

  function mountDemo(key) {

      no: d.no, title: d.title, tag: d.tag, example: d.example,
      sizes: d.sizes, defaultSize: d.defaultSize,
      stageHeight: d.stageHeight || 400,
      code: d.code, invariants: d.invariants, compare: d.compare,
      build: d.build, render: d.render
    });
  }
  sel.onchange = function () { mountDemo(sel.value); };
  var want = params.get("mode");
  if (want && DEMOS[want]) { sel.value = want; mountDemo(want); }
  else mountDemo(keys[0]);
})();
