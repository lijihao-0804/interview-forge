<script id="hot100-embed-bootstrap">
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('embed') !== '1') return;
  document.documentElement.classList.add('hot100-embedded');
  if (params.has('panel')) document.documentElement.classList.add('hot100-single-panel');
})();

<script id="hot100-theme-sync">
(() => {
  const root = document.documentElement;
  const apply = (v) => {
    if (v === "light" || v === "dark") root.setAttribute("data-theme", v);
    else root.removeAttribute("data-theme");
  };
  try { apply(localStorage.getItem("forge-theme")); } catch (e) { }
  window.addEventListener("storage", (e) => {
    if (!e || e.key === null || e.key === "forge-theme") {
      let v = null;
      try { v = localStorage.getItem("forge-theme"); } catch (err) { }
      apply(v);
    }
  });
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "forge-theme") apply(e.data.theme);
  });
})();
</script></head>

<nav aria-label="学习导航" class="hot100-topnav" data-hot100-nav=""><strong>单调栈实验室</strong><span class="hot100-links"><a href="../../../index.html" target="_blank" rel="noopener noreferrer">学习面板</a><a href="index.html" target="_blank" rel="noopener noreferrer">可视化中心</a></span></nav><main class="shell"><a href="index.html" target="_blank" rel="noopener noreferrer">← 可视化中心</a><h1>739. 每日温度：单调栈实验室</h1><div class="muted">栈里保存“还没等到更高温度”的下标，且温度从栈底到栈顶递减。</div><div class="toolbar"><button class="primary" id="step">处理下一天</button><button id="reset">重置</button><button id="auto">自动播放</button></div><section class="panel"><div class="bars" id="bars"></div><h2>未结算下标栈</h2><div class="stack" id="stack"></div><div aria-live="polite" class="log" id="log"></div></section></main>
<script>const temps=[73,74,75,71,69,72,76,73],$=id=>document.getElementById(id);let s,timer;function init(){clearInterval(timer);timer=null;$('auto').textContent='自动播放';s={i:-1,stack:[],ans:Array(temps.length).fill(0),msg:'栈为空，准备从第 0 天开始。'};render()}function step(){if(s.i>=temps.length-1){s.msg='完成。栈中剩余下标右侧没有更高温度，答案保持 0。';render();return}s.i++;const resolved=[];while(s.stack.length&&temps[s.i]>temps[s.stack.at(-1)]){const j=s.stack.pop();s.ans[j]=s.i-j;resolved.push(`${j} → 等 ${s.ans[j]} 天`)}s.stack.push(s.i);s.msg=`第 ${s.i} 天温度 ${temps[s.i]}。${resolved.length?'弹栈并结算：'+resolved.join('；'):'没有比栈顶更高，直接入栈。'}`;render()}function render(){const min=68;$('bars').innerHTML=temps.map((t,i)=>`<div class="col ${i===s.i?'current':''}"><div class="answer">${i<s.i||s.ans[i]?s.ans[i]:''}</div><div class="bar" style="height:${40+(t-min)*17}px">${t}°</div><div class="idx">${i}</div></div>`).join('');$('stack').innerHTML=s.stack.map(i=>`<span class="token">下标 ${i} / ${temps[i]}°</span>`).join('')||'<span class="muted">空</span>';$('log').textContent=s.msg}$('step').onclick=step;$('reset').onclick=init;$('auto').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('auto').textContent='自动播放'}else{timer=setInterval(step,800);$('auto').textContent='暂停'}};init();</script>
<script id="hot100-a11y">
(() => {
  // 可视化中心的演示卡片由页面脚本动态生成；只处理卡片容器，不拦截全站点击。
  const ensureVisualCardLinks = () => document.querySelectorAll('#grid a.card').forEach((link) => {
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
  });
  const visualCardGrid = document.getElementById('grid');
  if (visualCardGrid) {
    ensureVisualCardLinks();
    new MutationObserver(ensureVisualCardLinks).observe(visualCardGrid, { childList: true, subtree: true });
  }
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    // 高度计算：可见子元素最大 bottom（子元素盒子即使被 iframe 裁切，
    // 其 rect 仍反映真实布局高度；不要用 body.scrollHeight —— 它不会小于
    // iframe 视口高度，会把"虚高"锁死导致收缩永远上报不出去）。
    const computeHeight = () => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      return Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
    };
    // 上报收敛：高度与上次一致就不发消息（防抖 + 防增长循环重复灌消息）。
    let lastReported = -1;
    const reportHeight = () => requestAnimationFrame(() => {
      const height = computeHeight();
      if (Math.abs(height - lastReported) <= 2) return;
      lastReported = height;
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    // 常驻巡检（300ms 节流由高度收敛判断兜底）：事件观察覆盖不到的时序 ——
    // canvas 内部绘制引起的晚到尺寸变化、超过延迟重报窗口的收缩、宿主侧
    // resize 引发的重排 —— 都会在下一拍被上报。事件观察保留以获得即时性。
    setInterval(reportHeight, 300);
    setTimeout(reportHeight, 400);
    setTimeout(reportHeight, 1200);
    reportHeight();
  }
})();
</script>
