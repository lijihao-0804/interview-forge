            this.val = v;

        buckets = new Node[cap];

        return key % capacity;

        int idx = hash(key);
        Node head = buckets[idx];
        Node cur = head;
        while (cur != null) {
            if (cur.key == key) {
                cur.val = value;
                return;
            }
            cur = cur.next;

        Node newNode = new Node(key, value);
        newNode.next = head;
        buckets[idx] = newNode;

        int idx = hash(key);
        Node cur = buckets[idx];

// ===================== 可视化引擎 =====================
let panelData = [];

// ---------- 1. BST 节点 ----------
class TreeNode {
  constructor(val) {
    this.val = val;
    this.left = null;
    this.right = null;
    this.x = 0; this.y = 0;
    this.color = null; // for RBT
    this.bf = 0; // for AVL
    this.height = 1; // for AVL
    this.bfDisplay = 0;
  }
}

// ---------- 2. B树节点 ----------
class BTreeNode {
  constructor(t, leaf) {
    this.t = t;
    this.leaf = leaf;
    this.keys = [];
    this.children = [];
    this.n = 0;
    this.x = 0; this.y = 0;
  }
}

// ---------- 3. Trie节点 ----------
class TrieNode {
  constructor(ch) {
    this.ch = ch;
    this.children = {};
    this.isEnd = false;
    this.x = 0; this.y = 0;
  }
}

// ===================== 树布局引擎 =====================
function layoutBST(node, x, y, xGap) {
  if (!node) return x;
  const leftX = layoutBST(node.left, x, y + 60, xGap / 2);
  node.x = Math.max(leftX + 15, xGap / 2);
  node.y = y;
  return layoutBST(node.right, node.x + 30, y + 60, xGap / 2);
}

function calcTreeWidth(node) {
  if (!node) return 0;
  return calcTreeWidth(node.left) + calcTreeWidth(node.right) + 1;
}

function layoutTree(root, canvasW) {
  if (!root) return;
  const total = calcTreeWidth(root);
  const startX = canvasW / 2;
  const xGap = Math.min(80, Math.max(30, (canvasW - 40) / total));
  assignPos(root, startX, 40, xGap);
}

function assignPos(node, x, y, gap) {
  if (!node) return;
  node.x = x; node.y = y;
  const leftW = calcTreeWidth(node.left);
  const rightW = calcTreeWidth(node.right);
  if (node.left) assignPos(node.left, x - (leftW + rightW + 1) * gap / 2 + leftW * gap / 2, y + 55, gap);
  if (node.right) assignPos(node.right, x + (leftW + rightW + 1) * gap / 2 - rightW * gap / 2, y + 55, gap);
}

function treeDepth(node) {
  if (!node) return 0;
  return 1 + Math.max(treeDepth(node.left), treeDepth(node.right));
}

// ===================== 绘制函数 =====================
function drawTree(ctx, root, highlights, dataIdx, extra) {
  if (!root) return;
  const h = highlights || {};
  const nodes = [];
  const edges = [];

  function traverse(n) {
    if (!n) return;
    nodes.push(n);
    if (n.left) { edges.push([n, n.left]); traverse(n.left); }
    if (n.right) { edges.push([n, n.right]); traverse(n.right); }
  }
  traverse(root);

  // 绘制边
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 2;
  for (const [p, c] of edges) {
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + 20);
    ctx.lineTo(c.x, c.y - 20);
    ctx.stroke();
  }

  // 绘制节点
  for (const n of nodes) {
    const isCurrent = h.current === n;
    const isFound = h.found === n;
    const isCompare = h.compare && h.compare.has(n);
    const isPath = h.path && h.path.has(n);
    const isLeft = h.leftPtr === n;
    const isRight = h.rightPtr === n;
    const isUncle = h.uncle === n;
    const isGrand = h.grandparent === n;
    const isRotate = h.rotate && h.rotate.has(n);

    let bg = '#4a6cf7';
    let textColor = '#fff';
    let borderColor = '#333';
    let borderW = 2;

    if (isFound) { bg = '#4caf50'; borderW = 3; }
    else if (isCurrent) { bg = '#ff9800'; borderW = 3; }
    else if (isCompare) { bg = '#ff9800'; }
    else if (isRotate) { bg = '#e91e63'; borderW = 3; }
    else if (isPath) { bg = '#7c4dff'; }
    else if (isUncle) { bg = '#00bcd4'; }
    else if (isLeft) { bg = '#00bcd4'; }
    else if (isRight) { bg = '#e91e63'; }
    else if (isGrand) { bg = '#9c27b0'; }

    // RBT 颜色
    if (dataIdx === 2 && n.color) {
      if (isFound) { bg = '#4caf50'; }
      else if (isCurrent) { bg = '#ff9800'; }
      else { bg = n.color === 'red' ? '#e44' : '#555'; textColor = '#fff'; }
      if (n.color === 'black') textColor = '#fff';
    }

    // 绘制节点圆
    const r = extra === 'btree' ? 14 : extra === 'trie' ? 18 : 20;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = borderW;
    ctx.stroke();

    // 节点内文字
    ctx.fillStyle = textColor;
    ctx.font = '13px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let label = n.val !== undefined && n.val !== null ? String(n.val) : '';
    if (extra === 'trie') label = n.ch || '';

    // B树显示多个key
    if (extra === 'btree') {
      // 用矩形代替圆形
      const kw = 30;
      const kh = 24;
      const kKeys = n.keys || [];
      const totalW = kKeys.length * kw + 4;
      ctx.fillStyle = bg;
      ctx.fillRect(n.x - totalW / 2, n.y - kh / 2, totalW, kh);
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = borderW;
      ctx.strokeRect(n.x - totalW / 2, n.y - kh / 2, totalW, kh);
      ctx.fillStyle = textColor;
      ctx.font = '12px Consolas, monospace';
      for (let ki = 0; ki < kKeys.length; ki++) {
        ctx.fillText(String(kKeys[ki]), n.x - totalW / 2 + kw / 2 + ki * kw, n.y);
        if (ki < kKeys.length - 1) {
          ctx.strokeStyle = '#ddd';
          ctx.beginPath();
          ctx.moveTo(n.x - totalW / 2 + kw + ki * kw, n.y - kh / 2);
          ctx.lineTo(n.x - totalW / 2 + kw + ki * kw, n.y + kh / 2);
          ctx.stroke();
        }
      }
      label = '';
    }

    if (label.length <= 2) ctx.fillText(label, n.x, n.y);
    else if (label.length > 2) ctx.font = '11px Consolas, monospace', ctx.fillText(label, n.x, n.y);

    // AVL 显示平衡因子
    if (dataIdx === 1 && !isFound && !isCurrent) {
      ctx.fillStyle = '#888';
      ctx.font = '10px sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText('BF=' + n.bfDisplay, n.x + 22, n.y - 8);
    }

    // RBT 显示颜色标签
    if (dataIdx === 2 && n.color && !isFound && !isCurrent) {
      ctx.fillStyle = '#888';
      ctx.font = '10px sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText(n.color === 'red' ? '🔴' : '⚫', n.x + 22, n.y - 8);
    }
  }
}

// ===================== 数据生成 =====================
function generateBST(values) {
  if (!values || values.length === 0) return null;
  let root = null;
  for (const v of values) {
    root = bstInsert(root, v);
  }
  return root;
}

function bstInsert(root, val) {
  if (!root) return new TreeNode(val);
  if (val < root.val) root.left = bstInsert(root.left, val);
  else if (val > root.val) root.right = bstInsert(root.right, val);
  return root;
}

function bstSearchSteps(root, target) {
  const steps = [];
  steps.push({ highlights: {}, msg: `从根节点开始查找目标 ${target}`, line: 3 });
  let cur = root;
  const pathSet = new Set();
  while (cur) {
    pathSet.add(cur);
    steps.push({ highlights: { current: cur, path: pathSet }, msg: `访问节点 ${cur.val}`, line: 4 });
    if (cur.val === target) {
      steps.push({ highlights: { found: cur, path: pathSet }, msg: `✓ 找到目标 ${target}！`, line: 5 });
      return steps;
    } else if (target < cur.val) {
      steps.push({ highlights: { current: cur, path: pathSet, leftPtr: cur.left }, msg: `${target} < ${cur.val}，向左子树查找`, line: 6 });
      cur = cur.left;
    } else {
      steps.push({ highlights: { current: cur, path: pathSet, rightPtr: cur.right }, msg: `${target} > ${cur.val}，向右子树查找`, line: 7 });
      cur = cur.right;
    }
  }
  steps.push({ highlights: { path: pathSet }, msg: `✗ 未找到目标 ${target}（到达空节点）`, line: 13 });
  return steps;
}

// ===================== AVL =====================
function avlHeight(n) { return n ? n.height : 0; }
function avlGetBF(n) { return n ? avlHeight(n.left) - avlHeight(n.right) : 0; }
function avlUpdateHeight(n) { n.height = 1 + Math.max(avlHeight(n.left), avlHeight(n.right)); }

function avlRightRotate(y) {
  const x = y.left;
  const T2 = x.right;
  x.right = y;
  y.left = T2;
  avlUpdateHeight(y);
  avlUpdateHeight(x);
  return x;
}

function avlLeftRotate(x) {
  const y = x.right;
  const T2 = y.left;
  y.left = x;
  x.right = T2;
  avlUpdateHeight(x);
  avlUpdateHeight(y);
  return y;
}

function avlInsert(root, val, steps, path) {
  if (!root) {
    const n = new TreeNode(val);
    n.bfDisplay = 0;
    steps.push({ highlights: {}, msg: `插入新节点 ${val}`, line: 11, tree: null, insertVal: val });
    return n;
  }
  path = path || [];
  path.push(root);
  steps.push({ highlights: { current: root, path: new Set(path) }, msg: `比较 ${val} 与节点 ${root.val}`, line: 12 });
  if (val < root.val) {
    root.left = avlInsert(root.left, val, steps, path);
  } else if (val > root.val) {
    root.right = avlInsert(root.right, val, steps, path);
  } else return root;

  avlUpdateHeight(root);
  root.bfDisplay = avlGetBF(root);
  const bf = root.bfDisplay;
  steps.push({ highlights: { current: root, path: new Set(path) }, msg: `节点 ${root.val} 高度=${root.height}，平衡因子=${bf}`, line: 15 });

  // 检查平衡
  if (bf > 1 && val < root.left.val) {
    steps.push({ highlights: { current: root, path: new Set(path), rotate: new Set([root, root.left]) }, msg: `LL 失衡：对 ${root.val} 右旋`, line: 20 });
    return avlRightRotate(root);
  }
  if (bf < -1 && val > root.right.val) {
    steps.push({ highlights: { current: root, path: new Set(path), rotate: new Set([root, root.right]) }, msg: `RR 失衡：对 ${root.val} 左旋`, line: 23 });
    return avlLeftRotate(root);
  }
  if (bf > 1 && val > root.left.val) {
    steps.push({ highlights: { current: root, path: new Set(path), rotate: new Set([root, root.left, root.left.right]) }, msg: `LR 失衡：先左旋左子，再右旋`, line: 26 });
    root.left = avlLeftRotate(root.left);
    return avlRightRotate(root);
  }
  if (bf < -1 && val < root.right.val) {
    steps.push({ highlights: { current: root, path: new Set(path), rotate: new Set([root, root.right, root.right.left]) }, msg: `RL 失衡：先右旋右子，再左旋`, line: 30 });
    root.right = avlRightRotate(root.right);
    return avlLeftRotate(root);
  }
  steps.push({ highlights: { current: root, path: new Set(path) }, msg: `节点 ${root.val} 平衡因子=${bf}，无需调整`, line: 33 });
  return root;
}

function buildAVLSteps(root, target) {
  const steps = [];
  steps.push({ highlights: {}, msg: `开始查找目标 ${target}`, line: 2 });
  let cur = root;
  const pathSet = new Set();
  while (cur) {
    pathSet.add(cur);
    steps.push({ highlights: { current: cur, path: pathSet }, msg: `访问节点 ${cur.val}（高度=${cur.height}，平衡因子=${cur.bfDisplay}）`, line: 2 });
    if (cur.val === target) {
      steps.push({ highlights: { found: cur, path: pathSet }, msg: `✓ 找到目标 ${target}！`, line: 2 });
      return steps;
    } else if (target < cur.val) {
      steps.push({ highlights: { current: cur, path: pathSet, leftPtr: cur.left }, msg: `${target} < ${cur.val}，向左`, line: 2 });
      cur = cur.left;
    } else {
      steps.push({ highlights: { current: cur, path: pathSet, rightPtr: cur.right }, msg: `${target} > ${cur.val}，向右`, line: 2 });
      cur = cur.right;
    }
  }
  steps.push({ highlights: { path: pathSet }, msg: `✗ 未找到目标 ${target}`, line: 2 });
  return steps;
}

// ===================== RBT =====================
function rbtBuild(values) {
  if (!values.length) return null;
  let root = null;
  for (const v of values) root = rbtInsert(root, v);
  if (root) root.color = 'black';
  return root;
}

function rbtInsert(root, val) {
  if (!root) { const n = new TreeNode(val); n.color = 'red'; return n; }
  if (val < root.val) root.left = rbtInsert(root.left, val);
  else if (val > root.val) root.right = rbtInsert(root.right, val);
  else return root;
  // 左左红红
  if (isRed(root.left) && isRed(root.left.left)) {
    if (isRed(root.right)) { flipColors(root); }
    else { root = rotateRight(root); }
  }
  // 左右红红
  if (isRed(root.left) && isRed(root.left.right)) {
    if (isRed(root.right)) { flipColors(root); }
    else { root.left = rotateLeft(root.left); root = rotateRight(root); }
  }
  // 右右红红
  if (isRed(root.right) && isRed(root.right.right)) {
    if (isRed(root.left)) { flipColors(root); }
    else { root = rotateLeft(root); }
  }
  // 右左红红
  if (isRed(root.right) && isRed(root.right.left)) {
    if (isRed(root.left)) { flipColors(root); }
    else { root.right = rotateRight(root.right); root = rotateLeft(root); }
  }
  return root;
}

function isRed(n) { return n && n.color === 'red'; }

function rotateRight(h) {
  const x = h.left;
  h.left = x.right;
  x.right = h;
  x.color = h.color;
  h.color = 'red';
  return x;
}

function rotateLeft(h) {
  const x = h.right;
  h.right = x.left;
  x.left = h;
  x.color = h.color;
  h.color = 'red';
  return x;
}

function flipColors(h) {
  h.color = 'red';
  h.left.color = 'black';
  h.right.color = 'black';
}

function rbtSearchSteps(root, target) {
  const steps = [];
  steps.push({ highlights: {}, msg: `开始查找目标 ${target}（红色节点 ⚠ 需检查规则）`, line: 7 });
  let cur = root;
  const pathSet = new Set();
  while (cur) {
    pathSet.add(cur);
    const extra = cur.color === 'red' ? '（红）' : '（黑）';
    steps.push({ highlights: { current: cur, path: pathSet }, msg: `访问 ${cur.val}${extra}`, line: 8 });
    if (cur.val === target) {
      steps.push({ highlights: { found: cur, path: pathSet }, msg: `✓ 找到目标 ${target} ！`, line: 9 });
      return steps;
    } else if (target < cur.val) {
      steps.push({ highlights: { current: cur, path: pathSet }, msg: `${target} < ${cur.val}，向左`, line: 10 });
      cur = cur.left;
    } else {
      steps.push({ highlights: { current: cur, path: pathSet }, msg: `${target} > ${cur.val}，向右`, line: 11 });
      cur = cur.right;
    }
  }
  steps.push({ highlights: { path: pathSet }, msg: `✗ 未找到目标 ${target}（红黑树查找与 BST 相同）`, line: 12 });
  return steps;
}

// ===================== B-Tree =====================
function bTreeGenerate(t, keys) {
  const root = new BTreeNode(t, true);
  for (const k of keys) bTreeInsert(root, k);
  return root;
}

function bTreeInsert(root, key) {
  if (root.n === 2 * root.t - 1) {
    const s = new BTreeNode(root.t, false);
    s.children[0] = root;
    bTreeSplitChild(s, 0, root);
    bTreeInsertNonFull(s, key);
    return s;
  }
  bTreeInsertNonFull(root, key);
  return root;
}

function bTreeSplitChild(parent, idx, child) {
  const t = child.t;
  const z = new BTreeNode(t, child.leaf);
  z.n = t - 1;
  for (let j = 0; j < t - 1; j++) z.keys[j] = child.keys[j + t];
  if (!child.leaf) {
    for (let j = 0; j < t; j++) z.children[j] = child.children[j + t];
  }
  child.n = t - 1;
  for (let j = parent.n; j >= idx + 1; j--) parent.children[j + 1] = parent.children[j];
  parent.children[idx + 1] = z;
  for (let j = parent.n - 1; j >= idx; j--) parent.keys[j + 1] = parent.keys[j];
  parent.keys[idx] = child.keys[t - 1];
  parent.n++;
}

function bTreeInsertNonFull(node, key) {
  let i = node.n - 1;
  if (node.leaf) {
    while (i >= 0 && key < node.keys[i]) { node.keys[i + 1] = node.keys[i]; i--; }
    node.keys[i + 1] = key;
    node.n++;
  } else {
    while (i >= 0 && key < node.keys[i]) i--;
    i++;
    if (node.children[i].n === 2 * node.t - 1) {
      bTreeSplitChild(node, i, node.children[i]);
      if (key > node.keys[i]) i++;
    }
    bTreeInsertNonFull(node.children[i], key);
  }
}

function bTreeSearchSteps(root, target, t) {
  const steps = [];
  const allNodes = [];

  function collect(n, depth) {
    if (!n) return;
    n._depth = depth;
    allNodes.push(n);
    if (!n.leaf) for (const c of n.children) collect(c, depth + 1);
  }
  collect(root, 0);

  steps.push({ highlights: {}, msg: `开始搜索目标 ${target}，B树阶数 t=${t}（每个节点最多 ${2*t-1} 个关键字）`, line: 8 });

  function doSearch(node, depth) {
    let i = 0;
    const path = new Set();
    while (i < node.n && target > node.keys[i]) i++;
    steps.push({ highlights: { current: node }, msg: `在节点中查找：第 ${i+1} 个关键字为 ${i < node.n ? node.keys[i] : '无'}`, line: 9 });
    if (i < node.n && node.keys[i] === target) {
      steps.push({ highlights: { found: node }, msg: `✓ 找到目标 ${target} ！`, line: 10 });
      return true;
    }
    if (node.leaf) {
      steps.push({ highlights: {}, msg: `✗ 到达叶节点，未找到目标 ${target}`, line: 11 });
      return false;
    }
    steps.push({ highlights: { current: node }, msg: `进入第 ${i+1} 个子树继续查找`, line: 12 });
    return doSearch(node.children[i], depth + 1);
  }

  doSearch(root, 0);
  return steps;
}

// BTree layout
function bTreeLayout(root, canvasW) {
  if (!root) return;
  const nodes = [];
  function collect(n, d) { if (!n) return; nodes.push(n); n._depth = d; if (!n.leaf) for (const c of n.children) collect(c, d + 1); }
  collect(root, 0);
  const maxDepth = Math.max(...nodes.map(n => n._depth));
  const levels = Array.from({length: maxDepth + 1}, () => []);
  for (const n of nodes) levels[n._depth].push(n);
  const yGap = Math.min(100, Math.max(50, (320 - 40) / (maxDepth + 1)));
  let maxCount = 1;
  for (const lev of levels) maxCount = Math.max(maxCount, lev.length);
  for (let d = 0; d < levels.length; d++) {
    const lev = levels[d];
    const xGap = Math.min(120, Math.max(40, (canvasW - 40) / (lev.length + 1)));
    for (let i = 0; i < lev.length; i++) {
      lev[i].x = xGap * (i + 1);
      lev[i].y = 40 + d * yGap;
    }
  }
}

// ===================== Trie =====================
let trieNextId = 0;

function trieInsert(root, word) {
  let cur = root;
  const path = [cur];
  for (const ch of word) {
    if (!cur.children[ch]) {
      cur.children[ch] = new TrieNode(ch);
      cur.children[ch].id = trieNextId++;
    }
    cur = cur.children[ch];
    path.push(cur);
  }
  cur.isEnd = true;
  return path;
}

function trieSearchSteps(root, word, allWords) {
  const steps = [];
  const emptyPath = new Set();
  steps.push({ highlights: {}, msg: `开始在字典树中搜索「${word}」`, line: 13 });

  let cur = root;
  const visited = new Set();

  for (let i = 0; i < word.length; i++) {
    const ch = word[i];
    visited.add(cur);
    if (cur.children[ch]) {
      cur = cur.children[ch];
      visited.add(cur);
      steps.push({ highlights: { current: cur, path: visited }, msg: `字符「${ch}」→ 向下查找，当前路径前缀「${word.slice(0, i+1)}」`, line: 14 });
    } else {
      steps.push({ highlights: { current: cur, path: visited }, msg: `✗ 字符「${ch}」不存在于字典树中，查找失败`, line: 15 });
      return steps;
    }
  }

  if (cur.isEnd) {
    steps.push({ highlights: { found: cur, path: visited }, msg: `✓ 找到完整单词「${word}」！`, line: 16 });
  } else {
    steps.push({ highlights: { current: cur, path: visited }, msg: `路径存在但「${word}」不是一个完整单词（仅为前缀）`, line: 16 });
  }
  return steps;
}

function trieLayout(root, canvasW, canvasH) {
  if (!root) return;
  const nodes = [];
  function collect(n, d) { nodes.push(n); n._depth = d; for (const ch of Object.values(n.children)) collect(ch, d + 1); }
  collect(root, 0);
  const maxDepth = Math.max(...nodes.map(n => n._depth));
  const levels = Array.from({length: maxDepth + 1}, () => []);
  for (const n of nodes) levels[n._depth].push(n);

  const yGap = Math.min(80, Math.max(50, (canvasH - 60) / (maxDepth + 1)));
  for (let d = 0; d < levels.length; d++) {
    const lev = levels[d];
    const xGap = Math.min(80, Math.max(30, (canvasW - 20) / (lev.length + 1)));
    for (let i = 0; i < lev.length; i++) {
      lev[i].x = xGap * (i + 1) + (d % 2 === 0 ? 0 : xGap / 2);
      lev[i].y = 30 + d * yGap;
    }
  }
}

function trieDraw(ctx, root, highlights) {
  if (!root) return;
  const nodes = [];
  const edges = [];
  function collect(n) { nodes.push(n); for (const c of Object.values(n.children)) { edges.push([n, c]); collect(c); } }
  collect(root);

  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 2;
  for (const [p, c] of edges) {
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + 16);
    ctx.lineTo(c.x, c.y - 16);
    ctx.stroke();
  }

  for (const n of nodes) {
    const isCurrent = highlights.current === n;
    const isFound = highlights.found === n;
    const isPath = highlights.path && highlights.path.has(n);

    let bg = '#4a6cf7';
    let textColor = '#fff';
    let borderW = 2;

    if (isFound) { bg = '#4caf50'; borderW = 3; }
    else if (isCurrent) { bg = '#ff9800'; borderW = 3; }
    else if (isPath && n !== root) { bg = '#7c4dff'; }

    const r = 18;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = borderW;
    ctx.stroke();

    // 字符
    if (n.ch) {
      ctx.fillStyle = textColor;
      ctx.font = '15px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.ch, n.x, n.y);
    }

    // isEnd 标记
    if (n.isEnd) {
      ctx.fillStyle = '#4caf50';
      ctx.font = '10px sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText('End', n.x + 20, n.y - 10);
    }
  }
}

// ===================== Hash Table =====================
function hashTableBuild(capacity, pairs) {
  const table = Array.from({length: capacity}, () => []);
  for (const [k, v] of pairs) {
    const idx = k % capacity;
    table[idx].push({key: k, val: v});
  }
  return table;
}

function hashSearchSteps(table, target) {
  const steps = [];
  const cap = table.length;
  const hashVal = ((target % cap) + cap) % cap;
  steps.push({ hashIdx: hashVal, table: JSON.parse(JSON.stringify(table)), highlights: [], line: 16, msg: `计算哈希：${target} % ${cap} = ${hashVal}，定位到桶 [${hashVal}]` });

  const bucket = table[hashVal];
  if (bucket.length === 0) {
    steps.push({ hashIdx: hashVal, table: JSON.parse(JSON.stringify(table)), highlights: [], line: 17, msg: `桶 [${hashVal}] 为空，目标不存在` });
    return steps;
  }

  for (let i = 0; i < bucket.length; i++) {
    const entry = bucket[i];
    steps.push({ hashIdx: hashVal, table: JSON.parse(JSON.stringify(table)), highlights: [{bucketIdx: hashVal, entryIdx: i}], line: 18, msg: `遍历桶 [${hashVal}] 第 ${i+1} 个节点：key=${entry.key} ${entry.key === target ? '✓ 匹配！' : '≠ ' + target}` });
    if (entry.key === target) {
      steps.push({ hashIdx: hashVal, table: JSON.parse(JSON.stringify(table)), highlights: [{bucketIdx: hashVal, entryIdx: i, found: true}], line: 19, msg: `✓ 找到！key=${target} 对应的值为 ${entry.val}` });
      return steps;
    }
  }
  steps.push({ hashIdx: hashVal, table: JSON.parse(JSON.stringify(table)), highlights: [{bucketIdx: hashVal, entryIdx: -1}], line: 21, msg: `✗ 未找到 key=${target}` });
  return steps;
}

    if (targetValEl) targetValEl.textContent = `🎯 目标值：${state.target !== null && state.target !== undefined ? state.target : ''}`;

    // 高亮代码行
    const codeLines = panel.querySelectorAll('.code-line');
    codeLines.forEach(el => el.classList.remove('highlight-line'));
    if (step.line > 0) {
      const target = panel.querySelector(`.code-line[data-line="${step.line}"]`);
      if (target) target.classList.add('highlight-line');
    }

    // 根据算法类型绘制
    if (idx === 5) {
      drawHashTable(ctx, step, w, h);
    } else if (idx === 4) {
      if (state.trie) {
        trieLayout(state.trie, w, h);
        trieDraw(ctx, state.trie, step.highlights || {});
      }
    } else if (idx === 3) {
      if (state.btree) {
        bTreeLayout(state.btree, w);
        const bNodes = [];
        function collectB(n) { if (!n) return; bNodes.push(n); if (!n.leaf) for (const c of n.children) collectB(c); }
        collectB(state.btree);
        for (const n of bNodes) {
          const isCurrent = step.highlights && step.highlights.current === n;
          const isFound = step.highlights && step.highlights.found === n;
          let bg = '#4a6cf7';
          if (isFound) bg = '#4caf50';
          else if (isCurrent) bg = '#ff9800';
          const kw = 30, kh = 24;
          const kKeys = n.keys || [];
          const totalW = kKeys.length * kw + 4;
          ctx.fillStyle = bg;
          ctx.fillRect(n.x - totalW / 2, n.y - kh / 2, totalW, kh);
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 2;
          ctx.strokeRect(n.x - totalW / 2, n.y - kh / 2, totalW, kh);
          ctx.fillStyle = '#fff';
          ctx.font = '12px Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          for (let ki = 0; ki < kKeys.length; ki++) {
            ctx.fillText(String(kKeys[ki]), n.x - totalW / 2 + kw / 2 + ki * kw, n.y);
            if (ki < kKeys.length - 1) {
              ctx.strokeStyle = 'rgba(255,255,255,0.3)';
              ctx.beginPath();
              ctx.moveTo(n.x - totalW / 2 + kw + ki * kw, n.y - kh / 2);
              ctx.lineTo(n.x - totalW / 2 + kw + ki * kw, n.y + kh / 2);
              ctx.stroke();
            }
          }
        }
        // 绘制边
        ctx.strokeStyle = '#bbb';
        ctx.lineWidth = 2;
        function drawBEdges(n) {
          if (!n || n.leaf) return;
          for (let i = 0; i < n.children.length; i++) {
            const c = n.children[i];
            if (!c) continue;
            ctx.beginPath();
            ctx.moveTo(n.x, n.y + 12);
            ctx.lineTo(c.x, c.y - 12);
            ctx.stroke();
            drawBEdges(c);
          }
        }
        drawBEdges(state.btree);
      }
    } else {
      if (state.tree) {
        layoutTree(state.tree, w);
        drawTree(ctx, state.tree, step.highlights || {}, idx, null);
      } else {
        ctx.fillStyle = '#999';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('点击「重置」生成树', w / 2, h / 2);
      }
    }
  }

  // ===== 哈希表绘制 =====
  function drawHashTable(ctx, step, w, h) {
    const table = step.table || [];
    const cap = table.length;
    if (cap === 0) {
      ctx.fillStyle = '#999';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('点击「重置」生成数据', w / 2, h / 2);
      return;
    }

    const cellW = 70;
    const cellH = 36;
    const maxBucketLen = Math.max(...table.map(b => b.length), 1);
    const totalH = cap * cellH + 10;
    const startY = Math.max(20, (h - totalH) / 2);
    const startX = 30;

    // 绘制每行
    for (let i = 0; i < cap; i++) {
      const y = startY + i * cellH;
      // 索引列
      ctx.fillStyle = '#f0f2f5';
      ctx.fillRect(startX, y, cellW, cellH - 4);
      ctx.strokeStyle = '#ddd';
      ctx.strokeRect(startX, y, cellW, cellH - 4);
      ctx.fillStyle = '#666';
      ctx.font = '13px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`[${i}]`, startX + cellW / 2, y + (cellH - 4) / 2);

      // 桶内容（链表）
      const bucket = table[i];
      if (bucket.length === 0) {
        ctx.fillStyle = '#e0e0e0';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('∅', startX + cellW + 12, y + (cellH - 4) / 2);
      } else {
        let cx = startX + cellW + 8;
        for (let bi = 0; bi < bucket.length; bi++) {
          const entry = bucket[bi];
          const isHighlight = step.highlights && step.highlights.some(h => h.bucketIdx === i && (h.entryIdx === bi || h.entryIdx === -1));
          const isFound = step.highlights && step.highlights.some(h => h.bucketIdx === i && h.found);
          const isEnd = step.highlights && step.highlights.some(h => h.bucketIdx === i && h.entryIdx === -1 && bi >= bucket.length - 1);

          const nw = 70;
          const nh = cellH - 4;
          let bg = '#4a6cf7';
          if (isFound) bg = '#4caf50';
          else if (isHighlight) bg = '#ff9800';
          else if (isEnd) bg = '#d0d0d0';

          ctx.fillStyle = bg;
          ctx.fillRect(cx, y, nw, nh);
          ctx.strokeStyle = '#aaa';
          ctx.strokeRect(cx, y, nw, nh);
          ctx.fillStyle = '#fff';
          ctx.font = '11px Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`${entry.key}:${entry.val}`, cx + nw / 2, y + nh / 2);

          // 箭头
          ctx.fillStyle = '#999';
          ctx.font = '16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('→', cx + nw + 5, y + nh / 2);

          cx += nw + 16;
          if (cx > w - 30) break;
        }
        // 末尾 null
        ctx.fillStyle = '#ccc';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('null', cx - 10, y + (cellH - 4) / 2);
      }
    }

    // 哈希计算标注
    if (step.hashIdx !== undefined) {
      const hy = startY + step.hashIdx * cellH;
      ctx.fillStyle = '#ff9800';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('← hash bucket', startX + w - 140, hy + cellH / 2);
      // 高亮该行
      ctx.fillStyle = 'rgba(255, 152, 0, 0.1)';
      ctx.fillRect(startX, hy, w - startX - 10, cellH - 4);
    }
  }

  // ===== 步骤生成 =====
  function generate() {
    state.stepIdx = 0;
    state.steps = [];

    if (idx === 5) { // Hash Table
      const cap = Math.max(4, Math.floor(state.size / 2));
      const maxKey = cap * 5;
      const pairs = [];
      const usedKeys = new Set();
      const numPairs = Math.min(state.size, cap * 2);
      for (let i = 0; i < numPairs; i++) {
        let k;
        do { k = Math.floor(Math.random() * maxKey) + 1; } while (usedKeys.has(k));
        usedKeys.add(k);
        pairs.push([k, Math.floor(Math.random() * 1000)]);
      }
      state.hashTable = hashTableBuild(cap, pairs);
      // 70% 选存在的key
      let target;
      if (pairs.length > 0 && Math.random() < 0.7) {
        target = pairs[Math.floor(Math.random() * pairs.length)][0];
      } else {
        target = Math.floor(Math.random() * maxKey * 1.5) + 1;
      }
      state.target = target;
      state.steps = hashSearchSteps(state.hashTable, target);
      render();
      updateButtons();
      return;
    }

    if (idx === 4) { // Trie
      trieNextId = 0;
      state.trie = new TrieNode(null);

      const wordList = ['cat', 'car', 'dog', 'do', 'done', 'dot', 'bat', 'bag', 'big', 'dig'];
      const selected = wordList.slice(0, Math.min(state.size, wordList.length));
      for (const w of selected) trieInsert(state.trie, w);

      let target;
      if (Math.random() < 0.6) {
        target = selected[Math.floor(Math.random() * selected.length)];
      } else {
        const prefixes = ['ca', 'do', 'ba', 'bi', 'di', 'da', 'co', 'da'];
        target = prefixes[Math.floor(Math.random() * prefixes.length)] +
                 String.fromCharCode(97 + Math.floor(Math.random() * 26));
      }
      // 填充操作选择
      actionSelect.innerHTML = '';
      const allWords = [...new Set([...selected, ...selected.map(w => w.slice(0, Math.floor(w.length/2)+1))])];
      const opts = [...new Set([...allWords, 'cat', 'car', 'dog', 'done', 'bat', 'can', 'run', target])];
      for (const w of opts) {
        const opt = document.createElement('option');
        opt.value = w;
        opt.textContent = w + (selected.includes(w) ? '' : ' (不存在)');
        if (w === target) opt.selected = true;
        actionSelect.appendChild(opt);
      }
      state.target = target;
      state.steps = trieSearchSteps(state.trie, target, selected);
      render();
      updateButtons();
      return;
    }

    if (idx === 3) { // B-Tree
      const t = 3;
      const values = [];
      const count = Math.min(state.size, 12);
      const usedV = new Set();
      let bLastV = null;
      for (let i = 0; i < count; i++) {
        let v;
        do { v = Math.floor(Math.random() * 150) + 5; } while (usedV.has(v));
        usedV.add(v);
        values.push(v);
        bLastV = v;
      }
      values.sort((a, b) => a - b);
      state.btree = null;
      for (const kv of values) state.btree = bTreeInsert(state.btree || new BTreeNode(t, true), kv);
      state.btree = state.btree || new BTreeNode(t, true);

      let target;
      if (values.length > 0 && Math.random() < 0.6) {
        target = values[Math.floor(Math.random() * values.length)];
      } else {
        target = Math.floor(Math.random() * (bLastV + 10)) + 1;
      }
      state.target = target;
      state.steps = bTreeSearchSteps(state.btree, target, t);
      render();
      updateButtons();
      return;
    }

    // BST / AVL / RBT
    const values = [];
    const count = Math.min(state.size, 15);
    const usedVals = new Set();
    let lastV = null;
    for (let i = 0; i < count; i++) {
      let v;
      do { v = Math.floor(Math.random() * 200) + 5; } while (usedVals.has(v));
      usedVals.add(v);
      values.push(v);
      lastV = v;
    }

    if (idx === 2) { // RBT
      state.tree = rbtBuild(values);
      let target;
      if (values.length > 0 && Math.random() < 0.7) {
        target = values[Math.floor(Math.random() * values.length)];
      } else {
        target = lastV + Math.floor(Math.random() * 10) + 1;
      }
      state.target = target;
      state.steps = rbtSearchSteps(state.tree, target);
    } else if (idx === 1) { // AVL
      const steps = [];
      state.tree = null;
      for (const val of values) {
        state.tree = avlInsert(state.tree, val, steps, []);
      }
      state.tree = state.tree;
      let target;
      if (values.length > 0 && Math.random() < 0.7) {
        target = values[Math.floor(Math.random() * values.length)];
      } else {
        target = lastV + Math.floor(Math.random() * 10) + 1;
      }
      state.target = target;
      state.steps = buildAVLSteps(state.tree, target);
    } else { // BST
      state.tree = generateBST(values);
      let target;
      if (values.length > 0 && Math.random() < 0.7) {
        target = values[Math.floor(Math.random() * values.length)];
      } else {
        target = lastV + Math.floor(Math.random() * 10) + 1;
      }
      state.target = target;
      state.steps = bstSearchSteps(state.tree, target);
    }

    render();
    updateButtons();
  }

  function updateButtons() {
    const atFirst = state.stepIdx <= 0;
    const atLast = state.stepIdx >= state.steps.length - 1;
    firstBtn.disabled = atFirst;
    prevBtn.disabled = atFirst;
    nextBtn.disabled = atLast;
    lastBtn.disabled = atLast;
  }

  // 事件绑定
  const sizeSelect = document.createElement('select');
  sizeSelect.className = 'size-select';
  sizeSelect.innerHTML = '<option value="8">8</option><option value="12" selected>12</option><option value="16">16</option><option value="20">20</option>';
  // 插入到 actionSelect 前面
  const controlsEl = panel.querySelector('.controls');
  const actionLabel = controlsEl.querySelector('label[for]') || controlsEl.querySelector('label');
  controlsEl.insertBefore(sizeSelect, actionSelect.parentElement || actionSelect);
  const sizeLabel = document.createElement('label');
  sizeLabel.textContent = '数据量 ';
  controlsEl.insertBefore(sizeLabel, sizeSelect);
  sizeLabel.appendChild(sizeSelect);

  sizeSelect.addEventListener('change', () => {
    state.size = parseInt(sizeSelect.value);
    generate();
  });

  actionSelect.addEventListener('change', () => {
    if (idx === 4) {
      state.target = actionSelect.value;
      const selected = [];
      function collectWords(n, prefix, set) {
        if (n.isEnd) set.add(prefix);
        for (const [ch, child] of Object.entries(n.children)) collectWords(child, prefix + ch, set);
      }
      const existSet = new Set();
      if (state.trie) collectWords(state.trie, '', existSet);
      state.steps = trieSearchSteps(state.trie, state.target, [...existSet]);
      state.stepIdx = 0;
      render();
      updateButtons();
    }
  });

  // 对于非Trie，搜索目标选择器
  if (idx !== 4 && idx !== 5) {
    const targetSelect = document.createElement('select');
    targetSelect.className = 'target-select';
    controlsEl.insertBefore(targetSelect, resetBtn);
    const targetLabel = document.createElement('label');
    targetLabel.textContent = '目标值 ';
    controlsEl.insertBefore(targetLabel, targetSelect);
    targetLabel.appendChild(targetSelect);

    targetSelect.addEventListener('change', () => {
      state.target = parseInt(targetSelect.value);
      if (idx === 2) state.steps = rbtSearchSteps(state.tree, state.target);
      else if (idx === 1) state.steps = buildAVLSteps(state.tree, state.target);
      else state.steps = bstSearchSteps(state.tree, state.target);
      state.stepIdx = 0;
      render();
      updateButtons();
    });

    // 在生成时填充 targetSelect
    const origGenerate = generate;
    generate = function() {
      origGenerate.call(this);
      if (state.tree) {
        const vals = [];
        function collect(n) { if (!n) return; vals.push(n.val); collect(n.left); collect(n.right); }
        collect(state.tree);
        const unique = [...new Set(vals)].sort((a, b) => a - b);
        targetSelect.innerHTML = '';
        for (const v of unique) {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          if (v === state.target) opt.selected = true;
          targetSelect.appendChild(opt);
        }
        // 添加不存在的选项
        const nonExist = Math.max(...unique) + Math.floor(Math.random() * 10) + 1;
        const opt = document.createElement('option');
        opt.value = nonExist;
        opt.textContent = nonExist + ' (不存在)';
        targetSelect.appendChild(opt);
      }
    };
  }

  // B树 target select
  if (idx === 3) {
    const targetSelect = document.createElement('select');
    targetSelect.className = 'target-select';
    controlsEl.insertBefore(targetSelect, resetBtn);
    const targetLabel = document.createElement('label');
    targetLabel.textContent = '目标值 ';
    controlsEl.insertBefore(targetLabel, targetSelect);
    targetLabel.appendChild(targetSelect);
    targetSelect.addEventListener('change', () => {
      state.target = parseInt(targetSelect.value);
      state.steps = bTreeSearchSteps(state.btree, state.target, 3);
      state.stepIdx = 0;
      render();
      updateButtons();
    });
    const origGenerate = generate;
    generate = function() {
      origGenerate.call(this);
      if (state.btree) {
        const vals = [];
        function collectB(n) { if (!n) return; n.keys.forEach(k => vals.push(k)); if (!n.leaf) n.children.forEach(c => collectB(c)); }
        collectB(state.btree);
        const unique = [...new Set(vals)].sort((a, b) => a - b);
        targetSelect.innerHTML = '';
        for (const v of unique) {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          if (v === state.target) opt.selected = true;
          targetSelect.appendChild(opt);
        }
        const nonExist = (unique.length > 0 ? Math.max(...unique) : 50) + Math.floor(Math.random() * 10) + 1;
        const opt = document.createElement('option');
        opt.value = nonExist;
        opt.textContent = nonExist + ' (不存在)';
        targetSelect.appendChild(opt);
      }
    };
  }

  // Hash target select
  if (idx === 5) {
    const targetSelect = document.createElement('select');
    targetSelect.className = 'target-select';
    controlsEl.insertBefore(targetSelect, resetBtn);
    const targetLabel = document.createElement('label');
    targetLabel.textContent = '目标键 ';
    controlsEl.insertBefore(targetLabel, targetSelect);
    targetLabel.appendChild(targetSelect);
    targetSelect.addEventListener('change', () => {
      state.target = parseInt(targetSelect.value);
      state.steps = hashSearchSteps(state.hashTable, state.target);
      state.stepIdx = 0;
      render();
      updateButtons();
    });
    const origGenerate = generate;
    generate = function() {
      origGenerate.call(this);
      if (state.hashTable) {
        const keys = new Set();
        for (const bucket of state.hashTable) for (const e of bucket) keys.add(e.key);
        const sorted = [...keys].sort((a, b) => a - b);
        targetSelect.innerHTML = '';
        for (const k of sorted) {
          const opt = document.createElement('option');
          opt.value = k;
          opt.textContent = k;
          if (k === state.target) opt.selected = true;
          targetSelect.appendChild(opt);
        }
        const nonExist = (sorted.length > 0 ? Math.max(...sorted) : 50) + Math.floor(Math.random() * 10) + 1;
        const opt = document.createElement('option');
        opt.value = nonExist;
        opt.textContent = nonExist + ' (不存在)';
        targetSelect.appendChild(opt);
      }
    };
  }

  nextBtn.addEventListener('click', () => {
    if (state.stepIdx < state.steps.length - 1) { state.stepIdx++; render(); updateButtons(); }
  });
  prevBtn.addEventListener('click', () => {
    if (state.stepIdx > 0) { state.stepIdx--; render(); updateButtons(); }
  });
  firstBtn.addEventListener('click', () => { state.stepIdx = 0; render(); updateButtons(); });
  lastBtn.addEventListener('click', () => { state.stepIdx = state.steps.length - 1; render(); updateButtons(); });
  resetBtn.addEventListener('click', generate);
  autoBtn.addEventListener('click', () => {
    if (state.running) {
      if (state.timer) { clearInterval(state.timer); state.timer = null; }
      state.running = false;
      autoBtn.textContent = '播放 自动';
    } else {
      state.running = true;
      autoBtn.textContent = '⏸ 暂停';
      const speed = parseInt(speedSlider.value);
      const delay = Math.max(30, 200 - speed * 15);
      state.timer = setInterval(() => {
        if (state.stepIdx < state.steps.length - 1) {
          state.stepIdx++;
          render();
          updateButtons();
        } else {
          clearInterval(state.timer);
          state.timer = null;
          state.running = false;
          autoBtn.textContent = '播放 自动';
        }
      }, delay);
    }
  });

  panel.querySelector('.copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(data.javaCode).then(() => {
      const btn = panel.querySelector('.copy-btn');
      const orig = btn.textContent;
      btn.textContent = '✓ 已复制';
      setTimeout(() => btn.textContent = orig, 1500);
    }).catch(() => alert('复制失败'));
  });

  state.render = render;
  panelData[idx] = state;
  updateLegend();

  // 初始生成
  state.size = 12;
  generate();

  const ro = new ResizeObserver(() => render());
  ro.observe(canvas.parentElement);

  window.addEventListener('resize', () => render());
}

// ===================== 启动 =====================
ALGO_DATA.forEach((_, idx) => {
  panelData.push(null);
  initPanel(idx);
});

document.querySelectorAll('.sort-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    panelData.forEach(s => { if (s && s.timer) { clearInterval(s.timer); s.timer = null; s.running = false; } });
    document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.btn-auto').forEach(b => b.textContent = '播放 自动');
    tab.classList.add('active');
    const idx = parseInt(tab.dataset.idx);
    document.getElementById('panel-' + idx).classList.add('active');
    const s = panelData[idx];
    if (s && s.render) s.render();
  });
});
</script>

    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
