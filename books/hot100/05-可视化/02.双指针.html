<h1>双指针算法可视化（Java）</h1>

<script>
// ===================== 双指针问题数据 =====================
const PROBLEM_DATA = [
  {
    name: "移动零",
    nameEn: "Move Zeroes",
    time: "O(n)",
    space: "O(1)",
    desc: "双指针技巧——快慢指针。左指针维护已处理好的非零元素末尾，右指针遍历数组。当右指针遇到非零元素时，将其与左指针位置交换，左指针右移。这样所有非零元素被依次移到前面，零则被动移到最后。",
    presets: [
      { label: "默认 [0,1,0,3,12]", data: [0,1,0,3,12] },
      { label: "全零 [0,0,0,0,1]", data: [0,0,0,0,1] },
      { label: "无零 [1,2,3,4,5]", data: [1,2,3,4,5] },
      { label: "混合 [0,0,1,0,3,0,2]", data: [0,0,1,0,3,0,2] },
      { label: "随机 8 个", data: null, size: 8 },
      { label: "随机 12 个", data: null, size: 12 }
    ],
    javaCode: `public void moveZeroes(int[] nums) {
    int left = 0;
    for (int right = 0; right < nums.length; right++) {
        if (nums[right] != 0) {
            int tmp = nums[left];
            nums[left] = nums[right];
            nums[right] = tmp;
            left++;
        }
    }
}`
  },
  {
    name: "盛最多水的容器",
    nameEn: "Container With Most Water",
    time: "O(n)",
    space: "O(1)",
    desc: "双指针技巧——对撞指针。左右指针指向数组两端，每次计算当前容器面积 = min(height[l], height[r]) × (r-l)，更新最大面积。然后将较矮一侧的指针向中间移动，因为容器的高度受限于较矮的边。",
    presets: [
      { label: "经典 [1,8,6,2,5,4,8,3,7]", data: [1,8,6,2,5,4,8,3,7] },
      { label: "递增 [1,2,3,4,5,6,7,8]", data: [1,2,3,4,5,6,7,8] },
      { label: "递减 [8,7,6,5,4,3,2,1]", data: [8,7,6,5,4,3,2,1] },
      { label: "随机 8 个", data: null, size: 8 },
      { label: "随机 12 个", data: null, size: 12 }
    ],
    javaCode: `public int maxArea(int[] height) {
    int l = 0, r = height.length - 1;
    int max = 0;
    while (l < r) {
        int h = Math.min(height[l], height[r]);
        int w = r - l;
        max = Math.max(max, h * w);
        if (height[l] < height[r]) l++;
        else r--;
    }
    return max;
}`
  },
  {
    name: "三数之和",
    nameEn: "3Sum",
    time: "O(n²)",
    space: "O(1) 忽略结果空间",
    desc: "排序 + 双指针。先对数组排序，然后固定一个元素 nums[i]，再用双指针 l=i+1、r=n-1 在剩余部分寻找和为 -nums[i] 的两个数。需要跳过重复元素以避免重复三元组。",
    presets: [
      { label: "经典 [-1,0,1,2,-1,-4]", data: [-1,0,1,2,-1,-4] },
      { label: "全零 [0,0,0,0]", data: [0,0,0,0] },
      { label: "有解 [-2,-1,0,1,2,3]", data: [-2,-1,0,1,2,3] },
      { label: "无解 [1,2,3,4,5]", data: [1,2,3,4,5] },
      { label: "随机 8 个", data: null, size: 8 },
      { label: "随机 12 个", data: null, size: 12 }
    ],
    javaCode: `public List<List<Integer>> threeSum(int[] nums) {
    Arrays.sort(nums);
    List<List<Integer>> res = new ArrayList<>();
    for (int i = 0; i < nums.length - 2; i++) {
        if (i > 0 && nums[i] == nums[i-1]) continue;
        int l = i + 1, r = nums.length - 1;
        while (l < r) {
            int sum = nums[i] + nums[l] + nums[r];
            if (sum == 0) {
                res.add(Arrays.asList(nums[i], nums[l], nums[r]));
                while (l < r && nums[l] == nums[l+1]) l++;
                while (l < r && nums[r] == nums[r-1]) r--;
                l++; r--;
            } else if (sum < 0) l++;
            else r--;
        }
    }
    return res;
}`
  },
  {
    name: "接雨水",
    nameEn: "Trapping Rain Water",
    time: "O(n)",
    space: "O(1)",
    desc: "双指针技巧——对撞指针左右夹逼。维护左右两侧的最大高度 leftMax 和 rightMax。对于每个位置，能接的雨水量由两侧最大高度的较小者决定。如果 height[l] < height[r]，则处理左侧，否则处理右侧。",
    presets: [
      { label: "经典 [0,1,0,2,1,0,1,3,2,1,2,1]", data: [0,1,0,2,1,0,1,3,2,1,2,1] },
      { label: "山谷 [3,0,0,2,0,4]", data: [3,0,0,2,0,4] },
      { label: "无凹 [1,2,3,4,5]", data: [1,2,3,4,5] },
      { label: "平台 [2,0,0,0,2]", data: [2,0,0,0,2] },
      { label: "随机 8 个", data: null, size: 8 },
      { label: "随机 12 个", data: null, size: 12 }
    ],
    javaCode: `public int trap(int[] height) {
    int l = 0, r = height.length - 1;
    int lMax = 0, rMax = 0, water = 0;
    while (l < r) {
        if (height[l] < height[r]) {
            if (height[l] >= lMax) lMax = height[l];
            else water += lMax - height[l];
            l++;
        } else {
            if (height[r] >= rMax) rMax = height[r];
            else water += rMax - height[r];
            r--;
        }
    }
    return water;
}`
  }
];

// ===================== 可视化引擎 =====================
let currentIdx = 0;
let panelData = [];

function generateRandomArray(size, min, max) {
  const arr = new Array(size);
  for (let i = 0; i < size; i++) arr[i] = Math.floor(Math.random() * (max - min + 1)) + min;
  return arr;
}

// ---------- 步骤生成 ----------
function buildSteps(probIdx, rawArr) {
  const arr = rawArr.slice();
  const n = arr.length;
  const steps = [];

  function push(opts) {
    steps.push({
      array: opts.array || arr.slice(),
      pointers: opts.pointers || {},
      swaps: opts.swaps || [],
      highlight: opts.highlight || [],
      sorted: opts.sorted || [],
      fixed: opts.fixed,
      areaRect: opts.areaRect || null,
      waterLevels: opts.waterLevels || null,
      waterTotal: opts.waterTotal != null ? opts.waterTotal : null,
      maxArea: opts.maxArea,
      triplet: opts.triplet || null,
      sum: opts.sum,
      lMax: opts.lMax,
      rMax: opts.rMax,
      line: opts.line || 0,
      msg: opts.msg || ''
    });
  }

  switch (probIdx) {
    // ===== 0 - 移动零 =====
    case 0: {
      push({ pointers: { l: 0, r: 0 }, line: 2, msg: '初始化左指针 left = 0，右指针 right 开始遍历' });
      let left = 0;
      for (let right = 0; right < n; right++) {
        push({ pointers: { l: left, r: right }, highlight: [right], line: 3,
          msg: `右指针扫描到 nums[${right}] = ${arr[right]}${arr[right] === 0 ? '（零元素，跳过）' : '（非零，准备交换）'}` });
        if (arr[right] !== 0) {
          if (right !== left) {
            push({ pointers: { l: left, r: right }, swaps: [left, right], highlight: [left, right], line: 5,
              msg: `交换 nums[${left}] = ${arr[left]} 和 nums[${right}] = ${arr[right]}` });
          } else {
            push({ pointers: { l: left, r: right }, highlight: [right], sorted: [right], line: 5,
              msg: `nums[${right}] 已在正确位置，无需交换` });
          }
          [arr[left], arr[right]] = [arr[right], arr[left]];
          left++;
          if (right !== left) {
            push({ pointers: { l: left, r: right }, sorted: Array.from({length: left}, (_,i) => i), line: 8,
              msg: `左指针右移到 ${left}，前 ${left} 个元素已处理完成` });
          }
        }
      }
      push({ sorted: Array.from({length: n}, (_,i) => i), pointers: {}, line: 0,
        msg: '✓ 移动零完成！所有非零元素已移到数组前面' });
      break;
    }

    // ===== 1 - 盛最多水的容器 =====
    case 1: {
      let l = 0, r = n - 1;
      let maxArea = 0, maxL = 0, maxR = n - 1;
      push({ pointers: { l, r }, line: 2, msg: `初始化：左指针 l = ${l}，右指针 r = ${r}` });
      while (l < r) {
        const h = Math.min(arr[l], arr[r]);
        const w = r - l;
        const area = h * w;
        const isHigherLeft = arr[l] < arr[r];
        push({ pointers: { l, r }, highlight: [l, r], areaRect: { l, r, level: h }, line: 4,
          msg: `height[${l}] = ${arr[l]}，height[${r}] = ${arr[r]}，高 = min(${arr[l]},${arr[r]}) = ${h}，宽 = ${r} - ${l} = ${w}，面积 = ${h} × ${w} = ${area}` });
        if (area > maxArea) {
          maxArea = area;
          maxL = l; maxR = r;
          push({ pointers: { l, r }, highlight: [l, r], areaRect: { l, r, level: h }, maxArea, line: 5,
            msg: `🏆 更新最大面积为 ${maxArea}（柱子 ${maxL} 和 ${maxR}）` });
        }
        push({ pointers: { l, r }, highlight: [l, r], line: 6,
          msg: `移动 ${isHigherLeft ? '左' : '右'}指针（height[${isHigherLeft ? l : r}] = ${isHigherLeft ? arr[l] : arr[r]} 较矮）→ ${isHigherLeft ? 'l++' : 'r--'}` });
        if (isHigherLeft) l++; else r--;
      }
      push({ pointers: {}, maxArea, line: 0,
        msg: `✓ 盛最多水的容器完成！最大面积 = ${maxArea}（柱子 ${maxL} 和 ${maxR}，高度 ${Math.min(arr[maxL], arr[maxR])}，宽度 ${Math.abs(maxR - maxL)}）` });
      break;
    }

    // ===== 2 - 三数之和 =====
    case 2: {
      arr.sort((a, b) => a - b);
      push({ array: arr.slice(), pointers: {}, sorted: [], line: 2, msg: `排序后数组：[${arr.join(', ')}]` });
      const foundTriplets = [];
      for (let i = 0; i < n - 2; i++) {
        if (i > 0 && arr[i] === arr[i-1]) {
          push({ array: arr.slice(), pointers: {}, fixed: i, highlight: [i], line: 4,
            msg: `nums[${i}] = ${arr[i]} 与前一个重复，跳过` });
          continue;
        }
        let l = i + 1, r = n - 1;
        push({ array: arr.slice(), pointers: { l, r }, fixed: i, line: 5,
          msg: `固定 nums[${i}] = ${arr[i]}，在 [${l}..${r}] 中寻找两数之和为 ${-arr[i]}` });
        while (l < r) {
          const sum = arr[i] + arr[l] + arr[r];
          push({ array: arr.slice(), pointers: { l, r }, fixed: i, highlight: [l, r], sum, line: 7,
            msg: `nums[${i}] + nums[${l}] + nums[${r}] = ${arr[i]} + ${arr[l]} + ${arr[r]} = ${sum}${sum === 0 ? ' ✓ 找到一组解！' : sum < 0 ? ' < 0，左指针右移' : ' > 0，右指针左移'}` });
          if (sum === 0) {
            foundTriplets.push([arr[i], arr[l], arr[r]]);
            push({ array: arr.slice(), pointers: { l, r }, fixed: i, triplet: [i, l, r], sum, line: 8,
              msg: `✅ 找到三元组：[${arr[i]}, ${arr[l]}, ${arr[r]}]` });
            while (l < r && arr[l] === arr[l+1]) { l++; push({ array: arr.slice(), pointers: { l, r }, fixed: i, highlight: [l], line: 9, msg: `跳过重复的左指针 → l = ${l}` }); }
            while (l < r && arr[r] === arr[r-1]) { r--; push({ array: arr.slice(), pointers: { l, r }, fixed: i, highlight: [r], line: 10, msg: `跳过重复的右指针 → r = ${r}` }); }
            l++; r--;
          } else if (sum < 0) {
            l++;
          } else {
            r--;
          }
        }
        push({ array: arr.slice(), pointers: {}, fixed: i, highlight: [], line: 0,
          msg: `nums[${i}] = ${arr[i]} 查找结束，${foundTriplets.length} 组解` });
      }
      push({ array: arr.slice(), sorted: Array.from({length: n}, (_,i) => i), pointers: {}, line: 0,
        msg: `✓ 三数之和完成！共找到 ${foundTriplets.length} 组解：${foundTriplets.length ? foundTriplets.map(t => `[${t.join(',')}]`).join(' ') : '无'}` });
      break;
    }

    // ===== 3 - 接雨水 =====
    case 3: {
      let l = 0, r = n - 1;
      let lMax = 0, rMax = 0, water = 0;
      const waterLevelsArr = new Array(n).fill(0);
      push({ pointers: { l, r }, line: 2, msg: `初始化：左指针 l = ${l}，右指针 r = ${r}，leftMax = ${lMax}，rightMax = ${rMax}` });
      while (l < r) {
        if (arr[l] < arr[r]) {
          const oldLMax = lMax;
          if (arr[l] >= lMax) {
            lMax = arr[l];
          } else {
            const w = lMax - arr[l];
            water += w;
            waterLevelsArr[l] = w;
          }
          push({ pointers: { l, r }, highlight: [l], lMax, rMax, waterLevels: waterLevelsArr.slice(), waterTotal: water, line: 4,
            msg: `height[${l}] < height[${r}]（${arr[l]} < ${arr[r]}）→ 处理左侧：height[${l}]${arr[l] >= oldLMax ? ' >= ' : ' < '} leftMax（${arr[l]} ${arr[l] >= oldLMax ? '≥' : '<'} ${oldLMax}）${arr[l] >= oldLMax ? `→ 更新 leftMax = ${lMax}` : `→ 接水 ${lMax} - ${arr[l]} = ${lMax - arr[l]}`}` });
          l++;
        } else {
          const oldRMax = rMax;
          if (arr[r] >= rMax) {
            rMax = arr[r];
          } else {
            const w = rMax - arr[r];
            water += w;
            waterLevelsArr[r] = w;
          }
          push({ pointers: { l, r }, highlight: [r], lMax, rMax, waterLevels: waterLevelsArr.slice(), waterTotal: water, line: 8,
            msg: `height[${l}] ≥ height[${r}]（${arr[l]} ≥ ${arr[r]}）→ 处理右侧：height[${r}]${arr[r] >= oldRMax ? ' >= ' : ' < '} rightMax（${arr[r]} ${arr[r] >= oldRMax ? '≥' : '<'} ${oldRMax}）${arr[r] >= oldRMax ? `→ 更新 rightMax = ${rMax}` : `→ 接水 ${rMax} - ${arr[r]} = ${rMax - arr[r]}`}` });
          r--;
        }
      }
      push({ waterLevels: waterLevelsArr.slice(), waterTotal: water, pointers: {}, sorted: Array.from({length: n}, (_,i) => i), line: 0,
        msg: `✓ 接雨水完成！总共接水 = ${water}` });
      break;
    }
  }
  return steps;
}

// ---------- DOM 构建 ----------
function initPanel(idx) {
  const data = PROBLEM_DATA[idx];
  const panel = document.createElement('div');
  panel.className = 'panel' + (idx === 0 ? ' active' : '');
  panel.id = 'panel-' + idx;

  const codeStr = data.javaCode.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = codeStr.split('\n');
  let codeHTML = '<pre><code>';
  for (let i = 0; i < lines.length; i++) {
    const ln = i + 1;
    codeHTML += `<div class="code-line" data-line="${ln}"><span class="lineno">${ln}</span><span class="line-code">${lines[i]}</span></div>`;
  }
  codeHTML += '</code></pre>';

  const presetOpts = data.presets.map((p, pi) => `<option value="${pi}">${p.label}</option>`).join('');

  panel.innerHTML = `
    <div class="panel-header">
      <h2>${data.name}（${data.nameEn}）</h2>
      <div class="sub">${data.desc}</div>
    </div>
    <div class="complexity">
      <span class="label">复杂度</span>
      <span><span class="badge-time">●</span> 时间复杂度 ${data.time}</span>
      <span><span class="badge-space">●</span> 空间复杂度 ${data.space}</span>
      <button class="copy-btn" data-idx="${idx}" style="margin-left:auto;">复制代码</button>
    </div>
    <div class="content">
      <div class="code-section">
        <div class="code-header">
          <span class="lang-label">Java</span>
        </div>
        <div class="code-scroll">${codeHTML}</div>
      </div>
      <div class="vis-section">
        <div class="vis-msg" id="msg-${idx}">选择测试数据并点击「下一步」开始演示</div>
        <div class="vis-canvas-wrap" id="canvas-${idx}"></div>
        <div class="controls">
          <button class="btn-first" data-idx="${idx}">|◀ 首步</button>
          <button class="btn-prev" data-idx="${idx}">◀ 上一步</button>
          <button class="btn-next btn-primary" data-idx="${idx}">下一步 ▶</button>
          <button class="btn-last" data-idx="${idx}">末步 ▶|</button>
          <button class="btn-auto" data-idx="${idx}">▶ 自动</button>
          <label>速度 <input type="range" class="speed-slider" min="1" max="10" value="5" data-idx="${idx}"></label>
          <label>数据 <select class="preset-select" data-idx="${idx}">${presetOpts}</select></label>
          <button class="btn-reset" data-idx="${idx}">🔄 重置</button>
          <span class="step-info" id="stepInfo-${idx}">步骤 0 / 0</span>
        </div>
      </div>
    </div>
    <div class="algo-desc">
      <strong>算法说明：</strong>${data.desc}
    </div>
  `;

  document.getElementById('panels').appendChild(panel);

  const state = { steps: [], stepIdx: 0, arr: [], idx: idx, running: false, timer: null };
  panelData[idx] = state;

  const presetSelect = panel.querySelector('.preset-select');
  const nextBtn = panel.querySelector('.btn-next');
  const prevBtn = panel.querySelector('.btn-prev');
  const firstBtn = panel.querySelector('.btn-first');
  const lastBtn = panel.querySelector('.btn-last');
  const autoBtn = panel.querySelector('.btn-auto');
  const speedSlider = panel.querySelector('.speed-slider');
  const resetBtn = panel.querySelector('.btn-reset');

  function render() {
    const canvas = document.getElementById('canvas-' + idx);
    if (!state.steps.length) return;
    const stepIdx = Math.min(state.stepIdx, state.steps.length - 1);
    const step = state.steps[stepIdx];
    const arrVals = step.array;
    if (!arrVals || !arrVals.length) return;
    const maxVal = Math.max(...arrVals.map(Math.abs), 1);
    const minVal = Math.min(...arrVals);
    canvas.innerHTML = '';
    const _hotCanvasStyle = getComputedStyle(canvas);
    const _hotPadX = (parseFloat(_hotCanvasStyle.paddingLeft) || 0) + (parseFloat(_hotCanvasStyle.paddingRight) || 0);
    const _hotPadY = (parseFloat(_hotCanvasStyle.paddingTop) || 0) + (parseFloat(_hotCanvasStyle.paddingBottom) || 0);
    const W = Math.max(240, canvas.clientWidth - _hotPadX);
    const H = Math.max(180, canvas.clientHeight - _hotPadY);
    const barW = Math.max(8, Math.min(40, Math.floor((W - 20) / arrVals.length) - 2));

    const hasNegative = minVal < 0;
    const midY = hasNegative ? H / 2 : H - 30;

    arrVals.forEach((v, i) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'bar-wrapper';

      const bar = document.createElement('div');
      bar.className = 'bar';

      let barH = 0;
      if (hasNegative) {
        barH = Math.abs(v) / maxVal * (H / 2 - 10);
        if (v >= 0) {
          bar.style.height = barH + 'px';
          bar.style.alignSelf = 'flex-end';
          bar.style.marginTop = (H / 2) + 'px';
        } else {
          bar.style.height = barH + 'px';
          bar.style.alignSelf = 'flex-start';
          bar.style.marginBottom = (H / 2) + 'px';
          bar.style.borderRadius = '0 0 3px 3px';
        }
      } else {
        barH = (v / maxVal) * (H - 30);
        bar.style.height = barH + 'px';
      }
      bar.style.width = barW + 'px';

      // Coloring
      let bg = '#4a6cf7';
      if (step.sorted && step.sorted.includes(i)) bg = '#4caf50';
      if (step.swaps && step.swaps.includes(i)) bg = '#f44336';
      if (step.highlight && step.highlight.includes(i)) bg = '#ff9800';
      if (step.fixed === i) bg = '#9c27b0';
      if (step.triplet && step.triplet.includes(i)) bg = '#e91e63';
      if (step.pointers) {
        if (step.pointers.l === i && step.pointers.l === step.pointers.r) bg = '#00bcd4';
      }
      bar.style.background = bg;
      wrapper.appendChild(bar);

      // Value label
      const label = document.createElement('span');
      label.className = 'bar-label';
      label.textContent = v;
      label.style.bottom = hasNegative ? (v >= 0 ? '-18px' : (barH + 4) + 'px') : '-18px';
      bar.appendChild(label);

      // Pointer label
      if (step.pointers) {
        if (step.pointers.l === i && step.pointers.l !== undefined) {
          const pl = document.createElement('div');
          pl.className = 'ptr-label';
          pl.style.color = '#f44336';
          const isBoth = step.pointers.l === step.pointers.r;
          pl.textContent = isBoth ? 'L/R' : 'L';
          wrapper.appendChild(pl);
        }
        if (step.pointers.r === i && step.pointers.l !== step.pointers.r && step.pointers.r !== undefined) {
          const pr = document.createElement('div');
          pr.className = 'ptr-label';
          pr.style.color = '#4a6cf7';
          pr.textContent = 'R';
          wrapper.appendChild(pr);
        }
      }
      if (step.fixed === i) {
        const pf = document.createElement('div');
        pf.className = 'ptr-label';
        pf.style.color = '#9c27b0';
        pf.textContent = 'i';
        wrapper.appendChild(pf);
      }

      // Water on bar (rain water)
      if (step.waterLevels && step.waterLevels[i] > 0) {
        const waterEl = document.createElement('div');
        waterEl.className = 'water-on-bar';
        const waterH = (step.waterLevels[i] / maxVal) * (H - 30);
        waterEl.style.bottom = barH + 'px';
        waterEl.style.height = waterH + 'px';
        waterEl.style.background = 'rgba(66,133,244,0.45)';
        waterEl.style.width = barW + 'px';
        wrapper.appendChild(waterEl);
      }

      canvas.appendChild(wrapper);
    });

    // Water rectangle (container with most water)
    if (step.areaRect && !hasNegative) {
      const rect = step.areaRect;
      const totalBars = arrVals.length;
      const gap = 3;
      const totalW = totalBars * (barW + gap);
      const offsetX = (canvas.clientWidth - totalW) / 2;
      const waterLevelH = (rect.level / maxVal) * (H - 30);
      const leftPx = offsetX + rect.l * (barW + gap) - gap/2;
      const rightPx = offsetX + (rect.r + 1) * (barW + gap) - gap/2;
      const wRect = document.createElement('div');
      wRect.className = 'water-rect';
      wRect.style.left = leftPx + 'px';
      wRect.style.width = (rightPx - leftPx) + 'px';
      wRect.style.bottom = '0px';
      wRect.style.height = waterLevelH + 'px';
      wRect.style.background = 'rgba(66,133,244,0.2)';
      wRect.style.border = '2px dashed rgba(66,133,244,0.6)';
      canvas.appendChild(wRect);
    }

    // Step info
    const info = document.getElementById('stepInfo-' + idx);
    if (info) info.textContent = `步骤 ${state.stepIdx} / ${state.steps.length - 1}`;
    const msgEl = document.getElementById('msg-' + idx);
    if (msgEl) {
      let msg = step.msg || '';
      if (step.maxArea != null && step.maxArea > 0) msg += `　<span class="sub-msg">当前最大面积：${step.maxArea}</span>`;
      if (step.waterTotal != null) msg += `　<span class="sub-msg">累计接水：${step.waterTotal}</span>`;
      if (step.lMax != null) msg += `　<span class="sub-msg">leftMax=${step.lMax} rightMax=${step.rMax}</span>`;
      if (step.sum != null) msg += `　<span class="sub-msg">sum=${step.sum}</span>`;
      msgEl.innerHTML = msg;
    }

    // Code highlight
    const codeLines = panel.querySelectorAll('.code-line');
    codeLines.forEach(el => el.classList.remove('highlight-line'));
    if (step.line > 0) {
      const target = panel.querySelector(`.code-line[data-line="${step.line}"]`);
      if (target) target.classList.add('highlight-line');
    }
  }

  function getPresetData() {
    const optIdx = parseInt(presetSelect.value);
    const preset = data.presets[optIdx];
    if (preset.data) {
      return preset.data.slice();
    } else {
      let min = -5, max = 15;
      if (idx === 0) { min = 0; max = 9; }  // move zeroes: non-negative
      else if (idx === 1) { min = 1; max = 15; } // container: positive
      else if (idx === 2) { min = -5; max = 10; } // 3sum
      else { min = 0; max = 10; } // rain: non-negative
      return generateRandomArray(preset.size, min, max);
    }
  }

  function resetSteps() {
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
    state.running = false;
    autoBtn.textContent = '▶ 自动';
    state.arr = getPresetData();
    state.steps = buildSteps(idx, state.arr);
    state.stepIdx = 0;
    render();
    updateButtons();
  }

  function updateButtons() {
    const atFirst = state.stepIdx <= 0;
    const atLast = state.stepIdx >= state.steps.length - 1;
    firstBtn.disabled = atFirst;
    prevBtn.disabled = atFirst;
    nextBtn.disabled = atLast;
    lastBtn.disabled = atLast;
  }

  presetSelect.addEventListener('change', resetSteps);

  nextBtn.addEventListener('click', () => {
    if (state.stepIdx < state.steps.length - 1) { state.stepIdx++; render(); updateButtons(); }
  });
  prevBtn.addEventListener('click', () => {
    if (state.stepIdx > 0) { state.stepIdx--; render(); updateButtons(); }
  });
  firstBtn.addEventListener('click', () => {
    state.stepIdx = 0; render(); updateButtons();
  });
  lastBtn.addEventListener('click', () => {
    state.stepIdx = state.steps.length - 1; render(); updateButtons();
  });
  resetBtn.addEventListener('click', resetSteps);
  autoBtn.addEventListener('click', () => {
    if (state.running) {
      if (state.timer) { clearInterval(state.timer); state.timer = null; }
      state.running = false;
      autoBtn.textContent = '▶ 自动';
    } else {
      state.running = true;
      autoBtn.textContent = '⏸ 暂停';
      const speed = parseInt(speedSlider.value);
      const delay = Math.max(20, 120 - speed * 10);
      state.timer = setInterval(() => {
        if (state.stepIdx < state.steps.length - 1) {
          state.stepIdx++;
          render();
          updateButtons();
        } else {
          clearInterval(state.timer);
          state.timer = null;
          state.running = false;
          autoBtn.textContent = '▶ 自动';
        }
      }, delay);
    }
  });

  // Copy button
  panel.querySelector('.copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(data.javaCode).then(() => {
      const btn = panel.querySelector('.copy-btn');
      const orig = btn.textContent;
      btn.textContent = '✓ 已复制';
      setTimeout(() => btn.textContent = orig, 1500);
    }).catch(() => alert('复制失败'));
  });

  state.render = render;
  panelData[idx] = state;

  resetSteps();

  const ro = new ResizeObserver(() => render());
  ro.observe(document.getElementById('canvas-' + idx));
}

// ===================== 启动 =====================
PROBLEM_DATA.forEach((_, idx) => {
  panelData.push(null);
  initPanel(idx);
});

// Tab 切换
document.querySelectorAll('.sort-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    panelData.forEach(s => { if (s && s.timer) { clearInterval(s.timer); s.timer = null; s.running = false; } });
    document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.btn-auto').forEach(b => b.textContent = '▶ 自动');
    tab.classList.add('active');
    const idx = parseInt(tab.dataset.idx);
    document.getElementById('panel-' + idx).classList.add('active');
    const s = panelData[idx];
    if (s && s.render) s.render();
  });
});
</script>

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
