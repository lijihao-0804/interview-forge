<nav class="hot100-topnav" data-hot100-nav aria-label="学习导航"><strong>链表算法演示 · Hot 100</strong><span class="hot100-links"><a href="../../../index.html">学习面板</a><a href="index.html">可视化中心</a></span></nav>
<div id="app"></div>
<script>
/* ===== 链表演示：11 道题 · 统一框架 =====
 * 视图模型：view = { rows: [{name, vals, st:{idx:state}, ptrs:[{i,label,c}], ghost:[i]}] }
 * 状态色：hot 当前 / cmp 比较中 / swap 待换 / write 刚写入 / done 完成 / dim 弱化
 * 指针色：c1 蓝 / c2 橙 / c3 青 / c4 红
 */
var el = DemoKit.el;

function renderRows(view, stage) {
  stage.textContent = "";
  (view.rows || []).forEach(function (row) {
    var line = document.createElement("div");
    line.style.cssText = "display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:10px 0;position:relative;padding-top:40px";
    line.appendChild(el("span", "dk-var", row.name));
    if (!row.vals || !row.vals.length) {
      line.appendChild(el("span", "dk-var", "null"));
      stage.appendChild(line);
      return;
    }
    row.vals.forEach(function (v, i) {
      var st = (row.st && row.st[i]) || "";
      var cell = el("div", "dk-cell" + (st ? " " + st : ""), String(v));
      if (row.ptrs) {
        row.ptrs.forEach(function (pr) {
          if (pr.i !== i) return;
          var tag = el("span", "dk-ptr " + (pr.c || "c1"), pr.label);
          cell.appendChild(tag);
        });
      }
      line.appendChild(cell);
      if (i < row.vals.length - 1) line.appendChild(el("span", "dk-arrow", "→"));
    });
    if (row.tail) line.appendChild(el("span", "dk-note", row.tail));
    stage.appendChild(line);
  });
  if (view.note) {
    var n = el("div", "dk-note", view.note);
    stage.appendChild(n);
  }
}

/* 工具：造一行视图 */
function row(name, vals, extra) {
  var r = { name: name, vals: vals.slice() };
  if (extra) for (var k in extra) r[k] = extra[k];
  return r;
}
function st1(i, s) { var m = {}; m[i] = s; return m; }
function mergeSt(a, b) { var m = {}; for (var k in a) m[k] = a[k]; for (var k in b) m[k] = b[k]; return m; }

var DEMOS = {

  "0002": { no: "2", title: "两数相加", tag: "链表 · 逐位加法 + 进位",
    example: "输入：l1 = [9,9,9,9,9,9,9]，l2 = [9,9,9,9]　输出：[8,9,9,9,0,0,0,1]",
    build: function (ctx) {
      var a = [9, 9, 9, 9, 9, 9, 9], b = [9, 9, 9, 9];
      var carry = 0, out = [];
      var n = Math.max(a.length, b.length) + 1;
      for (var i = 0; i < n; i++) {
        var x = i < a.length ? a[i] : 0, y = i < b.length ? b[i] : 0;
        var sum = x + y + carry;
        ctx.step("第 " + i + " 位：" + x + " + " + y + " + 进位 " + carry + " = " + sum + " → 写入 " + (sum % 10) + "，新进位 " + Math.floor(sum / 10),
          { rows: [
            row("l1", a, { st: i < a.length ? st1(i, "hot") : null, ptrs: [{ i: i, label: "p1", c: "c1" }] }),
            row("l2", b, { st: i < b.length ? st1(i, "hot") : null, ptrs: [{ i: i, label: "p2", c: "c2" }] }),
            row("输出", out.concat([sum % 10]), { st: st1(out.length, "write") })
          ], note: "sum % 10 是本位，Math.floor(sum / 10) 是进位" });

      }
      if (carry) {
        out.push(carry);
        ctx.step("最高位还有进位 " + carry + " → 追加节点", { rows: [row("输出", out, { st: st1(out.length - 1, "write") })] });
      }

    },
    render: renderRows },

  "0019": { no: "19", title: "删除链表的倒数第 N 个结点", tag: "链表 · 快慢双指针",
    example: "输入：head = [1,2,3,4,5]，n = 2　输出：[1,2,3,5]",
    build: function (ctx) {
      var vals = [1, 2, 3, 4, 5], n = 2;
      var dummy = -1;
      var fast = 0, slow = 0;
      ctx.step("哑头节点 -1 起步；fast 先走 n+1 = 3 步（保持 fast 与 slow 间距 n+1）",
        { rows: [row("链表", [dummy].concat(vals), { ptrs: [{ i: 0, label: "slow", c: "c1" }, { i: 0, label: "fast", c: "c2" }], st: st1(0, "dim") })] });
      fast = 3;
      for (var k = 1; k <= 3; k++) {
        ctx.step("fast 先行第 " + k + " 步 → 位置 " + k,
          { rows: [row("链表", [dummy].concat(vals), { ptrs: [{ i: slow, label: "slow", c: "c1" }, { i: fast, label: "fast", c: "c2" }], st: mergeSt(st1(0, "dim"), st1(k, "hot")) })] });
      }
      while (fast < vals.length + 1) {
        ctx.step("fast、slow 同速前进…", { rows: [row("链表", [dummy].concat(vals), { ptrs: [{ i: slow, label: "slow", c: "c1" }, { i: fast, label: "fast", c: "c2" }] })] });
        fast++; slow++;
      }
      ctx.step("fast 到尾，slow 停在被删节点（" + vals[slow] + "）的前驱 → 删除下一节点",
        { rows: [row("链表", [dummy].concat(vals), { ptrs: [{ i: slow, label: "slow", c: "c1" }], st: mergeSt(st1(0, "dim"), st1(slow + 1, "swap")) })] });
      vals.splice(slow, 1);
      ctx.step("删除完成 → [1,2,3,5]", { rows: [row("链表", [dummy].concat(vals), { st: mergeSt(st1(0, "dim"), st1(slow, "write")) })] });
    },
    render: renderRows },

  "0021": { no: "21", title: "合并两个有序链表", tag: "链表 · 双指针归并",
    example: "输入：l1 = [1,2,4]，l2 = [1,3,4]　输出：[1,1,2,3,4,4]",
    build: function (ctx) {
      var a = [1, 2, 4], b = [1, 3, 4];
      var i = 0, j = 0, out = [];
      while (i < a.length && j < b.length) {
        if (a[i] <= b[j]) {
          ctx.step("比较 " + a[i] + " vs " + b[j] + "：取 l1 的 " + a[i], { rows: [
            row("l1", a, { st: st1(i, "hot"), ptrs: [{ i: i, label: "p1", c: "c1" }] }),
            row("l2", b, { st: st1(j, "dim"), ptrs: [{ i: j, label: "p2", c: "c2" }] }),
            row("输出", out.concat([a[i]]), { st: st1(out.length, "write") })] });
          out.push(a[i++]);
        } else {
          ctx.step("比较 " + a[i] + " vs " + b[j] + "：取 l2 的 " + b[j], { rows: [

            row("l2", b, { st: st1(j, "hot"), ptrs: [{ i: j, label: "p2", c: "c2" }] }),
            row("输出", out.concat([b[j]]), { st: st1(out.length, "write") })] });
          out.push(b[j++]);

      }
      while (i < a.length) { out.push(a[i++]); }
      while (j < b.length) { out.push(b[j++]); }

  "0024": { no: "24", title: "两两交换链表中的节点", tag: "链表 · 指针重排",
    example: "输入：head = [1,2,3,4,5]　输出：[2,1,4,3,5]",

  "0138": { no: "138", title: "随机链表的复制", tag: "链表 · 哈希映射",
    example: "输入：head = [[7,null],[13,0],[11,4],[10,2],[1,0]]",

    },

  "0141": { no: "141", title: "环形链表", tag: "链表 · Floyd 快慢指针",
    example: "输入：head = [3,2,0,-4]，pos = 1（尾部连接到下标 1）　输出：true",
    build: function (ctx) {
      var vals = [3, 2, 0, -4];
      var pos = 1;
      var slow = 0, fast = 0, met = false, stepNo = 0;
      ctx.step("Floyd 判圈：slow 每次走 1 步、fast 走 2 步；有环则必在环内相遇", { rows: [
        row("链表(有环 " + pos + ")", vals, { ptrs: [{ i: 0, label: "slow", c: "c1" }, { i: 0, label: "fast", c: "c2" }], tail: "⟲ 尾部连回下标 " + pos }) ] });
      for (var s = 0; s < 12 && !met; s++) {
        slow = (slow + 1) % vals.length;
        fast = (fast + 2) % vals.length;
        stepNo++;
        met = slow === fast;
        ctx.step("第 " + stepNo + " 轮：slow=" + vals[slow] + "，fast=" + vals[fast] + (met ? " → 相遇！有环 ✓" : ""),
          { rows: [row("链表(有环 " + pos + ")", vals, { ptrs: [{ i: slow, label: "slow", c: "c1" }, { i: fast, label: "fast", c: "c2" }], st: mergeSt(st1(slow, met ? "target" : "hot"), met ? {} : st1(fast, "cmp")), tail: "⟲ " + pos }) ] });
      }
      ctx.step("结论：有环。原理：进入环后 fast 每轮追近 1 步，必然追上", { rows: [
        row("链表(有环 " + pos + ")", vals, { st: st1(slow, "target"), tail: "⟲ " + pos }) ] });
    },
    render: renderRows },

  "0142": { no: "142", title: "环形链表 II", tag: "链表 · Floyd 两阶段",
    example: "输入：head = [3,2,0,-4]，pos = 1　输出：返回环的入口节点 2",
    build: function (ctx) {
      var vals = [3, 2, 0, -4], pos = 1;
      var slow = 0, fast = 0;
      ctx.step("阶段一：slow/fast 判圈，直到相遇", { rows: [
        row("链表", vals, { ptrs: [{ i: 0, label: "slow", c: "c1" }, { i: 0, label: "fast", c: "c2" }], tail: "⟲ " + pos }) ] });
      var met = -1;
      for (var s = 0; s < 12; s++) {
        slow = (slow + 1) % vals.length;
        fast = (fast + 2) % vals.length;
        if (slow === fast) { met = slow; break; }
        ctx.step("追击中：slow=" + vals[slow] + "，fast=" + vals[fast], { rows: [
          row("链表", vals, { ptrs: [{ i: slow, label: "slow", c: "c1" }, { i: fast, label: "fast", c: "c2" }], tail: "⟲ " + pos }) ] });
      }
      ctx.step("相遇于 " + vals[met] + "。数学结论：头到入口 = 入口到相遇点（模环长）",
        { rows: [row("链表", vals, { ptrs: [{ i: met, label: "相遇", c: "c4" }], tail: "⟲ " + pos }) ] });
      slow = 0;
      var ptrs2 = [{ i: slow, label: "slow", c: "c1" }, { i: met, label: "meet", c: "c4" }];
      while (slow !== met) {
        ctx.step("两指针同速前进：slow=" + vals[slow] + "，meet=" + vals[met], { rows: [
          row("链表", vals, { ptrs: ptrs2.slice(), tail: "⟲ " + pos }) ] });
        slow = (slow + 1) % vals.length;
        met = (met + 1) % vals.length;
        ptrs2 = [{ i: slow, label: "slow", c: "c1" }, { i: met, label: "meet", c: "c4" }];
      }
      ctx.step("两指针在 " + vals[met] + " 相会 → 这就是环的入口 ✓", { rows: [
        row("链表", vals, { st: st1(met, "target"), ptrs: ptrs2.slice(), tail: "⟲ " + pos }) ] });
    },
    render: renderRows },

  "0146": { no: "146", title: "LRU 缓存", tag: "链表 · 双向链表 + 哈希",
    example: "容量 capacity = 2；操作 [put,put,get,put,get,put,get,get,put]，见步骤",
    build: function (ctx) {
      var cap = 2;
      var list = [];                       // 头=最新，尾=最旧
      var map = {};
      var seq = [
        ["put", 1, 1], ["put", 2, 2], ["get", 1, null], ["put", 3, 3],
        ["get", 2, null], ["put", 4, 4], ["get", 1, null], ["get", 3, null], ["get", 4, null]
      ];
      function view(opDesc, opIdx) {
        return { rows: [row("缓存(新→旧)", list.map(function (e) { return e.k + ":" + e.v; }), { tail: "容量 " + list.length + "/" + cap })], note: "操作 " + (opIdx + 1) + "：" + opDesc };
      }
      var oi = 0;
      seq.forEach(function (op, opIdx) {
        oi = opIdx;
        var kind = op[0];
        if (kind === "put") {
          var k = op[1], v = op[2];
          if (map[k] !== undefined) {
            list.splice(list.map(function (e) { return e.k; }).indexOf(k), 1);
          } else if (list.length >= cap) {
            var evicted = list.pop();
            delete map[evicted.k];
            list.unshift({ k: k, v: v }); map[k] = 1;
            ctx.step("put(" + k + "," + v + ")：缓存满 → 淘汰最久未用的 " + evicted.k + "，新节点插头部", view("put(" + k + "," + v + ") 淘汰 " + evicted.k, opIdx));
            return;
          }
          list.unshift({ k: k, v: v }); map[k] = 1;
          ctx.step("put(" + k + "," + v + ")：插入头部", view("put(" + k + "," + v + ")", opIdx));
        } else {
          var gk = op[1];
          if (map[gk] === undefined) {
            ctx.step("get(" + gk + ")：未命中 → -1", view("get(" + gk + ") 未命中", opIdx));
          } else {
            var idx = list.map(function (e) { return e.k; }).indexOf(gk);
            var entry = list.splice(idx, 1)[0];
            list.unshift(entry);
            ctx.step("get(" + gk + ") 命中 → " + entry.v + "，节点移到头部（最新）", view("get(" + gk + ")=" + entry.v + "，移到头部", opIdx));
          }
        }
      });
      ctx.step("全部操作完成。双向链表 O(1) 移动/淘汰 + 哈希表 O(1) 定位", view("结束", seq.length - 1));
    },
    render: renderRows },

  "0148": { no: "148", title: "排序链表", tag: "链表 · 归并排序",
    example: "输入：head = [-1,5,3,4,0]　输出：[-1,0,3,4,5]",
    build: function (ctx) {
      var vals = [-1, 5, 3, 4, 0];
      function mergeView(l, r, merged, hi) {
        return { rows: [
          row("左半", l, { ptrs: [{ i: 0, label: "L", c: "c1" }] }),
          row("右半", r, { ptrs: [{ i: 0, label: "R", c: "c2" }] }),
          row("合并中", merged.concat(hi !== undefined ? [hi] : []), { st: hi !== undefined ? st1(merged.length, "write") : null }) ] };
      }
      ctx.step("归并排序：快慢指针找中点 → 递归拆半 → 有序合并", { rows: [row("链表", vals)] });
      var mid = 2;
      var left = vals.slice(0, mid), right = vals.slice(mid);
      ctx.step("找中点拆半：左 [" + left.join(",") + "]，右 [" + right.join(",") + "]", mergeView(left, right, []));
      left.sort(function (a, b) { return a - b; }); right.sort(function (a, b) { return a - b; });
      ctx.step("两半分别递归排序完成（子问题规模减半）：左 [" + left.join(",") + "]，右 [" + right.join(",") + "]", mergeView(left, right, []));
      var merged = [], i = 0, j = 0;
      while (i < left.length && j < right.length) {
        if (left[i] <= right[j]) {
          merged.push(left[i]);
          ctx.step("比较 " + left[i] + " vs " + right[j] + " → 取 " + left[i], mergeView(left, right, merged, merged.length - 1));
          i++;
        } else {
          merged.push(right[j]);
          ctx.step("比较 " + left[i] + " vs " + right[j] + " → 取 " + right[j], mergeView(left, right, merged, merged.length - 1));
          j++;
        }
      }
      while (i < left.length) merged.push(left[i++]);
      while (j < right.length) merged.push(right[j++]);
      ctx.step("合并完成 → [-1,0,3,4,5]", { rows: [row("结果", merged, { st: st1(merged.length - 1, "target") })] });
    },
    render: renderRows },

  "0160": { no: "160", title: "相交链表", tag: "链表 · 双指针走位",
    example: "listA = [4,1,8,4,5]，listB = [5,6,1,8,4,5]，从 8 开始相交　输出：8",
    build: function (ctx) {
      var common = [8, 4, 5];
      var aHead = [4, 1], bHead = [5, 6, 1];
      var pa = 0, pb = 0, swap = false;
      ctx.step("技巧：pA 走完 A 就走 B，pB 走完 B 就走 A——两指针走过的总长度相同，必然在交点相遇",
        { rows: [row("A 独有", aHead), row("公共尾", common), row("B 独有", bHead)] });
      var routeA = aHead.concat(common), routeB = bHead.concat(common);
      var la = aHead.length, lb = bHead.length;
      for (var s = 0; s < 12; s++) {
        var va = pa < aHead.length ? aHead[pa] : common[pa - aHead.length];
        var vb = pb < bHead.length ? bHead[pb] : common[pb - bHead.length];
        var rowView = { rows: [
          row("A 路径", routeA, { st: st1(pa, "hot"), ptrs: [{ i: pa, label: "pA", c: "c1" }] }),
          row("B 路径", routeB, { st: st1(pb, "hot"), ptrs: [{ i: pb, label: "pB", c: "c2" }] }) ] };
        if (va === vb) {
          ctx.step("pA=" + va + " 与 pB=" + vb + " 相同 → 相交节点是 " + va + " ✓", rowView);
          break;
        }
        ctx.step("pA=" + va + "，pB=" + vb + "：不等，各走一步（走完自己就切到对方）", rowView);
        pa = (pa + 1) % 12; pb = (pb + 1) % 12;
        if (pa > 11 || pb > 11) break;
      }
    },
    render: renderRows },

  "0234": { no: "234", title: "回文链表", tag: "链表 · 找中 + 反转 + 比较",
    example: "输入：head = [1,2,3,2,1]　输出：true",
    build: function (ctx) {
      var vals = [1, 2, 3, 2, 1];
      var half = 2;
      ctx.step("第一步：快慢指针找中点（fast 每次 2 步）", { rows: [
        row("链表", vals, { ptrs: [{ i: 0, label: "slow", c: "c1" }, { i: 0, label: "fast", c: "c2" }] }) ] });
      var slow = 0, fast = 0;
      for (var s = 0; s < 3; s++) {
        slow++; fast += 2;
        ctx.step("slow=" + vals[slow] + "，fast=" + (fast < vals.length ? vals[fast] : "到尾") + " → 中点定位完成", { rows: [
          row("链表", vals, { ptrs: [{ i: slow, label: "slow", c: "c1" }, { i: Math.min(fast, vals.length - 1), label: "fast", c: "c2" }] }) ] });
      }
      var second = vals.slice(slow).reverse();
      ctx.step("第二步：反转后半段 → [" + second.join(",") + "]（原地反转，O(1) 空间）", { rows: [
        row("前半", vals.slice(0, slow)),
        row("后半(反转)", second, { st: st1(0, "write") }) ] });
      var ok = true;
      for (var k = 0; k < second.length; k++) {
        var equal = vals[k] === second[k];
        ctx.step("比较 " + vals[k] + " vs " + second[k] + "：" + (equal ? "相等 ✓" : "不等 ✗"), { rows: [
          row("前半", vals.slice(0, slow), { st: st1(k, "cmp") }),
          row("后半(反转)", second, { st: st1(k, equal ? "done" : "swap") }) ] });
        if (!equal) ok = false;
      }
      ctx.step(ok ? "全部相等 → 是回文链表 ✓" : "不相等 → 不是回文", { rows: [
        row("结论", ok ? ["是回文"] : ["不是回文"], { st: st1(0, "target") }) ] });
    },
    render: renderRows }
};

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');

    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');

    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
