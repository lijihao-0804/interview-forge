<script>
/* ===== 堆（快速选择）· 图（课程表）· 滑窗（异位词）· 回溯（分割回文串）：5 道题 ===== */
var el = DemoKit.el;

function cells(vals, st, ptrs) {
  var wrap = el("div", "dk-cells");
  vals.forEach(function (v, i) {
    var cell = el("div", "dk-cell" + ((st && st[i]) ? " " + st[i] : ""), String(v));
    if (ptrs) ptrs.forEach(function (p) {
      if (p.i === i) cell.appendChild(el("span", "dk-ptr " + (p.c || "c1"), p.label));
    });
    wrap.appendChild(cell);
  });
  return wrap;
}
function row(name, vals, extra) {
  var r = { name: name, vals: vals.slice() };
  if (extra) for (var k in extra) r[k] = extra[k];
  return r;
}
function renderRows(view, stage) {
  stage.textContent = "";
  (view.rows || []).forEach(function (row) {
    var line = document.createElement("div");
    line.style.cssText = "display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:10px 0;position:relative;padding-top:40px";
    line.appendChild(el("span", "dk-var", row.name));
    (row.vals || []).forEach(function (v, i) {
      var st = (row.st && row.st[i]) || "";
      var cell = el("div", "dk-cell" + (st ? " " + st : ""), String(v));
      if (row.ptrs) row.ptrs.forEach(function (p) {
        if (p.i === i) cell.appendChild(el("span", "dk-ptr " + (p.c || "c1"), p.label));
      });
      line.appendChild(cell);
      if (i < row.vals.length - 1) line.appendChild(el("span", "dk-arrow", "→"));
    });
    if (row.tail) line.appendChild(el("span", "dk-note", row.tail));
    stage.appendChild(line);
  });
  if (view.note) stage.appendChild(el("div", "dk-note", view.note));
}

var DEMOS = {

  "0215": { no: "215", title: "数组中的第K个最大元素", tag: "堆 · 快速选择",
    example: "输入：nums = [3,2,1,5,6,4]，k = 2　输出：5",
    build: function (ctx) {
      var nums = [3, 2, 1, 5, 6, 4];
      var k = 2;
      var targetIdx = k - 1;    // 降序第 k-1（升序排后第 n-k）
      ctx.step("快速选择：partition 后若基准落在第 k 位直接得到答案；平均 O(n)，不必全排序", { rows: [row("nums", nums)] });
      var lo = 0, hi = nums.length - 1;
      function partition(lo, hi) {
        var pivot = nums[lo];
        var i = lo, j = hi;
        ctx.step("基准 pivot = " + pivot + "（区间 [" + lo + "," + hi + "]），i/j 相向移动", { rows: [
          row("nums", nums, { st: st1(lo, "hot"), ptrs: [{ i: lo, label: "pivot", c: "c4" }, { i: i, label: "i", c: "c1" }, { i: j, label: "j", c: "c2" }] }) ] });
        while (i < j) {
          while (i < j && nums[j] <= pivot) j--;
          while (i < j && nums[i] >= pivot) i++;
          if (i < j) {
            var t = nums[i]; nums[i] = nums[j]; nums[j] = t;

          row("nums", nums, { st: mergeSt(st1(i, "target"), st1(lo, "dim")), ptrs: [{ i: i, label: "第k位?", c: "c3" }] }) ] });

      }
      for (var guard = 0; guard < 10; guard++) {

        if (pos === targetIdx) {

        if (pos < targetIdx) { lo = pos + 1; ctx.step("基准在 " + pos + " < 目标 " + targetIdx + " → 右半继续", { rows: [row("nums", nums, { st: st1(lo, "hot") })] }); }
        else { hi = pos - 1; ctx.step("基准在 " + pos + " > 目标 " + targetIdx + " → 左半继续", { rows: [row("nums", nums, { st: st1(hi, "hot") })] }); }
      }
    },
    render: renderRows },

  "0347": { no: "347", title: "前 K 个高频元素", tag: "堆 · 计数 + 桶排序",

      var result = [];
      for (var f = buckets.length - 1; f >= 0 && result.length < k; f--) {

            row("数字", Object.keys(count).map(Number), { st: (function () { var m = {}; Object.keys(count).forEach(function (n) { if (count[n] === f) m[count[n]] = "hot"; }); return m; })() }),

        }

      ctx.step("完成！前 " + k + " 个高频元素 = [" + result.join(",") + "]（桶排序 O(n)，比堆更省）", { rows: [
        row("结果", result, { st: st1(result.length - 1, "target") }) ] });
    },
    render: renderRows },

  "0207": { no: "207", title: "课程表", tag: "图 · 拓扑排序（Kahn）",
    example: "输入：numCourses = 4，prerequisites = [[1,0],[2,1],[3,2]]　输出：true（修课链 0→1→2→3）",
    build: function (ctx) {
      var n = 4;
      var prereq = [[1, 0], [2, 1], [3, 2]];
      var indeg = [], adj = [];
      for (var i = 0; i < n; i++) { indeg.push(0); adj.push([]); }
      prereq.forEach(function (p) { adj[p[1]].push(p[0]); indeg[p[0]]++; });
      var queue = [];
      for (var i = 0; i < n; i++) if (indeg[i] === 0) queue.push(i);
      ctx.step("构建邻接表与入度表；入度为 0 的课程可以立刻修（队列 [" + queue.join(",") + "]）",
        { rows: [row("课程", [0, 1, 2, 3], { st: (function () { var m = {}; queue.forEach(function (q) { m[q] = "hot"; }); return m; })() })], note: "入度：" + JSON.stringify(indeg) + "（依赖几门课）" });
      var taken = 0, order = [];
      while (queue.length) {
        var cur = queue.shift();
        taken++; order.push(cur);
        ctx.step("修课程 " + cur + "（已修 " + taken + "/" + n + "）；它解锁的后继课程入度 -1",
          { rows: [row("课程", [0, 1, 2, 3], { st: (function () { var m = {}; m[cur] = "write"; return m; })() })], note: "已修顺序：" + order.join(" → ") });
        adj[cur].forEach(function (next) {
          indeg[next]--;
          if (indeg[next] === 0) { queue.push(next); ctx.step("课程 " + next + " 的先修全部完成 → 入度归 0，入队", { rows: [row("课程", [0, 1, 2, 3], { st: st1(next, "hot") })] }); }
        });
      }
      ctx.step(taken === n ? "全部 " + n + " 门课修完 → 无环，可以完成 ✓" : "只修了 " + taken + " 门 → 有环！返回 false", { rows: [
        row("课程", [0, 1, 2, 3], { st: (function () { var m = {}; for (var k = 0; k < taken; k++) m[order[k]] = "done"; return m; })() }) ] });
    },
    render: renderRows },

  "0438": { no: "438", title: "找到字符串中所有字母异位词", tag: "滑窗 · 定长窗口计数",
    example: "输入：s = \"cbaebabacd\"，p = \"abc\"　输出：[0, 6]",
    build: function (ctx) {
      var s = "cbaebabacd", p = "abc";
      var need = {}, win = {};
      p.split("").forEach(function (c) { need[c] = (need[c] || 0) + 1; });
      var wlen = p.length, left = 0, right = 0, valid = 0, result = [];
      var keys = Object.keys(need);
      function winStr() { return s.slice(Math.max(0, right - wlen), right); }
      ctx.step("窗口长度固定为 p 的长度 " + wlen + "：right 扩张，窗口超长收缩 left；窗口内计数与 need 完全一致即命中",
        { rows: [row("s", s.split(""), { st: st1(0, "hot") })], note: "need: a=1, b=1, c=1" });
      for (right = 0; right < s.length; right++) {

        if (need[ch] !== undefined) {
          win[ch] = (win[ch] || 0) + 1;
          if (win[ch] === need[ch]) valid++;
        }
        if (right - left + 1 > wlen) {
          var out = s[left];
          if (need[out] !== undefined && win[out] === need[out]) valid--;
          if (win[out] !== undefined) win[out]--;
          left++;
        }
        var l = Math.max(0, left);
        ctx.step("right=" + right + "（'" + ch + "'）：窗口 \"" + s.slice(Math.max(0, left), right + 1) + "\"，满足条件的字符种数 " + valid + "/" + keys.length,
          { rows: [row("s", s.split(""), { st: (function () { var m = {}; for (var k = Math.max(0, left); k <= right; k++) m[k] = k === right ? "hot" : "cmp"; return m; })() })], note: "窗口 \"" + s.slice(Math.max(0, left), right + 1) + "\" · valid " + valid + "/" + keys.length });
        if (valid === keys.length) {
          result.push(left);
          ctx.step("✓ 窗口 \"" + s.slice(left, right + 1) + "\" 是 \"" + p + "\" 的异位词 → 记录起始下标 " + left,
            { rows: [row("s", s.split(""), { st: (function () { var m = {}; for (var k = left; k <= right; k++) m[k] = "target"; return m; })() })], note: "命中下标 " + left } );
        }
      }
      ctx.step("完成！所有异位词起始下标 = [" + result.join(", ") + "]", { rows: [row("结果", result.map(function (x) { return "s[" + x + "]"; }), { st: st1(result.length - 1, "target") })] });
    },

  "0131": { no: "131", title: "分割回文串", tag: "回溯 · 决策树 + 剪枝",
    example: "输入：s = \"aab\"　输出：[[\"a\",\"a\",\"b\"],[\"aa\",\"b\"]]",
    build: function (ctx) {
      var s = "aab";
      var path = [], results = [];
      function isPal(l, r) { while (l < r) { if (s[l] !== s[r]) return false; l++; r--; } return true; }
      var nodeCount = 0;
      function backtrack(start) {
        if (start === s.length) {
          results.push(path.slice());
          ctx.step("✓ 到达叶子：切分方案 " + JSON.stringify(path.slice()), { rows: [
            row("路径", path.slice(), { st: st1(path.length - 1, "target") }) ], note: "已收集方案数：" + results.length });
          return;
        }
        for (var end = start + 1; end <= s.length; end++) {
          var piece = s.slice(start, end);
          if (!isPal(start, end - 1)) {
            ctx.step("剪枝：\"" + piece + "\" 不是回文 → 整个分支丢弃", { rows: [
              row("已选路径", path.slice().concat([piece + "✗"]), { st: st1(path.length, "swap") }) ], note: "当前路径：" + JSON.stringify(path) });
            continue;
          }
          path.push(piece);
          ctx.step("选择 \"" + piece + "\"（是回文 ✓）→ 递归剩余 \"" + s.slice(end) + "\"", { rows: [
            row("已选路径", path.slice(), { st: st1(path.length - 1, "hot") }) ], note: "当前路径：" + JSON.stringify(path) });
          backtrack(end);
          path.pop();
          ctx.step("撤销 \"" + piece + "\"，尝试下一切分点", { rows: [
            row("已选路径", path.slice(), { st: st1(path.length - 1, "dim") }) ], note: "当前路径：" + JSON.stringify(path) });
        }
      }
      ctx.step("回溯 = 决策树遍历：每层决定“下一个切分点”，非回文前缀直接剪枝", { rows: [row("s", s.split(""), { st: null })] });
      backtrack(0);
      ctx.step("完成！共 " + results.length + " 种切分方案：" + JSON.stringify(results), { rows: [
        row("结果数", [results.length], { st: st1(0, "target") }) ] });
    },
    render: renderRows }
};

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });

    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
