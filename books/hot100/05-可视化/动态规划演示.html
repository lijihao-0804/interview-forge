<script>
/* ===== 动态规划演示：10 道题 · 表格逐格填充视图 =====
 * view = { table: [ [ {v, st} ] 或 [值] ], cols, rowLabels, colLabels, hl:{r,c}, note }
 */
var el = DemoKit.el;

function renderTable(view, stage) {
  var t = view.table;
  var tbl = document.createElement("table");
  tbl.style.cssText = "border-collapse:separate;border-spacing:5px";
  for (var r = 0; r < t.length; r++) {
    var tr = document.createElement("tr");
    for (var c = 0; c < t[r].length; c++) {
      var cell = t[r][c];
      var v = (cell && typeof cell === "object") ? cell.v : cell;
      var st = (cell && typeof cell === "object") ? cell.st : null;
      var td = el("td", "dk-cell" + (st ? " " + st : ""), v === undefined || v === null ? "·" : String(v));
      td.style.minWidth = "46px";
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  stage.textContent = "";
  stage.appendChild(tbl);
  if (view.note) stage.appendChild(el("div", "dk-note", view.note));
}

var DEMOS = {

  "0070": { no: "70", title: "爬楼梯", tag: "DP · 斐波那契",
    example: "输入：n = 5（每次爬 1 或 2 个台阶）　输出：8",
    sizes: [{ label: "n = 3", n: 3 }, { label: "n = 5（示例 1）", n: 5 }, { label: "n = 10", n: 10 }],
    defaultSize: 1,
    build: function (ctx, size) {
      var n = (size && size.n) || 5;
      var dp = [0];
      dp[1] = 1; if (n >= 2) dp[2] = 2;
      ctx.step("dp[i] = 到达第 i 阶的方法数：dp[i] = dp[i-1] + dp[i-2]（最后一步跨 1 或 2 阶）",
        { table: [dp.map(function (v, i) { return { v: i === 0 ? "—" : v, st: null }; })] });
      for (var i = 3; i <= n; i++) {
        dp[i] = dp[i - 1] + dp[i - 2];
        ctx.step("dp[" + i + "] = dp[" + (i - 1) + "] + dp[" + (i - 2) + "] = " + dp[i - 1] + " + " + dp[i - 2] + " = " + dp[i],
          { table: [dp.map(function (v, k) { return { v: k === 0 ? "—" : v, st: k === i ? "hot" : k < i ? "done" : null }; })] });
      }
      ctx.step("完成！爬 " + n + " 阶共有 " + dp[n] + " 种方法（就是斐波那契数列）", { table: [dp.map(function (v, k) { return { v: k === 0 ? "—" : v, st: k === n ? "target" : "done" }; })] });
    },
    render: renderTable },

  "0118": { no: "118", title: "杨辉三角", tag: "DP · 递推构造",
    example: "输入：numRows = 5",
    sizes: [{ label: "5 行（示例 1）", n: 5 }, { label: "7 行", n: 7 }, { label: "9 行", n: 9 }],
    defaultSize: 0,
    build: function (ctx, size) {
      var n = (size && size.n) || 5;
      var tri = [];
      for (var r = 0; r < n; r++) {
        var row = [];
        for (var c = 0; c <= r; c++) {
          row.push(c === 0 || c === r ? { v: 1, st: "write" } : { v: (tri[r - 1][c - 1].v || 0) + (tri[r - 1][c].v || 0), st: "hot" });
        }
        row = row.map(function (x) { return { v: x.v, st: x.st === "hot" ? "write" : "hot" }; });
        tri.push(row);
        ctx.step("第 " + (r + 1) + " 行：两端为 1，中间 = 上一行左右之和", { table: tri.map(function (rw) { return rw.map(function (x) { return { v: x.v, st: null }; }); }) });
      }
      ctx.step("完成！" + n + " 行杨辉三角（每个数 = 上一行左右两数之和）", { table: tri });
    },
    render: renderTable },

  "0139": { no: "139", title: "单词拆分", tag: "DP · 可达性",
    example: "输入：s = \"leetcode\"，wordDict = [\"leet\", \"code\"]　输出：true",
    build: function (ctx) {
      var s = "leetcode", dict = ["leet", "code"];
      var dp = [true];
      for (var i = 1; i <= s.length; i++) {
        dp[i] = false;
        for (var j = 0; j < i; j++) {
          if (dp[j] && dict.indexOf(s.slice(j, i)) >= 0) {
            dp[i] = true;
            ctx.step("dp[" + i + "]：s[0.." + i + ") 能拆（dp[" + j + "] 为真 且 \"" + s.slice(j, i) + "\" 在字典中）", { table: [dp.map(function (v, k) { return { v: v ? "✓" : "✗", st: k === i ? "target" : k === j ? "hot" : k < i ? "done" : null }; })] });
            break;
          }
        }
        if (!dp[i]) ctx.step("dp[" + i + "]：找不到可行的拆分点 → false", { table: [dp.map(function (v, k) { return { v: v ? "✓" : "✗", st: k === i ? "swap" : k < i ? "done" : null }; })] });
      }
      ctx.step(dp[s.length] ? "完成！s 可以拆分为字典单词" : "无法拆分", { table: [dp.map(function (v) { return { v: v ? "✓" : "✗", st: null }; })] });
    },
    render: renderTable },

  "0152": { no: "152", title: "乘积最大子数组", tag: "DP · 正负双状态",
    example: "输入：nums = [2,3,-2,4]　输出：6",
    build: function (ctx) {
      var nums = [2, 3, -2, 4];
      var maxP = nums[0], minP = nums[0], ans = nums[0];
      var mx = [nums[0]], mn = [nums[0]];
      for (var i = 1; i < nums.length; i++) {
        var x = nums[i];
        var cands = [x, maxP * x, minP * x];
        maxP = Math.max.apply(null, cands);
        minP = Math.min.apply(null, cands);
        mx.push(maxP); mn.push(minP);
        ans = Math.max(ans, maxP);
        ctx.step("x=" + x + "：max = max(x, 上一max×x, 上一min×x) = " + maxP + "（负数×负数可能翻正！），min = " + minP + "，ans = " + ans,
          { table: [mx.map(function (v) { return { v: v }; }), mn.map(function (v) { return { v: v }; })], note: "第一行 max[i]，第二行 min[i]" });
      }
      ctx.step("完成！最大乘积子数组 = " + ans, { table: [mx.map(function (v) { return { v: v, st: null }; })] });
    },
    render: renderTable },

  "0198": { no: "198", title: "打家劫舍", tag: "DP · 不相邻选取",
    example: "输入：nums = [2,7,9,3,1]　输出：12",
    build: function (ctx) {
      var nums = [2, 7, 9, 3, 1];
      var dp = [nums[0]];
      dp[1] = Math.max(nums[0], nums[1]);
      ctx.step("dp[0] = 2；dp[1] = max(2, 7) = 7（相邻不能都偷）", { table: [dp.map(function (v) { return { v: v, st: "write" }; }), nums.map(function (v) { return { v: v, st: null }; })] });
      for (var i = 2; i < nums.length; i++) {
        dp[i] = Math.max(dp[i - 1], dp[i - 2] + nums[i]);
        ctx.step("dp[" + i + "] = max(不偷 dp[" + (i - 1) + "]=" + dp[i - 1] + "，偷 dp[" + (i - 2) + "]+" + nums[i] + "=" + (dp[i - 2] + nums[i]) + ") = " + dp[i],
          { table: [dp.map(function (v, k) { return { v: v, st: k === i ? "hot" : k < i ? "done" : null }; }), nums.map(function (v, k) { return { v: v, st: k === i ? "cmp" : null }; })] });
      }
      ctx.step("完成！能偷到的最高金额 = " + dp[nums.length - 1], { table: [dp.map(function (v) { return { v: v, st: null }; }), nums.map(function (v) { return { v: v, st: null }; })] });
    },
    render: renderTable },

  "0279": { no: "279", title: "完全平方数", tag: "DP · 完全背包",
    example: "输入：n = 12　输出：3（12 = 4 + 4 + 4）",
    build: function (ctx) {
      var n = 12;
      var dp = [0];
      for (var i = 1; i <= n; i++) dp[i] = Infinity;
      for (var i = 1; i <= n; i++) {
        for (var s = 1; s * s <= i; s++) {
          dp[i] = Math.min(dp[i], dp[i - s * s] + 1);
          ctx.step("dp[" + i + "]：尝试 " + (s * s) + "（dp[" + (i - s * s) + "] + 1 = " + (dp[i - s * s] + 1) + "）→ 当前最小 " + dp[i],
            { table: [dp.map(function (v, k) { return { v: v === Infinity ? "∞" : v, st: k === i ? "hot" : k < i ? "done" : null }; })] });
        }
      }
      ctx.step("完成！12 = 4 + 4 + 4 → 最少 3 个完全平方数", { table: [dp.map(function (v) { return { v: v, st: null }; })] });
    },
    render: renderTable },

  "0300": { no: "300", title: "最长递增子序列", tag: "DP · O(n²) 经典",
    example: "输入：nums = [10,9,2,5,3,7,101,18]　输出：4（[2,3,7,101] 或 [2,5,7,101]）",
    build: function (ctx) {
      var nums = [10, 9, 2, 5, 3, 7, 101, 18];
      var dp = [];
      for (var i = 0; i < nums.length; i++) {
        dp[i] = 1;
        for (var j = 0; j < i; j++) {
          if (nums[j] < nums[i]) dp[i] = Math.max(dp[i], dp[j] + 1);
        }
        ctx.step("dp[" + i + "]（" + nums[i] + "）：扫前面所有比它小的，取最大 dp+1 → " + dp[i],
          { table: [dp.map(function (v, k) { return { v: v, st: k === i ? "hot" : k < i ? "done" : null }; }), nums.map(function (v, k) { return { v: v, st: k === i ? "cmp" : null }; })] });
      }
      var ans = Math.max.apply(null, dp);
      ctx.step("完成！LIS 长度 = " + ans + "（答案不一定在 dp 末尾，取全局 max）", { table: [dp.map(function (v, k) { return { v: v, st: v === ans ? "target" : null }; }), nums.map(function (v) { return { v: v, st: null }; })] });
    },
    render: renderTable },

  "0322": { no: "322", title: "零钱兑换", tag: "DP · 完全背包",
    example: "输入：coins = [1, 2, 5]，amount = 11　输出：3（5+5+1）",
    build: function (ctx) {
      var coins = [1, 2, 5], amount = 11;
      var dp = [0];
      for (var i = 1; i <= amount; i++) dp[i] = Infinity;
      for (var i = 1; i <= amount; i++) {
        for (var c = 0; c < coins.length; c++) {
          var coin = coins[c];
          if (coin <= i && dp[i - coin] + 1 < dp[i]) {
            dp[i] = dp[i - coin] + 1;
            ctx.step("dp[" + i + "]：用面值 " + coin + "（dp[" + (i - coin) + "] + 1 = " + dp[i] + "）→ 当前最少 " + dp[i] + " 枚",
              { table: [dp.map(function (v, k) { return { v: v === Infinity ? "∞" : v, st: k === i ? "hot" : k < i ? "done" : null }; })] });
          }
        }
        if (dp[i] === Infinity) ctx.step("dp[" + i + "] = ∞（凑不出来）", { table: [dp.map(function (v, k) { return { v: v === Infinity ? "∞" : v, st: null }; })] });
      }
      ctx.step("完成！凑出 " + amount + " 最少需要 " + dp[amount] + " 枚硬币（5+5+1）", { table: [dp.map(function (v) { return { v: v === Infinity ? "∞" : v, st: null }; })] });
    },
    render: renderTable },

  "0005": { no: "5", title: "最长回文子串", tag: "DP · 区间 DP",
    example: "输入：s = \"babad\"　输出：\"bab\"（\"aba\" 也合法）",
    build: function (ctx) {
      var s = "babad", n = s.length;
      var dp = [];
      for (var i = 0; i < n; i++) { dp.push([]); for (var j = 0; j < n; j++) dp[i].push({ v: i === j ? "✓" : "·" }); }
      var bestL = 0, bestLen = 1;
      ctx.step("dp[i][j] = s[i..j] 是否回文。先填单字符（全 ✓）", { table: dp });
      for (var i = 0; i + 1 < n; i++) {
        if (s[i] === s[i + 1]) { dp[i][i + 1] = { v: "✓", st: "write" }; if (2 > bestLen) { bestL = i; bestLen = 2; } }
      }
      ctx.step("再填相邻相同的长 2 子串", { table: dp });
      for (var len = 3; len <= n; len++) {
        for (var i = 0; i + len - 1 < n; i++) {
          var j = i + len - 1;
          var pal = s[i] === s[j] && dp[i + 1][j - 1].v === "✓";
          dp[i][j] = { v: pal ? "✓" : "✗" };
          if (pal) {
            ctx.step("s[" + i + ".." + j + "]=\"" + s.slice(i, j + 1) + "\"：首尾相等 且 内部回文 → 回文！长度 " + len,
              { table: dp.map(function (row, r) { return row.map(function (x, c) { return { v: x.v, st: (r === i || r === j || (r > i && r < j)) ? "write" : null }; }); }) });
            if (len > bestLen) { bestL = i; bestLen = len; }
          }
        }
      }
      ctx.step("完成！最长回文子串 = \"" + s.slice(bestL, bestL + bestLen) + "\"（长度 " + bestLen + "）", { table: dp });
    },
    render: renderTable },

  "0064": { no: "64", title: "最小路径和", tag: "DP · 网格",
    example: "输入：grid = [[1,3,1],[1,5,1],[2,4,1]]　输出：7（右→右→下→下→左…即 1→3→1→1→1）",
    build: function (ctx) {
      var g = [[1, 3, 1], [1, 5, 1], [2, 4, 1]];
      var dp = [];
      for (var i = 0; i < g.length; i++) dp.push(g[i].map(function () { return { v: "·" }; }));
      dp[0][0] = { v: g[0][0], st: "hot" };
      ctx.step("起点 dp[0][0] = " + g[0][0], { table: dp.map(function (r) { return r.map(function (x) { return { v: x.v }; }); }) });
      for (var c = 1; c < g[0].length; c++) {
        dp[0][c] = { v: dp[0][c - 1].v + g[0][c] };
        ctx.step("首行只能向右：dp[0][" + c + "] = " + dp[0][c].v, { table: dp });
      }
      for (var r = 1; r < g.length; r++) {
        dp[r][0] = { v: dp[r - 1][0].v + g[r][0] };
        ctx.step("首列只能向下：dp[" + r + "][0] = " + dp[r][0].v, { table: dp });
      }
      for (var r = 1; r < g.length; r++) {
        for (var c = 1; c < g[0].length; c++) {
          dp[r][c] = { v: Math.min(dp[r - 1][c].v, dp[r][c - 1].v) + g[r][c] };
          ctx.step("dp[" + r + "][" + c + "] = min(上 " + dp[r - 1][c].v + "，左 " + dp[r][c - 1].v + ") + " + g[r][c] + " = " + dp[r][c].v,
            { table: dp });
        }
      }
      ctx.step("完成！右下角 = 最小路径和 " + dp[g.length - 1][g[0].length - 1], { table: dp });
    },
    render: renderTable }
};

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
