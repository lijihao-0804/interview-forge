<script>
/* ===== 矩阵演示：4 道题 ===== */
var el = DemoKit.el;

function renderGrid(view, stage) {
  var g = view.grid, st = view.st || {};
  var tbl = el("table");
  tbl.style.cssText = "border-collapse:separate;border-spacing:6px";
  for (var r = 0; r < g.length; r++) {
    var tr = el("tr");
    for (var c = 0; c < g[r].length; c++) {
      var cell = el("td", "dk-cell" + ((st[r] && st[r][c]) ? " " + st[r][c] : ""), String(g[r][c]));
      cell.style.minWidth = "44px"; cell.style.textAlign = "center"; cell.style.padding = "9px 7px";
      tr.appendChild(cell);
    }
    tbl.appendChild(tr);
  }
  stage.textContent = "";
  stage.appendChild(tbl);
  if (view.note) stage.appendChild(el("div", "dk-note", view.note));
}
function stOf(fn) {
  var m = [];
  return m;
}
function makeSt(rows, cols, fn) {
  var m = [];
  for (var r = 0; r < rows; r++) { m.push([]); for (var c = 0; c < cols; c++) m[r].push(fn ? fn(r, c) : null); }
  return m;
}

var DEMOS = {

  "0048": { no: "48", title: "旋转图像", tag: "矩阵 · 原地旋转（转置 + 行翻转）",
    example: "输入：matrix = [[1,2,3],[4,5,6],[7,8,9]]　输出：顺时针旋转 90°",
    sizes: [{ label: "3×3（示例 1）", n: 3 }, { label: "4×4（更深）", n: 4 }],
    defaultSize: 0,
    build: function (ctx, size) {
      var n = (size && size.n) || 3;
      var g = [];
      var v = 1;
      for (var r = 0; r < n; r++) { g.push([]); for (var c = 0; c < n; c++) g[r].push(v++); }
      ctx.step("n = " + n + "。顺时针旋转 = 先转置（沿主轴翻转）再每行左右翻转", { grid: g });
      for (var r = 0; r < n; r++) {
        for (var c = r + 1; c < n; c++) {
          var t = g[r][c]; g[r][c] = g[c][r]; g[c][r] = t;
        }
      }
      var stT = makeSt(n, n, function (r, c) { return r === c ? "write" : r < c ? "hot" : null; });
      ctx.step("① 转置完成：g[r][c] ↔ g[c][r]（沿对角线镜像）", { grid: g, st: stT });
      for (var r = 0; r < n; r++) {
        g[r].reverse();
      }
      var stR = makeSt(n, n, function (r, c) { return "write"; });
      ctx.step("② 每行左右翻转完成 → 顺时针旋转 90° ✓", { grid: g, st: stR });
      ctx.step("验证：原第一列 [" + [1, 4, 7].slice(0, n).join(",") + "] 变成第一行 ✓（n = " + n + " 同理）", { grid: g, st: makeSt(n, n, function (r, c) { return "done"; }) });
    },
    render: renderGrid },

  "0054": { no: "54", title: "螺旋矩阵", tag: "矩阵 · 边界收缩",
    example: "输入：matrix = [[1,2,3],[4,5,6],[7,8,9]]　输出：[1,2,3,6,9,8,7,4,5]",
    sizes: [{ label: "3×3（示例 1）", rows: 3, cols: 3 }, { label: "3×4（更深）", rows: 3, cols: 4 }, { label: "4×4", rows: 4, cols: 4 }],
    defaultSize: 0,
    build: function (ctx, size) {
      var R = (size && size.rows) || 3, C = (size && size.cols) || 3;
      var g = [], v = 1;
      for (var r = 0; r < R; r++) { g.push([]); for (var c = 0; c < C; c++) g[r].push(v++); }
      var top = 0, bottom = R - 1, left = 0, right = C - 1;
      var order = [];
      ctx.step("四个边界 l/r/t/b，按 右→下→左→上 顺时针绕圈，绕完收缩边界", { grid: g });
      var guard = 0;
      while (top <= bottom && left <= right && guard++ < 50) {
        for (var c = left; c <= right; c++) order.push(g[top][c]);
        top++;
        ctx.step("上边界向右扫 → " + order.join(","), { grid: g, st: (function () { var m = makeSt(R, C); for (var c = left; c < right + 1 && c < C; c++) if (c <= right) { try { if (g[top - 1] && c < C) m[top - 1][c] = "write"; } catch (e) {} } return m; })() });
        for (var r = top; r <= bottom; r++) order.push(g[r][right]);
        right--;
        ctx.step("右边界向下扫 → " + order.join(","), { grid: g, st: (function () { var m = makeSt(R, C); for (var rr = top; rr <= bottom; rr++) if (right + 1 < C) m[rr][right + 1] = "write"; return m; })() });
        if (top <= bottom) {
          for (var c = right; c >= left; c--) order.push(g[bottom][c]);
          bottom--;
          ctx.step("下边界向左扫 → " + order.join(","), { grid: g, st: (function () { var m = makeSt(R, C); for (var c = left; c <= right + 1 && c < C; c++) if (bottom + 1 < R) m[bottom + 1][c] = "write"; return m; })() });
        }
        if (left <= right) {
          for (var r = bottom; r >= top; r--) order.push(g[r][left]);
          left++;
          ctx.step("左边界向上扫 → " + order.join(","), { grid: g, st: (function () { var m = makeSt(R, C); for (var rr = top; rr <= bottom + 1 && rr < R; rr++) if (left - 1 >= 0) m[rr][left - 1] = "write"; return m; })() });
        }
      }
      ctx.step("完成！螺旋顺序 = [" + order.join(",") + "]", { grid: g, st: makeSt(R, C, function () { return "done"; }) });
    },
    render: renderGrid },

  "0073": { no: "73", title: "矩阵置零", tag: "矩阵 · 首行首列做标记",
    example: "输入：matrix = [[1,1,1],[1,0,1],[1,1,1]]　输出：[[1,0,1],[0,0,0],[1,0,1]]",
    build: function (ctx) {
      var g = [[1, 1, 1], [1, 0, 1], [1, 1, 1]];
      var M = g.length, N = g[0].length;
      var firstRowZero = false, firstColZero = false;
      for (var c = 0; c < N; c++) if (g[0][c] === 0) firstRowZero = true;
      for (var r = 0; r < M; r++) if (g[r][0] === 0) firstColZero = true;
      ctx.step("用第一行/第一列做标记位（O(1) 额外空间）。先记下首行首列自身是否含 0", { grid: g });
      for (var r = 1; r < M; r++) for (var c = 1; c < N; c++) {
        if (g[r][c] === 0) { g[0][c] = 0; g[r][0] = 0; }
      }
      ctx.step("扫描内部：凡 0，就在其第一行/第一列打标记", { grid: g, st: (function () { var m = makeSt(M, N, function (r, c) { return (r === 0 || c === 0) ? "cmp" : null; }); return m; })() });
      for (var r = 1; r < M; r++) for (var c = 1; c < N; c++) {
        if (g[0][c] === 0 || g[r][0] === 0) g[r][c] = 0;
      }
      ctx.step("按标记清零内部", { grid: g });
      if (firstRowZero) for (var c = 0; c < N; c++) g[0][c] = 0;
      if (firstColZero) for (var r = 0; r < M; r++) g[r][0] = 0;
      ctx.step("最后处理首行首列自身 → 完成", { grid: g, st: makeSt(M, N, function () { return "done"; }) });
    },
    render: renderGrid },

  "0240": { no: "240", title: "搜索二维矩阵 II", tag: "矩阵 · 右上角阶梯搜索",
    example: "输入：matrix（5×5 见视图），target = 5　输出：true",
    build: function (ctx) {
      var g = [[1, 4, 7, 11, 15], [2, 5, 8, 12, 19], [3, 6, 9, 16, 22], [10, 13, 14, 17, 24], [18, 21, 23, 26, 30]];
      var target = 5;
      var r = 0, c = g[0].length - 1;
      ctx.step("从右上角出发：当前值 > target 删一列，< target 删一行——每一步都排除整行/列", { grid: g, st: makeSt(g.length, g[0].length, function (r, c) { return "dim"; }) });
      var steps = 0;
      while (r < g.length && c >= 0 && steps++ < 30) {
        var val = g[r][c];
        var stM = makeSt(g.length, g[0].length, function () { return "dim"; });
        stM[r][c] = "hot";
        if (val === target) {
          stM[r][c] = "target";
          ctx.step("(" + r + "," + c + ") = " + val + " → 找到 " + target + " ✓", { grid: g, st: stM });
          return;
        }
        ctx.step("(" + r + "," + c + ") = " + val + (val > target ? " > " : " < ") + target + " → " + (val > target ? "左移 c--" : "下移 r++"),
          { grid: g, st: stM });
        if (val > target) c--; else r++;
      }
      ctx.step("越界 → 未找到", { grid: g, st: makeSt(g.length, g[0].length, function () { return "dim"; }) });
    },
    render: renderGrid }
};

(function () {
  var params = new URLSearchParams(location.search);
  var keys = Object.keys(DEMOS);
  var bar = document.createElement("div");
  bar.className = "dk-bar";
  bar.style.marginBottom = "14px";
  var label = document.createElement("span");
  label.className = "dk-var";
  label.textContent = "选择题目";
  bar.appendChild(label);
  var sel = document.createElement("select");
  sel.className = "dk-select";
  keys.forEach(function (k) {
    var d = DEMOS[k];
    var o = document.createElement("option");
    o.value = k;
    o.textContent = (d.no ? d.no + ". " : "") + d.title;
    sel.appendChild(o);
  });
  bar.appendChild(sel);
  if (params.get("embed") === "1") bar.style.display = "none";
  document.getElementById("app").parentNode.insertBefore(bar, document.getElementById("app"));
  function mountDemo(key) {
    var d = DEMOS[key];
    document.title = (d.no ? d.no + ". " : "") + d.title + " · 动画演示";
    DemoKit.mount({
      no: d.no, title: d.title, tag: d.tag, example: d.example,
      sizes: d.sizes, defaultSize: d.defaultSize,
      build: d.build, render: d.render
    });
  }
  var want = params.get("mode");
  if (want && DEMOS[want]) { sel.value = want; mountDemo(want); }
  else mountDemo(keys[0]);
})();
</script>

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
