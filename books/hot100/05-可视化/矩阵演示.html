--dk-ok:#79d8a8;--dk-warn:#ffc174;--dk-err:#ff969d}
html[data-theme="light"]{--dk-bg:#f4f6fb;--dk-panel:#ffffff;--dk-soft:#f6f7fb;--dk-text:#1b2434;--dk-muted:#68758c;
--dk-line:#dfe4ee;--dk-brand:#5654d4;--dk-brand-strong:#4543bd;--dk-brand-soft:#eeedff;
--dk-ok:#157a52;--dk-warn:#a85b00;--dk-err:#b3372f}}
html[data-theme="dark"]{--dk-bg:#0f131b;--dk-panel:#181e29;--dk-soft:#141a24;--dk-text:#eaf0fa;
--dk-muted:#9aa6ba;--dk-line:#313b4c;--dk-brand:#b1afff;--dk-brand-strong:#c4c2ff;--dk-brand-soft:#292955;
--dk-ok:#79d8a8;--dk-warn:#ffc174;--dk-err:#ff969d}
@font-face{font-family:"Inter";src:url("../../assets/fonts/Inter-Variable.woff2") format("woff2");
font-weight:100 900;font-style:normal;font-display:swap;
unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";src:url("../../assets/fonts/JetBrainsMono-Variable.woff2") format("woff2");
font-weight:100 800;font-style:normal;font-display:swap;
unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
body{font-family:var(--font-sans)!important;background:var(--dk-bg)!important;color:var(--dk-text)!important}
button,input,select,textarea{font-family:var(--font-sans)!important;border-radius:9px!important}
button{border:1px solid var(--dk-line)!important;background:var(--dk-panel)!important;color:var(--dk-text)!important;

button:hover{border-color:var(--dk-brand)!important;color:var(--dk-brand)!important}

background:var(--dk-panel)!important;color:var(--dk-text)!important;padding:5px 9px}
table{border-collapse:collapse}
th{background:var(--dk-soft)}
th,td{border-color:var(--dk-line)}

<script id="hot100-embed-bootstrap">
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('embed') !== '1') return;
  document.documentElement.classList.add('hot100-embedded');
  if (params.has('panel')) document.documentElement.classList.add('hot100-single-panel');
})();
</script>

<style id="hot100-polish">
:root {
  color-scheme: light dark;
  --hot-bg: #f4f6fb;
  --hot-surface: #ffffff;
  --hot-surface-soft: #f8f9fd;
  --hot-text: #182235;
  --hot-muted: #66748a;
  --hot-line: #dfe4ee;
  --hot-brand: #5654d4;
  --hot-brand-soft: #eeedff;
  --hot-on-brand: #ffffff;
  --hot-hero-start: #314fc7;
  --hot-hero-end: #5546ca;
  --hot-hero-text: #ffffff;
  --hot-hero-muted: #e7ebff;
  --hot-success: #167a52;
  --hot-success-soft: #def7e9;
  --hot-warning: #934b00;
  --hot-warning-soft: #fff0d8;
  --hot-danger: #b52b3a;
  --hot-danger-soft: #ffe5e9;
  --hot-canvas-bg: #f8fafc;
  --hot-canvas-line: #c9d2df;
  --hot-shadow: 0 12px 34px rgba(33,45,73,.075);
}
@media (prefers-color-scheme: dark) {
  :root {
    --hot-bg: #0f131b;
    --hot-surface: #181e29;
    --hot-surface-soft: #141a24;
    --hot-text: #eaf0fa;
    --hot-muted: #a3afc2;
    --hot-line: #313b4c;
    --hot-brand: #b1afff;
    --hot-brand-soft: #292955;
    --hot-on-brand: #111521;
    --hot-hero-start: #263677;
    --hot-hero-end: #39256f;
    --hot-hero-text: #f8f9ff;
    --hot-hero-muted: #dfe4ff;
    --hot-success: #79d8a8;
    --hot-success-soft: #183c2d;
    --hot-warning: #ffc174;
    --hot-warning-soft: #47311b;
    --hot-danger: #ff9ba6;
    --hot-danger-soft: #47242b;
    /* 旧 Canvas 内部仍使用深色文字，因此绘图区保持柔和浅底以确保可读。 */
    --hot-canvas-bg: #edf2f7;
    --hot-canvas-line: #bac5d2;
    --hot-shadow: 0 16px 42px rgba(0,0,0,.22);
  }
}
* { box-sizing: border-box; }
html { min-width: 0; background: var(--hot-bg) !important; }
body {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 0 34px !important;
  color: var(--hot-text) !important;
  background: radial-gradient(circle at 12% 0%, color-mix(in srgb,var(--hot-brand) 9%,transparent), transparent 34rem), var(--hot-bg) !important;
}
:focus-visible { outline: 3px solid color-mix(in srgb,var(--hot-brand) 48%,transparent) !important; outline-offset: 3px; }
.hot100-topnav {
  width: min(100% - 24px, 1400px);
  margin: 12px auto 16px;
  padding: 10px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--hot-muted);
  background: color-mix(in srgb,var(--hot-surface) 94%,transparent);
  border: 1px solid var(--hot-line);
  border-radius: 13px;
  box-shadow: var(--hot-shadow);
  font: 14px/1.45 system-ui, "Microsoft YaHei", sans-serif;
}
.hot100-topnav .hot100-links { display: flex; gap: 7px; flex-wrap: wrap; }
.hot100-topnav a { padding: 6px 9px; color: var(--hot-brand); background: var(--hot-brand-soft); border-radius: 7px; text-decoration: none; }
.hot100-topnav a:hover { filter: brightness(.97); }
.hot100-topnav strong { min-width: 0; color: var(--hot-text); overflow-wrap: anywhere; }
body > .container, body > .shell, body > main, body > .wrap {
  width: min(100% - 24px, 1400px) !important;
  max-width: 1400px !important;
  margin-left: auto !important;
  margin-right: auto !important;
  padding-bottom: 44px;
}
body > h1, body > h2, body > h3, body > .info, body > .desc, body > .btn-group {
  width: min(100% - 24px, 1400px);
  margin-left: auto !important;
  margin-right: auto !important;
}
canvas, svg, img { max-width: 100% !important; }
button, input, select, textarea { max-width: 100%; }
body h1 {
  margin-top: 0;
  color: var(--hot-text) !important;
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.2;
  letter-spacing: -.02em;
}
body h2 { color: var(--hot-text); line-height: 1.3; }
body h3 { color: var(--hot-text); line-height: 1.4; }
button, input, select, textarea { font: inherit; }
button {
  min-height: 36px;
  padding: 8px 12px;
  color: var(--hot-text);
  background: var(--hot-surface);
  border: 1px solid var(--hot-line) !important;
  border-radius: 9px !important;
  box-shadow: 0 2px 8px rgba(33,45,73,.04);
  transition: transform .16s ease, border-color .16s ease, background-color .16s ease, box-shadow .16s ease;
}
button:hover:not(:disabled) {
  border-color: color-mix(in srgb,var(--hot-brand) 42%,var(--hot-line)) !important;
  background: color-mix(in srgb,var(--hot-brand-soft) 58%,var(--hot-surface));
  box-shadow: 0 5px 14px rgba(33,45,73,.08);
  transform: translateY(-1px);
}
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { opacity: .52; cursor: not-allowed; box-shadow: none; }
button.primary, button.btn-primary, button.btn-apply, .primary, .btn-primary, .btn-apply {
  color: var(--hot-on-brand) !important;
  background: var(--hot-brand) !important;
  border-color: var(--hot-brand) !important;
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), select, textarea {
  min-height: 36px;
  padding: 7px 10px !important;
  color: var(--hot-text) !important;
  background: var(--hot-surface) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 8px !important;
}
input[type="range"] { accent-color: var(--hot-brand); }
.controls, .toolbar, .input-row, .preset-row, .sort-tabs, .ds-tabs, .op-bar, .btn-group, .legend { flex-wrap: wrap !important; }
.controls, .toolbar, .input-row, .preset-row, .op-bar, .btn-group { gap: 9px !important; }
/* 原生实验室也统一成“舞台/状态说明 → 控制条”。历史页面的 toolbar
   有些写在 panel 之前，这里用稳定的视觉顺序兜底；新页面应直接按该顺序写 DOM。 */
body > main.shell { display: flex; flex-direction: column; }
body > main.shell > .panel,
body > main.shell > .layout { order: 20; }
body > main.shell > .toolbar {
  order: 30;
  width: 100%;
  margin: 14px 0 0 !important;

  justify-content: flex-start;
}
.sort-tabs, .ds-tabs {
  display: flex;
  gap: 7px !important;
  margin-block: 18px !important;
  padding: 4px !important;
  background: color-mix(in srgb,var(--hot-surface) 84%,transparent) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 13px !important;
  box-shadow: 0 6px 20px rgba(33,45,73,.045);
}
.sort-tab, .ds-tab, .code-tab, .preset-btn {
  padding: 8px 11px !important;
  color: var(--hot-muted) !important;
  background: transparent !important;
  border: 1px solid transparent !important;
  border-radius: 9px !important;
  cursor: pointer;
  transition: color .16s ease, background-color .16s ease, border-color .16s ease;
}
.sort-tab:hover, .ds-tab:hover, .code-tab:hover, .preset-btn:hover {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;
}
.sort-tab.active, .ds-tab.active, .code-tab.active, .preset-btn.active {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;
  border-color: color-mix(in srgb,var(--hot-brand) 28%,var(--hot-line)) !important;
  box-shadow: 0 3px 10px rgba(33,45,73,.065);
}
.container, .shell, main, .wrap, .content, .layout, .code-section, .vis-section, .content > *, .layout > *, .wrap > * { min-width: 0 !important; }
.vis-canvas-wrap, .panel, .box, .table-responsive, .code-scroll, .notes-section { max-width: 100%; }
.table-responsive, .code-scroll, .notes-section { overflow: auto; }
.panel { overflow: hidden !important; }
.box { overflow: visible; }
.panel, .box {
  color: var(--hot-text);
  background-color: var(--hot-surface) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 15px !important;

}
.code-section { border-color: var(--hot-line) !important; }
.vis-section { background-color: var(--hot-surface-soft) !important; }
.vis-msg, .target-info, .algo-desc, .desc, .status, .log {

  border-color: var(--hot-line) !important;
}
.vis-msg, .target-info, .algo-desc, .desc {

}
.legend {

/* 题头必须使用独立的前景/背景色对；不能继承正文的灰色文字。 */
.panel-header {
  color: var(--hot-hero-text) !important;
  background: linear-gradient(135deg,var(--hot-hero-start),var(--hot-hero-end)) !important;
}
.panel-header h1, .panel-header h2, .panel-header h3 {

}

  overflow-wrap: anywhere;
}
/* 复杂度徽标中的色点不是第二层徽标，避免白块套白块。 */
.complexity .badge-time, .complexity .badge-space {

  border: 0 !important;
  border-radius: 0 !important;
}
/* 动画安全区：标签、指针和高亮不再贴边或被相邻区域裁掉。 */
.lane { min-height: 220px !important; padding: 36px 6px !important; row-gap: 52px !important; overflow: visible !important; }
.lane .label.top { bottom: 66px !important; }
.lane .label.bottom { top: 66px !important; }
.bars { height: 300px !important; padding-top: 38px !important; padding-bottom: 34px !important; overflow: visible !important; }
.bars .col { min-width: 0; }

.hot100-bar-stage {

pre { max-width: 100%; overflow: auto !important; }
table { max-width: 100%; }

@media (prefers-color-scheme: dark) {
  body > .container > h1, body > .shell > h1, body > main > h1, body > h1, body > h2 { color: var(--hot-text) !important; }
  .panel, .box, .code-section, .vis-section, .notes-section, .input-section, .top-tags,

}
/* 状态配色：前景与底色成对定义，避免只改背景造成文字消失。 */

  color: var(--hot-text) !important;

}

.header { color: var(--hot-muted) !important; background: transparent !important; border-color: transparent !important; }

<script>
/* ===== 矩阵演示：4 道题。题例一律打边界，动画逐格推进 ===== */
var el = DemoKit.el;

function makeSt(rows, cols, fn) {
  var m = [];
  for (var r = 0; r < rows; r++) { m.push([]); for (var c = 0; c < cols; c++) m[r].push(fn ? fn(r, c) : null); }
  return m;
}
function clone(g) {
  var m = [];
  for (var r = 0; r < g.length; r++) m.push(g[r].slice());
  return m;
}

function renderGrid(view, stage) {
  var g = view.grid, st = view.st || [];
  stage.textContent = "";
  var box = el("div");
  box.style.cssText = "display:flex;flex-direction:column;gap:10px;align-items:flex-start";

  if (view.vars && view.vars.length) {
    var vb = el("div", "dk-vars");
    vb.style.cssText = "margin:0";
    view.vars.forEach(function (v) {
      var s = el("span", "dk-var");
      s.appendChild(el("b", null, v[0] + "："));
      s.appendChild(document.createTextNode(String(v[1])));
      vb.appendChild(s);
    });
    box.appendChild(vb);
  }

  var tbl = el("table");
  tbl.style.cssText = "border-collapse:separate;border-spacing:6px";
  if (view.axes) {
    var head = el("tr");
    head.appendChild(el("td"));
    for (var c0 = 0; c0 < g[0].length; c0++) {
      var th = el("td", null, "c" + c0);
      th.style.cssText = "font-size:11px;color:var(--dk-muted);text-align:center";
      head.appendChild(th);
    }
    tbl.appendChild(head);
  }
  for (var r = 0; r < g.length; r++) {
    var tr = el("tr");
    if (view.axes) {
      var rh = el("td", null, "r" + r);
      rh.style.cssText = "font-size:11px;color:var(--dk-muted);padding-right:2px";
      tr.appendChild(rh);
    }
    for (var c = 0; c < g[r].length; c++) {
      var cls = (st[r] && st[r][c]) ? " " + st[r][c] : "";
      var cell = el("td", "dk-cell" + cls, String(g[r][c]));
      cell.style.cssText = "min-width:44px;text-align:center;padding:9px 7px";
      // 只有元素两两不同的题（48 旋转）才挂 key，否则重复值会让 FLIP 认错身份。
      if (view.keyed) cell.setAttribute("data-key", "v" + g[r][c]);
      tr.appendChild(cell);
    }
    tbl.appendChild(tr);
  }
  box.appendChild(tbl);

  if (view.out) {
    var ob = el("div");
    ob.style.cssText = "display:flex;gap:5px;align-items:center;flex-wrap:wrap";
    var lab = el("span", null, "输出");
    lab.style.cssText = "font-size:12px;color:var(--dk-muted);margin-right:2px";
    ob.appendChild(lab);
    if (!view.out.length) {
      var em = el("span", null, "（还是空的）");
      em.style.cssText = "font-size:12px;color:var(--dk-muted)";
      ob.appendChild(em);
    }
    view.out.forEach(function (v, i) {
      var chip = el("span", "dk-cell" + (i === view.out.length - 1 ? " hot" : " done"), String(v));
      chip.style.cssText = "min-width:0;padding:4px 8px;font-size:12px";
      ob.appendChild(chip);
    });
    box.appendChild(ob);
  }
  if (view.note) box.appendChild(el("div", "dk-note", view.note));
  stage.appendChild(box);
}

/* ---------- 73 的三组输入：默认那组首行、首列自己就含 0 ---------- */
var M73 = {
  edge:  [[1, 0, 3, 4], [5, 6, 7, 8], [0, 9, 10, 11], [12, 13, 14, 0]],
  inner: [[1, 2, 3, 4], [5, 0, 7, 8], [9, 10, 0, 12], [13, 14, 15, 16]],
  col:   [[1, 2, 3, 4], [0, 6, 7, 8], [9, 10, 11, 12]]
};
function expect73(orig) {
  var M = orig.length, N = orig[0].length, zr = {}, zc = {}, r, c;
  for (r = 0; r < M; r++) for (c = 0; c < N; c++) if (orig[r][c] === 0) { zr[r] = 1; zc[c] = 1; }
  var e = [];
  for (r = 0; r < M; r++) { e.push([]); for (c = 0; c < N; c++) e[r].push((zr[r] || zc[c]) ? 0 : orig[r][c]); }
  return e;
}
function sameGrid(a, b) {
  for (var r = 0; r < a.length; r++) for (var c = 0; c < a[r].length; c++) if (a[r][c] !== b[r][c]) return false;
  return true;
}

/* ---------- 240 的矩阵：行内递增、列内递增 ---------- */

var DEMOS = {

          for (var i = 0; i < f.length; i++) if (f[i] !== i + 1) return false;

        } },

    ],
    compare: {
      label: "错误写法：只转置，忘了翻转每一行",
      build: function (ctx, size) {
        var n = (size && size.n) || 4, r, c, v = 1, g = [];
        for (r = 0; r < n; r++) { g.push([]); for (c = 0; c < n; c++) g[r].push(v++); }
        ctx.step("同一个矩阵，只执行第 ① 步转置", { grid: clone(g), st: makeSt(n, n) });
        for (r = 0; r < n; r++) for (c = r + 1; c < n; c++) { var t = g[r][c]; g[r][c] = g[c][r]; g[c][r] = t; }
        ctx.step("✗ 转置完就收手，得到的是沿主对角线的镜像。第一行成了原第一列「自上而下」，而顺时针旋转要的是「自下而上」——整整差一次左右翻转。",
          { grid: clone(g), st: makeSt(n, n, function (rr) { return rr === 0 ? "swap" : "dim"; }) });

    },
    build: function (ctx, size) {
      var n = (size && size.n) || 4, r, c, v = 1, g = [];
      for (r = 0; r < n; r++) { g.push([]); for (c = 0; c < n; c++) g[r].push(v++); }
      var orig = clone(g), want = [];
      for (r = 0; r < n; r++) { want.push([]); for (c = 0; c < n; c++) want[r].push(orig[n - 1 - c][r]); }

      function V(st, note) {
        return { grid: clone(g), st: st || makeSt(n, n), note: note, keyed: true, want: want, n: n };

          g[r][c] = b; g[c][r] = a;

        ctx.step("② 翻转第 " + r + " 行：[" + g[r].join(",") + "] → [" + g[r].slice().reverse().join(",") + "]", V(stH), { line: [5, 6] });
        g[r].reverse();
        var stW = makeSt(n, n, function (rr) { return rr === cur ? "write" : (rr < cur ? "done" : null); });
        ctx.step("第 " + r + " 行就位", V(stW), { line: 6 });
      }

      var col0 = [];
      for (r = n - 1; r >= 0; r--) col0.push(orig[r][0]);
      ctx.step("完成！校验：原来的第一列自下而上是 [" + col0.join(",") + "]，现在的第一行正是 [" + g[0].join(",") + "] ✓",
        V(makeSt(n, n, function () { return "done"; }), "全程只用了一个临时变量，额外空间 O(1)。"), { line: 6 });
    },
    render: renderGrid
  },

  "0054": {
    no: "54", title: "螺旋矩阵", tag: "矩阵 · 四边界收缩",
    example: "输入：4×5 非方阵（默认）　输出：顺时针螺旋取出全部 20 个数。另备 1×6 单行，专门打两个 if 守卫",

      }
    },
    invariants: [
      { label: "输出里没有重复", test: function (v) {
          var seen = {};
          for (var i = 0; i < v.out.length; i++) { if (seen[v.out[i]]) return false; seen[v.out[i]] = 1; }

    compare: {

        var t = 0, b = 0, l = 0, r = C - 1;
        function W(cur, note) {

        for (var c = l; c <= r; c++) out.push(g[t][c]);

        ctx.step("✗ 没有 if (t <= b) 拦着，下边沿又把第 0 行从右往左扫了一遍 —— 5,4,3,2,1 全是重复输出", W(0, "同一行被取了两次。"));
        ctx.step("✗ 最终输出 [" + out.join(",") + "]，" + out.length + " 个数里有 5 个重复。两个 if 不是可有可无的防御，而是退化形状下的正确性保证。",
          { grid: g, st: makeSt(1, C, function () { return "swap"; }), out: out.slice(), axes: true });
      }
    },
    build: function (ctx, size) {
      var R = (size && size.rows) || 4, C = (size && size.cols) || 5;
      var g = [], v = 1, r, c;
      for (r = 0; r < R; r++) { g.push([]); for (c = 0; c < C; c++) g[r].push(v++); }
      var t = 0, b = R - 1, l = 0, rr = C - 1, out = [], total = R * C;

          grid: g, st: st, out: out.slice(), axes: true, note: note,
          t: t, b: b, l: l, r: rr, total: total, taken: clone(taken),

        };

      var guard = 0;
      while (t <= b && l <= rr && guard++ < 80) {
        for (c = l; c <= rr; c++) {
          out.push(g[t][c]); taken[t][c] = true;
          ctx.step("→ 上边沿向右：取 g[" + t + "][" + c + "] = " + g[t][c], V([t, c]), { line: 3 });

          cut = c + 1;
          ctx.step("g[" + r + "][" + c + "] = " + val + " < " + target + " → 它是第 " + r + " 行里最大的一个（右端），还比 target 小，整行作废：r++",
            V("cmp", "第 " + r + " 行剩下的 " + cut + " 个格子一次性出局。"), { line: 5 });
          r++;
        }
      }
      ctx.step("走出了矩阵边界 → 候选区已经空了，" + target + " 不存在，返回 false。",
        V("swap", "一共只走了 " + steps + " 步，从没回头。"), { line: 7 });
    },
    render: renderGrid
  }
};

(function () {
  var params = new URLSearchParams(location.search);
  var keys = Object.keys(DEMOS);
  var bar = document.createElement("div");
  bar.className = "dk-bar";
  bar.style.marginBottom = "14px";
  var label = document.createElement("span");
  label.className = "dk-var";
  label.textContent = "选择题目";
  bar.appendChild(label);
  var sel = document.createElement("select");
  sel.className = "dk-select";
  keys.forEach(function (k) {
    var d = DEMOS[k];
    var o = document.createElement("option");
    o.value = k;
    o.textContent = (d.no ? d.no + ". " : "") + d.title;
    sel.appendChild(o);
  });
  bar.appendChild(sel);
  if (params.get("embed") === "1") bar.style.display = "none";
  document.getElementById("app").parentNode.insertBefore(bar, document.getElementById("app"));
  function mountDemo(key) {
    var d = DEMOS[key];
    document.title = (d.no ? d.no + ". " : "") + d.title + " · 动画演示";
    DemoKit.mount({
      no: d.no, title: d.title, tag: d.tag, example: d.example,
      sizes: d.sizes, defaultSize: d.defaultSize,
      stageHeight: d.stageHeight || 480,
      code: d.code, invariants: d.invariants, compare: d.compare,
      build: d.build, render: d.render
    });
  }
  sel.onchange = function () { mountDemo(sel.value); };
  var want = params.get("mode");
  if (want && DEMOS[want]) { sel.value = want; mountDemo(want); }
  else mountDemo(keys[0]);
})();
</script>
