<script>
// ==================== 问题数据 ====================
const PROBLEM_DATA = [
  {
    id: 'twoSum',
    name: '1. 两数之和 (Two Sum)',
    tags: ['哈希表', '一遍哈希', 'O(N)'],
    notesHTML: `
      <h3>📌 核心题意</h3>
      <p>给定一个整数数组 <code>nums</code> 和一个目标值 <code>target</code>，找出<strong>和为目标值</strong>的那<strong>两个</strong>整数，并返回它们的数组下标。假设每种输入只会对应一个答案，且同一个元素不能使用两遍。</p>
      <h3>🧠 思考过程</h3>
      <h4>直觉与痛点（暴力解法）</h4>
      <p>第一反应是用两个嵌套的 <code>for</code> 循环遍历所有数字对。痛点：数组线性查找耗时 <strong>O(N)</strong>，总时间高达 <strong>O(N²)</strong>。</p>
      <h4>破局思路（引入哈希表）</h4>
      <p>核心思想：<strong>"边遍历，边查找，边记录"</strong>。</p>
    `,
    subNotesHTML: `
      <strong>⏱ 复杂度：</strong> 时间 O(N) | 空间 O(N) &nbsp;·&nbsp;
      <strong>💡 面试避坑：</strong> 一遍哈希先查再存，避免自己匹配自己。<br>
      <strong>追问：</strong> 如果数组已排序 → <strong>双指针</strong>，空间 O(1)。
    `,
    inputConfig: {
      fields: [
        { id: 'nums', label: 'nums', defaultVal: '2,7,11,15', placeholder: '如 2,7,11,15', width: '220px' },
        { id: 'target', label: 'target', defaultVal: '9', type: 'number', width: '70px' }
      ],
      presets: [
        { label: '默认', vals: { nums: '2,7,11,15', target: '9' } },
        { label: '无重复值', vals: { nums: '3,2,4', target: '6' } },
        { label: '相同值', vals: { nums: '3,3', target: '6' } },
        { label: '负数', vals: { nums: '-1,-2,-3,-4,-5', target: '-8' } },
        { label: '大数组', vals: { nums: '1,8,12,5,9,3,7,15,20,6', target: '13' } }
      ]
    },
    javaCode: `public int[] twoSum(int[] nums, int target) {
    Map<Integer, Integer> map = new HashMap<>();
    for (int i = 0; i < nums.length; i++) {
        int complement = target - nums[i];
        if (map.containsKey(complement)) {
            return new int[] { map.get(complement), i };
        }
        map.put(nums[i], i);
    }
    throw new IllegalArgumentException("No solution");
}`
  },
  {
    id: 'anagram',
    name: '2. 字母异位词分组 (Group Anagrams)',
    tags: ['哈希表', '排序', 'computeIfAbsent'],
    notesHTML: `
      <h3>📌 核心题意</h3>
      <p>将字母组成完全相同、但顺序不同的单词归类到同一分组。</p>
      <h3>🧠 思考过程</h3>
      <p>提取统一的<strong>"防伪特征码"（排序后的字符串）</strong>作为哈希表的 Key，同类单词必然映射到同一个 Key。</p>
    `,
    subNotesHTML: `
      <strong>⏱ 复杂度：</strong> 时间 O(N·KlogK) | 空间 O(N·K) &nbsp;·&nbsp;
      <strong>🔑 computeIfAbsent：</strong> 查找 → 不存在则创建新 List 并自动存入 Map → 返回引用 → <code>.add(s)</code>。<br>
      <strong>⚠ 不能用 getOrDefault 替代：</strong> 不会把新 List 存回 Map，数据会丢失！
    `,
    inputConfig: {
      fields: [
        { id: 'strs', label: 'strs', defaultVal: 'eat,tea,tan,ate,nat,bat', placeholder: '逗号分隔，如 eat,tea', width: '320px' }
      ],
      presets: [
        { label: '默认', vals: { strs: 'eat,tea,tan,ate,nat,bat' } },
        { label: '两个一组', vals: { strs: 'abc,bac,cba,def,edf' } },
        { label: '全部不同', vals: { strs: 'cat,dog,bird,fish' } },
        { label: '含空串', vals: { strs: 'a,,b,' } },
        { label: '单个字符', vals: { strs: 'a,b,c,aa,ab,ba' } }
      ]
    },
    javaCode: `public List<List<String>> groupAnagrams(String[] strs) {
    Map<String, List<String>> map = new HashMap<>();
    for (String s : strs) {
        char[] chars = s.toCharArray();
        Arrays.sort(chars);
        String key = new String(chars);
        map.computeIfAbsent(key,
            k -> new ArrayList<>()).add(s);
    }
    return new ArrayList<>(map.values());
}`
  },
  {
    id: 'longest',
    name: '3. 最长连续序列 (Longest Consecutive)',
    tags: ['哈希表', 'HashSet', 'O(N)', '剪枝'],
    notesHTML: `
      <h3>📌 核心题意</h3>
      <p>找出未排序数组中数字连续的最长序列长度。<strong>时间复杂度必须 O(N)</strong>。</p>
      <h3>🧠 思考过程</h3>
      <p>全部数字放入 <strong>HashSet</strong> → 只从每个连续序列的<strong>"起点"</strong>开始向上计数（<code>num-1</code> 不在 Set 中即为起点）。</p>
    `,
    subNotesHTML: `
      <strong>⏱ 复杂度：</strong> 时间 O(N) | 空间 O(N) &nbsp;·&nbsp;
      <strong>💡 灵魂剪枝：</strong> <code>if (!numSet.contains(num - 1))</code> 保证每个数字的 while 最多执行一次，总时间 O(N)。
    `,
    inputConfig: {
      fields: [
        { id: 'nums', label: 'nums', defaultVal: '100,4,200,1,3,2', placeholder: '如 100,4,200,1,3,2', width: '220px' }
      ],
      presets: [
        { label: '默认', vals: { nums: '100,4,200,1,3,2' } },
        { label: '倒序', vals: { nums: '5,4,3,2,1' } },
        { label: '含重复', vals: { nums: '1,2,0,1,3,2' } },
        { label: '全相邻', vals: { nums: '10,9,8,7,6,5' } },
        { label: '有间隔', vals: { nums: '0,3,7,2,5,8,4,6,9,1' } },
        { label: '单个', vals: { nums: '42' } }
      ]
    },
    javaCode: `public int longestConsecutive(int[] nums) {
    if (nums == null || nums.length == 0) return 0;
    Set<Integer> numSet = new HashSet<>();
    for (int num : nums) numSet.add(num);
    int longestStreak = 0;
    for (int num : numSet) {
        if (!numSet.contains(num - 1)) {
            int currentNum = num;
            int currentStreak = 1;
            while (numSet.contains(currentNum + 1)) {
                currentNum++;
                currentStreak++;
            }
            longestStreak = Math.max(
                longestStreak, currentStreak);
        }
    }
    return longestStreak;
}`
  }
];

// ==================== Step Builders (accept custom input) ====================

function buildTwoSumSteps(inputNums, inputTarget) {
  const nums = inputNums || [2, 7, 11, 15];
  const target = inputTarget || 9;
  const steps = [];
  const map = {};

  function push(opts) {
    steps.push({
      array: nums.slice(),
      target: target,
      currentIdx: opts.currentIdx,
      currentValue: opts.currentValue,
      complement: opts.complement,
      complementExist: opts.complementExist,
      mapPairs: Object.entries(map).map(([k, v]) => ({ key: parseInt(k), value: v })),
      found: opts.found || false,
      resultIndices: opts.resultIndices || [],
      line: opts.line || 0,
      msg: opts.msg || '',
      phase: opts.phase || 'init'
    });
  }

  push({ currentIdx: -1, line: 2, msg: '初始化哈希表 Map<Integer, Integer>()', phase: 'init' });

  for (let i = 0; i < nums.length; i++) {
    const complement = target - nums[i];

    push({
      currentIdx: i, currentValue: nums[i], complement, complementExist: false,
      complementIdx: -1, line: 3, msg: `i=${i}：nums[${i}] = ${nums[i]}，计算 complement = ${target} - ${nums[i]} = ${complement}`,
      phase: 'calc'
    });

    const found = map[complement] !== undefined;

    if (found) {
      push({
        currentIdx: i, currentValue: nums[i], complement, complementExist: true,
        complementIdx: map[complement], found: true, resultIndices: [map[complement], i],
        line: 4, msg: `🔍 在 HashMap 中找到 complement=${complement}！它在索引 ${map[complement]}！`,
        phase: 'found'
      });
      push({
        currentIdx: i, currentValue: nums[i], complement, complementExist: true,
        complementIdx: map[complement], found: true, resultIndices: [map[complement], i],
        line: 5, msg: `🎉 返回 [${map[complement]}, ${i}] → nums[${map[complement]}] + nums[${i}] = ${nums[map[complement]]} + ${nums[i]} = ${target}`,
        phase: 'result'
      });
      break;
    } else {
      push({
        currentIdx: i, currentValue: nums[i], complement, complementExist: false,
        complementIdx: -1, line: 6, msg: `❌ HashMap 中没有 ${complement}，将 nums[${i}] = ${nums[i]} 存入哈希表`,
        phase: 'notfound'
      });

      map[nums[i]] = i;

      push({
        currentIdx: -1, currentValue: nums[i], complement, complementExist: false,
        complementIdx: -1,
        line: 7, msg: `📝 map.put(${nums[i]}, ${i}) → 当前 HashMap：{${Object.entries(map).map(([k,v]) => k+':'+v).join(', ')}}`,
        phase: 'insert'
      });
    }
  }

  return steps;
}

function buildAnagramSteps(inputStrs) {
  const strs = (inputStrs && inputStrs.length) ? inputStrs : ['eat', 'tea', 'tan', 'ate', 'nat', 'bat'];
  const steps = [];
  const map = {};

  function push(opts) {
    steps.push({
      strs: strs.slice(),
      currentIdx: opts.currentIdx,
      currentStr: opts.currentStr || '',
      sortedKey: opts.sortedKey || '',
      mapGroups: JSON.parse(JSON.stringify(map)),
      activeKey: opts.activeKey || '',
      isNewGroup: opts.isNewGroup || false,
      line: opts.line || 0,
      msg: opts.msg || '',
      done: opts.done || false
    });
  }

  push({ currentIdx: -1, line: 2, msg: '初始化哈希表 Map<String, List<String>>()' });

  for (let i = 0; i < strs.length; i++) {
    const s = strs[i];
    const chars = s.split('');
    const sorted = chars.slice().sort();
    const key = sorted.join('');

    const isNew = !map[key];
    if (isNew) map[key] = [];

    push({
      currentIdx: i,
      currentStr: s,
      sortedKey: key,
      mapGroups: JSON.parse(JSON.stringify(map)),
      activeKey: key,
      isNewGroup: isNew,
      line: 3,
      msg: isNew
        ? `🆕 "${s}" → 排序 → "${key}"（新分组）`
        : `✅ "${s}" → 排序 → "${key}"（加入已有分组）`
    });

    map[key].push(s);

    push({
      currentIdx: i,
      currentStr: s,
      sortedKey: key,
      mapGroups: JSON.parse(JSON.stringify(map)),
      activeKey: key,
      isNewGroup: false,
      line: 4,
      msg: `📦 "${s}" → ["${map[key].join('", "')}"]`
    });
  }

  const allGroups = Object.values(map);
  push({
    currentIdx: -1,
    mapGroups: JSON.parse(JSON.stringify(map)),
    line: 6,
    msg: `🏁 完成！共 ${allGroups.length} 个分组：${allGroups.map(g => '[' + g.join(',') + ']').join('  ')}`,
    done: true
  });

  return steps;
}

function buildLongestSteps(inputNums) {
  const nums = (inputNums && inputNums.length) ? inputNums : [100, 4, 200, 1, 3, 2];
  const steps = [];
  const setValues = [...new Set(nums)].sort((a, b) => a - b);
  const setLookup = new Set(nums);

  function push(opts) {
    steps.push({
      setValues: setValues.slice(),
      currentNum: opts.currentNum,
      prevExists: opts.prevExists,
      isStart: opts.isStart,
      checkingNext: opts.checkingNext || false,
      nextNum: opts.nextNum,
      nextExists: opts.nextExists,
      sequenceNums: (opts.sequenceNums || []).slice(),
      currentStreak: opts.currentStreak || 0,
      longestStreak: opts.longestStreak || 0,
      line: opts.line || 0,
      msg: opts.msg || '',
      done: opts.done || false,
      highlights: opts.highlights || {},
      skip: opts.skip || false
    });
  }

  push({ currentNum: null, sequenceNums: [], currentStreak: 0, longestStreak: 0, line: 4, msg: '将所有数字放入 HashSet → {' + [...new Set(nums)].join(', ') + '}', highlights: {} });

  let longest = 0;

  for (const num of nums) {
    const hasPrev = setLookup.has(num - 1);
    const isStart = !hasPrev;

    push({
      currentNum: num,
      prevExists: hasPrev,
      isStart,
      checkingNext: false,
      nextNum: null,
      nextExists: false,
      sequenceNums: [],
      currentStreak: 0,
      longestStreak: longest,
      line: 6,
      msg: hasPrev
        ? `⏭  检查 ${num}：${num - 1} 在 Set 中 → 不是起点，跳过`
        : `🌟 检查 ${num}：${num - 1} 不在 Set 中 → ${num} 是起点！`,
      skip: hasPrev,
      highlights: { [num]: hasPrev ? 'skipped' : 'start' }
    });

    if (hasPrev) continue;

    let cur = num;
    let streak = 1;
    const seq = [cur];

    while (setLookup.has(cur + 1)) {
      cur++;
      streak++;
      seq.push(cur);
      push({
        currentNum: num,
        isStart: true,
        checkingNext: true,
        nextNum: cur,
        nextExists: true,
        sequenceNums: seq.slice(),
        currentStreak: streak,
        longestStreak: Math.max(longest, streak),
        line: 8,
        msg: `✅ ${cur} 在 Set 中！序列扩展为 [${seq.join(' → ')}]，当前长度 ${streak}`,
        highlights: { [num]: 'start', ...Object.fromEntries(seq.map(n => [n, 'in-seq'])) }
      });
    }

    longest = Math.max(longest, streak);

    push({
      currentNum: num,
      isStart: true,
      checkingNext: true,
      nextNum: cur + 1,
      nextExists: false,
      sequenceNums: seq.slice(),
      currentStreak: streak,
      longestStreak: longest,
      line: 10,
      msg: `❌ ${cur + 1} 不在 Set 中，序列结束。长度 ${streak}，当前最长 ${longest}`,
      highlights: { [num]: 'start', ...Object.fromEntries(seq.map(n => [n, 'in-seq'])) }
    });
  }

  push({ currentNum: null, sequenceNums: [], currentStreak: 0, longestStreak: longest, line: 11, msg: `🏁 完成！最长连续序列长度为 ${longest}`, done: true, highlights: {} });

  return steps;
}

// ==================== Renderers ====================

function renderTwoSum(canvas, step) {
  let html = `<div class="vis-msg ${step.phase === 'found' || step.phase === 'result' ? 'success' : 'info'}">${step.msg}</div>`;

  // Array
  html += `<div class="row-label">📊 数组 nums</div><div class="array-row">`;
  step.array.forEach((val, i) => {
    let cls = 'val-box';
    if (step.found && step.resultIndices.includes(i)) cls += ' found';
    else if (i === step.currentIdx) cls += ' current';
    else if (step.phase === 'insert' || step.currentIdx < 0) cls += ' muted';
    html += `<div class="array-cell"><span class="idx-label">${i}</span><div class="${cls}">${val}</div></div>`;
  });
  html += `</div>`;

  // Formula
  if (step.currentIdx >= 0) {
    html += `<div class="formula-box">`;
    html += `target = ${step.target} &nbsp;|&nbsp; nums[${step.currentIdx}] = <span class="highlight-text">${step.currentValue}</span> → complement = <span class="highlight-text">${step.complement}</span>`;
    if (step.complementExist) {
      html += ` &nbsp;✅ <span class="found-text">找到！</span>`;
    }
    html += `</div>`;
  }

  // HashMap
  html += `<div class="map-container"><div class="map-title"><span class="icon">🗂</span> HashMap（Key: 数值 → Value: 下标）</div><div class="map-grid">`;
  if (step.mapPairs.length === 0) {
    html += `<div class="map-empty">（空）</div>`;
  } else {
    step.mapPairs.forEach(({ key, value }) => {
      let cls = 'map-pair';
      if (step.complementExist && key === step.complement) cls += ' found';
      html += `<div class="${cls}"><span class="key">${key}</span><span class="arrow"> → </span><span class="val">${value}</span></div>`;
    });
  }
  html += `</div></div>`;

  if (step.phase === 'found' || step.phase === 'result') {
    html += `<div style="margin-top:6px;text-align:center"><span class="op-badge found">🎯 结果 [${step.resultIndices}]</span></div>`;
  } else if (step.phase === 'insert') {
    html += `<div style="margin-top:6px;text-align:center"><span class="op-badge insert">存入哈希表</span></div>`;
  } else if (step.phase === 'calc' || step.phase === 'notfound') {
    html += `<div style="margin-top:6px;text-align:center"><span class="op-badge search">查找中...</span></div>`;
  }

  canvas.innerHTML = html;
}

function renderAnagram(canvas, step) {
  let html = `<div class="vis-msg ${step.done ? 'success' : 'info'}">${step.msg}</div>`;

  // Input strings
  html += `<div class="row-label">📝 输入字符串</div><div style="padding:4px 0">`;
  step.strs.forEach((s, i) => {
    let cls = 'str-token';
    if (i < step.currentIdx || step.done) cls += ' done';
    else if (i === step.currentIdx) cls += ' current';
    html += `<span class="${cls}">"${s||''}"</span>`;
  });
  html += `</div>`;

  // Current step info
  if (step.currentStr !== undefined && !step.done && step.currentStr !== '') {
    const chars = step.currentStr.split('');
    const sorted = chars.slice().sort();
    html += `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-radius:8px;border:1px solid #e0e3eb;flex-wrap:wrap;margin:4px 0">`;
    html += `<span style="font-weight:600;color:#333;">🎯 "${step.currentStr}"</span><span style="color:#999;">→</span>`;
    html += `<span style="display:flex;gap:2px;">${chars.map(c => `<span style="background:#e3f2fd;padding:1px 6px;border-radius:3px;font-size:13px;font-weight:600">${c||'␣'}</span>`).join('')}</span>`;
    html += `<span style="color:#999;">→ sort →</span>`;
    html += `<span style="display:flex;gap:2px;">${sorted.map(c => `<span style="background:#fff3e0;padding:1px 6px;border-radius:3px;font-size:13px;font-weight:600;color:#e65100">${c||'␣'}</span>`).join('')}</span>`;
    html += `<span style="color:#999;">→</span>`;
    html += `<span style="background:#6c63ff;color:#fff;padding:2px 10px;border-radius:4px;font-weight:700;font-size:14px;">"${step.sortedKey}"</span>`;
    html += `</div>`;
  }

  // HashMap groups
  html += `<div class="map-container"><div class="map-title"><span class="icon">🗂</span> HashMap 分组结果</div>`;
  const entries = Object.entries(step.mapGroups);
  if (entries.length === 0) {
    html += `<div class="map-empty">（空）</div>`;
  } else {
    html += `<div style="display:flex;flex-direction:column;gap:6px;">`;
    entries.forEach(([key, items]) => {
      const isActive = key === step.activeKey;
      html += `<div class="group-box" style="${isActive ? 'border-color:#ff9800;background:#fff8e1;' : ''}">`;
      html += `<span class="group-key">${key}</span><span style="color:#999;font-size:12px;">→</span>`;
      items.forEach((item, idx) => {
        const isNew = isActive && idx === items.length - 1;
        html += `<span class="group-item${isNew ? ' new' : ''}">"${item}"</span>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  if (step.done) {
    html += `<div style="margin-top:6px;text-align:center"><span class="op-badge found">🏁 ${Object.keys(step.mapGroups).length} 个分组</span></div>`;
  }

  canvas.innerHTML = html;
}

function renderLongest(canvas, step) {
  let html = `<div class="vis-msg ${step.done ? 'success' : (step.skip ? '' : 'info')}">${step.msg}</div>`;

  // Set display
  html += `<div class="row-label">🔢 HashSet 内容</div><div class="set-grid">`;
  step.setValues.forEach(n => {
    let cls = 'set-num';
    if (step.highlights && step.highlights[n] === 'start') cls += ' start';
    else if (step.highlights && step.highlights[n] === 'in-seq') cls += ' in-seq';
    else if (step.highlights && step.highlights[n] === 'skipped') cls += ' skipped';
    else if (step.checkingNext && step.nextNum === n) cls += ' checking';
    html += `<div class="${cls}">${n}</div>`;
  });
  html += `</div>`;

  // Status
  if (step.currentNum !== null && !step.done) {
    html += `<div class="formula-box" style="font-size:14px;">`;
    if (step.skip) {
      html += `<span>⏭ <strong>${step.currentNum}</strong>：${step.currentNum - 1} 在 Set 中 → 不是起点</span>`;
    } else if (step.checkingNext) {
      html += `<span>🔍 检查 <strong>${step.nextNum}</strong>：${step.nextExists ? '✅ 存在！' : '❌ 不存在'}</span>`;
    } else {
      html += `<span>🌟 <strong>${step.currentNum}</strong>：${step.currentNum - 1} 不在 Set 中 → 起点！</span>`;
    }
    html += `</div>`;
  }

  // Sequence
  if (step.sequenceNums && step.sequenceNums.length > 0) {
    html += `<div style="padding:4px 0"><div class="row-label">📈 当前序列</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;">`;
    step.sequenceNums.forEach((n, i) => {
      if (i > 0) html += `<span style="color:#999;font-weight:700;">→</span>`;
      html += `<span style="background:#4caf50;color:#fff;padding:2px 10px;border-radius:4px;font-weight:700;font-size:14px;">${n}</span>`;
    });
    html += `</div></div>`;
  }

  // Streak
  if (step.currentStreak > 0 || step.longestStreak > 0) {
    const maxPossible = Math.max(...step.setValues) - Math.min(...step.setValues) + 1;
    const pct = Math.min(100, maxPossible > 0 ? (step.currentStreak / maxPossible) * 100 : 0);
    html += `<div style="padding:4px 0"><div class="row-label">📊 序列长度</div>`;
    html += `<div style="display:flex;gap:16px;font-size:13px;margin-bottom:4px;">`;
    html += `<span>当前: <strong style="color:#ff9800;">${step.currentStreak}</strong></span>`;
    html += `<span>最长: <strong style="color:#4caf50;">${step.longestStreak}</strong></span>`;
    html += `</div>`;
    html += `<div class="streak-bar-wrap"><div class="streak-bar-fill" style="width:${pct}%"></div><div class="streak-label">${step.sequenceNums.join(' → ') || '-'}</div></div>`;
    html += `</div>`;
  }

  if (step.done) {
    html += `<div style="margin-top:6px;text-align:center"><span class="op-badge found">🏆 最长连续序列: ${step.longestStreak}</span></div>`;
  }

  canvas.innerHTML = html;
}

// ==================== Parsers ====================

function parseNumList(str) {
  return str.split(',').map(s => s.trim()).filter(s => s !== '').map(Number);
}

function parseStrList(str) {
  return str.split(',').map(s => s.trim());
}

function parseTwoSumInput(inputs) {
  const numsStr = inputs.nums.value.trim();
  const targetStr = inputs.target.value.trim();
  const errEl = inputs.err;

  if (!numsStr) { errEl.textContent = '⚠️ nums 不能为空'; errEl.classList.add('show'); return null; }
  if (!targetStr) { errEl.textContent = '⚠️ target 不能为空'; errEl.classList.add('show'); return null; }

  const nums = parseNumList(numsStr);
  if (nums.length < 2) { errEl.textContent = '⚠️ nums 至少需要 2 个数字'; errEl.classList.add('show'); return null; }
  if (nums.some(isNaN)) { errEl.textContent = '⚠️ nums 包含无效数字，请用逗号分隔'; errEl.classList.add('show'); return null; }

  const target = Number(targetStr);
  if (isNaN(target)) { errEl.textContent = '⚠️ target 必须是有效数字'; errEl.classList.add('show'); return null; }

  errEl.classList.remove('show');
  return { nums, target };
}

function parseAnagramInput(inputs) {
  const strsStr = inputs.strs.value.trim();
  const errEl = inputs.err;

  if (!strsStr) { errEl.textContent = '⚠️ strs 不能为空'; errEl.classList.add('show'); return null; }

  const strs = parseStrList(strsStr).filter(s => true);
  if (strs.length < 1) { errEl.textContent = '⚠️ 至少需要 1 个字符串'; errEl.classList.add('show'); return null; }

  errEl.classList.remove('show');
  return strs;
}

function parseLongestInput(inputs) {
  const numsStr = inputs.nums.value.trim();
  const errEl = inputs.err;

  if (!numsStr) { errEl.textContent = '⚠️ nums 不能为空'; errEl.classList.add('show'); return null; }

  const nums = parseNumList(numsStr);
  if (nums.length < 1) { errEl.textContent = '⚠️ nums 至少需要 1 个数字'; errEl.classList.add('show'); return null; }
  if (nums.some(isNaN)) { errEl.textContent = '⚠️ nums 包含无效数字，请用逗号分隔'; errEl.classList.add('show'); return null; }

  errEl.classList.remove('show');
  return nums;
}

// ==================== DOM Construction ====================

const panelData = [];

function initPanel(idx) {
  const data = PROBLEM_DATA[idx];
  const panel = document.createElement('div');
  panel.className = 'panel' + (idx === 0 ? ' active' : '');
  panel.id = 'panel-' + idx;

  // Code display
  const codeStr = data.javaCode.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = codeStr.split('\n');
  let codeHTML = '<pre><code>';
  for (let i = 0; i < lines.length; i++) {
    const ln = i + 1;
    codeHTML += `<div class="code-line" data-line="${ln}"><span class="lineno">${ln}</span>${lines[i]}</div>`;
  }
  codeHTML += '</code></pre>';

  // Tags
  const tagsHTML = data.tags.map(t => `<span>🏷 ${t}</span>`).join('');

  // Build input section
  const cfg = data.inputConfig;
  let inputFieldsHTML = '';
  cfg.fields.forEach(f => {
    const type = f.type || 'text';
    const w = f.width || '150px';
    inputFieldsHTML += `<label>${f.label} = [</label>`;
    inputFieldsHTML += `<input type="${type}" class="custom-input" data-field-id="${f.id}" value="${f.defaultVal}" placeholder="${f.placeholder || ''}" style="width:${w};">`;
    inputFieldsHTML += `<label>]</label>`;
  });

  let presetsHTML = '<span class="preset-label">预设：</span>';
  cfg.presets.forEach((p, pi) => {
    presetsHTML += `<span class="preset-btn" data-preset-idx="${pi}">${p.label}</span>`;
  });

  // Full panel template
  panel.innerHTML = `
    <div class="panel-header">
      <h2>${data.name}</h2>
      <div class="sub">${data.notesHTML.replace(/<[^>]+>/g, '').substring(0, 120)}...</div>
    </div>
    <div class="top-tags">${tagsHTML}</div>
    <div class="notes-section">${data.notesHTML}</div>
    <div class="input-section">
      <div class="input-row">
        ${inputFieldsHTML}
        <button class="btn-apply">▶ 应用</button>
        <button class="btn-reset-input">↺ 重置</button>
      </div>
      <div class="input-err-msg"></div>
      <div class="preset-row">${presetsHTML}</div>
    </div>
    <div class="content">
      <div class="code-section">
        <div class="code-scroll">${codeHTML}</div>
      </div>
      <div class="vis-section">
        <div class="vis-canvas-wrap" id="canvas-${idx}"></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn-first" data-idx="${idx}">|◀ 首步</button>
      <button class="btn-prev" data-idx="${idx}">◀ 上一步</button>
      <button class="btn-next btn-primary" data-idx="${idx}">下一步 ▶</button>
      <button class="btn-last" data-idx="${idx}">末步 ▶|</button>
      <button class="btn-auto" data-idx="${idx}">▶ 自动播放</button>
      <span class="step-info" id="stepInfo-${idx}">步骤 0 / 0</span>
    </div>
    <div class="complexity-bar">${data.subNotesHTML}</div>
  `;

  document.getElementById('panels').appendChild(panel);

  // State
  const state = { steps: [], stepIdx: 0, running: false, timer: null };
  panelData[idx] = state;

  // DOM refs
  const inputEls = {};
  panel.querySelectorAll('.custom-input').forEach(el => {
    inputEls[el.dataset.fieldId] = el;
  });
  const errEl = panel.querySelector('.input-err-msg');
  const applyBtn = panel.querySelector('.btn-apply');
  const resetInputBtn = panel.querySelector('.btn-reset-input');
  const presetBtns = panel.querySelectorAll('.preset-btn');

  // Render
  function render() {
    const canvas = document.getElementById('canvas-' + idx);
    if (!state.steps.length) return;
    const stepIdx = Math.min(state.stepIdx, state.steps.length - 1);
    const step = state.steps[stepIdx];

    switch (idx) {
      case 0: renderTwoSum(canvas, step); break;
      case 1: renderAnagram(canvas, step); break;
      case 2: renderLongest(canvas, step); break;
    }

    const info = document.getElementById('stepInfo-' + idx);
    if (info) info.textContent = `步骤 ${state.stepIdx} / ${state.steps.length - 1}`;

    panel.querySelectorAll('.code-line').forEach(el => el.classList.remove('highlight-line'));
    if (step.line > 0) {
      const target = panel.querySelector(`.code-line[data-line="${step.line}"]`);
      if (target) target.classList.add('highlight-line');
    }
    updateButtons();
  }

  function updateButtons() {
    const btns = {
      first: panel.querySelector('.btn-first'),
      prev: panel.querySelector('.btn-prev'),
      next: panel.querySelector('.btn-next'),
      last: panel.querySelector('.btn-last')
    };
    const atFirst = state.stepIdx <= 0;
    const atLast = state.stepIdx >= state.steps.length - 1;
    if (btns.first) btns.first.disabled = atFirst;
    if (btns.prev) btns.prev.disabled = atFirst;
    if (btns.next) btns.next.disabled = atLast;
    if (btns.last) btns.last.disabled = atLast;
  }

  // Read custom input and rebuild steps
  function applyCustomInput() {
    errEl.classList.remove('show');
    let result = null;
    switch (idx) {
      case 0: {
        const parsed = parseTwoSumInput({ nums: inputEls.nums, target: inputEls.target, err: errEl });
        if (!parsed) return;
        result = buildTwoSumSteps(parsed.nums, parsed.target);
        break;
      }
      case 1: {
        const parsed = parseAnagramInput({ strs: inputEls.strs, err: errEl });
        if (!parsed) return;
        result = buildAnagramSteps(parsed);
        break;
      }
      case 2: {
        const parsed = parseLongestInput({ nums: inputEls.nums, err: errEl });
        if (!parsed) return;
        result = buildLongestSteps(parsed);
        break;
      }
    }
    if (result) {
      state.steps = result;
      state.stepIdx = 0;
      if (state.timer) { clearInterval(state.timer); state.timer = null; state.running = false; }
      const autoBtn = panel.querySelector('.btn-auto');
      if (autoBtn) autoBtn.textContent = '▶ 自动播放';
      render();
    }
  }

  // Reset to default
  function resetToDefault() {
    errEl.classList.remove('show');
    const cfg = PROBLEM_DATA[idx].inputConfig;
    cfg.fields.forEach(f => {
      if (inputEls[f.id]) inputEls[f.id].value = f.defaultVal;
    });
    applyCustomInput();
  }

  // Set preset values
  function applyPreset(pi) {
    const preset = PROBLEM_DATA[idx].inputConfig.presets[pi];
    if (!preset) return;
    errEl.classList.remove('show');
    Object.entries(preset.vals).forEach(([key, val]) => {
      if (inputEls[key]) inputEls[key].value = val;
    });
    // highlight active preset
    presetBtns.forEach(b => b.classList.remove('active'));
    presetBtns[pi].classList.add('active');
    applyCustomInput();
  }

  // ---- Events ----
  applyBtn.addEventListener('click', applyCustomInput);
  resetInputBtn.addEventListener('click', resetToDefault);

  // Enter key in any input triggers apply
  panel.querySelectorAll('.custom-input').forEach(el => {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyCustomInput(); });
  });

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => applyPreset(parseInt(btn.dataset.presetIdx)));
  });

  // Nav buttons
  panel.querySelector('.btn-next').addEventListener('click', () => {
    if (state.stepIdx < state.steps.length - 1) { state.stepIdx++; render(); }
  });
  panel.querySelector('.btn-prev').addEventListener('click', () => {
    if (state.stepIdx > 0) { state.stepIdx--; render(); }
  });
  panel.querySelector('.btn-first').addEventListener('click', () => {
    state.stepIdx = 0; render();
  });
  panel.querySelector('.btn-last').addEventListener('click', () => {
    state.stepIdx = state.steps.length - 1; render();
  });
  panel.querySelector('.btn-auto').addEventListener('click', () => {
    if (state.running) {
      if (state.timer) { clearInterval(state.timer); state.timer = null; }
      state.running = false;
      panel.querySelector('.btn-auto').textContent = '▶ 自动播放';
    } else {
      state.running = true;
      panel.querySelector('.btn-auto').textContent = '⏸ 暂停';
      state.timer = setInterval(() => {
        if (state.stepIdx < state.steps.length - 1) {
          state.stepIdx++;
          render();
        } else {
          clearInterval(state.timer); state.timer = null;
          state.running = false;
          panel.querySelector('.btn-auto').textContent = '▶ 自动播放';
        }
      }, 800);
    }
  });

  // ResizeObserver
  const ro = new ResizeObserver(() => render());
  ro.observe(document.getElementById('canvas-' + idx));

  state.render = render;
  panelData[idx] = state;

  // Init with default data
  resetToDefault();
}

// ==================== Bootstrap ====================

PROBLEM_DATA.forEach((_, idx) => initPanel(idx));

// Tab switching
document.querySelectorAll('.sort-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    panelData.forEach(s => {
      if (s && s.timer) { clearInterval(s.timer); s.timer = null; s.running = false; }
    });
    document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.btn-auto').forEach(b => b.textContent = '▶ 自动播放');
    tab.classList.add('active');
    const idx = parseInt(tab.dataset.idx);
    document.getElementById('panel-' + idx).classList.add('active');
    const s = panelData[idx];
    if (s && s.render) setTimeout(() => s.render(), 50);
  });
});
</script>

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
