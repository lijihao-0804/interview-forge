<script>
// ===================== 排序算法数据 =====================
const SORT_DATA = [
  {
    name: "冒泡排序",
    nameEn: "Bubble Sort",
    timeBest: "O(n)",
    timeAvg: "O(n²)",
    timeWorst: "O(n²)",
    space: "O(1)",
    stable: true,
    desc: "重复遍历数组，比较相邻元素并交换逆序对。每轮将当前最大值「冒泡」到末尾。优化：若一轮无交换则提前结束。",
    javaCode: `public static void bubbleSort(int[] arr) {
    int n = arr.length;
    boolean swapped;
    for (int i = 0; i < n - 1; i++) {
        swapped = false;
        for (int j = 0; j < n - 1 - i; j++) {
            if (arr[j] > arr[j + 1]) {
                int tmp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = tmp;
                swapped = true;
            }
        }
        if (!swapped) break;
    }
}`
  },
  {
    name: "选择排序",
    nameEn: "Selection Sort",
    timeBest: "O(n²)",
    timeAvg: "O(n²)",
    timeWorst: "O(n²)",
    space: "O(1)",
    stable: false,
    desc: "每轮从未排序部分选出最小值，放到已排序部分的末尾。简单直观，但无论数据如何都执行 O(n²) 次比较。",
    javaCode: `public static void selectionSort(int[] arr) {
    int n = arr.length;
    for (int i = 0; i < n - 1; i++) {
        int minIdx = i;
        for (int j = i + 1; j < n; j++) {
            if (arr[j] < arr[minIdx]) {
                minIdx = j;
            }
        }
        if (minIdx != i) {
            int tmp = arr[i];
            arr[i] = arr[minIdx];
            arr[minIdx] = tmp;
        }
    }
}`
  },
  {
    name: "插入排序",
    nameEn: "Insertion Sort",
    timeBest: "O(n)",
    timeAvg: "O(n²)",
    timeWorst: "O(n²)",
    space: "O(1)",
    stable: true,
    desc: "将数组分为已排序和未排序两部分，每次从未排序部分取一个元素插入到已排序部分的正确位置。数据基本有序时效率极高。",
    javaCode: `public static void insertionSort(int[] arr) {
    int n = arr.length;
    for (int i = 1; i < n; i++) {
        int key = arr[i];
        int j = i - 1;
        while (j >= 0 && arr[j] > key) {
            arr[j + 1] = arr[j];
            j--;
        }
        arr[j + 1] = key;
    }
}`
  },
  {
    name: "希尔排序",
    nameEn: "Shell Sort",
    timeBest: "O(n log n)",
    timeAvg: "O(n log n)",
    timeWorst: "O(n²)",
    space: "O(1)",
    stable: false,
    desc: "插入排序的改进版。通过增量(gap)分组，对每组进行插入排序，逐步缩小增量直至 1。使数据快速趋于基本有序。",
    javaCode: `public static void shellSort(int[] arr) {
    int n = arr.length;
    for (int gap = n / 2; gap > 0; gap /= 2) {
        for (int i = gap; i < n; i++) {
            int key = arr[i];
            int j = i;
            while (j >= gap && arr[j - gap] > key) {
                arr[j] = arr[j - gap];
                j -= gap;
            }
            arr[j] = key;
        }
    }
}`
  },
  {
    name: "归并排序",
    nameEn: "Merge Sort",
    timeBest: "O(n log n)",
    timeAvg: "O(n log n)",
    timeWorst: "O(n log n)",
    space: "O(n)",
    stable: true,
    desc: "分治思想。将数组递归地对半拆分到单元素，再两两合并成有序数组。稳定、高效，但需要额外 O(n) 空间。",
    javaCode: `public static void mergeSort(int[] arr, int l, int r) {
    if (l >= r) return;
    int m = l + (r - l) / 2;
    mergeSort(arr, l, m);
    mergeSort(arr, m + 1, r);
    merge(arr, l, m, r);
}

private static void merge(int[] arr, int l, int m, int r) {
    int[] left = Arrays.copyOfRange(arr, l, m + 1);
    int[] right = Arrays.copyOfRange(arr, m + 1, r + 1);
    int i = 0, j = 0, k = l;
    while (i < left.length && j < right.length)
        arr[k++] = left[i] <= right[j] ? left[i++] : right[j++];
    while (i < left.length) arr[k++] = left[i++];
    while (j < right.length) arr[k++] = right[j++];
}`
  },
  {
    name: "快速排序",
    nameEn: "Quick Sort",
    timeBest: "O(n log n)",
    timeAvg: "O(n log n)",
    timeWorst: "O(n²)",
    space: "O(log n)",
    stable: false,
    desc: "分治思想。选一个基准(pivot)，将小于基准的元素放左边、大于的放右边，然后递归排序左右子数组。最坏情况发生在已排序数组（可优化为随机选基准）。",
    javaCode: `public static void quickSort(int[] arr, int l, int r) {
    if (l >= r) return;
    int p = partition(arr, l, r);
    quickSort(arr, l, p - 1);
    quickSort(arr, p + 1, r);
}

private static int partition(int[] arr, int l, int r) {
    int pivot = arr[r]; // 选最后一个为基准
    int i = l - 1;
    for (int j = l; j < r; j++) {
        if (arr[j] < pivot) {
            i++;
            swap(arr, i, j);
        }
    }
    swap(arr, i + 1, r);
    return i + 1;
}`
  },
  {
    name: "堆排序",
    nameEn: "Heap Sort",
    timeBest: "O(n log n)",
    timeAvg: "O(n log n)",
    timeWorst: "O(n log n)",
    space: "O(1)",
    stable: false,
    desc: "利用最大堆性质：建堆后将堆顶（最大值）与末尾交换，缩小堆范围并调整。原地排序，无额外空间。",
    javaCode: `public static void heapSort(int[] arr) {
    int n = arr.length;
    // 建最大堆
    for (int i = n / 2 - 1; i >= 0; i--)
        heapify(arr, n, i);
    // 逐个取出堆顶
    for (int i = n - 1; i > 0; i--) {
        swap(arr, 0, i);
        heapify(arr, i, 0);
    }
}

private static void heapify(int[] arr, int n, int i) {
    int max = i, l = 2*i+1, r = 2*i+2;
    if (l < n && arr[l] > arr[max]) max = l;
    if (r < n && arr[r] > arr[max]) max = r;
    if (max != i) {
        swap(arr, i, max);
        heapify(arr, n, max);
    }
}`
  },
  {
    name: "计数排序",
    nameEn: "Counting Sort",
    timeBest: "O(n+k)",
    timeAvg: "O(n+k)",
    timeWorst: "O(n+k)",
    space: "O(k)",
    stable: true,
    desc: "非比较排序。统计每个元素出现次数，计算前缀和确定位置，再输出到结果数组。适用于数据范围 k 较小的情况。",
    javaCode: `public static void countingSort(int[] arr) {
    if (arr.length == 0) return;
    int max = Arrays.stream(arr).max().getAsInt();
    int min = Arrays.stream(arr).min().getAsInt();
    int range = max - min + 1;
    int[] count = new int[range];
    int[] output = new int[arr.length];

    for (int v : arr) count[v - min]++;

    // 前缀和 → 位置
    for (int i = 1; i < range; i++)
        count[i] += count[i - 1];

    // 稳定输出
    for (int i = arr.length - 1; i >= 0; i--) {
        int v = arr[i];
        output[count[v - min] - 1] = v;
        count[v - min]--;
    }
    System.arraycopy(output, 0, arr, 0, arr.length);
}`
  },
  {
    name: "基数排序",
    nameEn: "Radix Sort",
    timeBest: "O(nk)",
    timeAvg: "O(nk)",
    timeWorst: "O(nk)",
    space: "O(n+k)",
    stable: true,
    desc: "非比较排序。按位（个位→十位→百位…）依次用计数排序进行排序。k 为最大数字的位数。适合等长数字串。",
    javaCode: `public static void radixSort(int[] arr) {
    int max = Arrays.stream(arr).max().getAsInt();
    for (int exp = 1; max / exp > 0; exp *= 10)
        countingSortByDigit(arr, exp);
}

private static void countingSortByDigit(int[] arr, int exp) {
    int n = arr.length;
    int[] output = new int[n];
    int[] count = new int[10];
    for (int v : arr) count[(v / exp) % 10]++;
    for (int i = 1; i < 10; i++) count[i] += count[i-1];
    for (int i = n - 1; i >= 0; i--) {
        int d = (arr[i] / exp) % 10;
        output[count[d] - 1] = arr[i];
        count[d]--;
    }
    System.arraycopy(output, 0, arr, 0, n);
}`
  },
  {
    name: "桶排序",
    nameEn: "Bucket Sort",
    timeBest: "O(n+k)",
    timeAvg: "O(n+k)",
    timeWorst: "O(n²)",
    space: "O(n+k)",
    stable: true,
    desc: "非比较排序。将元素按范围分到若干桶中，桶内各自排序（可用插入排序），再依次合并。适合均匀分布的数据。",
    javaCode: `public static void bucketSort(float[] arr) {
    int n = arr.length;
    if (n <= 1) return;
    @SuppressWarnings("unchecked")
    List<Float>[] buckets = new ArrayList[n];
    for (int i = 0; i < n; i++)
        buckets[i] = new ArrayList<>();

    for (float v : arr)
        buckets[(int)(v * n)].add(v);

    for (List<Float> b : buckets)
        Collections.sort(b);

    int idx = 0;
    for (List<Float> b : buckets)
        for (float v : b)
            arr[idx++] = v;
}`
  }
];

// ===================== 可视化引擎 =====================
let currentIdx = 0;
let animationTimer = null;

function generateRandomArray(size) {
  const arr = new Array(size);
  for (let i = 0; i < size; i++) arr[i] = Math.floor(Math.random() * 100) + 1;
  return arr;
}

// ---------- 生成步骤序列 ----------
function buildSteps(sortIdx, rawArr) {
  const arr = rawArr.slice();
  const n = arr.length;
  const steps = [];
  // 每个 step: { array: [], compares: [i,j], swaps: [i,j], sorted: [i], line: num, type: 'compare'|'swap'|'sorted'|'done' }

  function push(opts) {
    steps.push({ array: arr.slice(), compares: opts.compares || [], swaps: opts.swaps || [], pivots: opts.pivots || [], active: opts.active || [], sorted: opts.sorted ? opts.sorted.slice() : [], line: opts.line || 0, msg: opts.msg || '' });
  }

  // 记录完整已排序区间（用于绿色显示）
  let sortedIndices = [];

  switch (sortIdx) {
    // ===== 0 - 冒泡排序 =====
    case 0: {
      for (let i = 0; i < n - 1; i++) {
        push({ compares: [], sorted: sortedIndices, line: 4, msg: `——— 第 ${i+1} 轮冒泡 ———` });
        let swapped = false;
        for (let j = 0; j < n - 1 - i; j++) {
          push({ compares: [j, j+1], sorted: sortedIndices, line: 7, msg: `比较 arr[${j}]=${arr[j]} 和 arr[${j+1}]=${arr[j+1]}` });
          if (arr[j] > arr[j+1]) {
            [arr[j], arr[j+1]] = [arr[j+1], arr[j]];
            swapped = true;
            push({ swaps: [j, j+1], sorted: sortedIndices, line: 9, msg: `交换 → arr[${j}]=${arr[j]}, arr[${j+1}]=${arr[j+1]}` });
          }
        }
        sortedIndices = [n - 1 - i, ...sortedIndices];
        push({ sorted: sortedIndices, line: 14, msg: `arr[${n-1-i}] 已就位（最大值已冒泡到末尾）` });
        if (!swapped) {
          push({ sorted: sortedIndices, line: 14, msg: '本轮无交换，数组已有序，提前结束！' });
          break;
        }
      }
      sortedIndices = Array.from({length: n}, (_,i) => i);
      push({ sorted: sortedIndices, line: 0, msg: '冒泡排序完成！' });
      break;
    }
    // ===== 1 - 选择排序 =====
    case 1: {
      for (let i = 0; i < n - 1; i++) {
        let minIdx = i;
        push({ active: [minIdx], sorted: sortedIndices, line: 4, msg: `第 ${i+1} 轮：从 [${i}..${n-1}] 选择最小值，初始 minIdx=${i}` });
        for (let j = i + 1; j < n; j++) {
          push({ compares: [j, minIdx], active: [minIdx], sorted: sortedIndices, line: 6, msg: `比较 arr[${j}]=${arr[j]} 与当前最小值 arr[${minIdx}]=${arr[minIdx]}` });
          if (arr[j] < arr[minIdx]) {
            minIdx = j;
            push({ active: [minIdx], sorted: sortedIndices, line: 7, msg: `更新最小值位置 → minIdx=${minIdx}（值为 ${arr[minIdx]}）` });
          }
        }
        if (minIdx !== i) {
          [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
          push({ swaps: [i, minIdx], sorted: sortedIndices, line: 12, msg: `交换 arr[${i}] 和 arr[${minIdx}] → arr[${i}]=${arr[i]}` });
        } else {
          push({ sorted: sortedIndices, line: 0, msg: `arr[${i}] 已经在正确位置，无需交换` });
        }
        sortedIndices.push(i);
        push({ sorted: sortedIndices.slice(), line: 0, msg: `arr[${i}] 已就位` });
      }
      sortedIndices = Array.from({length: n}, (_,i) => i);
      push({ sorted: sortedIndices, line: 0, msg: '选择排序完成！' });
      break;
    }
    // ===== 2 - 插入排序 =====
    case 2: {
      sortedIndices.push(0);
      for (let i = 1; i < n; i++) {
        let key = arr[i];
        let j = i - 1;
        push({ active: [i], sorted: sortedIndices, line: 4, msg: `取 key=arr[${i}]=${key}，准备插入到已排序部分 [0..${i-1}]` });
        push({ compares: [j], active: [i], sorted: sortedIndices, line: 6, msg: `比较 key=${key} 与 arr[${j}]=${arr[j]}` });
        while (j >= 0 && arr[j] > key) {
          arr[j + 1] = arr[j];
          push({ swaps: [j+1], active: [i], sorted: sortedIndices, line: 7, msg: `arr[${j}] > key，右移 → arr[${j+1}]=${arr[j]}` });
          j--;
          if (j >= 0) push({ compares: [j], active: [i], sorted: sortedIndices, line: 6, msg: `继续比较 key=${key} 与 arr[${j}]=${arr[j]}` });
        }
        arr[j + 1] = key;
        sortedIndices.push(i);
        push({ swaps: [j+1], sorted: sortedIndices.slice(), line: 10, msg: `插入 key=${key} 到位置 ${j+1}，arr[0..${i}] 已有序` });
      }
      push({ sorted: sortedIndices, line: 0, msg: '插入排序完成！' });
      break;
    }
    // ===== 3 - 希尔排序 =====
    case 3: {
      for (let gap = Math.floor(n / 2); gap > 0; gap = Math.floor(gap / 2)) {
        push({ compares: [], sorted: [], line: 3, msg: `——— 增量 gap=${gap} ———` });
        for (let i = gap; i < n; i++) {
          let key = arr[i];
          let j = i;
          push({ active: [i], sorted: [], line: 5, msg: `取 key=arr[${i}]=${key}，在同组(gap=${gap})中插入` });
          while (j >= gap && arr[j - gap] > key) {
            arr[j] = arr[j - gap];
            push({ swaps: [j], active: [j-gap], sorted: [], line: 8, msg: `同组中 arr[${j-gap}]=${arr[j-gap]} > key，右移到 arr[${j}]` });
            j -= gap;
          }
          arr[j] = key;
          push({ swaps: [j], sorted: [], line: 11, msg: `插入 key=${key} 到位置 ${j}` });
        }
      }
      sortedIndices = Array.from({length: n}, (_,i) => i);
      push({ sorted: sortedIndices, line: 0, msg: '希尔排序完成！' });
      break;
    }
    // ===== 4 - 归并排序 =====
    case 4: {
      function doMergeSort(l, r) {
        if (l >= r) return;
        let m = Math.floor((l + r) / 2);
        push({ compares: [], sorted: [], line: 2, msg: `拆分 [${l}..${r}] → [${l}..${m}] 和 [${m+1}..${r}]` });
        doMergeSort(l, m);
        doMergeSort(m + 1, r);
        doMerge(l, m, r);
      }
      function doMerge(l, m, r) {
        let left = arr.slice(l, m + 1);
        let right = arr.slice(m + 1, r + 1);
        let i = 0, j = 0, k = l;
        push({ compares: [], sorted: [], line: 13, msg: `合并 [${l}..${m}] 和 [${m+1}..${r}]` });
        while (i < left.length && j < right.length) {
          if (left[i] <= right[j]) {
            arr[k] = left[i]; i++;
            push({ swaps: [k], sorted: [], line: 14, msg: `取较小值 left[${i-1}]=${left[i-1]} 放入 arr[${k}]` });
          } else {
            arr[k] = right[j]; j++;
            push({ swaps: [k], sorted: [], line: 14, msg: `取较小值 right[${j-1}]=${right[j-1]} 放入 arr[${k}]` });
          }
          k++;
        }
        while (i < left.length) { arr[k] = left[i]; i++; push({ swaps: [k], sorted: [], line: 15, msg: `左侧剩余 left[${i-1}]=${arr[k]} 放入 arr[${k}]` }); k++; }
        while (j < right.length) { arr[k] = right[j]; j++; push({ swaps: [k], sorted: [], line: 16, msg: `右侧剩余 right[${j-1}]=${arr[k]} 放入 arr[${k}]` }); k++; }
        push({ sorted: [], line: 0, msg: `合并完成 [${l}..${r}] 已有序` });
      }
      doMergeSort(0, n - 1);
      sortedIndices = Array.from({length: n}, (_,i) => i);
      push({ sorted: sortedIndices, line: 0, msg: '归并排序完成！' });
      break;
    }
    // ===== 5 - 快速排序 =====
    case 5: {
      function doQuick(l, r) {
        if (l >= r) return;
        let p = doPartition(l, r);
        doQuick(l, p - 1);
        doQuick(p + 1, r);
      }
      function doPartition(l, r) {
        let pivot = arr[r];
        let i = l - 1;
        push({ pivots: [r], sorted: sortedIndices, line: 9, msg: `分区 [${l}..${r}]：选 arr[${r}]=${pivot} 为基准` });
        for (let j = l; j < r; j++) {
          push({ compares: [j], pivots: [r], sorted: sortedIndices, line: 12, msg: `比较 arr[${j}]=${arr[j]} 和基准 ${pivot}` });
          if (arr[j] < pivot) {
            i++;
            [arr[i], arr[j]] = [arr[j], arr[i]];
            push({ swaps: [i, j], pivots: [r], sorted: sortedIndices, line: 14, msg: `arr[${j}]=${arr[i]} < ${pivot}，交换到左侧 arr[${i}]` });
          }
        }
        [arr[i+1], arr[r]] = [arr[r], arr[i+1]];
        push({ swaps: [i+1, r], pivots: [], sorted: sortedIndices, line: 17, msg: `基准归位：arr[${i+1}] ↔ arr[${r}]，基准=${arr[i+1]} 已在正确位置` });
        return i + 1;
      }
      doQuick(0, n - 1);
      sortedIndices = Array.from({length: n}, (_,i) => i);
      push({ sorted: sortedIndices, line: 0, msg: '快速排序完成！' });
      break;
    }
    // ===== 6 - 堆排序 =====
    case 6: {
      let heapSize = n;
      function heapify(nn, i) {
        let max = i, l = 2*i+1, r = 2*i+2;
        push({ active: [i], sorted: sortedIndices, line: 14, msg: `调整节点 arr[${i}]=${arr[i]}，左子=${l<nn?arr[l]:'-'}，右子=${r<nn?arr[r]:'-'}` });
        if (l < nn && arr[l] > arr[max]) { max = l; }
        if (r < nn && arr[r] > arr[max]) { max = r; }
        if (max !== i) {
          [arr[i], arr[max]] = [arr[max], arr[i]];
          push({ swaps: [i, max], sorted: sortedIndices, line: 18, msg: `arr[${max}] 更大，交换 arr[${i}] 和 arr[${max}] → ${arr[i]}、${arr[max]}` });
          heapify(nn, max);
        } else {
          push({ sorted: sortedIndices, line: 0, msg: `节点 arr[${i}] 满足堆性质` });
        }
      }
      push({ sorted: sortedIndices, line: 3, msg: '——— 建堆阶段 ———' });
      for (let i = Math.floor(n / 2) - 1; i >= 0; i--) heapify(n, i);
      push({ sorted: sortedIndices, line: 0, msg: '——— 排序阶段 ———' });
      for (let i = n - 1; i > 0; i--) {
        [arr[0], arr[i]] = [arr[i], arr[0]];
        sortedIndices = [i, ...sortedIndices];
        push({ swaps: [0, i], sorted: sortedIndices, line: 8, msg: `堆顶 arr[0]=${arr[0]} 与 arr[${i}]=${arr[i]} 交换，arr[${i}] 已就位` });
        heapify(i, 0);
      }
      sortedIndices = [0, ...sortedIndices];
      push({ sorted: sortedIndices, line: 0, msg: '堆排序完成！' });
      break;
    }
    // ===== 7 - 计数排序 =====
    case 7: {
      if (n === 0) break;
      let max = Math.max(...arr);
      let min = Math.min(...arr);
      let range = max - min + 1;
      push({ sorted: [], line: 0, msg: `计数排序：值域 [${min}..${max}]，范围=${range}` });
      let count = new Array(range).fill(0);
      let output = new Array(n);
      for (let v of arr) count[v - min]++;
      for (let i = 1; i < range; i++) count[i] += count[i-1];
      for (let i = n - 1; i >= 0; i--) {
        let v = arr[i];
        output[count[v - min] - 1] = v;
        count[v - min]--;
      }
      for (let i = 0; i < n; i++) {
        arr[i] = output[i];
        push({ swaps: [i], sorted: [], line: 21, msg: `回写 arr[${i}] = ${arr[i]}` });
      }
      sortedIndices = Array.from({length: n}, (_,i) => i);
      push({ sorted: sortedIndices, line: 0, msg: '计数排序完成！' });
      break;
    }
    // ===== 8 - 基数排序 =====
    case 8: {
      let max = Math.max(...arr);
      function doCountSort(exp) {
        let output = new Array(n);
        let count = new Array(10).fill(0);
        for (let v of arr) count[Math.floor(v / exp) % 10]++;
        for (let i = 1; i < 10; i++) count[i] += count[i-1];
        for (let i = n - 1; i >= 0; i--) {
          let d = Math.floor(arr[i] / exp) % 10;
          output[count[d] - 1] = arr[i];
          count[d]--;
        }
        for (let i = 0; i < n; i++) {
          arr[i] = output[i];
          push({ swaps: [i], sorted: [], line: 18, msg: `按 ${exp===1?'个':exp===10?'十':'百'} 位 ${exp} 排序：arr[${i}] = ${arr[i]}` });
        }
      }
      for (let exp = 1; Math.floor(max / exp) > 0; exp *= 10) {
        push({ sorted: [], line: 3, msg: `——— 按 ${exp===1?'个':exp===10?'十':'百'} 位排序（exp=${exp}）———` });
        doCountSort(exp);
      }
      sortedIndices = Array.from({length: n}, (_,i) => i);
      push({ sorted: sortedIndices, line: 0, msg: '基数排序完成！' });
      break;
    }
    // ===== 9 - 桶排序 =====
    case 9: {
      let buckets = Array.from({length: n}, () => []);
      let floatArr = arr.map(v => v / 100);
      push({ sorted: [], line: 0, msg: `将 ${n} 个元素分配到 ${n} 个桶中` });
      for (let i = 0; i < n; i++) {
        let bi = Math.min(Math.floor(floatArr[i] * n), n - 1);
        buckets[bi].push(floatArr[i]);
      }
      push({ sorted: [], line: 0, msg: '各桶内部排序' });
      for (let b of buckets) b.sort((a, b) => a - b);
      push({ sorted: [], line: 0, msg: '按序回写所有元素' });
      let idx = 0;
      for (let b of buckets) {
        for (let v of b) {
          arr[idx] = Math.round(v * 100);
          push({ swaps: [idx], sorted: [], line: 18, msg: `回写 arr[${idx}] = ${arr[idx]}` });
          idx++;
        }
      }
      sortedIndices = Array.from({length: n}, (_,i) => i);
      push({ sorted: sortedIndices, line: 0, msg: '桶排序完成！' });
      break;
    }
  }
  return steps;
}

// ---------- DOM 构建 ----------
let panelData = []; // [{ panelEl, steps, stepIdx, arr, bars, ... }]

function initSortPanel(idx) {
  const data = SORT_DATA[idx];
  const panel = document.createElement('div');
  panel.className = 'panel' + (idx === 0 ? ' active' : '');
  panel.id = 'panel-' + idx;

  const codeStr = data.javaCode.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = codeStr.split('\n');

  let codeHTML = '<pre><code>';
  for (let i = 0; i < lines.length; i++) {
    const ln = i + 1;
    const text = lines[i];
    codeHTML += `<div class="code-line" data-line="${ln}"><span class="lineno">${ln}</span><span class="line-code">${text}</span></div>`;
  }
  codeHTML += '</code></pre>';

  panel.innerHTML = `
    <div class="panel-header">
      <h2>${data.name}（${data.nameEn}）</h2>
      <div class="sub">${data.desc}</div>
    </div>
    <div class="complexity">
      <span class="label">时间复杂度</span>
      <span><span class="badge-best">●</span> 最优 ${data.timeBest}</span>
      <span><span class="badge-avg">●</span> 平均 ${data.timeAvg}</span>
      <span><span class="badge-worst">●</span> 最坏 ${data.timeWorst}</span>
      <span>空间复杂度 ${data.space}</span>
      <span>稳定性: <span class="${data.stable ? 'stable-yes' : 'stable-no'}">${data.stable ? '✔ 稳定' : '✘ 不稳定'}</span></span>
      <button class="copy-btn" data-idx="${idx}" style="margin-left:auto;">复制代码</button>
    </div>
    <div class="content">
      <div class="code-section">
        <div class="code-header">
          <span class="lang-label">Java</span>
        </div>
        <div class="code-scroll">${codeHTML}</div>
      </div>
      <div class="vis-section">
        <div class="vis-msg" id="msg-${idx}">点击「下一步」开始演示</div>
        <div class="vis-canvas-wrap" id="canvas-${idx}"></div>
        <div class="controls">
          <button class="btn-first" data-idx="${idx}">|◀ 首步</button>
          <button class="btn-prev" data-idx="${idx}">◀ 上一步</button>
          <button class="btn-next btn-primary" data-idx="${idx}">下一步 ▶</button>
          <button class="btn-last" data-idx="${idx}">末步 ▶|</button>
          <button class="btn-auto" data-idx="${idx}">播放 自动</button>
          <label>速度 <input type="range" class="speed-slider" min="1" max="10" value="5" data-idx="${idx}"></label>
          <label>数据量 <select class="size-select" data-idx="${idx}">
            <option value="6">6</option><option value="8">8</option><option value="10" selected>10</option>
            <option value="15">15</option><option value="20">20</option><option value="30">30</option>
          </select></label>
          <button class="btn-reset" data-idx="${idx}">🔄 重置</button>
          <span class="step-info" id="stepInfo-${idx}">步骤 0 / 0</span>
        </div>
      </div>
    </div>
    <div class="algo-desc">
      <strong>算法说明：</strong>${data.desc}
    </div>
  `;

  document.getElementById('panels').appendChild(panel);

  // 重新绑定重置按钮
  const resetBtn = panel.querySelector('.btn-reset');
  resetBtn.innerHTML = '🔄 重置';
  // 注册事件
  const sizeSelect = panel.querySelector('.size-select');
  const nextBtn = panel.querySelector('.btn-next');
  const prevBtn = panel.querySelector('.btn-prev');
  const firstBtn = panel.querySelector('.btn-first');
  const lastBtn = panel.querySelector('.btn-last');
  const autoBtn = panel.querySelector('.btn-auto');
  const speedSlider = panel.querySelector('.speed-slider');

  const state = { steps: [], stepIdx: 0, arr: [], size: 10, running: false, timer: null };
  panelData[idx] = state;

  function render() {
    const canvas = document.getElementById('canvas-' + idx);
    if (!state.steps.length || state.steps.length === 0) return;
    const step = state.steps[Math.min(state.stepIdx, state.steps.length - 1)];
    const arrVals = step.array;
    const maxVal = Math.max(...arrVals, 1);
    canvas.innerHTML = '';
    const _hotCanvasStyle = getComputedStyle(canvas);
    const _hotPadX = (parseFloat(_hotCanvasStyle.paddingLeft) || 0) + (parseFloat(_hotCanvasStyle.paddingRight) || 0);
    const _hotPadY = (parseFloat(_hotCanvasStyle.paddingTop) || 0) + (parseFloat(_hotCanvasStyle.paddingBottom) || 0);
    const W = Math.max(240, canvas.clientWidth - _hotPadX);
    const H = Math.max(180, canvas.clientHeight - _hotPadY);
    const barW = Math.max(6, Math.min(40, Math.floor((W - 20) / arrVals.length) - 2));

    arrVals.forEach((v, i) => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = (v / maxVal) * (H - 30) + 'px';
      bar.style.width = barW + 'px';
      bar.style.background = '#4a6cf7';
      if (step.sorted && step.sorted.includes(i)) bar.style.background = '#4caf50';
      if (step.compares && step.compares.includes(i)) bar.style.background = '#ff9800';
      if (step.swaps && step.swaps.includes(i)) bar.style.background = '#f44336';
      if (step.pivots && step.pivots.includes(i)) bar.style.background = '#9c27b0';
      if (step.active && step.active.includes(i)) bar.style.background = '#00bcd4';
      const label = document.createElement('span');
      label.className = 'bar-label';
      label.textContent = v;
      bar.appendChild(label);
      canvas.appendChild(bar);
    });

    const info = document.getElementById('stepInfo-' + idx);
    if (info) info.textContent = `步骤 ${state.stepIdx} / ${state.steps.length - 1}`;
    const msgEl = document.getElementById('msg-' + idx);
    if (msgEl) msgEl.textContent = step.msg || '';

    // 高亮代码行
    const codeLines = panel.querySelectorAll('.code-line');
    codeLines.forEach(el => el.classList.remove('highlight-line'));
    if (step.line > 0) {
      const target = panel.querySelector(`.code-line[data-line="${step.line}"]`);
      if (target) target.classList.add('highlight-line');
    }
  }

  function resetSteps() {
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
    state.running = false;
    autoBtn.textContent = '播放 自动';
    state.arr = generateRandomArray(state.size);
    state.steps = buildSteps(idx, state.arr);
    state.stepIdx = 0;
    render();
    updateButtons();
  }

  function updateButtons() {
    const atFirst = state.stepIdx <= 0;
    const atLast = state.stepIdx >= state.steps.length - 1;
    firstBtn.disabled = atFirst;
    prevBtn.disabled = atFirst;
    nextBtn.disabled = atLast;
    lastBtn.disabled = atLast;
  }

  sizeSelect.addEventListener('change', () => {
    state.size = parseInt(sizeSelect.value);
    resetSteps();
  });

  nextBtn.addEventListener('click', () => {
    if (state.stepIdx < state.steps.length - 1) { state.stepIdx++; render(); updateButtons(); }
  });
  prevBtn.addEventListener('click', () => {
    if (state.stepIdx > 0) { state.stepIdx--; render(); updateButtons(); }
  });
  firstBtn.addEventListener('click', () => {
    state.stepIdx = 0; render(); updateButtons();
  });
  lastBtn.addEventListener('click', () => {
    state.stepIdx = state.steps.length - 1; render(); updateButtons();
  });
  resetBtn.addEventListener('click', resetSteps);
  autoBtn.addEventListener('click', () => {
    if (state.running) {
      if (state.timer) { clearInterval(state.timer); state.timer = null; }
      state.running = false;
      autoBtn.textContent = '播放 自动';
    } else {
      state.running = true;
      autoBtn.textContent = '⏸ 暂停';
      const speed = parseInt(speedSlider.value);
      const delay = Math.max(20, 120 - speed * 10);
      state.timer = setInterval(() => {
        if (state.stepIdx < state.steps.length - 1) {
          state.stepIdx++;
          render();
          updateButtons();
        } else {
          clearInterval(state.timer);
          state.timer = null;
          state.running = false;
          autoBtn.textContent = '播放 自动';
        }
      }, delay);
    }
  });

  // 复制代码
  panel.querySelector('.copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(data.javaCode).then(() => {
      const btn = panel.querySelector('.copy-btn');
      const orig = btn.textContent;
      btn.textContent = '✓ 已复制';
      setTimeout(() => btn.textContent = orig, 1500);
    }).catch(() => alert('复制失败'));
  });

  // 把 render 和 state 存到 panelData 供 tab 切换时调用
  state.render = render;
  panelData[idx] = state;

  // 初始化
  state.size = 10;
  resetSteps();

  // resize re-render
  const ro = new ResizeObserver(() => render());
  ro.observe(document.getElementById('canvas-' + idx));
}

// ===================== 启动 =====================
SORT_DATA.forEach((_, idx) => {
  panelData.push(null);
  initSortPanel(idx);
});

// Tab 切换
document.querySelectorAll('.sort-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    // 暂停所有面板的自动播放
    panelData.forEach(s => { if (s && s.timer) { clearInterval(s.timer); s.timer = null; s.running = false; } });
    document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.btn-auto').forEach(b => b.textContent = '播放 自动');
    tab.classList.add('active');
    const idx = parseInt(tab.dataset.idx);
    document.getElementById('panel-' + idx).classList.add('active');
    // 触发渲染（适配新容器尺寸）
    const s = panelData[idx];
    if (s && s.render) s.render();
  });
});
</script>

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
