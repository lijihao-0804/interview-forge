    <h2>01 背包 倒序 VS 正序 遍历演示（nums=[1,5,11,5], target=11）</h2>
    <div class="info" style="text-align:center;">
        规则：每个数字<strong>只能选 1 次</strong> | 总和=22 → 目标 target = 11
    </div>

    <div class="wrap">
        <!-- 左侧：正确倒序遍历 -->
        <div class="box">
            <h3>✅ 正确：倒序遍历（01背包，不重复选物品）</h3>
            <div class="info">
                当前物品：<span id="itemDesc1">暂无</span>
                <br>遍历下标 j：<span id="jDesc1">-</span>
            </div>
            <div class="dp-row" id="dpContainer1"></div>
            <div class="desc" id="desc1">初始状态：dp[0] = true（和为0一定能凑出）</div>
        </div>

        <!-- 右侧：错误正序遍历 -->
        <div class="box">
            <h3>❌ 错误：正序遍历（会重复选取同一物品）</h3>
            <div class="info">
                当前物品：<span id="itemDesc2">暂无</span>
                <br>遍历下标 j：<span id="jDesc2">-</span>
            </div>
            <div class="dp-row" id="dpContainer2"></div>
            <div class="desc" id="desc2">初始状态：dp[0] = true</div>
        </div>
    </div>

    <div class="btn-group">
        <button id="nextBtn">下一步</button>
        <button id="resetBtn">重置重来</button>
    </div>

<script>
// 全局配置
const nums = [1, 5, 11, 5];
const target = 11;
const totalLen = target + 1;

// 状态变量
let dpReverse = new Array(totalLen).fill(false); // 倒序dp
let dpForward = new Array(totalLen).fill(false); // 正序dp
let itemIdx = 0;    // 当前遍历第几个物品
let jReverse = -1;  // 倒序j指针
let jForward = -1; // 正序j指针
let stepState = "itemStart"; // 阶段：itemStart / jRun / end

// DOM
const dpContainer1 = document.getElementById('dpContainer1');
const dpContainer2 = document.getElementById('dpContainer2');
const itemDesc1 = document.getElementById('itemDesc1');
const jDesc1 = document.getElementById('jDesc1');
const desc1 = document.getElementById('desc1');
const itemDesc2 = document.getElementById('itemDesc2');
const jDesc2 = document.getElementById('jDesc2');
const desc2 = document.getElementById('desc2');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');

// 渲染dp数组
function renderDp(container, dpArr, currJ) {
    container.innerHTML = '';
    for (let i = 0; i < dpArr.length; i++) {
        const cell = document.createElement('div');
        cell.className = `dp-cell ${dpArr[i] ? 'true' : 'false'}`;
        if (i === currJ) cell.classList.add('curr');
        cell.innerText = dpArr[i] ? 'T' : 'F';
        container.appendChild(cell);
    }
}

// 初始化
function init() {
    dpReverse.fill(false);
    dpForward.fill(false);
    dpReverse[0] = true;
    dpForward[0] = true;
    itemIdx = 0;
    jReverse = -1;
    jForward = -1;
    stepState = "itemStart";

    renderDp(dpContainer1, dpReverse, -1);
    renderDp(dpContainer2, dpForward, -1);

    itemDesc1.innerText = "暂无";
    jDesc1.innerText = "-";
    desc1.innerText = "初始状态：dp[0] = true（和为0一定能凑出）";

    itemDesc2.innerText = "暂无";
    jDesc2.innerText = "-";
    desc2.innerText = "初始状态：dp[0] = true";

    nextBtn.disabled = false;
}

// 单步逻辑
function nextStep() {
    if (itemIdx >= nums.length) {
        desc1.innerText = "✅ 所有物品遍历完成，最终结果";
        desc2.innerText = "❌ 正序遍历重复选数，结果失真";
        nextBtn.disabled = true;
        return;
    }

    const currNum = nums[itemIdx];

    // 阶段1：开始处理当前物品
    if (stepState === "itemStart") {
        itemDesc1.innerText = `第 ${itemIdx+1} 件物品：${currNum}`;
        itemDesc2.innerText = `第 ${itemIdx+1} 件物品：${currNum}`;

        // 倒序从 target 往下
        jReverse = target;
        // 正序从 currNum 往上
        jForward = currNum;

        desc1.innerText = `开始处理物品 ${currNum}，倒序 j 从 ${target} 向前遍历`;
        desc2.innerText = `开始处理物品 ${currNum}，正序 j 从 ${currNum} 向后遍历`;

        stepState = "jRun";
        renderDp(dpContainer1, dpReverse, jReverse);
        renderDp(dpContainer2, dpForward, jForward);
        return;
    }

    // 阶段2：逐个 j 执行状态转移
    if (stepState === "jRun") {
        // ========== 倒序更新（正确） ==========
        if (jReverse >= currNum) {
            const old = dpReverse[jReverse];
            dpReverse[jReverse] = dpReverse[jReverse] || dpReverse[jReverse - currNum];
            jDesc1.innerText = `j = ${jReverse}`;
            desc1.innerText =
                `倒序 j=${jReverse}：dp[${jReverse}] = dp[${jReverse}] || dp[${jReverse}-${currNum}]`
                + (old !== dpReverse[jReverse] ? " → 状态变为 TRUE" : " → 状态不变");
            renderDp(dpContainer1, dpReverse, jReverse);
            jReverse--;
        }

        // ========== 正序更新（错误，会重复选） ==========
        if (jForward <= target) {
            const old = dpForward[jForward];
            dpForward[jForward] = dpForward[jForward] || dpForward[jForward - currNum];
            jDesc2.innerText = `j = ${jForward}`;
            desc2.innerText =
                `正序 j=${jForward}：dp[${jForward}] = dp[${jForward}] || dp[${jForward}-${currNum}]`
                + (old !== dpForward[jForward] ? " → 状态变为 TRUE" : " → 状态不变（易重复选当前物品）");
            renderDp(dpContainer2, dpForward, jForward);
            jForward++;
        }

        // 当前物品的 j 遍历全部结束
        if (jReverse < currNum && jForward > target) {
            // 提前终止：已经找到 target
            if (dpReverse[target]) {
                desc1.innerText = `🎉 已凑出目标 ${target}，可以分割子集！`;
                nextBtn.disabled = true;
                return;
            }
            itemIdx++;
            stepState = "itemStart";
            return;
        }
    }
}

// 绑定事件
nextBtn.addEventListener('click', nextStep);
resetBtn.addEventListener('click', init);

// 页面加载初始化
window.onload = init;
</script>

<script id="hot100-a11y">
(() => {
  const tabLike = document.querySelectorAll('.sort-tab, .ds-tab, .code-tab, .preset-btn');
  const syncState = (item) => item.setAttribute('aria-pressed', item.classList.contains('active') ? 'true' : 'false');
  tabLike.forEach((item) => {
    if (!item.hasAttribute('role')) item.setAttribute('role', 'button');
    if (!item.hasAttribute('tabindex')) item.setAttribute('tabindex', '0');
    syncState(item);
    item.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); item.click(); }
    });
    new MutationObserver(() => syncState(item)).observe(item, { attributes: true, attributeFilter: ['class'] });
  });
  document.querySelectorAll('button').forEach((button) => { if (!button.type) button.type = 'button'; });
  document.querySelectorAll('input, select, textarea').forEach((control) => {
    if (control.matches('[aria-label], [aria-labelledby]')) return;
    if (control.id && document.querySelector(`label[for="${CSS.escape(control.id)}"]`)) return;
    if (control.closest('label')) return;
    const fallback = control.getAttribute('placeholder') || control.getAttribute('name') || control.id || (control.type === 'range' ? '播放速度' : '参数');
    control.setAttribute('aria-label', fallback);
  });
  document.querySelectorAll('canvas').forEach((canvas) => {
    if (!canvas.hasAttribute('role')) canvas.setAttribute('role', 'img');
    if (!canvas.hasAttribute('aria-label')) {
      const heading = canvas.closest('.panel')?.querySelector('h2, h3')?.textContent?.trim();
      canvas.setAttribute('aria-label', `${heading || document.title} 的算法状态图`);
    }
    canvas.parentElement?.classList.add('hot100-native-canvas');
  });
  document.querySelectorAll('.vis-canvas-wrap').forEach((stage) => {
    if (stage.querySelector('.bar-wrapper')) stage.classList.add('hot100-bar-stage');
  });
  document.querySelectorAll('.log, .status, .vis-msg, .desc').forEach((node) => {
    if (!node.hasAttribute('aria-live')) node.setAttribute('aria-live', 'polite');
  });
  const embedParams = new URLSearchParams(location.search);
  if (embedParams.get('embed') === '1') {
    const panelIndex = embedParams.get('panel');
    if (panelIndex !== null) {
      const panelTab = [...document.querySelectorAll('.sort-tab, .ds-tab')]
        .find((item) => item.dataset.idx === panelIndex);
      panelTab?.click();
    }
    const mode = embedParams.get('mode');
    const modeSelect = document.getElementById('mode');
    if (mode && modeSelect && [...modeSelect.options].some((option) => option.value === mode)) {
      modeSelect.value = mode;
      modeSelect.dispatchEvent(new Event('change', { bubbles: true }));
    }
    const reportHeight = () => requestAnimationFrame(() => {
      const bottoms = [...document.body.children]
        .filter((item) => getComputedStyle(item).display !== 'none')
        .map((item) => item.getBoundingClientRect().bottom);
      const height = Math.max(320, Math.ceil(Math.max(0, ...bottoms) + 12));
      parent.postMessage({ type: 'hot100:visual-height', height }, '*');
    });
    new ResizeObserver(reportHeight).observe(document.body);
    new MutationObserver(reportHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'hot100:measure') reportHeight();
    });
    window.addEventListener('load', reportHeight, { once: true });
    document.fonts?.ready.then(reportHeight);
    reportHeight();
  }
})();
</script>
