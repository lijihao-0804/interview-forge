<script id="hot100-embed-bootstrap">
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('embed') !== '1') return;
  document.documentElement.classList.add('hot100-embedded');
  if (params.has('panel')) document.documentElement.classList.add('hot100-single-panel');
})();
</script>

<style id="hot100-polish">
:root {
  color-scheme: light dark;
  --hot-bg: #f4f6fb;
  --hot-surface: #ffffff;
  --hot-surface-soft: #f8f9fd;
  --hot-text: #182235;
  --hot-muted: #66748a;
  --hot-line: #dfe4ee;
  --hot-brand: #5654d4;
  --hot-brand-soft: #eeedff;
  --hot-on-brand: #ffffff;
  --hot-hero-start: #314fc7;
  --hot-hero-end: #5546ca;
  --hot-hero-text: #ffffff;
  --hot-hero-muted: #e7ebff;
  --hot-success: #167a52;
  --hot-success-soft: #def7e9;
  --hot-warning: #934b00;
  --hot-warning-soft: #fff0d8;
  --hot-danger: #b52b3a;
  --hot-danger-soft: #ffe5e9;
  --hot-canvas-bg: #f8fafc;
  --hot-canvas-line: #c9d2df;
  --hot-shadow: 0 12px 34px rgba(33,45,73,.075);
}
@media (prefers-color-scheme: dark) {
  :root {
    --hot-bg: #0f131b;
    --hot-surface: #181e29;
    --hot-surface-soft: #141a24;
    --hot-text: #eaf0fa;
    --hot-muted: #a3afc2;
    --hot-line: #313b4c;
    --hot-brand: #b1afff;
    --hot-brand-soft: #292955;
    --hot-on-brand: #111521;
    --hot-hero-start: #263677;
    --hot-hero-end: #39256f;
    --hot-hero-text: #f8f9ff;
    --hot-hero-muted: #dfe4ff;
    --hot-success: #79d8a8;
    --hot-success-soft: #183c2d;
    --hot-warning: #ffc174;
    --hot-warning-soft: #47311b;
    --hot-danger: #ff9ba6;
    --hot-danger-soft: #47242b;
    /* 旧 Canvas 内部仍使用深色文字，因此绘图区保持柔和浅底以确保可读。 */
    --hot-canvas-bg: #edf2f7;
    --hot-canvas-line: #bac5d2;
    --hot-shadow: 0 16px 42px rgba(0,0,0,.22);
  }
}
* { box-sizing: border-box; }
html { min-width: 0; background: var(--hot-bg) !important; }
body {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 0 34px !important;
  color: var(--hot-text) !important;
  background: radial-gradient(circle at 12% 0%, color-mix(in srgb,var(--hot-brand) 9%,transparent), transparent 34rem), var(--hot-bg) !important;
}
:focus-visible { outline: 3px solid color-mix(in srgb,var(--hot-brand) 48%,transparent) !important; outline-offset: 3px; }
.hot100-topnav {
  width: min(100% - 24px, 1400px);
  margin: 12px auto 16px;
  padding: 10px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--hot-muted);
  background: color-mix(in srgb,var(--hot-surface) 94%,transparent);
  border: 1px solid var(--hot-line);
  border-radius: 13px;
  box-shadow: var(--hot-shadow);
  font: 14px/1.45 system-ui, "Microsoft YaHei", sans-serif;
}
.hot100-topnav .hot100-links { display: flex; gap: 7px; flex-wrap: wrap; }
.hot100-topnav a { padding: 6px 9px; color: var(--hot-brand); background: var(--hot-brand-soft); border-radius: 7px; text-decoration: none; }
.hot100-topnav a:hover { filter: brightness(.97); }
.hot100-topnav strong { min-width: 0; color: var(--hot-text); overflow-wrap: anywhere; }
body > .container, body > .shell, body > main, body > .wrap {
  width: min(100% - 24px, 1400px) !important;
  max-width: 1400px !important;
  margin-left: auto !important;
  margin-right: auto !important;
  padding-bottom: 44px;
}
body > h1, body > h2, body > h3, body > .info, body > .desc, body > .btn-group {
  width: min(100% - 24px, 1400px);
  margin-left: auto !important;
  margin-right: auto !important;
}
canvas, svg, img { max-width: 100% !important; }
button, input, select, textarea { max-width: 100%; }
body h1 {
  margin-top: 0;
  color: var(--hot-text) !important;
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.2;
  letter-spacing: -.02em;
}
body h2 { color: var(--hot-text); line-height: 1.3; }
body h3 { color: var(--hot-text); line-height: 1.4; }
button, input, select, textarea { font: inherit; }
button {
  min-height: 36px;
  padding: 8px 12px;
  color: var(--hot-text);
  background: var(--hot-surface);
  border: 1px solid var(--hot-line) !important;
  border-radius: 9px !important;
  box-shadow: 0 2px 8px rgba(33,45,73,.04);
  transition: transform .16s ease, border-color .16s ease, background-color .16s ease, box-shadow .16s ease;
}
button:hover:not(:disabled) {
  border-color: color-mix(in srgb,var(--hot-brand) 42%,var(--hot-line)) !important;
  background: color-mix(in srgb,var(--hot-brand-soft) 58%,var(--hot-surface));
  box-shadow: 0 5px 14px rgba(33,45,73,.08);
  transform: translateY(-1px);
}
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { opacity: .52; cursor: not-allowed; box-shadow: none; }
button.primary, button.btn-primary, button.btn-apply, .primary, .btn-primary, .btn-apply {
  color: var(--hot-on-brand) !important;
  background: var(--hot-brand) !important;
  border-color: var(--hot-brand) !important;
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), select, textarea {
  min-height: 36px;
  padding: 7px 10px !important;
  color: var(--hot-text) !important;
  background: var(--hot-surface) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 8px !important;
}
input[type="range"] { accent-color: var(--hot-brand); }
.controls, .toolbar, .input-row, .preset-row, .sort-tabs, .ds-tabs, .op-bar, .btn-group, .legend { flex-wrap: wrap !important; }
.controls, .toolbar, .input-row, .preset-row, .op-bar, .btn-group { gap: 9px !important; }
/* 原生实验室也统一成“舞台/状态说明 → 控制条”。历史页面的 toolbar
   有些写在 panel 之前，这里用稳定的视觉顺序兜底；新页面应直接按该顺序写 DOM。 */
body > main.shell { display: flex; flex-direction: column; }
body > main.shell > .panel,
body > main.shell > .layout { order: 20; }
body > main.shell > .toolbar {
  order: 30;
  width: 100%;
  margin: 14px 0 0 !important;
  padding: 12px 0 0 !important;
  border-top: 1px solid var(--hot-line);
  justify-content: flex-start;
}
.sort-tabs, .ds-tabs {
  display: flex;
  gap: 7px !important;
  margin-block: 18px !important;
  padding: 4px !important;
  background: color-mix(in srgb,var(--hot-surface) 84%,transparent) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 13px !important;
  box-shadow: 0 6px 20px rgba(33,45,73,.045);
}
.sort-tab, .ds-tab, .code-tab, .preset-btn {
  padding: 8px 11px !important;
  color: var(--hot-muted) !important;
  background: transparent !important;
  border: 1px solid transparent !important;
  border-radius: 9px !important;
  cursor: pointer;
  transition: color .16s ease, background-color .16s ease, border-color .16s ease;
}
.sort-tab:hover, .ds-tab:hover, .code-tab:hover, .preset-btn:hover {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;
}
.sort-tab.active, .ds-tab.active, .code-tab.active, .preset-btn.active {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;
  border-color: color-mix(in srgb,var(--hot-brand) 28%,var(--hot-line)) !important;
  box-shadow: 0 3px 10px rgba(33,45,73,.065);
}
.container, .shell, main, .wrap, .content, .layout, .code-section, .vis-section, .content > *, .layout > *, .wrap > * { min-width: 0 !important; }
.vis-canvas-wrap, .panel, .box, .table-responsive, .code-scroll, .notes-section { max-width: 100%; }
.table-responsive, .code-scroll, .notes-section { overflow: auto; }
.panel { overflow: hidden !important; }
.box { overflow: visible; }
.panel, .box {
  color: var(--hot-text);
  background-color: var(--hot-surface) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 15px !important;

}
.code-section { border-color: var(--hot-line) !important; }
.vis-section { background-color: var(--hot-surface-soft) !important; }
.vis-msg, .target-info, .algo-desc, .desc, .status, .log {

  border-color: var(--hot-line) !important;
}
.vis-msg, .target-info, .algo-desc, .desc {

}
.legend {

}

/* 题头必须使用独立的前景/背景色对；不能继承正文的灰色文字。 */
.panel-header {
  color: var(--hot-hero-text) !important;
  background: linear-gradient(135deg,var(--hot-hero-start),var(--hot-hero-end)) !important;
}
.panel-header h1, .panel-header h2, .panel-header h3 {
  color: inherit !important;
}
.panel-header .sub, .panel-header p, .panel-header .info {

  opacity: 1 !important;
  line-height: 1.65;
  white-space: normal !important;
  overflow-wrap: anywhere;
}
/* 复杂度徽标中的色点不是第二层徽标，避免白块套白块。 */
.complexity .badge-time, .complexity .badge-space {
  display: inline !important;
  margin-right: 6px;
  padding: 0 !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
}
/* 动画安全区：标签、指针和高亮不再贴边或被相邻区域裁掉。 */
.lane { min-height: 220px !important; padding: 36px 6px !important; row-gap: 52px !important; overflow: visible !important; }
.lane .label.top { bottom: 66px !important; }
.lane .label.bottom { top: 66px !important; }
.bars { height: 300px !important; padding-top: 38px !important; padding-bottom: 34px !important; overflow: visible !important; }
.bars .col { min-width: 0; }
.bars .idx, .bars .answer { z-index: 2; }
.hot100-bar-stage {

  overflow-x: auto !important;

.hot100-bar-stage .bar-wrapper { z-index: 2; }

.hot100-native-canvas {

/* 高亮使用边框/阴影，不再放大后覆盖相邻格子。 */

.curr, .board-cell.current { box-shadow: inset 0 0 0 2px color-mix(in srgb,var(--hot-brand) 58%,transparent) !important; }
.bar-label, .idx { color: var(--hot-muted) !important; }
pre { max-width: 100%; overflow: auto !important; }
table { max-width: 100%; }

@media (prefers-color-scheme: dark) {
  body > .container > h1, body > .shell > h1, body > main > h1, body > h1, body > h2 { color: var(--hot-text) !important; }
  .panel, .box, .code-section, .vis-section, .notes-section, .input-section, .top-tags,

  .sub, .muted, .info, .row-label, .step-info, .size-info { color: var(--hot-muted) !important; }
  input, select, textarea { color: var(--hot-text) !important; background: var(--hot-surface) !important; border-color: var(--hot-line) !important; }
  button:not(.primary):not(.btn-primary):not(.active) { color: var(--hot-text); background-color: var(--hot-surface); border-color: var(--hot-line); }
}
/* 状态配色：前景与底色成对定义，避免只改背景造成文字消失。 */
.code-line.highlight-line {
  color: var(--hot-text) !important;
  background: var(--hot-warning-soft) !important;
  box-shadow: inset 3px 0 var(--hot-warning);
}
.code-line.highlight-line .lineno { color: var(--hot-warning) !important; }

}
.header { color: var(--hot-muted) !important; background: transparent !important; border-color: transparent !important; }
.filled, .cell.in, .frontier {

}

  color: var(--hot-success) !important;

.val-box.current {

<script>
/* ===== 二维 DP 状态转移：1143 / 72 / 62。逐格填表，先亮依赖、再写结果 ===== */
var el = DemoKit.el;

function renderTable(view, stage) {

  (view.g || []).forEach(function (rowVals, r) {

    rh.style.cssText = "text-align:center;min-width:44px";

    stage.appendChild(f);
  }
  if (view.note) stage.appendChild(el("div", "dk-note", view.note));
}

function blank(rows, cols, v) {
  var m = [], r, c;
  for (r = 0; r < rows; r++) { m.push([]); for (c = 0; c < cols; c++) m[r].push(v === undefined ? null : v); }
  return m;
}
function copy2(g) {
  var m = [], r;
  for (r = 0; r < g.length; r++) m.push(g[r].slice());
  return m;
}

var DEMOS = {

  "1143": {
    no: "1143", title: "最长公共子序列", tag: "二维 DP · 相同取左上，不同取上/左较大者",
    example: "输入：两个字符串 a、b　输出：最长公共「子序列」的长度（可以不连续，但必须保持相对顺序）",
    sizes: [
      { label: "a=abcde, b=ace（入门表，LCS=3）", a: "abcde", b: "ace" },
      { label: "a=abcbdab, b=bdcaba（经典大表，LCS=4）", a: "abcbdab", b: "bdcaba" },
      { label: "a=oxcpqrsvwf, b=shmtulqrypy（几乎不重合，LCS=2）", a: "oxcpqrsvwf", b: "shmtulqrypy" }

    defaultSize: 0,
    stageHeight: 520,
    code: {
      title: "对照代码",
      langs: {
        java: [
          "int[][] dp = new int[m + 1][n + 1];   // dp[i][j]：a 前 i 个 与 b 前 j 个 的 LCS 长度",
          "for (int i = 1; i <= m; i++) {",
          "    for (int j = 1; j <= n; j++) {",
          "        if (a.charAt(i - 1) == b.charAt(j - 1))",
          "            dp[i][j] = dp[i - 1][j - 1] + 1;              // 末尾字符相同 → 左上 + 1",
          "        else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);  // 不同 → 丢掉其中一个",
          "    } } return dp[m][n];"
        ],
        cpp: [
          "vector<vector<int>> dp(m + 1, vector<int>(n + 1, 0));  // dp[i][j]：前 i 与前 j 的 LCS",
          "for (int i = 1; i <= m; ++i) {",
          "    for (int j = 1; j <= n; ++j) {",
          "        if (a[i - 1] == b[j - 1])",
          "            dp[i][j] = dp[i - 1][j - 1] + 1;              // 末尾字符相同 → 左上 + 1",
          "        else dp[i][j] = max(dp[i - 1][j], dp[i][j - 1]);  // 不同 → 丢掉其中一个",
          "    } } return dp[m][n];"
        ],
        python: [
          "dp = [[0] * (n + 1) for _ in range(m + 1)]   # dp[i][j]：前 i 个 与 前 j 个 的 LCS",

          "        if a[i - 1] == b[j - 1]:",

          "        else: dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])  # 不同 → 丢掉其中一个",
          "return dp[m][n]"
        ],
        go: [
          "dp := make([][]int, m+1);  for i := range dp { dp[i] = make([]int, n+1) }",
          "for i := 1; i <= m; i++ {",
          "    for j := 1; j <= n; j++ {",
          "        if a[i-1] == b[j-1] {",
          "            dp[i][j] = dp[i-1][j-1] + 1                   // 末尾字符相同 → 左上 + 1",
          "        } else if dp[i-1][j] > dp[i][j-1] { dp[i][j] = dp[i-1][j] } else { dp[i][j] = dp[i][j-1] }",
          "    } };  return dp[m][n]"
        ],
        c: [
          "int dp[MAXM][MAXN] = {{0}};   /* dp[i][j]：a 前 i 个 与 b 前 j 个 的 LCS 长度 */",
          "for (int i = 1; i <= m; i++) {",
          "    for (int j = 1; j <= n; j++) {",
          "        if (a[i - 1] == b[j - 1])",
          "            dp[i][j] = dp[i - 1][j - 1] + 1;              /* 相同 → 左上 + 1 */",
          "        else dp[i][j] = dp[i-1][j] > dp[i][j-1] ? dp[i-1][j] : dp[i][j-1];",
          "    } } return dp[m][n];"
        ]
      }
    },
    invariants: [
      { label: "每格都不小于它的上方和左方", test: function (v) {

            if (v.dp[r][c] < v.dp[r - 1][c] || v.dp[r][c] < v.dp[r][c - 1]) return false;

            if (v.dp[r][c] - v.dp[r - 1][c - 1] > 1) return false;

    ],
    build: function (ctx, size) {
      var a = (size && size.a) || "abcde";
      var b = (size && size.b) || "ace";
      var m = a.length, n = b.length;
      var dp = blank(m + 1, n + 1, 0);
      var colHead = ["∅"], rowHead = ["∅"], i, j;
      for (j = 0; j < n; j++) colHead.push(b[j]);
      for (i = 0; i < m; i++) rowHead.push(a[i]);
      var filledR = 0, filledC = n;

      function V(cur, deps, kind, formula, note) {
        var st = blank(m + 1, n + 1, ""), r, c;
        for (r = 0; r <= m; r++) for (c = 0; c <= n; c++) {
          if (r === 0 || c === 0) st[r][c] = "done";
          else if (r > filledR || (r === filledR && c > filledC)) st[r][c] = "dim";
        }
        (deps || []).forEach(function (d) { st[d[0]][d[1]] = "cmp"; });
        if (cur) st[cur[0]][cur[1]] = kind || "hot";
        return {
          g: copy2(dp), st: st, colHead: colHead, rowHead: rowHead,
          formula: formula, note: note,
          dp: copy2(dp), cols: n + 1, filledR: filledR, filledC: filledC,
          vars: [["a", a], ["b", b],
                 ["当前格", cur ? "dp[" + cur[0] + "][" + cur[1] + "]" : "—"],
                 ["右下角", dp[m][n]]]
        };
      }

      ctx.step("dp[i][j] = a 的前 i 个字符 与 b 的前 j 个字符 的 LCS 长度。第 0 行第 0 列是空串，全为 0",
        V(null, null, null, "dp[i][j] = 相同 ? 左上+1 : max(上, 左)",
          "表格比字符串多一行一列，就是为了让“空串”这一行天然成立，省掉一堆边界判断"), { line: 1 });

      for (i = 1; i <= m; i++) {
        for (j = 1; j <= n; j++) {
          var same = a[i - 1] === b[j - 1];
          var deps = same ? [[i - 1, j - 1]] : [[i - 1, j], [i, j - 1]];
          filledR = i; filledC = j - 1;
          ctx.step(
            same
              ? "dp[" + i + "][" + j + "]：'" + a[i - 1] + "' == '" + b[j - 1] + "' → 只看左上 dp[" + (i - 1) + "][" + (j - 1) + "] = " + dp[i - 1][j - 1]
              : "dp[" + i + "][" + j + "]：'" + a[i - 1] + "' ≠ '" + b[j - 1] + "' → 看上方 " + dp[i - 1][j] + " 和左方 " + dp[i][j - 1],
            V([i, j], deps, "hot",
              same ? "dp[i][j] = dp[i-1][j-1] + 1" : "dp[i][j] = max(dp[i-1][j], dp[i][j-1])",
              same ? "两个末尾字符配成一对，剩下的部分就是左上角那个子问题"
                   : "末尾字符对不上，必须丢掉其中一个串的末尾字符，哪边留下的 LCS 长就用哪边"),
            { line: same ? 5 : 6 });

          dp[i][j] = same ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
          filledC = j;
          ctx.step("写入 dp[" + i + "][" + j + "] = " + dp[i][j],
            V([i, j], null, dp[i][j] > dp[i - 1][j - 1] ? "write" : "hot",
              same ? "dp[i][j] = dp[i-1][j-1] + 1" : "dp[i][j] = max(dp[i-1][j], dp[i][j-1])", null),
            { line: same ? 5 : 6 });
        }
      }

      ctx.step("填表完成！右下角 dp[" + m + "][" + n + "] = " + dp[m][n] + " 就是 LCS 长度",
        V([m, n], null, "target", "dp[i][j] = 相同 ? 左上+1 : max(上, 左)",
          "整张表 " + (m * n) + " 个格子，每格 O(1) → 时间 O(m·n)"), { line: 7 });
    },
    render: renderTable
  },

  "0072": {
    no: "72", title: "编辑距离", tag: "二维 DP · 三个方向同时竞争",
    example: "输入：单词 a、b　输出：把 a 变成 b 最少需要几次「插入 / 删除 / 替换」",
    sizes: [
      { label: "horse → ros（答案 3）", a: "horse", b: "ros" },
      { label: "intention → execution（答案 5，大表）", a: "intention", b: "execution" },
      { label: "sea → eat（答案 2）", a: "sea", b: "eat" }
    ],
    defaultSize: 0,
    stageHeight: 520,
    code: {
      title: "对照代码",
      langs: {
        java: [
          "int[][] dp = new int[m + 1][n + 1];",
          "for (int i = 0; i <= m; i++) dp[i][0] = i;   // 把 a 的前 i 个字符全删掉",
          "for (int j = 0; j <= n; j++) dp[0][j] = j;   // 往空串里插入 b 的前 j 个字符",
          "for (int i = 1; i <= m; i++) for (int j = 1; j <= n; j++) {",
          "    if (a.charAt(i - 1) == b.charAt(j - 1)) dp[i][j] = dp[i - 1][j - 1];  // 白嫖左上",
          "    else dp[i][j] = 1 + Math.min(dp[i - 1][j - 1],        // 替换",
          "                       Math.min(dp[i - 1][j], dp[i][j - 1]));  // 删除 / 插入",
          "} return dp[m][n];"
        ],
        cpp: [
          "vector<vector<int>> dp(m + 1, vector<int>(n + 1, 0));",
          "for (int i = 0; i <= m; ++i) dp[i][0] = i;   // 把 a 的前 i 个字符全删掉",
          "for (int j = 0; j <= n; ++j) dp[0][j] = j;   // 往空串里插入 b 的前 j 个字符",
          "for (int i = 1; i <= m; ++i) for (int j = 1; j <= n; ++j) {",
          "    if (a[i - 1] == b[j - 1]) dp[i][j] = dp[i - 1][j - 1];           // 白嫖左上",
          "    else dp[i][j] = 1 + min(dp[i - 1][j - 1],             // 替换",
          "                       min(dp[i - 1][j], dp[i][j - 1]));  // 删除 / 插入",
          "} return dp[m][n];"
        ],
        python: [
          "dp = [[0] * (n + 1) for _ in range(m + 1)]",
          "for i in range(m + 1): dp[i][0] = i          # 把 a 的前 i 个字符全删掉",
          "for j in range(n + 1): dp[0][j] = j          # 往空串里插入 b 的前 j 个字符",
          "for i, j in product(range(1, m + 1), range(1, n + 1)):",
          "    if a[i - 1] == b[j - 1]: dp[i][j] = dp[i - 1][j - 1]             # 白嫖左上",
          "    else: dp[i][j] = 1 + min(dp[i - 1][j - 1],           # 替换",
          "                             dp[i - 1][j], dp[i][j - 1])  # 删除 / 插入",
          "return dp[m][n]"
        ],
        go: [
          "dp := make([][]int, m+1);  for i := range dp { dp[i] = make([]int, n+1) }",
          "for i := 0; i <= m; i++ { dp[i][0] = i }     // 把 a 的前 i 个字符全删掉",
          "for j := 0; j <= n; j++ { dp[0][j] = j }     // 往空串里插入 b 的前 j 个字符",
          "for i := 1; i <= m; i++ { for j := 1; j <= n; j++ {",
          "    if a[i-1] == b[j-1] { dp[i][j] = dp[i-1][j-1]                    // 白嫖左上",
          "    } else { dp[i][j] = 1 + min3(dp[i-1][j-1],           // 替换",
          "                            dp[i-1][j], dp[i][j-1]) }    // 删除 / 插入",
          "} };  return dp[m][n]"
        ],
        c: [
          "int dp[MAXM][MAXN];",
          "for (int i = 0; i <= m; i++) dp[i][0] = i;   /* 把 a 的前 i 个字符全删掉 */",
          "for (int j = 0; j <= n; j++) dp[0][j] = j;   /* 往空串里插入 b 的前 j 个字符 */",
          "for (int i = 1; i <= m; i++) for (int j = 1; j <= n; j++) {",
          "    if (a[i - 1] == b[j - 1]) dp[i][j] = dp[i - 1][j - 1];  /* 白嫖左上 */",
          "    else dp[i][j] = 1 + min3(dp[i - 1][j - 1],           /* 替换 */",
          "                       dp[i - 1][j], dp[i][j - 1]);      /* 删除 / 插入 */",
          "} return dp[m][n];"
        ]
      }
    },
    invariants: [
      { label: "编辑距离 ≤ 两串长度的较大值", test: function (v) {
          return v.cur <= Math.max(v.m, v.n)
            ? "当前格 " + v.cur + " ≤ max(" + v.m + ", " + v.n + ")：最坏也就是全删再全插"
            : false;
        } },
      { label: "相邻格最多差 1", test: function (v) {
          var r, c;
          for (r = 1; r <= v.filledR; r++) for (c = 1; c < v.cols; c++) {
            if (r === v.filledR && c > v.filledC) break;
            if (Math.abs(v.dp[r][c] - v.dp[r - 1][c]) > 1) return false;
            if (Math.abs(v.dp[r][c] - v.dp[r][c - 1]) > 1) return false;
          }
          return "多看一个字符最多多花一次操作";
        } }
    ],
    build: function (ctx, size) {
      var a = (size && size.a) || "horse";
      var b = (size && size.b) || "ros";
      var m = a.length, n = b.length;
      var dp = blank(m + 1, n + 1, 0);
      var colHead = ["∅"], rowHead = ["∅"], i, j;
      for (j = 0; j < n; j++) colHead.push(b[j]);
      for (i = 0; i < m; i++) rowHead.push(a[i]);
      for (i = 0; i <= m; i++) dp[i][0] = i;
      for (j = 0; j <= n; j++) dp[0][j] = j;
      var filledR = 0, filledC = n;

      function V(cur, deps, kind, formula, note) {
        var st = blank(m + 1, n + 1, ""), r, c;
        for (r = 0; r <= m; r++) for (c = 0; c <= n; c++) {

        }

        if (cur) st[cur[0]][cur[1]] = kind || "hot";
        return {
          g: copy2(dp), st: st, colHead: colHead, rowHead: rowHead,
          formula: formula, note: note,
          dp: copy2(dp), cols: n + 1, m: m, n: n,
          cur: cur ? dp[cur[0]][cur[1]] : 0,
          filledR: filledR, filledC: filledC,
          vars: [["a", a], ["b", b],
                 ["当前格", cur ? "dp[" + cur[0] + "][" + cur[1] + "]" : "—"],
                 ["右下角", dp[m][n]]]
        };
      }

      ctx.step("第 0 列 = 把 a 的前 i 个字符全删掉（i 次）；第 0 行 = 往空串里插入 b 的前 j 个字符（j 次）",
        V(null, null, null, "dp[i][j] = 相同 ? 左上 : 1 + min(左上, 上, 左)",
          "这一圈边界不是“填 0”，而是真实的代价 —— 写错它整张表就全错"), { line: 2 });

      for (i = 1; i <= m; i++) {
        for (j = 1; j <= n; j++) {
          var same = a[i - 1] === b[j - 1];
          var deps = same ? [[i - 1, j - 1]] : [[i - 1, j - 1], [i - 1, j], [i, j - 1]];
          filledR = i; filledC = j - 1;
          if (same) {
            ctx.step("dp[" + i + "][" + j + "]：'" + a[i - 1] + "' == '" + b[j - 1] + "' → 这一对字符不用动，直接抄左上 " + dp[i - 1][j - 1],
              V([i, j], deps, "hot", "dp[i][j] = dp[i-1][j-1]",
                "相等时千万别再 +1 —— 不需要任何操作"), { line: 5 });
            dp[i][j] = dp[i - 1][j - 1];
          } else {
            var rep = dp[i - 1][j - 1], del = dp[i - 1][j], ins = dp[i][j - 1];
            var best = Math.min(rep, Math.min(del, ins));
            ctx.step("dp[" + i + "][" + j + "]：'" + a[i - 1] + "' ≠ '" + b[j - 1] + "' → 替换 " + rep + " / 删除 " + del + " / 插入 " + ins + "，取最小 " + best + " 再 +1",
              V([i, j], deps, "hot", "dp[i][j] = 1 + min(左上, 上, 左)",
                "左上=替换，上=删掉 a 的这个字符，左=往 a 里插入 b 的这个字符"), { line: 6 });
            dp[i][j] = best + 1;
