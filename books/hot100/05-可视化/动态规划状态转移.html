<script id="hot100-embed-bootstrap">
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('embed') !== '1') return;
  document.documentElement.classList.add('hot100-embedded');
  if (params.has('panel')) document.documentElement.classList.add('hot100-single-panel');
})();
</script>

<style id="hot100-polish">
:root {
  color-scheme: light dark;
  --hot-bg: #f4f6fb;
  --hot-surface: #ffffff;
  --hot-surface-soft: #f8f9fd;
  --hot-text: #182235;
  --hot-muted: #66748a;
  --hot-line: #dfe4ee;
  --hot-brand: #5654d4;
  --hot-brand-soft: #eeedff;
  --hot-on-brand: #ffffff;
  --hot-hero-start: #314fc7;
  --hot-hero-end: #5546ca;
  --hot-hero-text: #ffffff;
  --hot-hero-muted: #e7ebff;
  --hot-success: #167a52;
  --hot-success-soft: #def7e9;
  --hot-warning: #934b00;
  --hot-warning-soft: #fff0d8;
  --hot-danger: #b52b3a;
  --hot-danger-soft: #ffe5e9;
  --hot-canvas-bg: #f8fafc;
  --hot-canvas-line: #c9d2df;
  --hot-shadow: 0 12px 34px rgba(33,45,73,.075);
}
@media (prefers-color-scheme: dark) {
  :root {
    --hot-bg: #0f131b;
    --hot-surface: #181e29;
    --hot-surface-soft: #141a24;
    --hot-text: #eaf0fa;
    --hot-muted: #a3afc2;
    --hot-line: #313b4c;
    --hot-brand: #b1afff;
    --hot-brand-soft: #292955;
    --hot-on-brand: #111521;
    --hot-hero-start: #263677;
    --hot-hero-end: #39256f;
    --hot-hero-text: #f8f9ff;
    --hot-hero-muted: #dfe4ff;
    --hot-success: #79d8a8;
    --hot-success-soft: #183c2d;
    --hot-warning: #ffc174;
    --hot-warning-soft: #47311b;
    --hot-danger: #ff9ba6;
    --hot-danger-soft: #47242b;
    /* 旧 Canvas 内部仍使用深色文字，因此绘图区保持柔和浅底以确保可读。 */
    --hot-canvas-bg: #edf2f7;
    --hot-canvas-line: #bac5d2;
    --hot-shadow: 0 16px 42px rgba(0,0,0,.22);
  }
}
* { box-sizing: border-box; }
html { min-width: 0; background: var(--hot-bg) !important; }
body {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 0 34px !important;
  color: var(--hot-text) !important;
  background: radial-gradient(circle at 12% 0%, color-mix(in srgb,var(--hot-brand) 9%,transparent), transparent 34rem), var(--hot-bg) !important;
}
:focus-visible { outline: 3px solid color-mix(in srgb,var(--hot-brand) 48%,transparent) !important; outline-offset: 3px; }
.hot100-topnav {
  width: min(100% - 24px, 1400px);
  margin: 12px auto 16px;
  padding: 10px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--hot-muted);
  background: color-mix(in srgb,var(--hot-surface) 94%,transparent);
  border: 1px solid var(--hot-line);
  border-radius: 13px;
  box-shadow: var(--hot-shadow);
  font: 14px/1.45 system-ui, "Microsoft YaHei", sans-serif;
}
.hot100-topnav .hot100-links { display: flex; gap: 7px; flex-wrap: wrap; }
.hot100-topnav a { padding: 6px 9px; color: var(--hot-brand); background: var(--hot-brand-soft); border-radius: 7px; text-decoration: none; }
.hot100-topnav a:hover { filter: brightness(.97); }
.hot100-topnav strong { min-width: 0; color: var(--hot-text); overflow-wrap: anywhere; }
body > .container, body > .shell, body > main, body > .wrap {
  width: min(100% - 24px, 1400px) !important;
  max-width: 1400px !important;
  margin-left: auto !important;
  margin-right: auto !important;
  padding-bottom: 44px;
}
body > h1, body > h2, body > h3, body > .info, body > .desc, body > .btn-group {
  width: min(100% - 24px, 1400px);
  margin-left: auto !important;
  margin-right: auto !important;
}
canvas, svg, img { max-width: 100% !important; }
button, input, select, textarea { max-width: 100%; }
body h1 {
  margin-top: 0;
  color: var(--hot-text) !important;
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.2;
  letter-spacing: -.02em;
}
body h2 { color: var(--hot-text); line-height: 1.3; }
body h3 { color: var(--hot-text); line-height: 1.4; }
button, input, select, textarea { font: inherit; }
button {
  min-height: 36px;
  padding: 8px 12px;
  color: var(--hot-text);
  background: var(--hot-surface);
  border: 1px solid var(--hot-line) !important;
  border-radius: 9px !important;
  box-shadow: 0 2px 8px rgba(33,45,73,.04);
  transition: transform .16s ease, border-color .16s ease, background-color .16s ease, box-shadow .16s ease;
}
button:hover:not(:disabled) {
  border-color: color-mix(in srgb,var(--hot-brand) 42%,var(--hot-line)) !important;
  background: color-mix(in srgb,var(--hot-brand-soft) 58%,var(--hot-surface));
  box-shadow: 0 5px 14px rgba(33,45,73,.08);
  transform: translateY(-1px);
}
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { opacity: .52; cursor: not-allowed; box-shadow: none; }
button.primary, button.btn-primary, button.btn-apply, .primary, .btn-primary, .btn-apply {
  color: var(--hot-on-brand) !important;
  background: var(--hot-brand) !important;
  border-color: var(--hot-brand) !important;
}
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), select, textarea {
  min-height: 36px;
  padding: 7px 10px !important;
  color: var(--hot-text) !important;
  background: var(--hot-surface) !important;
  border: 1px solid var(--hot-line) !important;
  border-radius: 8px !important;
}
input[type="range"] { accent-color: var(--hot-brand); }
.controls, .toolbar, .input-row, .preset-row, .sort-tabs, .ds-tabs, .op-bar, .btn-group, .legend { flex-wrap: wrap !important; }
.controls, .toolbar, .input-row, .preset-row, .op-bar, .btn-group { gap: 9px !important; }
/* 原生实验室也统一成“舞台/状态说明 → 控制条”。历史页面的 toolbar
   有些写在 panel 之前，这里用稳定的视觉顺序兜底；新页面应直接按该顺序写 DOM。 */
body > main.shell { display: flex; flex-direction: column; }
body > main.shell > .panel,
body > main.shell > .layout { order: 20; }

  border: 1px solid var(--hot-line) !important;
  border-radius: 13px !important;
  box-shadow: 0 6px 20px rgba(33,45,73,.045);
}
.sort-tab, .ds-tab, .code-tab, .preset-btn {
  padding: 8px 11px !important;
  color: var(--hot-muted) !important;
  background: transparent !important;
  border: 1px solid transparent !important;
  border-radius: 9px !important;
  cursor: pointer;
  transition: color .16s ease, background-color .16s ease, border-color .16s ease;
}
.sort-tab:hover, .ds-tab:hover, .code-tab:hover, .preset-btn:hover {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;
}
.sort-tab.active, .ds-tab.active, .code-tab.active, .preset-btn.active {
  color: var(--hot-brand) !important;
  background: var(--hot-brand-soft) !important;

  box-shadow: 0 3px 10px rgba(33,45,73,.065);
}
.container, .shell, main, .wrap, .content, .layout, .code-section, .vis-section, .content > *, .layout > *, .wrap > * { min-width: 0 !important; }
.vis-canvas-wrap, .panel, .box, .table-responsive, .code-scroll, .notes-section { max-width: 100%; }
.table-responsive, .code-scroll, .notes-section { overflow: auto; }
.panel { overflow: hidden !important; }
.box { overflow: visible; }
.panel, .box {
  color: var(--hot-text);
  background-color: var(--hot-surface) !important;

.vis-msg, .target-info, .algo-desc, .desc, .status, .log {

}
.vis-msg, .target-info, .algo-desc, .desc {

}
.legend {

}

/* 题头必须使用独立的前景/背景色对；不能继承正文的灰色文字。 */
.panel-header {
  color: var(--hot-hero-text) !important;
  background: linear-gradient(135deg,var(--hot-hero-start),var(--hot-hero-end)) !important;
}

}
.panel-header .sub, .panel-header p, .panel-header .info {
  max-width: 88ch;

  white-space: normal !important;
  overflow-wrap: anywhere;
}
/* 复杂度徽标中的色点不是第二层徽标，避免白块套白块。 */
.complexity .badge-time, .complexity .badge-space {
  display: inline !important;
  margin-right: 6px;
  padding: 0 !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
}
/* 动画安全区：标签、指针和高亮不再贴边或被相邻区域裁掉。 */
.lane { min-height: 220px !important; padding: 36px 6px !important; row-gap: 52px !important; overflow: visible !important; }
.lane .label.top { bottom: 66px !important; }
.lane .label.bottom { top: 66px !important; }
.bars { height: 300px !important; padding-top: 38px !important; padding-bottom: 34px !important; overflow: visible !important; }
.bars .col { min-width: 0; }

.hot100-bar-stage {

pre { max-width: 100%; overflow: auto !important; }
table { max-width: 100%; }

@media (prefers-color-scheme: dark) {

<script id="hot100-theme-sync">
(() => {
  const root = document.documentElement;
  const apply = (v) => {
    if (v === "light" || v === "dark") root.setAttribute("data-theme", v);
    else root.removeAttribute("data-theme");
  };
  try { apply(localStorage.getItem("forge-theme")); } catch (e) { }
  window.addEventListener("storage", (e) => {
    if (!e || e.key === null || e.key === "forge-theme") {
      let v = null;
      try { v = localStorage.getItem("forge-theme"); } catch (err) { }
      apply(v);
    }
  });
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "forge-theme") apply(e.data.theme);
  });
})();

<body>
<nav aria-label="学习导航" class="hot100-topnav" data-hot100-nav=""><strong>二维动态规划状态转移</strong><span class="hot100-links"><a href="../../../index.html" target="_blank" rel="noopener noreferrer">学习面板</a><a href="index.html" target="_blank" rel="noopener noreferrer">可视化中心</a></span></nav><main class="shell"><a href="index.html" target="_blank" rel="noopener noreferrer">← 可视化中心</a><h1>二维动态规划状态转移</h1><div class="muted">逐格填表，观察当前状态只依赖已经计算完成的方向。</div><div class="toolbar"><select id="mode"><option value="lcs">1143. 最长公共子序列</option><option value="paths">62. 不同路径</option></select><button class="primary" id="step">填下一格</button><button id="reset">重置</button><button id="auto">自动播放</button></div><section class="panel"><div class="table" id="table"></div><div aria-live="polite" class="log" id="log"></div></section></main>
<script>
const $ = id => document.getElementById(id);
let s, timer = null, playing = false;
const phaseNames = { compare: "比较", dependency: "读取依赖", formula: "推导公式", write: "写入单元格", done: "完成" };
function stop() {
  if (timer) { clearTimeout(timer); timer = null; }
  playing = false;
  $("auto").textContent = "自动播放";
}
function finished() { return s.r >= s.rows; }
function preparePending() {
  const lcs = $("mode").value === "lcs";
  const r = s.r, c = s.c;
  if (lcs) {
    const same = s.a[r - 1] === s.b[c - 1];
    const deps = same ? [[r - 1, c - 1]] : [[r - 1, c], [r, c - 1]];
    const value = same ? s.dp[r - 1][c - 1] + 1 : Math.max(s.dp[r - 1][c], s.dp[r][c - 1]);
    s.pending = { deps, value, same };
    s.msg = same
      ? "比较 '" + s.a[r - 1] + "' 与 '" + s.b[c - 1] + "'：相同，候选值来自左上角。"
      : "比较 '" + s.a[r - 1] + "' 与 '" + s.b[c - 1] + "'：不同，候选值来自上方和左方。";
  } else {
    s.pending = { deps: [[r - 1, c], [r, c - 1]], value: s.dp[r - 1][c] + s.dp[r][c - 1] };
    s.msg = "定位 dp[" + r + "][" + c + "]：需要读取上方 dp[" + (r - 1) + "][" + c + "] 与左方 dp[" + r + "][" + (c - 1) + "]。";
  }
  s.phase = "compare";
}
function advanceCell() {
  s.c++;
  if (s.c >= s.cols) { s.r++; s.c = 1; }
  if ($("mode").value === "paths" && s.r === 1) s.c = 2;
  s.pending = null;
  s.phase = finished() ? "done" : "compare";
}
function step() {
  if (finished()) { s.phase = "done"; s.msg = "填表完成，右下角就是答案。"; render(); return; }
  if (!s.pending) {
    preparePending();
  } else if (s.phase === "compare") {
    s.phase = "dependency";
    s.msg = "先确认依赖单元格已经完成，再进行公式推导。";
  } else if (s.phase === "dependency") {
    s.phase = "formula";
    const p = s.pending;
    s.msg = $("mode").value === "lcs"
      ? (p.same ? "相同：dp[" + s.r + "][" + s.c + "] = 左上 " + s.dp[s.r - 1][s.c - 1] + " + 1 = " + p.value + "。" : "不同：dp[" + s.r + "][" + s.c + "] = max(上 " + s.dp[s.r - 1][s.c] + ", 左 " + s.dp[s.r][s.c - 1] + ") = " + p.value + "。")
      : "dp[" + s.r + "][" + s.c + "] = 上方 " + s.dp[s.r - 1][s.c] + " + 左方 " + s.dp[s.r][s.c - 1] + " = " + p.value + "。";
  } else if (s.phase === "formula") {
    s.dp[s.r][s.c] = s.pending.value;
    s.phase = "write";
    s.msg = "把结果 " + s.pending.value + " 写入 dp[" + s.r + "][" + s.c + "]，下一步再移动到下一个状态。";
  } else {
    advanceCell();
    if (finished()) s.msg = "填表完成，右下角就是答案。";
    else s.msg = "移动到下一个状态 dp[" + s.r + "][" + s.c + "]。";
  }
  render();
}
function schedule() {
  if (!playing || timer) return;
  const delay = s.phase === "write" ? 900 : s.phase === "formula" ? 760 : 600;
  timer = setTimeout(() => {
    timer = null;
    step();
    if (finished()) stop(); else schedule();
  }, delay);
}
function init() {
  stop();
  if ($("mode").value === "lcs") {
    const a = "abcde", b = "ace";
    s = { a, b, rows: a.length + 1, cols: b.length + 1, dp: Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0)), r: 1, c: 1, phase: "compare", pending: null, msg: "dp[i][j] 表示 a 的前 i 个字符与 b 的前 j 个字符的 LCS 长度。" };
  } else {
    s = { rows: 4, cols: 5, dp: Array.from({ length: 4 }, () => Array(5).fill(0)), r: 1, c: 2, phase: "compare", pending: null, msg: "dp[i][j] 表示从左上角走到第 i 行第 j 列的路径数。第 1 行和第 1 列已初始化。" };
    for (let i = 1; i < 4; i++) s.dp[i][1] = 1;
    for (let j = 1; j < 5; j++) s.dp[1][j] = 1;
  }
  render();
}
function render() {
  const lcs = $("mode").value === "lcs", cols = s.cols, table = $("table");
  const dep = s.pending ? s.pending.deps : [];
  const isDep = (r, c) => dep.some(x => x[0] === r && x[1] === c);
  const cells = ['<div class="cell header"></div>'];
  for (let c = 0; c < cols; c++) cells.push('<div class="cell header">' + (lcs ? (c ? s.b[c - 1] : "∅") : c) + "</div>");
  for (let r = 0; r < s.rows; r++) {
    cells.push('<div class="cell header">' + (lcs ? (r ? s.a[r - 1] : "∅") : r) + "</div>");
    for (let c = 0; c < cols; c++) {
      const done = r < s.r || (r === s.r && c < s.c);
      const current = r === s.r && c === s.c && !finished();
      const candidate = current && s.pending && (s.phase === "formula" || s.phase === "write");
      const value = candidate ? s.pending.value : s.dp[r][c];
      const classes = ["cell", done ? "filled" : "", current ? "is-current" : "", current && isDep(r, c) ? "dependency" : "", candidate ? "is-candidate" : "", current && s.phase === "write" ? "is-write" : ""].filter(Boolean).join(" ");
      cells.push('<div class="' + classes + '">' + value + "</div>");
    }
  }
  table.style.gridTemplateColumns = "repeat(" + (cols + 1) + ",minmax(48px,1fr))";
  table.innerHTML = cells.join("");
  const formula = lcs ? "相同：左上 + 1；不同：max(上, 左)" : "dp[i][j] = dp[i-1][j] + dp[i][j-1]";
  $("log").innerHTML = '<div class="dp-phase">阶段：' + (phaseNames[s.phase] || s.phase) + "</div><span class=\"formula\">" + formula + "</span><br>" + s.msg;
}
$("step").onclick = () => { stop(); step(); };
$("reset").onclick = init;
$("mode").onchange = init;
$("auto").onclick = () => {
  if (playing) stop();
  else { playing = true; $("auto").textContent = "暂停"; schedule(); }
};
window.addEventListener("pagehide", stop);
init();
</script>
