<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ACM 模拟 IDE · InterviewForge</title>
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="../../assets/practice-playground.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
</head>
<body>
  <header class="site-topbar" style="width:calc(100% - 48px);max-width:1280px;margin:16px auto 6px">
    <a class="site-brand" href="../../index.html">Hot 100 深度学习库</a>
    <nav aria-label="主导航" class="site-nav">
      <a href="../../index.html">题目面板</a>
      <a href="../../cockpit.html">中控台</a>
      <a href="../../library/index.html">学习书架</a>
      <a href="index.html">AI 岗机试题库</a>
    </nav>
  </header>

  <main class="practice-shell">
    <div class="practice-head">
      <div>
        <h1 id="practiceTitle">ACM 模拟 IDE</h1>
        <p>Python 3.12 / Java 17 · stdin/stdout 运行 · 只比较样例，不代表隐藏测试通过</p>
      </div>
      <a class="practice-back" href="index.html">← 返回题库</a>
    </div>

    <div class="practice-toolbar">
      <label for="language">语言</label>
      <select id="language" class="practice-select">
        <option value="python">Python 3</option>
        <option value="java">Java 17</option>
      </select>
      <button id="runBtn" class="practice-btn primary" type="button">运行代码 (Ctrl+Enter)</button>
      <button id="resetBtn" class="practice-btn" type="button">重置当前草稿</button>
      <span id="runtimeStatus" class="practice-runtime">就绪</span>
    </div>

    <div class="practice-grid">
      <section class="practice-panel">
        <div class="practice-panel-head"><span>代码编辑器</span><span id="languageHint">Python 3 · ACM 模式</span></div>
        <div id="editorWrap">
          <textarea id="editorFallback" spellcheck="false" aria-label="代码编辑器"></textarea>
        </div>
      </section>

      <section class="practice-panel">
        <div class="practice-io">
          <label for="stdinArea">输入 (stdin)</label>
          <textarea id="stdinArea" class="practice-textarea" placeholder="在这里粘贴测试输入…" spellcheck="false"></textarea>
          <label for="expectedArea" style="margin-top:12px">期望输出（可选，用于对比）</label>
          <textarea id="expectedArea" class="practice-textarea" placeholder="粘贴期望输出，会自动和实际输出对比…" spellcheck="false"></textarea>
          <div id="diffResult" class="practice-diff"></div>
        </div>
        <div class="practice-output">
          <label>输出 (stdout)</label>
          <pre id="stdoutArea">点击「运行代码」或按 Ctrl+Enter 执行</pre>
          <label>错误 (stderr)</label>
          <pre id="stderrArea" class="stderr"></pre>
          <button id="clearOutput" class="practice-btn" type="button">清空输出</button>
        </div>
        <div class="practice-meta" id="runMeta"></div>
        <div class="practice-meta" id="sourceNote"></div>
      </section>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/clike/clike.min.js"></script>
  <script src="../../assets/practice-playground.js?v=1"></script>
</body>
</html>
