<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">有了 MCP：应用和服务各自支持同一协议</title><desc id="desc">两款兼容的助手，复用同一份 GitHub MCP Server 实现</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8377"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#22231f} .bg{fill:var(--canvas,#faf9f5)} .node{fill:var(--node,#eeeae0)} .primary{fill:var(--ink,#22231f)} .muted{fill:var(--muted,#62645a)}</style><rect x="0" y="0" width="1200" height="800" rx="0" fill="#faf9f5" stroke="none" stroke-width="2" class="bg"/><text x="48" y="63" font-size="36" fill="#22231f" font-weight="700" text-anchor="start" class="primary">有了 MCP：应用和服务各自支持同一协议</text><text x="48" y="103" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">两款兼容的助手，复用同一份 GitHub MCP Server 实现</text><rect x="48" y="180" width="330" height="175" rx="16" fill="#ede7f3" stroke="none" stroke-width="2"/><text x="213" y="227" font-size="30" fill="#22231f" font-weight="700" text-anchor="middle" class="primary">AI 助手 A</text><rect x="73" y="256" width="280" height="65" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="213" y="298" font-size="24" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">通用 MCP 接入机制</text><line x1="388" y1="287" x2="529" y2="287" stroke="#8a8377" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="458.5" y="273.0" font-size="20" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">同一协议</text><rect x="48" y="430" width="330" height="175" rx="16" fill="#ede7f3" stroke="none" stroke-width="2"/><text x="213" y="477" font-size="30" fill="#22231f" font-weight="700" text-anchor="middle" class="primary">AI 助手 B</text><rect x="73" y="506" width="280" height="65" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="213" y="548" font-size="24" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">通用 MCP 接入机制</text><line x1="388" y1="537" x2="529" y2="537" stroke="#8a8377" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="458.5" y="523.0" font-size="20" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">同一协议</text><rect x="540" y="205" width="340" height="350" rx="16" fill="#e5eee5" stroke="#adc2ad" stroke-width="2"/><text x="710" y="254" font-size="28" fill="#22231f" font-weight="700" text-anchor="middle" class="primary">GitHub MCP Server</text><text x="566" y="305" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">提供工具清单和参数说明</text><text x="566" y="343" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">按 MCP 接收调用、返回结果</text><rect x="562" y="394" width="296" height="129" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="710" y="431" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">GitHub 查询业务实现</text><text x="710" y="465" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">调用 API、处理查询结果</text><text x="710" y="499" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">这份服务供兼容应用复用</text><line x1="890" y1="380" x2="975" y2="380" stroke="#8a8377" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="932.5" y="366.0" font-size="20" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">API</text><rect x="985" y="309" width="170" height="145" rx="16" fill="#e6edf0" stroke="none" stroke-width="2"/><text x="1070" y="354" font-size="25" fill="#22231f" font-weight="700" text-anchor="middle" class="primary">GitHub API</text><text x="1070" y="394" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">账号认证</text><text x="1070" y="426" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">Issue 查询</text><rect x="48" y="652" width="1107" height="96" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="72" y="690" font-size="25" fill="#22231f" font-weight="600" text-anchor="start" class="primary">应用侧：复用 MCP 接入机制    服务侧：复用 GitHub 业务实现</text><text x="72" y="725" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">接入仍需双方兼容并完成账号权限配置；协议支持不替代业务实现。</text></svg>