<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">没有 MCP：按不同助手的方式接入</title><desc id="desc">同一个 GitHub 查询需求，可能需要分别衔接两款助手的工具体系</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8377"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#22231f} .bg{fill:var(--canvas,#faf9f5)} .node{fill:var(--node,#eeeae0)} .primary{fill:var(--ink,#22231f)} .muted{fill:var(--muted,#62645a)}</style><rect x="0" y="0" width="1200" height="800" rx="0" fill="#faf9f5" stroke="none" stroke-width="2" class="bg"/><text x="48" y="63" font-size="36" fill="#22231f" font-weight="700" text-anchor="start" class="primary">没有 MCP：按不同助手的方式接入</text><text x="48" y="103" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">同一个 GitHub 查询需求，可能需要分别衔接两款助手的工具体系</text><rect x="48" y="180" width="260" height="175" rx="16" fill="#ede7f3" stroke="none" stroke-width="2"/><text x="178" y="227" font-size="30" fill="#22231f" font-weight="700" text-anchor="middle" class="primary">AI 助手 A</text><text x="178" y="278" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">模型提出查询请求</text><text x="178" y="313" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">接收结果并生成回答</text><line x1="318" y1="268" x2="383" y2="268" stroke="#8a8377" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="395" y="180" width="488" height="175" rx="16" fill="#f2e7de" stroke="#d6bca6" stroke-width="2"/><text x="419" y="224" font-size="26" fill="#22231f" font-weight="700" text-anchor="start" class="primary">适配助手 A 的 GitHub 接入代码</text><text x="419" y="268" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">按 A 的方式登记工具和参数</text><text x="419" y="307" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">衔接 A 的执行接口与返回格式</text><line x1="893" y1="268" x2="975" y2="360" stroke="#8a8377" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="48" y="430" width="260" height="175" rx="16" fill="#ede7f3" stroke="none" stroke-width="2"/><text x="178" y="477" font-size="30" fill="#22231f" font-weight="700" text-anchor="middle" class="primary">AI 助手 B</text><text x="178" y="528" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">模型提出查询请求</text><text x="178" y="563" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">接收结果并生成回答</text><line x1="318" y1="518" x2="383" y2="518" stroke="#8a8377" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="395" y="430" width="488" height="175" rx="16" fill="#f2e7de" stroke="#d6bca6" stroke-width="2"/><text x="419" y="474" font-size="26" fill="#22231f" font-weight="700" text-anchor="start" class="primary">适配助手 B 的 GitHub 接入代码</text><text x="419" y="518" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">按 B 的方式登记工具和参数</text><text x="419" y="557" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">衔接 B 的执行接口与返回格式</text><line x1="893" y1="518" x2="975" y2="455" stroke="#8a8377" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="985" y="311" width="170" height="208" rx="16" fill="#e6edf0" stroke="none" stroke-width="2"/><text x="1070" y="363" font-size="25" fill="#22231f" font-weight="700" text-anchor="middle" class="primary">GitHub API</text><text x="1070" y="412" font-size="24" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">账号认证</text><text x="1070" y="451" font-size="24" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">Issue 查询</text><rect x="48" y="652" width="1107" height="96" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="72" y="690" font-size="25" fill="#22231f" font-weight="600" text-anchor="start" class="primary">可以复用：访问 GitHub 的业务代码</text><text x="72" y="725" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">可能重复：让不同助手认识工具、执行调用、接收结果的适配工作</text></svg>