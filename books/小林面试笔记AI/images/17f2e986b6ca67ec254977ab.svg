<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">共享协议，减少重复适配</title><desc id="desc">3 个应用访问 4 个服务：连接关系相同，对接实现可以复用</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8377"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#22231f} .bg{fill:var(--canvas,#faf9f5)} .node{fill:var(--node,#eeeae0)} .primary{fill:var(--ink,#22231f)} .muted{fill:var(--muted,#62645a)}</style><rect x="0" y="0" width="1200" height="790" rx="0" fill="#faf9f5" stroke="none" stroke-width="2" class="bg"/><text x="48" y="63" font-size="36" fill="#22231f" font-weight="700" text-anchor="start" class="primary">共享协议，减少重复适配</text><text x="48" y="103" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">3 个应用访问 4 个服务：连接关系相同，对接实现可以复用</text><rect x="48" y="145" width="528" height="530" rx="16" fill="#f3f0e8" stroke="none" stroke-width="2"/><text x="73" y="187" font-size="29" fill="#22231f" font-weight="700" text-anchor="start" class="primary">专用对接</text><text x="73" y="222" font-size="22" fill="#62645a" font-weight="400" text-anchor="start" class="muted">每一对应用与服务分别适配</text><line x1="136" y1="305" x2="115" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="136" y1="305" x2="247" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="136" y1="305" x2="379" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="136" y1="305" x2="511" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="312" y1="305" x2="115" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="312" y1="305" x2="247" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="312" y1="305" x2="379" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="312" y1="305" x2="511" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="488" y1="305" x2="115" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="488" y1="305" x2="247" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="488" y1="305" x2="379" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><line x1="488" y1="305" x2="511" y2="445" stroke="#c9b9ae" stroke-width="1.8"/><rect x="66" y="252" width="140" height="53" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="136" y="287" font-size="23" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">应用 A</text><rect x="242" y="252" width="140" height="53" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="312" y="287" font-size="23" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">应用 B</text><rect x="418" y="252" width="140" height="53" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="488" y="287" font-size="23" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">应用 C</text><rect x="60" y="445" width="110" height="62" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="115" y="484" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">服务 1</text><rect x="192" y="445" width="110" height="62" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="247" y="484" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">服务 2</text><rect x="324" y="445" width="110" height="62" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="379" y="484" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">服务 3</text><rect x="456" y="445" width="110" height="62" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="511" y="484" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">服务 4</text><text x="312" y="559" font-size="27" fill="#22231f" font-weight="700" text-anchor="middle" class="primary">可能需要 12 套专用适配</text><text x="312" y="598" font-size="23" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">3 × 4 = 12</text><text x="312" y="641" font-size="22" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">仍然可以直接对接全部服务</text><rect x="624" y="145" width="528" height="530" rx="16" fill="#f3f0e8" stroke="none" stroke-width="2"/><text x="649" y="187" font-size="29" fill="#22231f" font-weight="700" text-anchor="start" class="primary">共享 MCP 协议</text><text x="649" y="222" font-size="22" fill="#62645a" font-weight="400" text-anchor="start" class="muted">应用与服务各自实现协议支持</text><line x1="712" y1="305" x2="691" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="712" y1="305" x2="823" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="712" y1="305" x2="955" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="712" y1="305" x2="1087" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="888" y1="305" x2="691" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="888" y1="305" x2="823" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="888" y1="305" x2="955" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="888" y1="305" x2="1087" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="1064" y1="305" x2="691" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="1064" y1="305" x2="823" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="1064" y1="305" x2="955" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><line x1="1064" y1="305" x2="1087" y2="445" stroke="#b6c6b5" stroke-width="1.8"/><rect x="642" y="252" width="140" height="53" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="712" y="287" font-size="23" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">应用 A</text><rect x="818" y="252" width="140" height="53" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="888" y="287" font-size="23" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">应用 B</text><rect x="994" y="252" width="140" height="53" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="1064" y="287" font-size="23" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">应用 C</text><rect x="636" y="445" width="110" height="62" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="691" y="484" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">服务 1</text><rect x="768" y="445" width="110" height="62" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="823" y="484" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">服务 2</text><rect x="900" y="445" width="110" height="62" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="955" y="484" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">服务 3</text><rect x="1032" y="445" width="110" height="62" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="1087" y="484" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">服务 4</text><text x="888" y="559" font-size="27" fill="#22231f" font-weight="700" text-anchor="middle" class="primary">约 7 个协议适配实现</text><text x="888" y="598" font-size="23" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">3 个应用支持 + 4 个服务支持</text><text x="888" y="641" font-size="22" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">仍然可以直接对接全部服务</text><text x="48" y="760" font-size="21" fill="#62645a" font-weight="400" text-anchor="start" class="muted">M×N 与 M+N 是适配工作量的工程示意；各应用与服务共享协议实现。</text></svg>