<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-labelledby="title desc"><title id="title">查询 GitHub Issue 的完整调用流程</title><desc id="desc">模型提出调用意图；Host 协调执行；Client 传递消息；Server 访问业务 API</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8377"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#22231f} .bg{fill:var(--canvas,#faf9f5)} .node{fill:var(--node,#eeeae0)} .primary{fill:var(--ink,#22231f)} .muted{fill:var(--muted,#62645a)}</style><rect x="0" y="0" width="1200" height="1090" rx="0" fill="#faf9f5" stroke="none" stroke-width="2" class="bg"/><text x="48" y="63" font-size="36" fill="#22231f" font-weight="700" text-anchor="start" class="primary">查询 GitHub Issue 的完整调用流程</text><text x="48" y="103" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">模型提出调用意图；Host 协调执行；Client 传递消息；Server 访问业务 API</text><rect x="27" y="148" width="176" height="63" rx="16" fill="#ede7f3" stroke="none" stroke-width="2"/><text x="115" y="189" font-size="25" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">Host</text><line x1="115" y1="215" x2="115" y2="971" stroke="#d0cbc1" stroke-width="2" stroke-dasharray="6 6"/><rect x="262" y="148" width="176" height="63" rx="16" fill="#ede7f3" stroke="none" stroke-width="2"/><text x="350" y="189" font-size="25" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">模型</text><line x1="350" y1="215" x2="350" y2="971" stroke="#d0cbc1" stroke-width="2" stroke-dasharray="6 6"/><rect x="497" y="148" width="176" height="63" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="585" y="189" font-size="25" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">MCP Client</text><line x1="585" y1="215" x2="585" y2="971" stroke="#d0cbc1" stroke-width="2" stroke-dasharray="6 6"/><rect x="732" y="1