<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">消息格式相同，传输方式不同</title><desc id="desc">JSON-RPC 2.0 写明方法、参数和请求 ID；传输负责把消息送到对方</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8377"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#22231f} .bg{fill:var(--canvas,#faf9f5)} .node{fill:var(--node,#eeeae0)} .primary{fill:var(--ink,#22231f)} .muted{fill:var(--muted,#62645a)}</style><rect x="0" y="0" width="1200" height="740" rx="0" fill="#faf9f5" stroke="none" stroke-width="2" class="bg"/><text x="48" y="63" font-size="36" fill="#22231f" font-weight="700" text-anchor="start" class="primary">消息格式相同，传输方式不同</text><text x="48" y="103" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">JSON-RPC 2.0 写明方法、参数和请求 ID；传输负责把消息送到对方</text><rect x="48" y="154" width="528" height="484" rx="16" fill="#ede7f3" stroke="none" stroke-width="2"/><text x="73" y="202" font-size="31" fill="#22231f" font-weight="700" text-anchor="start" class="primary">stdio</text><text x="73" y="242" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">本机进程间通信</text><rect x="83" y="285" width="458" height="64" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="312" y="327" font-size="27" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">MCP Client</text><line x1="248" y1="355" x2="248" y2="431" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="376" y1="431" x2="376" y2="355" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><text x="186" y="397" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">stdin</text><text x="443" y="397" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">stdout</text><rect x="83" y="439" width="458" height="67" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="312" y="482" font-size="26" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">MCP Server 子进程</text><text x="78" y="560" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">stdout：只写 MCP 消息</text><text x="78" y="596" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">stderr：普通日志</text><rect x="624" y="154" width="528" height="484" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="649" y="202" font-size="31" fill="#22231f" font-weight="700" text-anchor="start" class="primary">Streamable HTTP</text><text x="649" y="242" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">独立 HTTP 服务，本地或远程</text><rect x="659" y="285" width="458" height="64" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="888" y="327" font-size="27" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">MCP Client</text><line x1="824" y1="355" x2="824" y2="431" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="952" y1="431" x2="952" y2="355" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><text x="757" y="397" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">POST</text><text x="1041" y="397" font-size="21" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">JSON / SSE</text><rect x="659" y="439" width="458" height="67" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="888" y="482" font-size="26" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">MCP Server HTTP 服务</text><text x="654" y="560" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">响应：单个 JSON 或 SSE 流</text><text x="654" y="596" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">SSE 可传进度通知与最终结果</text><text x="48" y="710" font-size="21" fill="#62645a" font-weight="400" text-anchor="start" class="muted">SSE 是可选的 HTTP 响应形式，不是按请求长短划分，也不是协议升级。</text></svg>