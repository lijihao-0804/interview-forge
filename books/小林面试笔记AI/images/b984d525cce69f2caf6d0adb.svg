<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Host、Client、Server 各自负责什么</title><desc id="desc">一个 Host 管理多个 Client；每个 Client 对接一个指定的 Server</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8377"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#22231f} .bg{fill:var(--canvas,#faf9f5)} .node{fill:var(--node,#eeeae0)} .primary{fill:var(--ink,#22231f)} .muted{fill:var(--muted,#62645a)}</style><rect x="0" y="0" width="1200" height="820" rx="0" fill="#faf9f5" stroke="none" stroke-width="2" class="bg"/><text x="48" y="63" font-size="36" fill="#22231f" font-weight="700" text-anchor="start" class="primary">Host、Client、Server 各自负责什么</text><text x="48" y="103" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">一个 Host 管理多个 Client；每个 Client 对接一个指定的 Server</text><rect x="48" y="150" width="370" height="556" rx="16" fill="#ede7f3" stroke="#b7a8c8" stroke-width="2"/><text x="74" y="195" font-size="29" fill="#22231f" font-weight="700" text-anchor="start" class="primary">Host：AI 应用</text><text x="74" y="232" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">Claude Desktop / Cursor</text><rect x="74" y="255" width="318" height="88" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="94" y="291" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">模型交互、上下文管理</text><text x="94" y="323" font-size="23" fill="#22231f" font-weight="400" text-anchor="start" class="primary">用户授权与调用协调</text><rect x="94" y="375" width="280" height="64" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="234" y="416" font-size="27" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">Client A</text><line x1="374" y1="407" x2="520" y2="407" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><text x="447.0" y="395.0" font-size="20" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">MCP</text><rect x="525" y="363" width="305" height="90" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="677" y="398" font-size="25" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">文件系统 MCP Server</text><text x="677" y="432" font-size="21" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">本地进程</text><line x1="830" y1="407" x2="940" y2="407" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><text x="885.0" y="395.0" font-size="19" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">业务访问</text><rect x="945" y="363" width="210" height="90" rx="16" fill="#e6edf0" stroke="none" stroke-width="2"/><text x="1050" y="414" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">本地文件</text><rect x="94" y="486" width="280" height="64" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="234" y="527" font-size="27" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">Client B</text><line x1="374" y1="518" x2="520" y2="518" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><text x="447.0" y="506.0" font-size="20" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">MCP</text><rect x="525" y="474" width="305" height="90" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="677" y="509" font-size="25" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">GitHub MCP Server</text><text x="677" y="543" font-size="21" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">本地或远程服务</text><line x1="830" y1="518" x2="940" y2="518" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><text x="885.0" y="506.0" font-size="19" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">业务访问</text><rect x="945" y="474" width="210" height="90" rx="16" fill="#e6edf0" stroke="none" stroke-width="2"/><text x="1050" y="525" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">GitHub API</text><rect x="94" y="597" width="280" height="64" rx="16" fill="#faf9f5" stroke="none" stroke-width="2"/><text x="234" y="638" font-size="27" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">Client C</text><line x1="374" y1="629" x2="520" y2="629" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><text x="447.0" y="617.0" font-size="20" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">MCP</text><rect x="525" y="585" width="305" height="90" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="677" y="620" font-size="25" fill="#22231f" font-weight="600" text-anchor="middle" class="primary">数据库 MCP Server</text><text x="677" y="654" font-size="21" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">本地或远程服务</text><line x1="830" y1="629" x2="940" y2="629" stroke="#8a8377" stroke-width="2.2" marker-end="url(#arrow)"/><text x="885.0" y="617.0" font-size="19" fill="#62645a" font-weight="400" text-anchor="middle" class="muted">业务访问</text><rect x="945" y="585" width="210" height="90" rx="16" fill="#e6edf0" stroke="none" stroke-width="2"/><text x="1050" y="636" font-size="22" fill="#22231f" font-weight="400" text-anchor="middle" class="primary">PostgreSQL 数据库</text><text x="48" y="744" font-size="22" fill="#62645a" font-weight="400" text-anchor="start" class="muted">Client 发送 MCP 请求；Server 处理请求并返回结果。</text><text x="48" y="774" font-size="22" fill="#62645a" font-weight="400" text-anchor="start" class="muted">Server 根据业务需要访问文件、API 或数据库。</text></svg>