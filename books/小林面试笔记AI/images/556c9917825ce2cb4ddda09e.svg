<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">同一仓库，三类能力</title><desc id="desc">按接口职责理解 Tools、Resources 和 Prompts</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a8377"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#22231f} .bg{fill:var(--canvas,#faf9f5)} .node{fill:var(--node,#eeeae0)} .primary{fill:var(--ink,#22231f)} .muted{fill:var(--muted,#62645a)}</style><rect x="0" y="0" width="1200" height="700" rx="0" fill="#faf9f5" stroke="none" stroke-width="2" class="bg"/><text x="48" y="63" font-size="36" fill="#22231f" font-weight="700" text-anchor="start" class="primary">同一仓库，三类能力</text><text x="48" y="103" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">按接口职责理解 Tools、Resources 和 Prompts</text><rect x="48" y="155" width="352" height="399" rx="16" fill="#e5eee5" stroke="none" stroke-width="2"/><text x="73" y="203" font-size="32" fill="#22231f" font-weight="700" text-anchor="start" class="primary">Tools</text><text x="73" y="243" font-size="26" fill="#22231f" font-weight="400" text-anchor="start" class="primary">可调用的功能</text><text x="73" y="309" font-size="22" fill="#22231f" font-weight="400" text-anchor="start" class="primary">search_code(query)</text><text x="73" y="349" font-size="22" fill="#22231f" font-weight="400" text-anchor="start" class="primary">执行一次代码搜索</text><text x="73" y="389" font-size="22" fill="#22231f" font-weight="400" text-anchor="start" class="primary">create_issue：创建 Issue</text><text x="73" y="460" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">tools/list</text><text x="73" y="499" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">tools/call</text><rect x="424" y="155" width="352" height="399" rx="16" fill="#e6edf0" stroke="none" stroke-width="2"/><text x="449" y="203" font-size="32" fill="#22231f" font-weight="700" text-anchor="start" class="primary">Resources</text><text x="449" y="243" font-size="26" fill="#22231f" font-weight="400" text-anchor="start" class="primary">上下文数据</text><text x="449" y="309" font-size="22" fill="#22231f" font-weight="400" text-anchor="start" class="primary">repo://demo/README.md</text><text x="449" y="349" font-size="22" fill="#22231f" font-weight="400" text-anchor="start" class="primary">读取项目说明</text><text x="449" y="389" font-size="22" fill="#22231f" font-weight="400" text-anchor="start" class="primary">Host 选择如何加入上下文</text><text x="449" y="460" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">resources/list</text><text x="449" y="499" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">resources/read</text><rect x="800" y="155" width="352" height="399" rx="16" fill="#ede7f3" stroke="none" stroke-width="2"/><text x="825" y="203" font-size="32" fill="#22231f" font-weight="700" text-anchor="start" class="primary">Prompts</text><text x="825" y="243" font-size="26" fill="#22231f" font-weight="400" text-anchor="start" class="primary">可复用的消息模板</text><text x="825" y="309" font-size="22" fill="#22231f" font-weight="400" text-anchor="start" class="primary">review_code(language, code)</text><text x="825" y="349" font-size="22" fill="#22231f" font-weight="400" text-anchor="start" class="primary">生成代码审查提示</text><text x="825" y="389" font-size="22" fill="#22231f" font-weight="400" text-anchor="start" class="primary">获取模板后再交给模型</text><text x="825" y="460" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">prompts/list</text><text x="825" y="499" font-size="23" fill="#62645a" font-weight="400" text-anchor="start" class="muted">prompts/get</text><rect x="48" y="579" width="1104" height="60" rx="16" fill="#eeeae0" stroke="none" stroke-width="2"/><text x="72" y="619" font-size="24" fill="#22231f" font-weight="400" text-anchor="start" class="primary">同一份 README 也能由 read_file 工具返回：数据相同，接口职责不同。</text><text x="48" y="670" font-size="21" fill="#62645a" font-weight="400" text-anchor="start" class="muted">权限依据具体数据与操作设计；只读资源也可能包含敏感信息。</text></svg>