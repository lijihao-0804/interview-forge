<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>收藏中心 · InterviewForge</title>
<script src="../assets/time-utils.js?v=3"></script>
<style>
:root{color-scheme:light dark;--bg:#f3f5fa;--panel:#fff;--soft:#f7f8fc;--text:#172033;--muted:#647188;--line:#dce2ec;--brand:#5654d4;--brand-soft:#eeedff;--success:#13764b;--danger:#c1363e;--warning:#a8620a}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--panel:#181e29;--soft:#141a24;--text:#edf2fb;--muted:#a7b2c4;--line:#313b4c;--brand:#b2b0ff;--brand-soft:#292955;--success:#79d8a8;--danger:#ff969d;--warning:#e8b463}}
*{box-sizing:border-box}
body{margin:0;color:var(--text);background:radial-gradient(circle at 12% 0%,color-mix(in srgb,var(--brand) 8%,transparent),transparent 32rem),var(--bg);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}
.shell{width:min(100% - 32px,1120px);margin:auto;padding:22px 0 40px}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}

/* 面包屑 */
.page-nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 16px;font-size:13px;color:var(--muted)}
.page-nav a{color:var(--brand);text-decoration:none;font-weight:600;padding:2px 8px;border-radius:6px;transition:background-color .15s ease}
.page-nav a:hover{background:var(--brand-soft);text-decoration:none}
.page-nav span[aria-current]{color:var(--text);font-weight:600}
.page-nav>span[aria-hidden]{opacity:.45}

.hero h1{margin:0 0 6px;font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.hero p{margin:0 0 20px;color:var(--muted)}

/* 筛选栏 */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--text);
font:inherit;font-size:13px;font-weight:550;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
white-space:nowrap;transition:border-color .16s ease,background-color .16s ease,color .16s ease,box-shadow .16s ease,transform .12s ease}
.chip:hover{border-color:color-mix(in srgb,var(--brand) 42%,var(--line));color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--soft))}
.chip.active{border-color:var(--brand);font-weight:700;background:color-mix(in srgb,var(--brand) 88%,#000);color:#fff;
box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 30%,transparent);transform:translateY(-1px)}
.chip-n{font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--text) 7%,transparent);line-height:1.5}
.chip.active .chip-n{background:rgba(255,255,255,.2);color:#fff}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.toolbar .count{color:var(--muted);font-size:13px}
.toolbar input[type=search]{flex:1 1 220px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;
background:var(--panel);color:var(--text);font:inherit;font-size:13.5px}
.toolbar input[type=search]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}

/* 收藏列表 */
.list{display:flex;flex-direction:column;gap:10px}
.fav{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--line);
border-radius:12px;background:var(--panel);transition:border-color .16s ease,box-shadow .2s ease,transform .16s ease}
.fav:hover{border-color:color-mix(in srgb,var(--brand) 32%,var(--line));box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 9%,transparent);transform:translateY(-1px)}
.fav-ico{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;
background:var(--soft);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:16px}
.fav-body{min-width:0;flex:1}
.fav-title{font-weight:700;font-size:15px;line-height:1.45;display:block;color:var(--text)}
.fav-title:hover{color:var(--brand);text-decoration:none}
.fav-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;color:var(--muted);font-size:12px}
.pill{padding:1px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:11.5px;font-weight:650}
.pill.type-content{background:color-mix(in srgb,var(--success) 12%,var(--panel));color:var(--success)}
.fav-actions{flex:none;display:flex;gap:6px;align-items:center}
.btn{padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);
font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:border-color .15s ease,color .15s ease,background-color .15s ease}
.btn:hover{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger);background:color-mix(in srgb,var(--danger) 6%,var(--panel))}
.btn.open:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));color:var(--brand);background:var(--brand-soft)}

.empty{padding:56px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--panel)}
.empty strong{display:block;margin-bottom:6px;color:var(--text);font-size:15px}
.empty p{margin:0;font-size:13px}
.notice{margin:0 0 16px;padding:10px 14px;border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));
border-radius:10px;background:color-mix(in srgb,var(--danger) 6%,var(--panel));color:var(--danger);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);padding:9px 18px;border-radius:999px;
background:color-mix(in srgb,var(--text) 88%,#000);color:var(--panel);font-size:13px;font-weight:600;
opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){.fav{padding:12px}.fav-actions{flex-direction:column}.toolbar input[type=search]{flex-basis:100%}}
</style>
</head>
<body>
<div class="shell">
  <nav class="page-nav" aria-label="面包屑">
    <a href="../cockpit.html">🎛️ 中控台</a><span aria-hidden="true">›</span>
    <a href="../library/index.html">学习书架</a><span aria-hidden="true">›</span>
    <span aria-current="page">收藏中心</span>
  </nav>

  <section class="hero">
    <h1>⭐ 收藏中心</h1>
    <p>你在题目和书架章节里收藏的内容都汇总在这里，可按来源筛选、搜索关键词。</p>
  </section>

  <div id="errorBox" class="notice" hidden></div>

  <div class="filters" id="moduleFilters" aria-label="按来源筛选">
    <button type="button" class="chip active" data-module="">全部<span class="chip-n" id="n-all">0</span></button>
  </div>

  <div class="toolbar">
    <span class="count" id="countText" aria-live="polite">正在读取…</span>
    <label style="flex:1;display:flex">
      <span style="position:absolute;width:1px;height:1px;overflow:hidden">搜索收藏</span>
      <input id="searchInput" type="search" placeholder="搜索收藏的标题…" autocomplete="off" style="width:100%">
    </label>
    <button type="button" class="chip" id="typeAll" data-type="">全部类型</button>
    <button type="button" class="chip" id="typeProblem" data-type="problem">🧩 题目</button>
    <button type="button" class="chip" id="typeContent" data-type="content">📖 章节</button>
  </div>

  <div class="list" id="favList"></div>
  <div class="empty" id="emptyBox" hidden>
    <strong>还没有收藏任何内容</strong>
    <p>在题解页或书架章节页点击「⭐ 收藏」，内容就会出现在这里。</p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var SEARCH_INDEX_URL = "../library/search-index.json";
  var items = [], ids = [], stats = {}, activeModule = "", activeType = "", query = "";
  var searchIndexOfFav = null;   // 只有收藏缺标题时才回查索引
  var listEl = document.getElementById("favList");
  var emptyEl = document.getElementById("emptyBox");
  var countEl = document.getElementById("countText");
  var errEl = document.getElementById("errorBox");
  var toastEl = document.getElementById("toast");

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");setTimeout(function(){toastEl.classList.remove("show")},1800)}

  // 模块显示名：hot100 显示为 Hot 100，其余用搜索索引里的 module_title
  var MODULE_NAMES = {hot100:"Hot 100 算法刷题", "": "未归属模块"};

  function moduleLabel(mid){
    // 优先用收藏时存下的中文模块名；老数据没有则回落到 id
    for (var i=0;i<items.length;i++){
      var it = items[i];
      if ((it.module_id || "") === mid && it.module_title) return it.module_title;
    }
    if (MODULE_NAMES[mid]) return MODULE_NAMES[mid];
    return mid || "未归属模块";
  }

  function renderFilters(){
    var box = document.getElementById("moduleFilters");
    // 保留「全部」，其余按统计重建
    var kept = box.querySelector('[data-module=""]');
    box.innerHTML = "";
    if (kept) box.appendChild(kept);
    Object.keys(stats).forEach(function(mid){
      if (mid === "__total__" || mid === "") return;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (activeModule === mid ? " active" : "");
      b.dataset.module = mid;
      b.innerHTML = esc(moduleLabel(mid)) + '<span class="chip-n">' + stats[mid] + "</span>";
      box.appendChild(b);
    });
    var total = document.getElementById("n-all");
    if (total) total.textContent = stats.__total__ || 0;
  }

  function render(){
    var shown = items.filter(function(it){
      if (activeModule !== "" && (it.module_id || "") !== activeModule) return false;
      if (activeType && it.target_type !== activeType) return false;
      if (query) {
        var hay = ((it.title || "") + " " + (it.module_title || "") + " " + (it.note || "")).toLowerCase();
        if (hay.indexOf(query) < 0) return false;
      }
      return true;
    });
    countEl.textContent = shown.length === 0 ? "没有匹配的收藏"
      : "共 " + shown.length + " 条收藏" + (query ? "（搜索「" + query + "」）" : "");
    if (!items.length) { listEl.innerHTML = ""; emptyEl.hidden = false; return; }
    emptyEl.hidden = true;
    if (!shown.length) {
      listEl.innerHTML = '<div class="empty" style="padding:36px 20px"><strong>当前筛选下没有收藏</strong><p>试试切换来源，或清空搜索框。</p></div>';
      return;
    }
    listEl.innerHTML = shown.map(function(it){
      var isContent = it.target_type === "content";
      var icon = isContent ? "📖" : "🧩";
      var typeLabel = isContent ? "章节" : "题目";
      var url = it.url || "#";
      return '<article class="fav">'
        + '<span class="fav-ico" aria-hidden="true">' + icon + '</span>'
        + '<div class="fav-body">'
        +   '<a class="fav-title" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title || it.target_id) + '</a>'
        +   '<div class="fav-meta">'
        +     '<span class="pill ' + (isContent ? "type-content" : "") + '">' + typeLabel + '</span>'
        +     '<span>' + esc(moduleLabel(it.module_id || "")) + '</span>'
        +     '<span>收藏于 ' + esc(String(it.created_at || "").slice(0, 16).replace("T", " ")) + '</span>'
        +   '</div>'
        + '</div>'
        + '<div class="fav-actions">'
        +   '<a class="btn open" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">打开</a>'
        +   '<button type="button" class="btn" data-remove="' + esc(it.target_type) + '|' + esc(it.target_id) + '">移除</button>'
        + '</div>'
        + '</article>';
    }).join("");
  }

  function load(){
    errEl.hidden = true;
    countEl.textContent = "正在读取…";
    fetch("/api/favorites", {cache: "no-store"})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)) })
      .then(function(d){
        items = Array.isArray(d.items) ? d.items : [];
        stats = d.stats || {};
        ids = Array.isArray(d.ids) ? d.ids : [];
        // 章节收藏没有标题时，用搜索索引补全（只补空标题，避免额外请求）
        var needTitle = items.some(function(it){ return !it.title });
        if (needTitle) fillTitles().then(function(){ renderFilters(); render(); });
        else { renderFilters(); render(); }
      })
      .catch(function(e){
        errEl.hidden = false;
        errEl.textContent = "读取收藏失败：" + (e && e.message ? e.message : "网络异常") + "。请确认已登录并稍后重试。";
        countEl.textContent = "读取失败";
      });
  }

  function fillTitles(){
    if (searchIndexOfFav) return Promise.resolve();
    return fetch(SEARCH_INDEX_URL, {cache: "force-cache"})
      .then(function(r){ return r.ok ? r.json() : [] })
      .then(function(idx){
        searchIndexOfFav = {};
        (idx || []).forEach(function(e){
          var key = e.module_id + ":" + (e.id.indexOf(":") >= 0 ? e.id.split(":").slice(1).join(":") : e.id);
          searchIndexOfFav[key] = e;
        });
        items.forEach(function(it){
          if (it.title) return;
          var hit = searchIndexOfFav[it.module_id + ":" + it.target_id];
          if (hit) { it.title = hit.title; it.module_title = hit.module_title; if (!it.url) it.url = hit.url; }
          else if (!it.title) it.title = it.target_id;
        });
      })
      .catch(function(){});
  }

  // ---- 事件 ----
  document.getElementById("moduleFilters").addEventListener("click", function(e){
    var btn = e.target.closest("[data-module]");
    if (!btn) return;
    activeModule = btn.dataset.module || "";
    Array.prototype.forEach.call(this.querySelectorAll(".chip"), function(b){ b.classList.toggle("active", b === btn); });
    render();
  });

  ["typeAll","typeProblem","typeContent"].forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener("click", function(){
      activeType = el.dataset.type || "";
      ["typeAll","typeProblem","typeContent"].forEach(function(x){
        document.getElementById(x).classList.toggle("active", x === id);
      });
      render();
    });
  });

  document.getElementById("searchInput").addEventListener("input", function(){
    query = this.value.trim().toLowerCase();
    render();
  });

  listEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-remove]");
    if (!btn) return;
    var parts = btn.dataset.remove.split("|");
    btn.disabled = true;
    fetch("/api/favorites/remove", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({target_type: parts[0], target_id: parts[1]})
    }).then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(){
        items = items.filter(function(it){ return !(it.target_type===parts[0] && it.target_id===parts[1]); });
        if (stats[parts[2]] ) {}
        // 重算统计
        var next = {"__total__":0};
        items.forEach(function(it){ var m=it.module_id||""; next[m]=(next[m]||0)+1; next.__total__++; });
        stats = next;
        renderFilters(); render(); toast("已移除收藏");
      })
      .catch(function(){ btn.disabled = false; toast("移除失败，请重试"); });
  });

  load();
})();
</script>
</body>
</html>
