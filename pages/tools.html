<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script src="../assets/time-utils.js?v=2"></script>
<script src="../assets/ui.js?v=1"></script>
<title>工具箱 · InterviewForge</title>
<style>
:root{
  color-scheme:light dark;
  --font-sans:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#edf0f8;--panel:#fff;--soft:#f2f4fb;--text:#172033;--muted:#647188;
  --line:#d6dded;--brand:#5654d4;--brand-strong:#4543bd;--brand-soft:#eeedff;
  --success:#13764b;--success-soft:#e7f6ee;--warning:#a45a00;--danger:#c1363e;
  --radius-2:10px;--radius-3:14px;--radius-4:20px;
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-in-out:cubic-bezier(.65,0,.35,1);
  --shadow:0 14px 38px rgba(31,42,68,.075)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f131b;--panel:#181e29;--soft:#141a24;--text:#edf2fb;--muted:#a7b2c4;
  --line:rgba(148,163,190,.22);--brand:#b2b0ff;--brand-strong:#cbc9ff;--brand-soft:#292955;
  --success:#79d8a8;--success-soft:#17382b;--warning:#ffc474;--danger:#ff969d;
  --shadow:0 18px 46px rgba(0,0,0,.22)}}
html[data-theme="light"]{color-scheme:light;--bg:#edf0f8;--panel:#fff;--soft:#f2f4fb;--text:#172033;
--muted:#647188;--line:#d6dded;--brand:#5654d4;--brand-strong:#4543bd;--brand-soft:#eeedff;
--success:#13764b;--success-soft:#e7f6ee;--warning:#a45a00;--danger:#c1363e;
--shadow:0 14px 38px rgba(31,42,68,.075)}
html[data-theme="dark"]{color-scheme:dark;--bg:#0f131b;--panel:#181e29;--soft:#141a24;--text:#edf2fb;
--muted:#a7b2c4;--line:rgba(148,163,190,.22);--brand:#b2b0ff;--brand-strong:#cbc9ff;--brand-soft:#292955;
--success:#79d8a8;--success-soft:#17382b;--warning:#ffc474;--danger:#ff969d;
--shadow:0 18px 46px rgba(0,0,0,.22)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.7 var(--font-sans);color:var(--text);background:var(--bg);min-height:100vh;
transition:background-color .25s var(--ease-in-out),color .25s var(--ease-in-out)}
.shell{width:min(100% - 32px,1080px);margin:0 auto;padding:26px 0 56px}

/* ---- 页头 ---- */
.pagehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.pagehead h1{font-size:clamp(22px,2.2vw,28px);font-weight:720;letter-spacing:-.01em}
.pagehead .back{margin-left:auto;border:1px solid var(--line);border-radius:999px;background:var(--panel);
color:var(--muted);padding:7px 14px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer;
transition:border-color .18s var(--ease-out),color .18s var(--ease-out),transform .18s var(--ease-out)}
.pagehead .back:hover{border-color:color-mix(in srgb,var(--brand) 42%,var(--line));color:var(--brand);transform:translateY(-1px)}
.subtitle{color:var(--muted);font-size:13.5px;margin:0 0 22px}

/* ---- 工具卡片网格 ---- */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.tool{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;
border:1px solid var(--line);border-radius:var(--radius-4);background:var(--panel);box-shadow:var(--shadow);
color:var(--text);text-decoration:none;
transition:border-color .18s var(--ease-out),box-shadow .25s var(--ease-out),transform .2s var(--ease-out)}
.tool:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));
box-shadow:0 10px 28px color-mix(in srgb,var(--brand) 14%,transparent),0 0 0 1px color-mix(in srgb,var(--brand) 18%,transparent);
transform:translateY(-2px)}
.tool:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 40%,transparent);outline-offset:3px}
.tool-head{display:flex;align-items:center;gap:11px;min-width:0}
.tool-ico{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;
background:var(--brand-soft);font-size:21px;line-height:1}
.tool-name{min-width:0}
.tool-name b{display:block;font-size:15.5px;font-weight:720;line-height:1.4}
.tool-name span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.tool-desc{color:var(--muted);font-size:13.5px;line-height:1.65;flex:1}
.tool-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.tool-go{margin-left:auto;color:var(--brand);font-size:13px;font-weight:650}
.tool-go::after{content:" →"}
.badge{padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.6}
.badge.ready{background:var(--success-soft);color:var(--success)}
.badge.todo{background:var(--soft);color:var(--muted);border:1px dashed var(--line)}

/* ---- 占位卡：提示后续工具将逐步扩充 ---- */
.tool-placeholder{display:flex;flex-direction:column;gap:8px;padding:20px;border:1px dashed var(--line);
border-radius:var(--radius-4);background:color-mix(in srgb,var(--soft) 60%,transparent);color:var(--muted)}
.tool-placeholder b{color:var(--text);font-size:14px;font-weight:650}
.tool-placeholder p{font-size:13px;line-height:1.65}

.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
@media(max-width:560px){.tool-grid{grid-template-columns:1fr}.shell{width:calc(100% - 20px);padding-top:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="pagehead">
    <h1>🧰 工具箱</h1>
    <a class="back" href="../cockpit.html">← 中控台</a>
  </div>
  <p class="subtitle">把日常要反复操作的事情做成小工具。点开一个开始使用，后续会持续加入新的工具。</p>

  <div class="tool-grid">
    <a class="tool" href="tools/nju-booking.html">
      <div class="tool-head">
        <span class="tool-ico" aria-hidden="true">📅</span>
        <span class="tool-name">
          <b>南大预约系统</b>
          <span>健身房自动预约</span>
        </span>
      </div>
      <p class="tool-desc">保存南大统一身份认证账号后，按场馆、日期与优先时段创建预约任务，开放时自动执行；结果可发送到邮箱。</p>
      <div class="tool-foot">
        <span class="badge ready">可用</span>
        <span class="tool-go">打开</span>
      </div>
    </a>

    <div class="tool-placeholder" aria-hidden="true">
      <b>更多工具</b>
      <p>这里会逐步加入新的小工具。每个工具都是独立子页面，互不影响。</p>
    </div>
  </div>

  <p class="foot">工具入口按需开放；如需新增工具，告诉我用途即可。</p>
</div>

<script>
/* Esc 返回上级：章节→模块→书架→中控台。输入框/弹窗内不触发。 */
(function(){{
  function parentOf(){{
    var path=location.pathname;
    // 章节页 → 模块页
    if(/\/library\/[^/]+\/chapter-\d+\.html$/.test(path))return 'index.html';
    // 模块页 → 书架
    if(/\/library\/[^/]+\.html$/.test(path))return '../index.html';
    // 全文搜索 → 书架
    if(/\/library\/search\.html$/.test(path))return 'index.html';
    // 工具子页 → 工具箱
    if(/\/pages\/tools\/.*\.html$/.test(path))return '../tools.html';
    // 其它二级页 → 中控台
    if(/\/pages\/[^/]+\.html$/.test(path))return '../cockpit.html';
    return null;
  }}
  document.addEventListener('keydown',function(e){{
    if(e.key!=='Escape')return;
    // 弹窗打开时让弹窗自己处理
    var modal=document.querySelector('.ann-mask.open,.weather-modal.open,[role="dialog"]:not([hidden])');
    if(modal)return;
    var el=document.activeElement;
    var tag=el?(el.tagName||'').toLowerCase():'';
    if(tag==='input'||tag==='textarea'||tag==='select'||(el&&el.isContentEditable))return;
    var target=parentOf();
    if(target){{e.preventDefault();location.href=target;}}
  }});
}})();
</script>
</body>
</html>
