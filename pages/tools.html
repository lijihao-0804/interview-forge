<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script src="../assets/time-utils.js?v=2"></script>
<script src="../assets/ui.js?v=1"></script>
<title>工具箱 · InterviewForge</title>
<style>
:root{
  color-scheme:light dark;
  --font-sans:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#edf0f8;--panel:#fff;--soft:#f2f4fb;--text:#172033;--muted:#647188;
  --line:#d6dded;--brand:#5654d4;--brand-strong:#4543bd;--brand-soft:#eeedff;
  --success:#13764b;--success-soft:#e7f6ee;--warning:#a45a00;--danger:#c1363e;
  --radius-2:10px;--radius-3:14px;--radius-4:20px;
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-in-out:cubic-bezier(.65,0,.35,1);
  --shadow:0 14px 38px rgba(31,42,68,.075)
}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--panel:#181e29;--soft:#141a24;--text:#edf2fb;
--muted:#a7b2c4;--line:rgba(148,163,190,.22);--brand:#b2b0ff;--brand-strong:#cbc9ff;--brand-soft:#292955;
--success:#79d8a8;--success-soft:#17382b;--warning:#ffc474;--danger:#ff969d;
--shadow:0 18px 46px rgba(0,0,0,.22)}}
html[data-theme="light"]{color-scheme:light;--bg:#edf0f8;--panel:#fff;--soft:#f2f4fb;--text:#172033;
--muted:#647188;--line:#d6dded;--brand:#5654d4;--brand-strong:#4543bd;--brand-soft:#eeedff;
--success:#13764b;--success-soft:#e7f6ee;--warning:#a45a00;--danger:#c1363e;
--shadow:0 14px 38px rgba(31,42,68,.075)}
html[data-theme="dark"]{color-scheme:dark;--bg:#0f131b;--panel:#181e29;--soft:#141a24;--text:#edf2fb;
--muted:#a7b2c4;--line:rgba(148,163,190,.22);--brand:#b2b0ff;--brand-strong:#cbc9ff;--brand-soft:#292955;
--success:#79d8a8;--success-soft:#17382b;--warning:#ffc474;--danger:#ff969d;
--shadow:0 18px 46px rgba(0,0,0,.22)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:15px/1.7 var(--font-sans);color:var(--text);background:var(--bg);min-height:100vh;
transition:background-color .25s var(--ease-in-out),color .25s var(--ease-in-out)}
.shell{width:calc(100% - 400px);max-width:1560px;margin:0 auto;padding:26px 0 56px}
@media(max-width:1400px){.shell{width:calc(100% - 100px)}}
@media(max-width:900px){.shell{width:calc(100% - 24px)}}
.pagehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:clamp(22px,2.2vw,28px);font-weight:720;letter-spacing:-.01em}
.pagehead .back{margin-left:auto;border:1px solid var(--line);border-radius:999px;background:var(--panel);
color:var(--muted);padding:7px 14px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer;
transition:border-color .18s var(--ease-out),color .18s var(--ease-out),transform .18s var(--ease-out)}
.pagehead .back:hover{border-color:color-mix(in srgb,var(--brand) 42%,var(--line));color:var(--brand);transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start;margin-bottom:18px}
.card{border:1px solid var(--line);border-radius:var(--radius-4);background:var(--panel);
box-shadow:var(--shadow);padding:20px}
.card h2{margin:0 0 13px;font-size:15px;font-weight:750;display:flex;align-items:center;gap:8px}
.card .hint{color:var(--muted);font-size:12.5px;line-height:1.65}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:var(--radius-2);
background:var(--soft);color:var(--text);padding:9px 12px;font:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand)}
.btn{border:1px solid var(--line);border-radius:var(--radius-2);background:var(--soft);color:var(--text);
padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;
transition:border-color .18s var(--ease-out),background-color .18s var(--ease-out),transform .18s var(--ease-out)}
.btn:hover{border-color:color-mix(in srgb,var(--brand) 42%,var(--line));color:var(--brand);transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.primary{border-color:var(--brand);background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-strong);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel))}
.btn.small{padding:4px 10px;font-size:12px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:650}
.badge.pending{color:var(--brand);background:var(--brand-soft)}
.badge.running{color:var(--warning);background:color-mix(in srgb,var(--warning) 14%,var(--panel))}
.badge.succeeded{color:var(--success);background:var(--success-soft)}
.badge.failed{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--panel))}
.badge.ambiguous{color:var(--warning);background:color-mix(in srgb,var(--warning) 14%,var(--panel))}
.badge.no_slot,.badge.cancelled{color:var(--muted);background:var(--soft)}
.booking-layout{grid-template-columns:minmax(280px,.72fr) minmax(0,1.28fr);align-items:start}
.jobs-wrap{min-width:0;overflow-x:auto}
table.jobs{width:100%;min-width:620px;border-collapse:collapse;font-size:13.5px}
table.jobs th{font-size:11.5px;color:var(--muted);font-weight:650;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
table.jobs td{padding:9px 9px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);vertical-align:top}
table.jobs tr:last-child td{border-bottom:0}
@media(max-width:900px){.booking-layout{grid-template-columns:1fr}}
.slotrows{display:flex;flex-direction:column;gap:8px}
.slotrow{display:flex;gap:8px;align-items:center}
.slotrow select{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--radius-2);background:var(--soft);
color:var(--text);padding:8px 11px;font:inherit;font-variant-numeric:tabular-nums}
.slotrow button{flex:none}
.msg{margin-top:11px;font-size:13px;border-radius:var(--radius-2);padding:8px 12px}
.msg.ok{color:var(--success);background:var(--success-soft)}
.msg.err{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel))}
.foot{color:var(--muted);font-size:12.5px;line-height:1.8;border:1px dashed var(--line);
border-radius:var(--radius-3);padding:13px 17px}
.foot b{color:var(--text)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="pagehead">
    <h1>🧰 工具箱</h1>
    <a class="back" href="../cockpit.html">← 返回中控台</a>
  </div>

  <div class="grid">
    <section class="card" id="card-cred">
      <h2>🔑 南大账号</h2>
      <p class="hint">用于登录和预约。</p>
      <div class="field">
        <label for="cred-account">学号 / 工号</label>
        <input id="cred-account" autocomplete="off" inputmode="numeric" placeholder="例如 522025230035">
      </div>
      <div class="field">
        <label for="cred-password">统一身份认证密码</label>
        <input id="cred-password" type="password" autocomplete="new-password" placeholder="输入密码以保存或更新">
      </div>
      <div class="actions">
        <button class="btn primary" id="cred-save" type="button">保存账号</button>
        <button class="btn danger" id="cred-delete" type="button">清除账号</button>
      </div>
      <p class="hint" id="cred-state" style="margin-top:11px">加载中…</p>
      <div class="msg" id="cred-msg" hidden></div>
    </section>

    <section class="card" id="card-notify">
      <h2>📬 结果通知</h2>
      <p class="hint">预约结果将发送到此邮箱（选填）。</p>
      <p class="hint" id="notify-smtp-state" aria-live="polite"></p>
      <div class="field">
        <label for="notify-to">接收通知的邮箱</label>
        <input id="notify-to" autocomplete="off" placeholder="例如 12345@qq.com">
      </div>
      <div class="actions">
        <button class="btn primary" id="notify-save" type="button">保存邮箱</button>
        <button class="btn" id="notify-test" type="button">发送测试</button>
        <button class="btn danger" id="notify-delete" type="button">删除</button>
      </div>
      <div class="msg" id="notify-msg" hidden></div>
    </section>

  </div>

  <section class="card" id="card-jobs" style="margin-bottom:18px">
    <h2>🏋️ 健身房预约</h2>
    <p class="hint">选择场馆、日期和时间区间。任务于预约开放后自动执行，确认免费后自动完成预约。</p>
    <div class="grid booking-layout" style="margin-top:14px">
      <div>
        <div class="field">
          <label for="job-venue">健身房</label>
          <select id="job-venue">
            <option value="129">一楼健身房</option>
            <option value="162">负一楼健身房</option>
          </select>
        </div>
        <div class="field">
          <label for="job-date">目标日期</label>
          <input id="job-date" type="date">
        </div>
        <div class="field">
          <label>优先预约时间区间</label>
          <p class="hint" style="margin-bottom:8px">可添加多个备选区间，合计最多 6 个小时段。</p>
          <div class="slotrows" id="slot-rows"></div>
          <div class="actions">
            <button class="btn small" id="slot-add" type="button">＋ 添加备选区间</button>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="job-create" type="button">创建自动预约</button>
        </div>
        <div class="msg" id="job-msg" hidden></div>
      </div>
      <div style="min-width:0">
        <div class="jobs-wrap">
          <table class="jobs">
            <thead><tr><th>日期</th><th>健身房</th><th>预约时段</th><th>状态</th><th></th></tr></thead>
            <tbody id="jobs-body"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <p class="hint" style="margin:0 2px 18px">每日 08:00 开始执行；执行开始后不可取消。</p>
</div>

<script>
(function () {
  "use strict";

  function makeApiError(endpoint, status, category, publicMessage) {
    var error = new Error(publicMessage || "请求失败");
    error.status = status;
    error.category = category || "network";
    error.publicMessage = publicMessage || "请求暂时失败";
    return error;
  }
  function api(path, options) {
    var request = Object.assign({ headers: { "Content-Type": "application/json" }, cache: "no-store" }, options || {});
    var endpoint = String(path).split("?", 1)[0];
    if (request.body && typeof request.body !== "string") request.body = JSON.stringify(request.body);
    var controller = new AbortController();
    request.signal = controller.signal;
    var timer = setTimeout(function () { controller.abort(); }, (options && options.timeout) || 12000);
    return fetch(path, request).then(function (r) {
      return r.text().then(function (text) {
        if (r.status === 401) {
          location.replace("/pages/login.html?next=" + encodeURIComponent("/pages/tools.html"));
          throw makeApiError(endpoint, 401, "unauthorized", "登录状态已失效，请重新登录");
        }
        var data = null;
        if (text) {
          try { data = JSON.parse(text); }
          catch (error) { throw makeApiError(endpoint, r.status, "invalid_json", "服务响应格式异常"); }
        }
        if (!r.ok) {
          var message = (data && data.error) ? data.error
            : (r.status >= 500 ? "服务暂时不可用" : (r.status === 403 ? "需要管理员权限" : "请求未成功"));
          throw makeApiError(endpoint, r.status, "http_error", message);
        }
        return { ok: true, data: data };
      });
    }).catch(function (error) {
      if (error && error.category) throw error;
      throw makeApiError(endpoint, 0, error && error.name === "AbortError" ? "timeout" : "network",
        error && error.name === "AbortError" ? "请求超时，请稍后重试" : "网络暂时不可用，请稍后重试");
    }).finally(function () { clearTimeout(timer); });
  }
  function $(id) { return document.getElementById(id); }
  function showMsg(id, text, ok) {
    var node = $(id);
    node.textContent = text;
    node.className = "msg " + (ok ? "ok" : "err");
    node.hidden = false;
  }
  function busyButton(btn, isBusy) { if (btn) btn.disabled = isBusy; }

  /* ---- 预约与凭据状态 ---- */
  function renderStatus(data) {
    var creds = data.credentials || {};
    var state = $("cred-state");
    if (creds.configured) {
      state.textContent = "账号已保存";
    } else {
      state.textContent = "请先保存南大账号密码。";
    }
  }

  /* ---- 凭据 ---- */
  function loadStatus() {
    return api("/api/tools/gym/credentials").then(function (res) { renderStatus({ credentials: res.data }); })
      .catch(function (error) { if (error.category !== "unauthorized") renderEnvError(error); });
  }
  function renderEnvError() {
    $("cred-state").textContent = "预约服务状态暂不可用，请稍后刷新。";
  }
  function saveCredentials() {
    var btn = $("cred-save");
    busyButton(btn, true);
    showMsg("cred-msg", "正在验证账号，请稍候…", true);
    api("/api/tools/gym/credentials", {
      method: "POST",
      timeout: 240000,
      body: { account: $("cred-account").value.trim(), password: $("cred-password").value }
    }).then(function (res) {
      var creds = res.data.credentials || {};
      var verification = creds.verification || {};
      if (verification.status === "ok") {
        showMsg("cred-msg", "账号已保存，登录验证通过 ✓", true);
      } else if (verification.status === "skipped") {
        showMsg("cred-msg", "账号已保存", true);
      } else {
        showMsg("cred-msg", "账号已保存，但登录验证未完成：" +
          (verification.detail || verification.status) + "（预约执行时还会再次验证）", false);
      }
      $("cred-password").value = "";
      return loadStatus();
    }).catch(function (error) {
      if (error.category !== "unauthorized") showMsg("cred-msg", error.publicMessage || "保存失败", false);
    }).finally(function () { busyButton(btn, false); });
  }
  function deleteCredentials() {
    if (!window.confirm("确定清除已保存的账号密码？待执行任务将无法登录。")) return;
    var btn = $("cred-delete");
    busyButton(btn, true);
    api("/api/tools/gym/credentials", { method: "DELETE" }).then(function () {
      showMsg("cred-msg", "账号信息已清除", true);
      $("cred-account").value = "";
      return loadStatus();
    }).catch(function (error) {
      if (error.category !== "unauthorized") showMsg("cred-msg", error.publicMessage || "删除失败", false);
    }).finally(function () { busyButton(btn, false); });
  }

  /* ---- 邮件通知（发件为全局，见管理后台；此处仅收件邮箱） ---- */
  function renderNotify(data) {
    var smtp = (data && data.smtp) || {};
    var smtpNode = $("notify-smtp-state");
    if (smtp.configured) {
      smtpNode.textContent = "邮件通知已就绪";
    } else {
      smtpNode.textContent = "邮件通知暂不可用";
    }
    if (data && data.recipient) $("notify-to").value = data.recipient;
  }
  function loadNotify() {
    return api("/api/tools/gym/notify").then(function (res) { renderNotify(res.data); })
      .catch(function (error) { if (error.category !== "unauthorized") $("notify-smtp-state").textContent = "通知状态暂不可用"; });
  }
  function saveNotify() {
    var btn = $("notify-save");
    busyButton(btn, true);
    api("/api/tools/gym/notify", {
      method: "POST",
      body: { notify_to: $("notify-to").value.trim() }
    }).then(function (res) {
      showMsg("notify-msg", "收件邮箱已保存", true);
      renderNotify(res.data.notify);
    }).catch(function (error) {
      if (error.category !== "unauthorized") showMsg("notify-msg", error.publicMessage || "保存失败", false);
    }).finally(function () { busyButton(btn, false); });
  }
  function testNotify() {
    var btn = $("notify-test");
    busyButton(btn, true);
    showMsg("notify-msg", "正在发送测试…", true);
    api("/api/tools/gym/notify/test", { method: "POST" })
      .then(function () { showMsg("notify-msg", "测试邮件已发送，请到收件邮箱查收", true); })
      .catch(function (error) {
        if (error.category !== "unauthorized") showMsg("notify-msg", error.publicMessage || "发送失败", false);
      })
      .finally(function () { busyButton(btn, false); });
  }
  function deleteNotify() {
    if (!window.confirm("删除通知邮箱？")) return;
    var btn = $("notify-delete");
    busyButton(btn, true);
    api("/api/tools/gym/notify", { method: "DELETE" }).then(function () {
      showMsg("notify-msg", "收件邮箱已删除", true);
      $("notify-to").value = "";
      return loadNotify();
    }).catch(function (error) {
      if (error.category !== "unauthorized") showMsg("notify-msg", error.publicMessage || "删除失败", false);
    }).finally(function () { busyButton(btn, false); });
  }

  /* ---- 时段优先级行 ---- */
  function hourLabel(hour) { return (hour < 10 ? "0" : "") + hour + ":00"; }
  function addSlotRow(startValue, endValue) {
    var rows = $("slot-rows");
    if (rows.children.length >= 6) return;
    var row = document.createElement("div");
    row.className = "slotrow";
    var start = document.createElement("select");
    start.setAttribute("aria-label", "区间开始时间");
    var end = document.createElement("select");
    end.setAttribute("aria-label", "区间结束时间");
    for (var h = 0; h <= 22; h++) {
      var option = document.createElement("option");
      option.value = String(h);
      option.textContent = hourLabel(h);
      start.appendChild(option);
    }
    function updateEnd(preferred) {
      var firstEnd = Number(start.value) + 1;
      end.textContent = "";
      for (var e = firstEnd; e <= 23; e++) {
        var option = document.createElement("option");
        option.value = String(e);
        option.textContent = hourLabel(e);
        end.appendChild(option);
      }
      var wanted = preferred == null ? firstEnd : Number(preferred);
      end.value = String(wanted >= firstEnd && wanted <= 23 ? wanted : firstEnd);
    }
    start.value = String(startValue == null ? 17 : startValue);
    start.addEventListener("change", function () { updateEnd(end.value); });
    updateEnd(endValue == null ? Number(start.value) + 1 : endValue);
    var remove = document.createElement("button");
    remove.type = "button";
    remove.className = "btn small danger";
    remove.textContent = "移除";
    remove.setAttribute("aria-label", "移除此备选区间");
    remove.addEventListener("click", function () {
      if (rows.children.length > 1) row.remove();
    });
    row.appendChild(start);
    row.appendChild(document.createTextNode(" 至 "));
    row.appendChild(end);
    row.appendChild(remove);
    rows.appendChild(row);
  }
  function collectSlots() {
    var slots = [];
    var rows = $("slot-rows").children;
    for (var i = 0; i < rows.length; i++) {
      var start = Number(rows[i].querySelector("select[aria-label=\"区间开始时间\"]").value);
      var end = Number(rows[i].querySelector("select[aria-label=\"区间结束时间\"]").value);
      if (!Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end > 23 || end <= start) {
        return { error: "请选择有效的起止时间区间。" };
      }
      for (var hour = start; hour < end; hour++) {
        var slot = hourLabel(hour) + "-" + hourLabel(hour + 1);
        if (slots.indexOf(slot) === -1) slots.push(slot);
      }
    }
    if (slots.length > 6) return { error: "所选区间合计超过 6 个小时段，请缩短区间或移除备选区间。" };
    return { slots: slots };
  }

  /* ---- 任务 ---- */
  var STATUS_LABEL = {
    pending: "待执行", running: "预约中", succeeded: "已预约", no_slot: "暂无空位",
    ambiguous: "请核对订单", failed: "未完成", cancelled: "已取消"
  };
  function renderJobs(items) {
    var body = $("jobs-body");
    body.textContent = "";
    if (!items.length) {
      var tr0 = document.createElement("tr");
      var td0 = document.createElement("td");
      td0.colSpan = 5;
      td0.className = "empty";
      td0.textContent = "暂无预约任务";
      tr0.appendChild(td0);
      body.appendChild(tr0);
      return;
    }
    items.forEach(function (job) {
      var tr = document.createElement("tr");
      tr.appendChild(el("td", null, job.target_date));
      var venue = String(job.venue || "129");
      tr.appendChild(el("td", null, {"129": "一楼健身房", "162": "负一楼健身房"}[venue] || "场馆 " + venue));
      tr.appendChild(el("td", null, (job.slots || []).join(" → ")));
      var tdStatus = document.createElement("td");
      var badge = el("span", "badge " + job.status, STATUS_LABEL[job.status] || job.status);
      tdStatus.appendChild(badge);
      tr.appendChild(tdStatus);
      var tdAction = document.createElement("td");
      if (job.status === "pending") {
        var cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "btn small danger";
        cancel.textContent = "取消排程";
        cancel.addEventListener("click", function () {
          if (!window.confirm("取消 #" + job.id + "（" + job.target_date + "）的自动预约排程？\n只取消本工具排程，不会取消南大已生成的预约。")) return;
          api("/api/tools/gym/jobs/" + job.id, { method: "DELETE" })
            .then(function () { loadJobs(); })
            .catch(function (error) {
              if (error.category !== "unauthorized") window.alert(error.publicMessage || "取消失败");
            });
        });
        tdAction.appendChild(cancel);
      } else if (job.status === "ambiguous") {
        var resolve = document.createElement("button");
        resolve.type = "button";
        resolve.className = "btn small";
        resolve.textContent = "核对订单后重试";
        resolve.addEventListener("click", function () {
          if (!window.confirm(
            "请先确认南大订单中没有该场馆的有效预约或待支付订单。\n"
            + "确认无订单并允许重试？"
          )) return;
          api("/api/tools/gym/jobs/" + job.id + "/resolve", {
            method: "POST", body: { confirmed_no_order: true }
          }).then(function () { loadJobs(); })
            .catch(function (error) {
              if (error.category !== "unauthorized") window.alert(error.publicMessage || "核对失败");
            });
        });
        tdAction.appendChild(resolve);
      }
      tr.appendChild(tdAction);
      body.appendChild(tr);
    });
  }
  function loadJobs() {
    return api("/api/tools/gym/jobs").then(function (res) { renderJobs(res.data.items || []); })
      .catch(function (error) {
        if (error.category === "unauthorized") return;
        var body = $("jobs-body");
        body.textContent = "";
        var tr = document.createElement("tr");
        var td = document.createElement("td");
        td.colSpan = 5;
        td.className = "empty";
        td.textContent = error.publicMessage || "任务列表加载失败";
        tr.appendChild(td);
        body.appendChild(tr);
      });
  }
  function createJob() {
    var dateValue = $("job-date").value;
    var selection = collectSlots();
    if (selection.error) { showMsg("job-msg", selection.error, false); return; }
    var slots = selection.slots;
    if (!dateValue) { showMsg("job-msg", "请选择目标日期", false); return; }
    var btn = $("job-create");
    busyButton(btn, true);
    api("/api/tools/gym/jobs", {
      method: "POST",
      body: { target_date: dateValue, slots: slots, venue: $("job-venue").value }
    }).then(function () {
      showMsg("job-msg", "已加入预约列表，预约日 08:00 开始执行。", true);
      return loadJobs();
    }).catch(function (error) {
      if (error.category !== "unauthorized") showMsg("job-msg", error.publicMessage || "创建失败", false);
    }).finally(function () { busyButton(btn, false); });
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  /* ---- init ---- */
  function initDateInput() {
    var input = $("job-date");
    var today = new Date();
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    input.min = today.getFullYear() + "-" + pad(today.getMonth() + 1) + "-" + pad(today.getDate());
  }
  addSlotRow(17, 18);
  addSlotRow(16, 17);
  initDateInput();
  $("cred-save").addEventListener("click", saveCredentials);
  $("cred-delete").addEventListener("click", deleteCredentials);
  $("notify-save").addEventListener("click", saveNotify);
  $("notify-test").addEventListener("click", testNotify);
  $("notify-delete").addEventListener("click", deleteNotify);
  $("slot-add").addEventListener("click", function () { addSlotRow(17, 18); });
  $("job-create").addEventListener("click", createJob);
  loadStatus();
  loadNotify();
  loadJobs();
  window.setInterval(function () { loadJobs(); loadStatus(); }, 30000);
})();
</script>
</body>
</html>
