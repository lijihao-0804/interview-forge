<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI 岗笔试大题 · InterviewForge</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
 body{background:var(--page-bg,#f4f6fb);color:var(--text);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
 .practice-shell{width:calc(100% - 80px);max-width:1080px;margin:auto;padding:26px 0 64px}
 .practice-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
 .practice-head h1{margin:0 0 5px;font-size:24px}
 .practice-head p{margin:0;color:var(--muted);font-size:13px}
 .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:16px}
 select,input{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--surface);color:inherit}
 .count{margin-left:auto;color:var(--muted);font-size:13px}
 .q-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;margin-bottom:12px;overflow:hidden;box-shadow:0 6px 18px rgba(33,45,73,.04)}
 .q-card>summary{cursor:pointer;list-style:none;padding:15px 18px;display:flex;gap:12px;align-items:flex-start}
 .q-card>summary::-webkit-details-marker{display:none}
 .q-card>summary:before{content:"▸";color:var(--muted);margin-top:2px;transition:transform .15s}
 .q-card[open]>summary:before{transform:rotate(90deg)}
 .q-main{min-width:0;flex:1}
 .q-title{font-weight:700;font-size:15px;margin:0 0 4px}
 .q-meta{font-size:12px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
 .q-summary{font-size:13px;color:#5a6472;margin:7px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .q-body{padding:0 20px 18px;border-top:1px solid #eef0f6}
 .q-section{margin-top:15px}
 .q-section h4{font-size:14px;color:var(--brand);margin:0 0 5px}
 .q-section p{white-space:pre-wrap;margin:0 0 8px;font-size:14px;color:#2b3446}
 pre{margin:8px 0 0;padding:12px 14px;border-radius:10px;background:#111827;color:#e5e7eb;overflow:auto;font:12.5px/1.55 "JetBrains Mono",Consolas,monospace;max-height:460px}
 .source{display:inline-block;margin-top:12px;font-size:12.5px}
 .empty{padding:40px 0;text-align:center;color:var(--muted)}
 @media(max-width:760px){.practice-shell{width:calc(100% - 24px)}.count{width:100%;margin-left:0}}
</style>
</head>
<body>
<header class="site-topbar" style="max-width:1000px;width:calc(100% - 80px);margin:16px auto 6px">
  <a class="site-brand" href="../index.html">Hot 100 深度学习库</a>
  <nav aria-label="主导航" class="site-nav">
    <a href="../index.html">题目面板</a>
    <a href="../cockpit.html">中控台</a>
    <a href="../library/index.html">学习书架</a>
    <a href="../pages/quiz.html?bank=ai-exam">AI 岗选择题</a>
    <a href="../books/hot100/00-总览/01-学习路线.html">学习路线</a>
  </nav>
</header>
<div class="practice-shell">
  <nav class="page-nav" aria-label="面包屑"><a href="../library/index.html">📚 学习书架</a><span aria-hidden="true">›</span><a href="../library/ai-exam-index/index.html">AI 岗笔试真题导航</a><span aria-hidden="true">›</span><span aria-current="page">大题</span></nav>
  <div class="practice-head">
    <div>
      <h1>AI 岗笔试大题</h1>
      <p>按企业筛选，展开看题目描述、思路、题解代码与复杂度；原题版权归来源页面。</p>
    </div>
  </div>
  <div class="toolbar">
    <label for="companyFilter" style="font-size:13px;color:var(--muted)">企业</label>
    <select id="companyFilter" aria-label="按企业筛选"><option value="">全部企业</option></select>
    <span class="count" id="count">加载中…</span>
  </div>
  <main id="list"><div class="empty">题目加载中…</div></main>
</div>
<script>
(function(){
  var DATA=null, company='';
  var list=document.getElementById('list'), filter=document.getElementById('companyFilter'), count=document.getElementById('count');
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function renderSection(section){
    var html='<section class="q-section">';
    if(section.heading && section.heading!=='题目说明') html+='<h4>'+esc(section.heading)+'</h4>';
    if(section.text) html+='<p>'+esc(section.text)+'</p>';
    if(section.code) html+='<pre><code>'+esc(section.code)+'</code></pre>';
    return html+'</section>';
  }
  function renderCard(item){
    var el=document.createElement('details'); el.className='q-card'; el.dataset.company=item.company;
    var summary=item.summary || (item.sections&&item.sections[0]&&item.sections[0].text) || '';
    if(summary.length>180) summary=summary.slice(0,180)+'…';
    el.innerHTML='<summary><div class="q-main"><p class="q-title">'+esc(item.title)+'</p>'+
      '<div class="q-meta"><span>'+esc(item.company)+'</span><span>'+esc(item.date||'日期未标注')+'</span><span>'+esc(item.role||'')+'</span></div>'+
      '<p class="q-summary">'+esc(summary)+'</p></div></summary><div class="q-body"></div>';
    var body=el.querySelector('.q-body');
    el.addEventListener('toggle',function(){
      if(!el.open || body.dataset.loaded) return;
      body.dataset.loaded='1';
      body.innerHTML=(item.sections||[]).map(renderSection).join('')+
        '<a class="source" href="'+esc(item.source_url)+'" target="_blank" rel="noopener noreferrer">打开原题页面 ↗</a>';
    });
    return el;
  }
  function render(){
    if(!DATA) return;
    var items=DATA.problems.filter(function(item){return !company || item.company===company});
    count.textContent='共 '+items.length+' 道大题';
    list.innerHTML='';
    if(!items.length){ list.innerHTML='<div class="empty">当前企业暂无题目。</div>'; return; }
    items.forEach(function(item){ list.appendChild(renderCard(item)); });
  }
  fetch('../assets/ai-exam-coding.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    DATA=d;
    var companies=Array.from(new Set(d.problems.map(function(x){return x.company}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b,'zh')});
    filter.innerHTML='<option value="">全部企业</option>'+companies.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join('');
    filter.addEventListener('change',function(){ company=this.value; render(); });
    render();
  }).catch(function(e){ list.innerHTML='<div class="empty">题目加载失败：'+esc(e.message)+'</div>'; });
})();
</script>
</body>
</html>
