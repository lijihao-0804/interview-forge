<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>注册 · InterviewForge</title>
<script src="../assets/register-flow.js?v=4"></script>
<style>
  :root { --page-bg:#f4f6fb; --surface:#fff; --text:#182235; --muted:#66748a; --line:#dfe4ee; --brand:#5654d4; --brand-strong:#4543bd; --brand-soft:#eeedff; --error:#b3372f; --success:#13764b; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--page-bg); color:var(--text); font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; padding:24px; }
  .card { width:100%; max-width:430px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:34px 32px; box-shadow:0 16px 44px rgba(33,45,73,.08); }
  h1 { font-size:22px; margin-bottom:6px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
  label { display:block; font-size:13px; font-weight:650; margin:14px 0 6px; }
  input { width:100%; min-height:42px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; color:var(--text); background:#fbfcff; font:inherit; }
  input:focus,button:focus-visible,a:focus-visible { outline:2px solid var(--brand-soft); outline-offset:1px; border-color:var(--brand); }
  .email-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:stretch; }
  .email-row button { min-width:112px; padding:8px 12px; border:1px solid color-mix(in srgb,var(--brand) 36%,var(--line)); border-radius:8px; color:var(--brand-strong); background:var(--brand-soft); font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .email-row button:disabled { opacity:.62; cursor:wait; }
  #submit { width:100%; margin-top:22px; padding:11px; border:0; border-radius:8px; background:var(--brand); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  #submit:hover { background:var(--brand-strong); }
  #submit:disabled { opacity:.6; cursor:wait; }
  .hint { min-height:18px; margin-top:5px; font-size:12px; color:var(--muted); }
  .hint.error { color:var(--error); }
  .hint.success { color:var(--success); }
  .msg { margin-top:14px; font-size:13px; min-height:20px; }
  .msg.error { color:var(--error); }
  .links { margin-top:18px; font-size:13px; text-align:center; }
  a { color:var(--brand); text-decoration:none; }
  a:hover { text-decoration:underline; }
  @media (max-width:480px) { body { padding:12px; } .card { padding:26px 20px; } .email-row { grid-template-columns:1fr; } .email-row button { width:100%; } }
  @media (prefers-color-scheme:dark) {
    :root { --page-bg:#0f131b; --surface:#181e29; --text:#edf2fb; --muted:#a7b2c4; --line:#313b4c; --brand:#b2b0ff; --brand-strong:#cbc9ff; --brand-soft:#292955; --error:#ff969d; --success:#79d8a8; }
    input { background:#141a24; }
  }
</style>
</head>
<body>
<main class="card">
  <h1>注册新账号</h1>
  <p class="sub">使用邮箱验证码注册。登录后可保存练习题解进度、收藏、学习记录和个人设置。</p>
  <form id="form" novalidate>
    <label for="email">邮箱</label>
    <div class="email-row">
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="name@example.com" required autofocus>
      <button id="sendCode" type="button">发送验证码</button>
    </div>
    <div class="hint" id="emailHint" role="status" aria-live="polite"></div>

    <label for="code">邮箱验证码</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="请输入邮件中的验证码" required>

    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required pattern="[A-Za-z0-9_-]{2,32}" title="2~32 位字母、数字、下划线或连字符">
    <div class="hint">2~32 位字母、数字、下划线或连字符，注册后不可修改</div>

    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
    <label for="confirm">确认密码</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8">

    <button type="submit" id="submit">注 册</button>
    <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
  </form>
  <div class="links"><a id="loginLink" href="login.html">已有账号？去登录</a> · <a id="guestLink" href="/index.html">游客继续阅读</a></div>
</main>
<script>
(function () {
  "use strict";
  var flow = window.InterviewForgeRegister;
  var form = document.getElementById("form");
  var email = document.getElementById("email");
  var code = document.getElementById("code");
  var username = document.getElementById("username");
  var password = document.getElementById("password");
  var confirm = document.getElementById("confirm");
  var sendButton = document.getElementById("sendCode");
  var submit = document.getElementById("submit");
  var message = document.getElementById("msg");
  var emailHint = document.getElementById("emailHint");
  var cooldownUntil = 0;
  var cooldownTimer = null;
  var sending = false;
  var submitting = false;

  function safeNext() {
    var value = new URLSearchParams(location.search).get("next") || "/index.html";
    try {
      var target = new URL(value, location.origin);
      if (target.origin !== location.origin || !target.pathname.startsWith("/")) throw new Error("external next");
      return target.pathname + target.search + target.hash;
    } catch (_) { return "/index.html"; }
  }

  var next = safeNext();
  document.getElementById("loginLink").href = "/pages/login.html?next=" + encodeURIComponent(next);
  document.getElementById("guestLink").href = next;

  function setMessage(text, type) {
    message.textContent = text || "";
    message.className = "msg" + (type ? " " + type : "");
  }

  function setEmailHint(text, type) {
    emailHint.textContent = text || "";
    emailHint.className = "hint" + (type ? " " + type : "");
  }

  function remainingSeconds() {
    return Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
  }

  function paintSendButton() {
    var seconds = remainingSeconds();
    sendButton.disabled = sending || submitting || seconds > 0;
    sendButton.textContent = sending ? "发送中…" : seconds > 0 ? seconds + " 秒后重试" : "发送验证码";
  }

  function stopCooldown() {
    if (cooldownTimer) clearInterval(cooldownTimer);
    cooldownTimer = null;
    cooldownUntil = 0;
    paintSendButton();
  }

  function startCooldown(seconds) {
    var safeSeconds = Math.max(1, Math.ceil(Number(seconds) || 1));
    cooldownUntil = Date.now() + safeSeconds * 1000;
    if (cooldownTimer) clearInterval(cooldownTimer);
    paintSendButton();
    cooldownTimer = setInterval(function () {
      if (remainingSeconds() <= 0) stopCooldown();
      else paintSendButton();
    }, 250);
  }

  async function readJson(response) {
    return response.json().catch(function () { return {}; });
  }

  sendButton.addEventListener("click", async function () {
    if (sending || submitting || remainingSeconds() > 0) return;
    var address = email.value.trim();
    if (!flow.isEmail(address)) {
      setEmailHint("请输入有效的邮箱地址。", "error");
      email.focus();
      return;
    }
    sending = true;
    setMessage("");
    setEmailHint("正在发送验证码…", "");
    paintSendButton();
    try {
      var response = await fetch("/api/register/send-code", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: address })
      });
      var payload = await readJson(response);
      if (!response.ok) {
        var retrySeconds = flow.cooldownFrom(response, payload);
        if (retrySeconds > 0) startCooldown(retrySeconds);
        setEmailHint(flow.sendCodeError(response.status, payload, retrySeconds), "error");
        return;
      }
      var resendAfter = flow.cooldownFrom(response, payload);
      startCooldown(resendAfter || 60);
      var expires = Math.max(0, Math.ceil(Number(payload.expires_in) || 0));
      var validity = expires ? "，" + Math.ceil(expires / 60) + " 分钟内有效" : "";
      setEmailHint("验证码已发送" + validity + "。请同时检查垃圾邮件目录。", "success");
      code.focus();
    } catch (_) {
      setEmailHint("未能确认发送结果。请检查网络和邮箱；如未收到，可稍后重试。", "error");
    } finally {
      sending = false;
      paintSendButton();
    }
  });

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    if (submitting) return;
    setMessage("");
    var address = email.value.trim();
    var enteredCode = code.value.trim();
    var account = username.value.trim();
    if (!flow.isEmail(address)) { setMessage("请输入有效的邮箱地址。", "error"); email.focus(); return; }
    if (!enteredCode) { setMessage("请输入邮箱验证码。", "error"); code.focus(); return; }
    if (!/^[A-Za-z0-9_-]{2,32}$/.test(account)) { setMessage("用户名需为 2~32 位字母、数字、下划线或连字符。", "error"); username.focus(); return; }
    if (password.value.length < 8) { setMessage("密码至少需要 8 位。", "error"); password.focus(); return; }
    if (password.value !== confirm.value) { setMessage("两次输入的密码不一致。", "error"); confirm.focus(); return; }
    submitting = true;
    submit.disabled = true;
    sendButton.disabled = true;
    submit.textContent = "注册中…";
    try {
      var response = await fetch("/api/register", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: address, username: account, password: password.value, code: enteredCode })
      });
      var payload = await readJson(response);
      if (!response.ok) {
        setMessage(flow.registerError(response.status, payload), "error");
        return;
      }
      location.replace(next);
    } catch (_) {
      setMessage("未能确认注册结果。请检查网络后尝试登录；若可登录，说明注册已成功。", "error");
    } finally {
      submitting = false;
      submit.disabled = false;
      submit.textContent = "注 册";
      paintSendButton();
    }
  });

  fetch("/api/me", { credentials: "same-origin", cache: "no-store" }).then(function (response) {
    if (response.ok) location.replace(next);
  }).catch(function () {});
})();
</script>
</body>
</html>
