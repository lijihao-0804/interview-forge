<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>选择题练习 · InterviewForge</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
 body{background:var(--page-bg,#f4f6fb);color:var(--text);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
 .quiz-shell{width:calc(100% - 80px);max-width:1000px;margin:auto;padding:26px 0 60px}
 .mode-switch{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
 .mode-switch button{padding:9px 18px;border:0;background:transparent;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
 .mode-switch button.on{background:var(--brand);color:#fff}
 .panel-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:0 10px 30px rgba(33,45,73,.06);margin-bottom:18px}
 .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
 select{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--surface);color:inherit}
 .btn{padding:9px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:inherit;font-weight:600;cursor:pointer}
 .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
 .btn:disabled{opacity:.5;cursor:not-allowed}
 /* 分类卡片墙（书架分节风格） */
 .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
 .cat-card{display:block;text-align:left;padding:18px 20px;border:1px solid var(--line);border-radius:16px;
   background:var(--surface);cursor:pointer;transition:all .15s;box-shadow:0 6px 18px rgba(33,45,73,.05)}
 .cat-card:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 12px 28px rgba(86,84,212,.14)}
 .cat-card h3{margin:0 0 6px;font-size:16px;color:var(--text)}
 .cat-card .n{font-size:13px;color:var(--muted)}
 .cat-card .bar{height:5px;border-radius:99px;background:#eef0f8;overflow:hidden;margin-top:10px}
 .cat-card .bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
 .crumb{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:14px}
 .crumb button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font:inherit}
 .crumb b{color:var(--brand)}
 /* 背题整块 */
 .study-block{margin:0 0 26px}
 .study-block>h2{font-size:18px;margin:0 0 4px;padding:8px 0;border-bottom:2px solid var(--brand);position:sticky;top:0;background:var(--page-bg,#f4f6fb);z-index:2}
 .study-block>h2 small{color:var(--muted);font-size:12px;font-weight:400;margin-left:8px}
 .study-q{padding:16px 0;border-bottom:1px dashed #e6e9f5}
 .study-q .stem{font-weight:650;margin:0 0 10px;line-height:1.5}
 .study-q .opt{padding:7px 12px;margin-bottom:6px;border-radius:9px;font-size:14px;border:1px solid transparent}
 .study-q .opt.correct{background:#e5f5ec;border-color:#157a52}
 .study-q .opt .k{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#e7ebf6;font-weight:700;margin-right:8px;font-size:12px}
 .study-q .opt.correct .k{background:#157a52;color:#fff}
 .study-q .ans{margin-top:8px;padding:10px 13px;border-radius:10px;background:#f7f8fd;border:1px solid #e6e9f5;font-size:13.5px;color:#2b3446}
 .study-q .ans b{color:var(--brand)}
 /* 整卷测评 */
 .exam-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
 .exam-bar b{color:var(--text);font-variant-numeric:tabular-nums}
 .q-stem{font-size:18px;font-weight:650;line-height:1.5;margin:0 0 16px}
 .optbtn{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:#fbfcff;font:inherit;cursor:pointer;transition:all .15s}
 .optbtn:hover{border-color:var(--brand);background:var(--brand-soft,#eeedff)}
 .optbtn.sel{border-color:var(--brand);background:var(--brand-soft,#eeedff)}
 .optbtn .k{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#e7ebf6;font-weight:700;margin-right:10px}
 .optbtn.sel .k{background:var(--brand);color:#fff}
 .res-item{padding:12px 0;border-bottom:1px dashed #e6e9f5}
 .res-badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;margin-left:8px}
 .res-badge.ok{background:#e5f5ec;color:#157a52}
 .res-badge.no{background:#fbe9e7;color:#b3372f}
 .big-score{font-size:40px;font-weight:800;color:var(--brand);line-height:1.1}
 .empty{text-align:center;color:var(--muted);padding:40px 0}
 @media(max-width:700px){.quiz-shell{width:calc(100% - 24px)}.cat-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="quiz-shell">
  <nav class="page-nav" aria-label="面包屑"><a href="../library/index.html">📚 学习书架</a><span aria-hidden="true">›</span><span aria-current="page">选择题练习</span></nav>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:8px 0 16px">
    <div>
      <h1 style="margin:0 0 4px;font-size:24px">选择题练习</h1>
      <p style="margin:0;font-size:13px;color:var(--muted)">按主题分类。<b>背题</b>整块滚动看；<b>做题</b>整卷测评，交卷判分。</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn" id="btnWrongCenter" type="button">📕 错题中心<span id="wrongCount" style="margin-left:4px;color:#b3372f;font-weight:700"></span></button>
      <div class="mode-switch" id="modeSwitch">
        <button type="button" data-mode="study" class="on">背题模式</button>
        <button type="button" data-mode="exam">做题模式</button>
      </div>
    </div>
  </div>

  <!-- 首页：分类卡片墙 -->
  <div id="homePanel">
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <!-- 分类内 -->
  <div id="catPanel" hidden>
    <div class="crumb"><button id="btnHome" type="button">← 全部分类</button><span>当前：<b id="crumbCat"></b></span></div>
    <div id="studyPanel"></div>
    <div id="examPanel" hidden>
      <div class="panel-card" id="examSetup">
        <div class="toolbar" style="gap:16px">
          <label>题目数 <select id="examCount">
            <option value="10">10 题</option><option value="20" selected>20 题</option>
            <option value="30">30 题</option><option value="0">全部</option></select></label>
          <button class="btn primary" id="btnStart" type="button">开始测评</button>
        </div>
        <p style="margin:12px 0 0;font-size:12.5px;color:var(--muted)">只考当前分类。整卷作答，可前后翻题，交卷后统一判分。</p>
      </div>
      <div id="examRun" hidden>
        <div class="panel-card">
          <div class="exam-bar">
            <span>第 <b id="exIdx">1</b> / <b id="exTotal">20</b> 题 · 已答 <b id="exDone">0</b></span>
            <span id="exTimer">00:00</span>
          </div>
          <div id="examCard"></div>
          <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
            <button class="btn" id="btnPrev" type="button">上一题</button>
            <button class="btn" id="btnNextQ" type="button">下一题</button>
            <button class="btn primary" id="btnSubmitExam" type="button" style="margin-left:auto">交卷判分</button>
          </div>
        </div>
      </div>
      <div id="examResult" hidden></div>
    </div>
  </div>
  <div style="margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;line-height:1.9">
    快捷键：<kbd>A</kbd>–<kbd>D</kbd>/<kbd>1</kbd>–<kbd>4</kbd> 选项 · <kbd>←</kbd><kbd>→</kbd> 翻题 · <kbd>Enter</kbd> 下一题 · <kbd>M</kbd> 切模式 · <kbd>Esc</kbd> 返回分类
  </div>
</div>
<script>
(function(){
  var DATA=null, mode='study', currentCat='';
  var STORE_KEY='forgeQuizProgress';
  function loadProgress(){ try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch(e){return {}} }
  function saveProgress(p){ try{localStorage.setItem(STORE_KEY,JSON.stringify(p))}catch(e){} }
  var progress=loadProgress();
  var wrongSet={}; Object.keys(progress).forEach(function(k){ if(progress[k]&&progress[k].correct===false) wrongSet[k]=1; });
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function catStats(){
    var c={}; DATA.questions.forEach(function(q){c[q.category]=(c[q.category]||0)+1});
    return c;
  }
  var MAXN=0;
  var WRONG='__wrong__';  // 错题中心特殊分类标记
  function wrongPool(){ return DATA.questions.filter(function(q){return wrongSet[q.key]}); }
  function updateWrongCount(){
    var n=Object.keys(wrongSet).length, el=document.getElementById('wrongCount');
    if(el) el.textContent = n? '('+n+')' : '';
  }
  function openWrongCenter(){
    currentCat=WRONG;
    document.getElementById('crumbCat').textContent='错题中心';
    document.getElementById('homePanel').hidden=true;
    document.getElementById('catPanel').hidden=false;
    document.getElementById('examResult').hidden=true;
    document.getElementById('examSetup').hidden=false;
    document.getElementById('examRun').hidden=true;
    // 错题中心总是先显示错题列表（背题式），列表里有「重做错题」按钮
    renderStudy();
  }
  function renderHome(){
    var c=catStats();
    MAXN=Math.max.apply(null,Object.values(c).concat([1]));
    var keys=Object.keys(c).sort(function(a,b){return c[b]-c[a]});
    document.getElementById('catGrid').innerHTML=keys.map(function(k){
      var done=DATA.questions.filter(function(q){return q.category===k && progress[q.key]}).length;
      var pct=c[k]?Math.round(done/c[k]*100):0;
      return '<button class="cat-card" data-cat="'+esc(k)+'"><h3>'+esc(k)+'</h3>'+
        '<div class="n">已学 '+done+' / '+c[k]+' 题 · '+pct+'%</div><div class="bar"><i style="width:'+pct+'%"></i></div></button>';
    }).join('');
    document.querySelectorAll('.cat-card').forEach(function(b){
      b.addEventListener('click',function(){ openCat(b.dataset.cat); });
    });
  }
  function openCat(cat){
    currentCat=cat;
    document.getElementById('crumbCat').textContent=cat;
    document.getElementById('homePanel').hidden=true;
    document.getElementById('catPanel').hidden=false;
    document.getElementById('examResult').hidden=true;
    document.getElementById('examSetup').hidden=false;
    document.getElementById('examRun').hidden=true;
    if(mode==='study'){ renderStudy(); } else { showExamPanel(); }
  }
  function goHome(){
    currentCat='';
    document.getElementById('homePanel').hidden=false;
    document.getElementById('catPanel').hidden=true;
    renderHome();
  }
  function showExamPanel(){
    document.getElementById('studyPanel').hidden=true;
    document.getElementById('examPanel').hidden=false;
  }
  function renderStudy(){
    document.getElementById('examPanel').hidden=true;
    var sp=document.getElementById('studyPanel'); sp.hidden=false;
    var pool = currentCat===WRONG ? wrongPool() : DATA.questions.filter(function(q){return q.category===currentCat});
    if(!pool.length){ sp.innerHTML='<div class="empty">'+(currentCat===WRONG?'🎉 太棒了，当前没有错题！':'该分类暂无题目。')+'</div>'; return; }
    var title = currentCat===WRONG ? '错题中心' : currentCat;
    var redoBtn = currentCat===WRONG ? '<div style="display:flex;gap:10px;margin:6px 0 14px;flex-wrap:wrap">'+
      '<button class="btn" id="btnWrongBack" type="button">← 返回全部题目</button>'+
      '<button class="btn primary" id="btnRedoWrong" type="button">✍️ 重做这 '+pool.length+' 道错题</button></div>' : '';
    var html='<section class="study-block"><h2>'+esc(title)+'<small>'+pool.length+' 题</small></h2>'+redoBtn;
    pool.forEach(function(q,qi){
      html+='<div class="study-q" data-qi="'+qi+'"><p class="stem">'+(qi+1)+'. '+esc(q.stem)+(q.multi?' <span style="font-size:12px;color:#b06f1a">（多选）</span>':'')+'</p>';
      var ansArr=q.answer||[];
      var myPick=(progress[q.key]&&progress[q.key].pick)||[];
      q.options.forEach(function(o,i){
        var isAns=ansArr.indexOf(i)>=0;
        var cls='opt'+(isAns?' correct':'')+((!isAns&&myPick.indexOf(i)>=0)?' wrong':'');
        html+='<div class="'+cls+'"><span class="k">'+String.fromCharCode(65+i)+'</span>'+esc(o)+(isAns?' ✓':'')+((!isAns&&myPick.indexOf(i)>=0)?' <span style="color:#b3372f;font-size:12px">（你的选择）</span>':'')+'</div>';
      });
      var ansText=ansArr.map(function(a){return String.fromCharCode(65+a)}).join('、');
      var pickText=myPick.length?'　<b style="color:#b3372f">你选了 '+letters(myPick)+'</b>':'';
      html+='<div class="ans"><b>答案 '+ansText+'</b>'+pickText+'　解析：'+esc(q.explain)+'</div></div>';
    });
    html+='</section>';
    sp.innerHTML=html;
    var rb=document.getElementById('btnRedoWrong');
    if(rb) rb.addEventListener('click',function(){
      mode='exam';
      document.querySelectorAll('#modeSwitch button').forEach(function(x){x.classList.toggle('on',x.dataset.mode==='exam');});
      showExamPanel();
    });
    var bb=document.getElementById('btnWrongBack');
    if(bb) bb.addEventListener('click',goHome);
  }
  /* 整卷测评（限定当前分类） */
  var exam={qs:[],idx:0,answers:[],timer:null,startTs:0};
  function startExam(){
    var n=parseInt(document.getElementById('examCount').value,10)||0;
    var pool = currentCat===WRONG ? wrongPool() : DATA.questions.filter(function(q){return q.category===currentCat});
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
    if(n>0) pool=pool.slice(0,n);
    if(!pool.length){ alert(currentCat===WRONG?'当前没有错题':'该分类没有题目'); return; }
    exam.qs=pool; exam.idx=0; exam.answers=pool.map(function(){return [];}); exam.startTs=Date.now();
    document.getElementById('examSetup').hidden=true;
    document.getElementById('examRun').hidden=false;
    document.getElementById('examResult').hidden=true;
    clearInterval(exam.timer); exam.timer=setInterval(tick,1000); tick();
    renderExam();
  }
  function tick(){ var s=Math.floor((Date.now()-exam.startTs)/1000);
    document.getElementById('exTimer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function renderExam(){
    var q=exam.qs[exam.idx], card=document.getElementById('examCard');
    document.getElementById('exIdx').textContent=exam.idx+1;
    document.getElementById('exTotal').textContent=exam.qs.length;
    document.getElementById('exDone').textContent=exam.answers.filter(function(a){return a&&a.length>0}).length;
    var cur=exam.answers[exam.idx]||[];
    var opts=q.options.map(function(o,i){
      return '<button class="optbtn'+(cur.indexOf(i)>=0?' sel':'')+'" data-i="'+i+'"><span class="k">'+String.fromCharCode(65+i)+'</span>'+esc(o)+'</button>';
    }).join('');
    var hint=q.multi?'<p style="margin:0 0 10px;font-size:12.5px;color:#b06f1a">多选题：可点选多项</p>':'';
    card.innerHTML='<p class="q-stem">'+esc(q.stem)+'</p>'+hint+opts;
    card.querySelectorAll('.optbtn').forEach(function(b){
      b.addEventListener('click',function(){
        var i=Number(b.dataset.i), arr=exam.answers[exam.idx]||[];
        if(q.multi){ var p=arr.indexOf(i); if(p>=0) arr.splice(p,1); else arr.push(i); }
        else { arr=[i]; }
        exam.answers[exam.idx]=arr; renderExam();
      });
    });
    document.getElementById('btnPrev').disabled=exam.idx===0;
    document.getElementById('btnNextQ').textContent=exam.idx+1<exam.qs.length?'下一题':'已是最后一题';
    document.getElementById('btnNextQ').disabled=exam.idx+1>=exam.qs.length;
  }
  function sameSet(a,b){
    a=(a||[]).slice().sort(function(x,y){return x-y}); b=(b||[]).slice().sort(function(x,y){return x-y});
    if(a.length!==b.length) return false;
    for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
  }
  function letters(arr){ return (arr||[]).map(function(a){return String.fromCharCode(65+a)}).join('、') || '—'; }
  function submitExam(){
    var un=exam.answers.filter(function(a){return !a||a.length===0}).length;
    if(un>0 && !confirm('还有 '+un+' 题未作答，确定交卷？')) return;
    clearInterval(exam.timer);
    var total=exam.qs.length, ok=0, rows='';
    exam.qs.forEach(function(q,i){
      var pick=exam.answers[i]||[], good=sameSet(pick,q.answer); if(good) ok++;
      progress[q.key]={correct:good, ts:Date.now(), pick:pick.slice()};
      if(good){ delete wrongSet[q.key]; } else { wrongSet[q.key]=1; }
      rows+='<div class="res-item"><p style="margin:0 0 6px;font-weight:650">'+(i+1)+'. '+esc(q.stem)+
        '<span class="res-badge '+(good?'ok':'no')+'">'+(pick.length===0?'未答':(good?'正确':'错误'))+'</span></p>'+
        '<div style="font-size:13px;color:#5a6472">你选：'+letters(pick)+'　正确答案：'+letters(q.answer)+'</div>'+
        '<div style="margin-top:6px;padding:8px 11px;border-radius:8px;background:#f7f8fd;border:1px solid #e6e9f5;font-size:13px">'+esc(q.explain)+'</div></div>';
    });
    var rate=Math.round(ok/total*100), secs=Math.floor((Date.now()-exam.startTs)/1000);
    document.getElementById('examRun').hidden=true;
    var box=document.getElementById('examResult'); box.hidden=false;
    box.innerHTML='<div class="panel-card"><div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">'+
      '<span class="big-score">'+ok+' / '+total+'</span>'+
      '<span style="color:var(--muted)">正确率 <b style="color:var(--text)">'+rate+'%</b> · 用时 '+
      String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')+'</span></div>'+
      '<div style="margin-top:16px"><button class="btn primary" id="btnAgain" type="button">再做一套</button></div></div>'+
      '<div class="panel-card"><h2 style="font-size:16px;margin:0 0 8px">逐题结果</h2>'+rows+'</div>';
    saveProgress(progress); updateWrongCount();
    document.getElementById('btnAgain').addEventListener('click',function(){ box.hidden=true; document.getElementById('examSetup').hidden=false; });
  }
  document.getElementById('modeSwitch').addEventListener('click',function(e){
    var b=e.target.closest('button[data-mode]'); if(!b)return;
    mode=b.dataset.mode;
    this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
    if(currentCat){ if(mode==='study'){ renderStudy(); } else { showExamPanel(); } }
  });
  document.getElementById('btnHome').addEventListener('click',goHome);
  document.getElementById('btnWrongCenter').addEventListener('click',openWrongCenter);
  document.getElementById('btnStart').addEventListener('click',startExam);
  document.getElementById('btnPrev').addEventListener('click',function(){ if(exam.idx>0){exam.idx--;renderExam();} });
  document.getElementById('btnNextQ').addEventListener('click',function(){ if(exam.idx+1<exam.qs.length){exam.idx++;renderExam();} });
  document.getElementById('btnSubmitExam').addEventListener('click',submitExam);
  /* ===== 快捷键 ===== */
  var studyIdx=0;
  function scrollToStudy(i){
    var els=document.querySelectorAll('.study-q'); if(!els.length) return;
    studyIdx=Math.max(0,Math.min(els.length-1,i));
    els.forEach(function(el,k){el.style.boxShadow=k===studyIdx?'inset 3px 0 0 var(--brand)':'';});
    els[studyIdx].scrollIntoView({behavior:'smooth',block:'start'});
  }
  function switchMode(){
    var nb=document.querySelector('.mode-switch button[data-mode="'+(mode==='study'?'exam':'study')+'"]');
    if(nb) nb.click();
  }
  document.addEventListener('keydown',function(e){
    if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey) return;
    var t=e.target;
    if(t && (t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    var k=e.key.toLowerCase();
    if(k==='m'){ switchMode(); e.preventDefault(); return; }
    if(k==='escape'){ if(currentCat){ goHome(); e.preventDefault(); } return; }
    if(!currentCat) return;
    var examVisible=!document.getElementById('examRun').hidden;
    var studyVisible=!document.getElementById('studyPanel').hidden;
    if(examVisible){
      var q=exam.qs[exam.idx];
      function pickKey(ix){ if(ix>=q.options.length) return; var arr=(exam.answers[exam.idx]||[]).slice();
        if(q.multi){ var p=arr.indexOf(ix); if(p>=0) arr.splice(p,1); else arr.push(ix); } else { arr=[ix]; }
        exam.answers[exam.idx]=arr; renderExam(); }
      if(/^[a-d]$/.test(k)){ pickKey(k.charCodeAt(0)-97); e.preventDefault(); return; }
      if(/^[1-4]$/.test(k)){ pickKey(parseInt(k,10)-1); e.preventDefault(); return; }
      if(k==='arrowleft'||k==='k'||k==='p'){ if(exam.idx>0){exam.idx--;renderExam();e.preventDefault();} return; }
      if(k==='arrowright'||k==='j'||k==='n'){ if(exam.idx+1<exam.qs.length){exam.idx++;renderExam();e.preventDefault();} return; }
      if(k==='enter'){ if(exam.idx+1<exam.qs.length){exam.idx++;renderExam();} else {submitExam();} e.preventDefault(); return; }
    } else if(studyVisible){
      if(k==='arrowright'||k==='j'||k==='n'){ scrollToStudy(studyIdx+1); e.preventDefault(); return; }
      if(k==='arrowleft'||k==='k'||k==='p'){ scrollToStudy(studyIdx-1); e.preventDefault(); return; }
    }
  });
  fetch('../assets/quiz.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    DATA=d; renderHome(); updateWrongCount();
  }).catch(function(e){
    document.getElementById('catGrid').innerHTML='<div class="empty">题库加载失败：'+esc(e.message)+'</div>';
  });
})();
</script>
</body>
</html>
