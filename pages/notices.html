<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>重要通知 · InterviewForge</title>
<script src="../assets/time-utils.js?v=2"></script>
<script src="../assets/ui.js?v=1"></script>
<style>
:root{
  color-scheme:light dark;
  --bg:#edf0f8;--panel:#fff;--soft:#f2f4fb;--text:#172033;--muted:#647188;
  --line:#d6dded;--brand:#5654d4;--brand-soft:#eeedff;--danger:#c1363e;--danger-soft:#fdecec;
  --radius-3:14px;--radius-4:20px;--shadow:0 14px 38px rgba(31,42,68,.075)
}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--panel:#181e29;--soft:#141a24;--text:#edf2fb;--muted:#a7b2c4;
--line:rgba(148,163,190,.22);--brand:#b2b0ff;--brand-soft:#292955;--danger:#ff969d;--danger-soft:#3a1f24;
--shadow:0 18px 46px rgba(0,0,0,.22)}}
html[data-theme="light"]{color-scheme:light;--bg:#edf0f8;--panel:#fff;--soft:#f2f4fb;--text:#172033;--muted:#647188;
--line:#d6dded;--brand:#5654d4;--brand-soft:#eeedff;--danger:#c1363e;--danger-soft:#fdecec;--shadow:0 14px 38px rgba(31,42,68,.075)}
html[data-theme="dark"]{color-scheme:dark;--bg:#0f131b;--panel:#181e29;--soft:#141a24;--text:#edf2fb;--muted:#a7b2c4;
--line:rgba(148,163,190,.22);--brand:#b2b0ff;--brand-soft:#292955;--danger:#ff969d;--danger-soft:#3a1f24;--shadow:0 18px 46px rgba(0,0,0,.22)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.7 "Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
/* 底部 padding 预留右下角认证胶囊 + 反馈球 + AI 启动器的占位高度，
 * 否则浮动控件会压住内容卡片的最后一段。 */
.shell{width:min(100% - 28px,1420px);margin:auto;padding:22px 0 calc(64px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.top-sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top a.back{color:var(--brand);text-decoration:none;font-weight:600;font-size:14px}
.top a.back:hover{text-decoration:underline}
.open-new{padding:6px 11px;border:1px solid color-mix(in srgb,var(--brand) 34%,var(--line));border-radius:8px;
  background:var(--panel);color:var(--brand);font:inherit;font-size:13px;cursor:pointer}
.open-new:hover{background:var(--brand-soft)}
.open-new:focus-visible,.notice-item:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 40%,transparent);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:16px;align-items:stretch;
  min-height:calc(100vh - 190px)}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-4);
  background:var(--panel);box-shadow:var(--shadow);min-width:0}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 10px}
.side-head h2{margin:0;font-size:15px;font-weight:750}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-filter{padding:0 16px 12px}
.side-filter input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:10px;
  background:var(--soft);color:var(--text);font:inherit;font-size:13.5px}
.side-filter input:focus{outline:none;border-color:var(--brand)}
.notice-list{list-style:none;margin:0;padding:0 8px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.notice-item{width:100%;text-align:left;display:block;padding:10px 12px;border:1px solid transparent;
  border-radius:var(--radius-3);background:transparent;color:var(--text);font:inherit;cursor:pointer;
  transition:background-color .16s,color .16s}
.notice-item:hover{background:var(--soft)}
.notice-item[aria-current="true"]{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent);color:var(--brand)}
.notice-item .ni-title{display:flex;align-items:flex-start;gap:7px;font-size:14px;font-weight:650;line-height:1.5}
.notice-item .ni-text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.notice-item .ni-date{margin-top:2px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.notice-item[aria-current="true"] .ni-date{color:color-mix(in srgb,var(--brand) 72%,var(--muted))}
.pin{flex:none;margin-top:1px;padding:0 6px;border-radius:999px;background:var(--danger-soft);color:var(--danger);font-size:11px;font-weight:700;line-height:1.6}
.side-foot{margin-top:auto;padding:10px 16px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.empty{padding:14px 4px;color:var(--muted);font-size:13px;text-align:center}

.preview{overflow:hidden}
.frame-bar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid var(--line)}
.frame-title{min-width:0}
.frame-title strong{display:block;font-size:14px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame-title span{display:block;margin-top:1px;color:var(--muted);font-size:12px}
.frame-actions{display:flex;gap:6px;flex-wrap:wrap}
.frame-actions button{padding:4px 9px;border:1px solid var(--line);border-radius:7px;background:var(--soft);
  color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
.frame-actions button:hover{border-color:color-mix(in srgb,var(--brand) 42%,var(--line));color:var(--brand)}
.frame-wrap{position:relative;flex:1;min-height:520px;background:var(--soft)}
/* 内嵌页占满内容区，并按视口高度撑开；底部再留出认证胶囊/反馈球的高度，
 * 让最后几行正文不会被右下角浮动控件压住。 */
.frame-wrap{min-height:max(520px,calc(100vh - 236px))}
.frame-wrap iframe{display:block;width:100%;height:100%;min-height:inherit;border:0;background:var(--panel)}
.frame-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
.frame-fallback.show{display:flex}
.frame-fallback p{margin:0;color:var(--muted);font-size:13.5px;max-width:420px}
.frame-fallback a{color:var(--brand);font-weight:650}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;min-height:0}
  .notice-list{max-height:260px}
  .frame-wrap,.frame-wrap iframe{min-height:60vh}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>📢 重要通知</h1>
      <p class="top-sub">集中记录需要长期留存的公告、变更与约定；每条通知都是一份可独立打开的文档。</p>
    </div>
    <div class="top-actions">
      <button class="open-new" type="button" id="openNew">在新标签页打开</button>
      <a class="back" href="../cockpit.html">← 返回中控台</a>
    </div>
  </header>

  <div class="layout">
    <aside class="card" aria-label="通知清单">
      <div class="side-head"><h2>通知清单</h2><span class="count" id="noticeCount">0 条</span></div>
      <div class="side-filter">
        <input id="noticeFilter" type="search" placeholder="搜索标题或关键字…" aria-label="搜索通知">
      </div>
      <ul class="notice-list" id="noticeList"></ul>
      <div class="side-foot">内容来自 <code>pages/notices/</code> 下的独立页面</div>
    </aside>

    <section class="card preview" aria-label="通知内容">
      <div class="frame-bar">
        <div class="frame-title">
          <strong id="frameTitle">加载中…</strong>
          <span id="frameMeta"></span>
        </div>
        <div class="frame-actions">
          <button type="button" id="btnReload">刷新</button>
          <button type="button" id="btnNew">新标签打开</button>
        </div>
      </div>
      <div class="frame-wrap">
        <iframe id="noticeFrame" title="通知内容" referrerpolicy="same-origin"></iframe>
        <div class="frame-fallback" id="frameFallback">
          <p>这条通知暂时无法内嵌显示。你可以
            <a id="frameFallbackLink" href="#" target="_blank" rel="noopener noreferrer">在新标签页打开</a>。</p>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ===== 通知清单 =====
   * 新增一条通知：把 HTML 放进 pages/notices/ 下，然后在这里加一行即可。
   *   id    稳定标识（写进 URL hash，便于直接分享 ?n=xxx）
   *   title 侧栏与标题栏显示的名称
   *   date  发布日期
   *   file  相对本页的路径（同源，才能被 iframe 内嵌）
   *   pin   置顶标记（可选）
   */
  var NOTICES = [
    { id: "nju-party-training", title: "南京大学第74期入党积极分子培训班 · 结业必做清单", date: "2026-10-19", file: "notices/nju-party-training.html", pin: true },
    { id: "agent-interview-resources", title: "智能体岗位面经 · 外部资源索引（GitHub）", date: "2026-10-19", file: "notices/agent-interview-resources.html" }
  ];

  var listEl = document.getElementById("noticeList");
  var countEl = document.getElementById("noticeCount");
  var filterEl = document.getElementById("noticeFilter");
  var frame = document.getElementById("noticeFrame");
  var frameTitle = document.getElementById("frameTitle");
  var frameMeta = document.getElementById("frameMeta");
  var fallback = document.getElementById("frameFallback");
  var fallbackLink = document.getElementById("frameFallbackLink");
  var current = null;

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function currentIdFromUrl() {
    var qs = new URLSearchParams(location.search);
    var fromQuery = qs.get("n");
    if (fromQuery) return fromQuery;
    var hash = location.hash.replace(/^#/, "");
    return hash || "";
  }

  function render(keyword) {
    var kw = String(keyword || "").trim().toLowerCase();
    var visible = NOTICES.filter(function (notice) {
      return !kw || notice.title.toLowerCase().indexOf(kw) >= 0;
    });
    countEl.textContent = visible.length + " 条";
    if (!visible.length) {
      listEl.innerHTML = '<li class="empty">没有匹配的通知</li>';
      return;
    }
    listEl.innerHTML = "";
    visible.forEach(function (notice) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "notice-item";
      btn.dataset.id = notice.id;
      btn.setAttribute("aria-current", notice.id === (current && current.id) ? "true" : "false");
      btn.innerHTML =
        '<span class="ni-title">' + (notice.pin ? '<span class="pin">置顶</span>' : "") + '<span class="ni-text">' + esc(notice.title) + "</span></span>" +
        '<span class="ni-date">' + esc(notice.date || "") + "</span>";
      btn.addEventListener("click", function () { select(notice.id, true); });
      li.appendChild(btn);
      listEl.appendChild(li);
    });
  }

  function markActive() {
    listEl.querySelectorAll(".notice-item").forEach(function (el) {
      el.setAttribute("aria-current", el.dataset.id === (current && current.id) ? "true" : "false");
    });
  }

  /* iframe 一律带 embedded=1：服务端据此只注入导航策略，不再往内嵌页里塞认证胶囊/
   * 反馈球/AI 启动器，主题也跟随外层。否则外层壳页已有一套 fixed 定位控件，
   * iframe 内再来一套，就会在右下角叠成两层。 */
  function frameSrc(file, bustCache) {
    var query = ["embedded=1"];
    if (bustCache) query.push("t=" + Date.now());
    return file + (file.indexOf("?") >= 0 ? "&" : "?") + query.join("&");
  }

  function select(id, pushUrl) {
    var notice = NOTICES.filter(function (item) { return item.id === id; })[0] || NOTICES[0];
    if (!notice) {
      frameTitle.textContent = "暂无通知";
      frameMeta.textContent = "";
      frame.removeAttribute("src");
      return;
    }
    current = notice;
    fallback.classList.remove("show");
    frameTitle.textContent = notice.title;
    frameMeta.textContent = (notice.date ? notice.date + " · " : "") + notice.file;
    frame.src = frameSrc(notice.file, false);
    fallbackLink.href = notice.file;
    markActive();
    if (pushUrl) {
      var url = new URL(location.href);
      url.searchParams.set("n", notice.id);
      url.hash = "";
      history.replaceState(null, "", url.pathname + url.search);
    }
  }

  frame.addEventListener("load", function () {
    // 浏览器对“同源但不存在”的地址也会触发 load；用 contentDocument 探测是否真的载入了页面。
    var ok = false;
    try { ok = !!(frame.contentDocument && frame.contentDocument.body); } catch (e) { ok = false; }
    if (!ok) fallback.classList.add("show");
  });
  frame.addEventListener("error", function () { fallback.classList.add("show"); });

  filterEl.addEventListener("input", function () { render(filterEl.value); });

  document.getElementById("btnReload").addEventListener("click", function () {
    if (current) frame.src = frameSrc(current.file, true);
  });
  function openCurrent() {
    if (!current) return;
    window.open(current.file, "_blank", "noopener");
  }
  document.getElementById("btnNew").addEventListener("click", openCurrent);
  document.getElementById("openNew").addEventListener("click", openCurrent);

  window.addEventListener("hashchange", function () { select(currentIdFromUrl(), false); });

  render("");
  select(currentIdFromUrl(), false);
})();
</script>
</body>
</html>
