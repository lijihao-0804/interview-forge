<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>学习记录 · InterviewForge</title>
<style>
:root{color-scheme:light dark;--bg:#f3f5fa;--panel:#fff;--soft:#f7f8fc;--text:#172033;--muted:#647188;--line:#dce2ec;--brand:#5755d4;--brand-soft:#eeedff;--success:#13764b;--danger:#c1363e}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--panel:#181e29;--soft:#141a24;--text:#edf2fb;--muted:#a7b2c4;--line:#313b4c;--brand:#b2b0ff;--brand-soft:#292955;--success:#79d8a8;--danger:#ff969d}}
*{box-sizing:border-box}
body{margin:0;color:var(--text);background:var(--bg);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}
.shell{width:min(100% - 28px,1080px);margin:auto;padding:22px 0 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:26px}
.top a{color:var(--brand);text-decoration:none}
.top a:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat strong{display:block;margin-top:3px;font-size:22px;font-variant-numeric:tabular-nums}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.card{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.card h2{margin:0 0 12px;font-size:17px}
ul{list-style:none;margin:0;padding:0}
li{padding:8px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.day{display:flex;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:12px}
.empty{padding:10px 0;color:var(--muted)}
.status-pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:650}
.status-pill.ac{color:var(--success);background:color-mix(in srgb,var(--success) 14%,var(--panel))}
.status-pill.wa{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--panel))}
.submit-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.notice{margin:0 0 16px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--danger) 7%,var(--panel))}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><h1>学习记录</h1><a href="../index.html">← 返回学习面板</a></header>
  <div id="notice" class="notice" hidden>数据库没有启动。请通过“启动学习站.cmd”访问，记录才会读取到。</div>
  <section class="stats" aria-label="学习统计">
    <div class="stat"><span>今天看题</span><strong id="todayViewed">0</strong></div>
    <div class="stat"><span>今天完成</span><strong id="todayRounds">0</strong></div>
    <div class="stat"><span>已刷题目</span><strong id="completedCount">0</strong></div>
    <div class="stat"><span>连续学习</span><strong id="streakCount">0</strong></div>
  </section>
  <div class="columns">
    <section class="card" aria-label="全部学习日">
      <h2>全部学习日（含提交）</h2>
      <ul id="dayList"></ul>
    </section>
    <section class="card" aria-label="最近活动">
      <h2>最近活动</h2>
      <ul id="eventList"></ul>
    </section>
  </div>
  <section class="card" style="margin-top:16px" aria-label="最近力扣提交">
    <h2>力扣提交记录（全部）</h2>
    <ul id="submitList"></ul>
  </section>
</div>
<script>
function esc(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function localTime(value){if(!value)return '尚无记录';const date=new Date(value);return `${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`}
async function load(){
  const dayList=document.getElementById('dayList');
  const eventList=document.getElementById('eventList');
  const submitList=document.getElementById('submitList');
  const notice=document.getElementById('notice');
  try{
    const [dashboardResponse,manifestResponse]=await Promise.all([
      fetch('/api/dashboard',{cache:'no-store'}),
      fetch('../library/manifest.json',{cache:'no-store'})
    ]);
    if(!dashboardResponse.ok||!manifestResponse.ok)throw new Error('unavailable');
    const data=await dashboardResponse.json();
    const manifest=await manifestResponse.json();
    const hotModule=(manifest.modules||[]).find(module=>module.id==='hot100');
    const byKey=new Map((hotModule?.chapters||[]).map(chapter=>[chapter.id,chapter]));
    const problemInfo=(pid)=>{
      const key=`hot100:${String(pid).padStart(4,'0')}`;
      const chapter=byKey.get(key);
      if(!chapter)return null;
      return {title:chapter.title,url:chapter.url.replace(/^\.\.\//,'')};
    };
    const summary=data.summary||{};
    document.getElementById('todayViewed').textContent=summary.today_viewed||0;
    document.getElementById('todayRounds').textContent=summary.today_rounds||0;
    document.getElementById('completedCount').textContent=summary.completed_problems||0;
    document.getElementById('streakCount').textContent=summary.streak||0;
    const allDays=(data.activity||[]).filter(day=>day.viewed||day.rounds||day.submits).reverse();
    dayList.innerHTML=allDays.length?allDays.map(day=>`<li><div class="day"><strong>${esc(day.date||day.study_date)}</strong><span class="muted">${day.viewed} 题 · ${day.rounds} 轮 · ${day.submits} 提交</span></div></li>`).join(''):'<li class="empty">还没有学习记录</li>';
    const events=(data.recent||[]).slice(0,20);
    eventList.innerHTML=events.length?events.map(event=>{
      const info=problemInfo(event.problem_id);
      const name=info?`<a href="${esc(info.url)}">${esc(info.title)}</a>`:`题号 ${event.problem_id}`;
      const action=event.action==='complete'?`完成第 ${event.round_no} 轮`:'打开题解';
      return `<li><div class="event-title">${name}</div><div class="muted">${esc(action)} · ${localTime(event.studied_at)}</div></li>`;
    }).join(''):'<li class="empty">打开题解后会自动记录</li>';
    const submits=(data.recent_submissions||[]);
    submitList.innerHTML=submits.length?submits.map(item=>{
      const info=problemInfo(item.problem_id);
      const name=info?`<a href="${esc(info.url)}">${esc(info.title)}</a>`:`题号 ${item.problem_id}`;
      const status=String(item.status||'').toUpperCase();
      return `<li><div class="event-title">${name}</div><div class="submit-meta"><span class="status-pill ${esc(status.toLowerCase())}">${esc(status)}</span><span class="muted">${esc(item.lang||'')} · ${localTime(item.submitted_at)}</span></div></li>`;
    }).join(''):'<li class="empty">还没有同步力扣提交记录</li>';
  }catch(_){
    notice.hidden=false;
    dayList.innerHTML='<li class="empty">无法读取记录</li>';
    eventList.innerHTML='<li class="empty">无法读取记录</li>';
    submitList.innerHTML='<li class="empty">无法读取记录</li>';
  }
}
load();
</script>
</body>
</html>
