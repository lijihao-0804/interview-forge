<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>代码纯享 · Interview Forge</title>
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/code-focus.css?v=1">
  <script defer src="../assets/vendor/highlight-11.11.1.min.js"></script>
  <script defer src="../assets/code-focus.js?v=1"></script>
</head>
<body>
  <header class="bar">
    <div class="identity">
      <a id="back" href="../index.html" aria-label="返回题目面板" title="返回题目面板">←</a>
      <h1>代码纯享</h1>
    </div>
    <div class="tools">
      <div class="font-control" role="group" aria-label="代码字号">
        <button id="smaller" type="button" aria-label="减小字号" title="减小字号">−</button>
        <output id="size-value" aria-label="当前字号">16 px</output>
        <button id="larger" type="button" aria-label="增大字号" title="增大字号">+</button>
      </div>
      <button id="copy" class="action" type="button" hidden>复制代码</button>
      <button id="edit" class="action primary" type="button" hidden>编辑代码</button>
      <button id="read" class="action primary" type="button" disabled>开始阅读</button>
    </div>
  </header>
  <main>
    <output id="notice" role="status"></output>
    <section id="editor" aria-labelledby="source-label">
      <div class="sheet-meta">
        <label id="source-label" for="source-code">源代码</label>
        <label class="language">语言
          <select id="language">
            <option value="auto">自动识别</option>
            <option value="plaintext">纯文本</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="c">C</option>
            <option value="go">Go</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="rust">Rust</option>
            <option value="kotlin">Kotlin</option>
            <option value="sql">SQL</option>
          </select>
        </label>
      </div>
      <textarea id="source-code" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="在这里输入或粘贴代码"></textarea>
    </section>
    <section id="reader" aria-label="代码阅读区" hidden>
      <div class="sheet-meta">
        <div class="file-info"><strong id="syntax"></strong><span id="line-count"></span></div>
        <span id="column-status"></span>
      </div>
      <div id="sheet" tabindex="-1"></div>
    </section>
    <noscript>请开启 JavaScript 以使用自动分栏。</noscript>
  </main>
</body>
</html>
