<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>代码纯享 · 发布页 · Interview Forge</title>
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <script src="../assets/theme-toggle.js?v=3" data-theme-control="focus-theme"></script>
  <link rel="stylesheet" href="../assets/code-focus.css?v=4">
  <script defer src="../assets/vendor/highlight-11.11.1.min.js"></script>
  <script defer src="../assets/code-focus-display.js?v=1"></script>
  <script defer src="../assets/code-focus-live.js?v=2"></script>
</head>
<body class="publication">
  <header class="bar">
    <div class="identity">
      <a id="back" href="../cockpit.html" aria-label="返回中控台" title="返回中控台">←</a>
      <h1>代码纯享</h1><span class="publication-label">发布页</span>
    </div>
    <label class="theme-field" for="focus-theme">主题
      <select id="focus-theme">
        <option value="system">跟随系统</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </label>
    <div class="tools">
      <div class="font-control" role="group" aria-label="代码字号">
        <button id="smaller" type="button" aria-label="减小字号">−</button>
        <output id="size-value" aria-label="当前字号">16 px</output>
        <button id="larger" type="button" aria-label="增大字号">+</button>
      </div>
      <button id="copy" class="action" type="button" disabled>复制代码</button>
    </div>
  </header>
  <main>
    <div class="publication-meta"><span id="sync-status" role="status">正在读取发布内容…</span></div>
    <output id="notice" role="status"></output>
    <section id="answer-strip" aria-labelledby="answer-title" hidden>
      <div class="answer-entry"><strong id="answer-title">答案</strong><span id="answer-count"></span></div>
      <div id="answer-groups" role="region" aria-label="分组答案" tabindex="0"></div>
    </section>
    <section id="reader" aria-label="发布的代码" hidden>
      <div class="sheet-meta">
        <div class="file-info"><strong id="syntax"></strong><span id="line-count"></span></div>
        <span id="column-status"></span>
      </div>
      <div id="sheet" tabindex="-1"></div>
    </section>
    <p class="publication-empty" id="empty-publication" hidden>暂无发布内容。管理员点击「发布」后，代码和答案会显示在这里。</p>
    <noscript>请开启 JavaScript 以读取发布内容。</noscript>
  </main>
</body>
</html>
