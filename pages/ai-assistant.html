<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 助手 · InterviewForge</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--text:#182230;--muted:#64748b;--line:#dbe2ec;--brand:#5b43d6;--brand-soft:#eeeaff;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .shell{width:min(1180px,calc(100% - 28px));margin:30px auto 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.top h1{margin:0;font-size:28px}.top a{color:var(--brand);text-decoration:none}
    .layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;min-height:620px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #28334d0a}.sessions{padding:14px;display:flex;flex-direction:column}.session-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.session-head h2{font-size:16px;margin:0}.button{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);padding:7px 10px;cursor:pointer}.button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.button:disabled{cursor:wait;opacity:.6}.session-list{display:flex;flex-direction:column;gap:6px;overflow:auto}.session-item{border:1px solid transparent;border-radius:10px;padding:9px 10px;text-align:left;background:transparent;cursor:pointer;color:var(--text)}.session-item:hover{background:var(--brand-soft)}.session-item.active{background:var(--brand-soft);border-color:#c9c0ff}.session-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session-time{display:block;color:var(--muted);font-size:12px;margin-top:2px}.empty{color:var(--muted);font-size:13px;padding:14px 4px}.chat{display:flex;flex-direction:column;min-width:0;overflow:hidden}.chat-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.chat-head h2{margin:0;font-size:18px}.status{color:var(--muted);font-size:13px}.messages{padding:20px;flex:1;overflow:auto;min-height:420px;max-height:610px}.message{display:flex;margin:0 0 14px}.message.user{justify-content:flex-end}.message-content{max-width:min(80%,760px);min-width:0}.bubble{max-width:100%;padding:11px 14px;border-radius:14px;background:#eef2f7;white-space:pre-wrap;overflow-wrap:anywhere}.message.user .bubble{background:var(--brand);color:#fff}.bubble p{margin:0 0 9px}.bubble p:last-child{margin-bottom:0}.bubble ul{margin:5px 0 5px 20px;padding:0}.bubble pre{background:#111827;color:#e5e7eb;padding:11px;border-radius:9px;overflow:auto;white-space:pre}.bubble code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.92em}.bubble :not(pre)>code{background:#e7eaf0;color:#273142;padding:1px 4px;border-radius:4px}.message.user .bubble :not(pre)>code{background:#7664e5;color:#fff}.tool-status{display:flex;flex-direction:column;gap:3px;padding:5px 3px 0;color:var(--muted);font-size:12px}.tool-status-item.done{color:#16804a}.tool-status-item.error{color:var(--danger)}.composer{border-top:1px solid var(--line);padding:14px 18px}.composer textarea{width:100%;resize:vertical;min-height:74px;max-height:220px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:inherit;background:#fff}.compose-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}.hint{font-size:12px;color:var(--muted)}.error{color:var(--danger);font-size:13px}.stop{color:var(--danger);border-color:#f0b9b2;background:#fff8f7}
    @media(max-width:760px){.layout{grid-template-columns:1fr;min-height:0}.sessions{max-height:230px}.session-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.messages{min-height:380px;max-height:none}.bubble{max-width:90%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><h1>AI 助手</h1><a href="../cockpit.html" target="_blank" rel="noopener noreferrer">返回学习中控台 →</a></header>
    <div class="layout">
      <aside class="card sessions" aria-label="会话列表">
        <div class="session-head"><h2>会话</h2><button class="button primary" id="newSession" type="button">新建</button></div>
        <div class="session-list" id="sessionList"><div class="empty">正在读取…</div></div>
      </aside>
      <section class="card chat" aria-label="AI 对话">
        <header class="chat-head"><h2 id="chatTitle">选择一个会话</h2><span class="status" id="status">未连接</span></header>
        <div class="messages" id="messages"><div class="empty">新建会话后开始对话。</div></div>
        <form class="composer" id="composer">
          <textarea id="messageInput" maxlength="12000" placeholder="问问你的学习计划、错题或知识点…" disabled></textarea>
          <div class="compose-row"><span class="hint">Enter 发送，Shift+Enter 换行</span><span><button class="button stop" id="stop" type="button" hidden>停止生成</button> <button class="button primary" id="send" type="submit" disabled>发送</button></span></div>
          <div class="error" id="error" role="status" aria-live="polite"></div>
        </form>
      </section>
    </div>
  </main>
  <script src="../assets/ai-assistant.js?v=2" defer></script>
</body>
</html>
