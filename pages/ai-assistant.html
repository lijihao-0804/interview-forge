<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 助手 · InterviewForge</title>
  <script src="../assets/time-utils.js?v=2"></script>
  <link rel="stylesheet" href="../assets/ai-assistant.css?v=8">
</head>
<body>
  <main class="shell">
    <header class="top"><h1>AI 助手</h1><div class="top-actions"><button class="button" id="memoryButton" type="button">记忆</button><a href="../cockpit.html" target="_blank" rel="noopener noreferrer">← 中控台</a></div></header>
    <div class="layout">
      <aside class="card sessions" aria-label="会话列表">
        <div class="session-head"><h2>会话</h2><button class="button primary" id="newSession" type="button">新建</button></div>
        <div class="session-list" id="sessionList"><div class="empty">正在读取…</div></div>
      </aside>
      <section class="card chat" aria-label="AI 对话">
        <header class="chat-head"><h2 id="chatTitle">选择一个会话</h2><span class="status" id="status">未连接</span></header>
        <div class="messages" id="messages"><div class="empty">新建会话后开始对话。</div></div>
        <form class="composer" id="composer">
          <textarea id="messageInput" maxlength="12000" placeholder="问问你的学习计划、错题或知识点…" disabled></textarea>
          <div class="compose-row">
            <span class="hint">Enter 发送，Shift+Enter 换行</span>
            <span>
              <button class="button" id="editTurn" type="button" hidden>编辑为新消息</button>
              <button class="button primary" id="retryTurn" type="button" hidden>重试原消息</button>
              <button class="button stop" id="stop" type="button" hidden>停止生成</button>
              <button class="button primary" id="send" type="submit" disabled>发送</button>
            </span>
          </div>
          <div class="error" id="error" role="status" aria-live="polite"></div>
        </form>
      </section>
    </div>
  </main>
  <dialog class="memory-dialog" id="memoryDialog">
    <h2>长期记忆</h2>
    <p>这里显示 AI 为你保存的少量长期信息，你可以随时删除。</p>
    <div class="memory-list" id="memoryList"><div class="memory-empty">正在读取…</div></div>
    <footer><button class="button" id="memoryClose" type="button">关闭</button></footer>
  </dialog>
  <script src="../assets/ai-page-context.js?v=2" defer></script>
  <script src="../assets/ai-assistant.js?v=14" defer></script>

<script>
/* Esc 返回上级：章节→模块→书架→中控台。输入框/弹窗内不触发。 */
(function(){{
  function parentOf(){{
    var path=location.pathname;
    // 章节页 → 模块页
    if(/\/library\/[^/]+\/chapter-\d+\.html$/.test(path))return 'index.html';
    // 模块页 → 书架
    if(/\/library\/[^/]+\.html$/.test(path))return '../index.html';
    // 全文搜索 → 书架
    if(/\/library\/search\.html$/.test(path))return 'index.html';
    // 工具子页 → 工具箱
    if(/\/pages\/tools\/.*\.html$/.test(path))return '../tools.html';
    // 其它二级页 → 中控台
    if(/\/pages\/[^/]+\.html$/.test(path))return '../cockpit.html';
    return null;
  }}
  document.addEventListener('keydown',function(e){{
    if(e.key!=='Escape')return;
    // 弹窗打开时让弹窗自己处理
    var modal=document.querySelector('.ann-mask.open,.weather-modal.open,[role="dialog"]:not([hidden])');
    if(modal)return;
    var el=document.activeElement;
    var tag=el?(el.tagName||'').toLowerCase():'';
    if(tag==='input'||tag==='textarea'||tag==='select'||(el&&el.isContentEditable))return;
    var target=parentOf();
    if(target){{e.preventDefault();location.href=target;}}
  }});
}})();
</script>
</body>
</html>
