<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>编辑代码纯享 · 工具箱 · Interview Forge</title>
  <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml">
  <script src="../../assets/theme-toggle.js?v=3" data-theme-control="focus-theme"></script>
  <link rel="stylesheet" href="../../assets/code-focus.css?v=4">
  <link rel="stylesheet" href="../../assets/code-focus-editor.css?v=1">
  <script defer src="../../assets/code-focus-display.js?v=1"></script>
  <script defer src="../../assets/code-focus-editor.js?v=1"></script>
</head>
<body>
  <header class="bar">
    <div class="identity">
      <a id="back" href="../tools.html" aria-label="返回工具箱" title="返回工具箱">←</a>
      <h1>编辑代码纯享</h1>
    </div>
    <label class="theme-field" for="focus-theme">主题
      <select id="focus-theme">
        <option value="system">跟随系统</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </label>
    <a class="action primary live-link" href="../code-focus-live.html" target="_blank" rel="noopener">打开发布页 ↗</a>
  </header>
  <main>
    <p class="publish-hint">编辑后自动保存，所有打开发布页的人都会看到更新。</p>
    <div class="save-bar">
      <span id="save-status" role="status">正在读取已发布内容…</span>
      <button id="retry" class="action primary" type="button" hidden>重试</button>
    </div>
    <section id="conflict" aria-label="版本冲突" hidden>
      <details>
        <summary id="remote-version">查看线上版本</summary>
        <dl>
          <dt>语言</dt><dd id="remote-language"></dd>
          <dt>答案</dt><dd><pre id="remote-answers"></pre></dd>
          <dt>源代码</dt><dd><pre id="remote-code"></pre></dd>
        </dl>
      </details>
      <div class="tools">
        <button id="use-remote" class="action" type="button">放弃本页修改，载入线上版本</button>
        <button id="use-local" class="action primary" type="button">用编辑框内容覆盖线上版本</button>
      </div>
    </section>
    <section id="answer-strip" aria-labelledby="answer-label">
      <div class="answer-entry">
        <label id="answer-label" for="answer-input">答案</label>
        <textarea id="answer-input" rows="1" spellcheck="false" autocomplete="off" autocapitalize="characters" placeholder="如 A, BC, D（多选连写）" disabled></textarea>
        <span id="answer-count"></span>
      </div>
      <div id="answer-groups" role="region" aria-label="分组答案" tabindex="0" hidden></div>
    </section>
    <section id="editor" aria-labelledby="source-label">
      <div class="sheet-meta">
        <label id="source-label" for="source-code">源代码</label>
        <label class="language">语言
          <select id="language" disabled>
            <option value="auto">自动识别</option>
            <option value="plaintext">纯文本</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="c">C</option>
            <option value="go">Go</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="rust">Rust</option>
            <option value="kotlin">Kotlin</option>
            <option value="sql">SQL</option>
          </select>
        </label>
      </div>
      <textarea id="source-code" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="输入或粘贴要公开的代码" disabled></textarea>
    </section>
    <noscript>请开启 JavaScript 以编辑和发布内容。</noscript>
  </main>
</body>
</html>
