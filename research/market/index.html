<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AI 应用与电子信息就业研究 · InterviewForge</title><link rel="stylesheet" href="style.css"><script type="module" src="app.mjs"></script></head>
<body><main><header><a href="index.html" class="mark">InterviewForge <span>就业研究</span></a><nav><a href="report.html">研究结论</a><a href="maintenance.html">数据与维护</a><button id="theme" aria-label="切换明暗主题">◐</button></nav></header>
<section class="lead"><div><h1>AI 应用与电子信息就业研究</h1><p>从一份具体的岗位说明出发，查专业、技能、城市和雇主规模。</p></div><div class="period">扩展采集期<br><strong>2026.11.18</strong></div></section>
<section aria-label="研究方向"><div id="cards"></div></section>
<div class="workspace"><aside><div class="sectionhead"><h2>筛选岗位</h2><button id="reset">重置</button></div>
<label>关键词<input id="q" type="search" placeholder="职位、雇主或岗位编号"></label>
<label>研究方向<select id="scope"></select></label><label>专业原文口径<select id="major"></select></label>
<label>工作地点范围<select id="region"></select></label><label>工作城市或地点<input id="city" list="cityList" placeholder="输入或选择地点"><datalist id="cityList"></datalist></label>
<label>招聘雇主<input id="company" list="companyList" placeholder="输入或选择雇主"><datalist id="companyList"></datalist></label>
<label>员工规模<select id="size"></select></label><label>招聘渠道<select id="source"></select></label>
<label>职业方向<select id="career"></select></label><label>企业性质<select id="owner"></select></label>
<label>技术名称<input id="tech" list="techList" placeholder="如 LangChain、STM32"><datalist id="techList"></datalist></label>
<label>技术出现位置<select id="field"><option value="tech">任职资格</option><option value="duty_tech">工作职责</option></select></label>
<label class="check"><input id="student" type="checkbox">有学生招聘证据</label>
<label class="check"><input id="detail" type="checkbox">仅看要求具体的 JD</label>
<label class="check"><input id="active" type="checkbox">剔除明确截止或已下线</label>
</aside>
<article><div class="sectionhead"><div><h2>当前样本</h2><p id="summary" aria-live="polite">正在读取岗位索引…</p></div><button id="export" disabled>导出筛选 CSV</button></div>
<div class="graphs"><section><h3>雇主覆盖</h3><div id="companybars"></div></section><section><h3>资格段常见技术</h3><div id="skillbars"></div></section></div>
<div class="sectionhead listhead"><h2>岗位与原文</h2><span id="page"></span></div>
<div id="jobs"></div><nav class="pages"><button id="prev">上一页</button><button id="next">下一页</button></nav>
</article></div></main>
<dialog id="viewer" aria-labelledby="jobTitle"><div class="sectionhead"><small id="jobCompany"></small><button id="close">关闭</button></div><div id="body"></div></dialog></body></html>
