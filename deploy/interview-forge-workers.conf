# Optional drop-in for interview-forge.service on a single Linux host.
# Install only after backing up project data and installing requirements-server.
# This changes this project's service only; it does not modify nginx or SSH.
[Service]
Environment=IF_SHARED_RUNTIME=1
ExecStart=
ExecStart=/opt/interview-forge/.venv/bin/python -m uvicorn interview_forge.api.app:app --host 127.0.0.1 --port 8765 --workers 4 --proxy-headers --forwarded-allow-ips=127.0.0.1
