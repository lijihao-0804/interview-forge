# Only the InterviewForge virtual host; do not replace nginx.conf.
upstream interview_forge_http {
    server 127.0.0.1:8765;
    keepalive 32;
}

# No cookies, query strings, request bodies or client IPs in this timing log.
log_format interview_forge_timing escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"request_time":"$request_time",'
    '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
    '"connection_requests":"$connection_requests","request_id":"$upstream_http_x_request_id"}';

server {
    server_name hot100.xyz www.hot100.xyz;
    access_log /var/log/nginx/hot100-access.log interview_forge_timing;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # Versioned public assets are immutable; unversioned assets revalidate.
    # Only assets are served directly: books/data/docs still use the app gate.
    location /assets/ {
        alias /opt/interview-forge/assets/;
        disable_symlinks on;
        gzip_static on;
        set $interview_forge_asset_cache "public, max-age=0, must-revalidate";
        if ($arg_v != "") {
            set $interview_forge_asset_cache "public, max-age=604800, immutable";
        }
        add_header Cache-Control $interview_forge_asset_cache;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    }

    location ~ /\. {
        return 404;
    }

    location / {
        proxy_pass http://interview_forge_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/hot100.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hot100.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name hot100.xyz www.hot100.xyz;
    access_log /var/log/nginx/hot100-access.log interview_forge_timing;
    return 301 https://$host$request_uri;
}
