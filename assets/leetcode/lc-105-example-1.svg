<svg xmlns="http://www.w3.org/2000/svg" width="220" height="223" viewBox="0 0 280 284" role="img" aria-labelledby="tree-title tree-desc">
  <title id="tree-title">示例 1 构造出的二叉树</title>
  <desc id="tree-desc">根节点 3，左子节点 9，右子节点 20；20 的左子节点是 15，右子节点是 7。</desc>
  <g fill="none" stroke="#111827" stroke-linecap="round" stroke-width="3">
    <path d="M110 31 31 151M110 31l70 120M180 151 96 250M180 151l66 99"/>
  </g>
  <g fill="#fff" stroke="#111827" stroke-width="3">
    <circle cx="110" cy="31" r="29"/>
    <circle cx="31" cy="151" r="29"/>
    <circle cx="180" cy="151" r="29"/>
    <circle cx="96" cy="250" r="29"/>
    <circle cx="246" cy="250" r="29"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="110" y="31">3</text>
    <text x="31" y="151">9</text>
    <text x="180" y="151">20</text>
    <text x="96" y="250">15</text>
    <text x="246" y="250">7</text>
  </g>
</svg>
