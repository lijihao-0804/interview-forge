<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 251 · 展开二维向量 · 交互演示</title></head><body><div id="app"></div><script type="application/json" id="problemExample">{"no": "251", "title": "展开二维向量", "tag": "设计", "example": "输入 [[],[3],[],[4,5]]，连续读取为 3、4、5；读取前多次询问 hasNext 不会跳过 3。", "frames": [{"label": "初始游标 (0,0)", "state": "[[],[3],[],[4,5]] 保留原来的四行。", "why": "暂时无需复制元素；只有在读取或探测时才跳过耗尽的行。", "cells": ["row=0", "col=0", "[]"], "code": [" 3          self.rows = vec", " 4          self.row = self.col = 0"]}, {"label": "连续探测", "state": "第一次 hasNext 跳到 (1,0)，第二次仍停在 3。", "why": "只调整到合法位置，不消费该元素。", "cells": ["row=1", "col=0", "值 3"], "code": [" 7          while self.row \u003c len(self.rows) and self.col == len(self.rows[self.row]):", " 8              self.row += 1", " 9              self.col = 0", "10          return self.row \u003c len(self.rows)"]}, {"label": "跨过第二个空行", "state": "取 3 后当前行耗尽，再次探测跳到 (3,0)。", "why": "跳过空行后，从末行按列返回 4 和 5。", "cells": ["3 已读", "row=3", "[4,5]"], "code": ["15          value = self.rows[self.row][self.col]", "16          self.col += 1", "17          return value", " 7          while self.row \u003c len(self.rows) and self.col == len(self.rows[self.row]):", " 8              self.row += 1", " 9              self.col = 0"]}, {"label": "游标越过末行", "state": "末行耗尽，row=4；hasNext 返回 false。", "why": "行游标等于外层长度，所有非空行均已消费。", "cells": ["row=4", "false"], "code": ["10          return self.row \u003c len(self.rows)"]}]}</script><script src="../../../books/hot100/05-可视化/assets/demo-kit.js?v=4f7718dbde1a"></script><script src="../../../books/hot200-extra/executions/251.js?v=01d9f5bb3143"></script><script src="../../../assets/hot200-example.js?v=1eed5ebc2351"></script></body></html>
