<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 276 · 栅栏涂色 · 交互演示</title></head><body><div id="app"></div><script type="application/json" id="problemExample">{"no": "276", "title": "栅栏涂色", "tag": "动态规划", "example": "n=3、k=2 时共有 8 种无约束排列，删去两种全同色，答案为 6。", "frames": [{"label": "初始化滚动状态", "state": "k=2 时，older=f(1)=2，previous=f(2)=4。", "why": "前两根最多同色两次，所有涂法均合法。", "cells": ["older=2", "previous=4"], "code": [" 5          older, previous = k, k * k"]}, {"label": "算出第三项", "state": "末根单独换色贡献 4，末尾连续两根同色贡献 2。", "why": "两类末段互斥，乘上不同于前一色的 k−1 个选择。", "cells": ["(4+2)×1", "新值=6"], "code": [" 7              older, previous = previous, (older + previous) * (k - 1)"]}, {"label": "滚动前移", "state": "older 接收旧值 4，previous 接收新值 6，返回 6。", "why": "下一轮只需要最近两项。", "cells": ["older=4", "previous=6", "输出 6"], "code": [" 7              older, previous = previous, (older + previous) * (k - 1)", " 8          return previous"]}]}</script><script src="../../../books/hot100/05-可视化/assets/demo-kit.js?v=4f7718dbde1a"></script><script src="../../../books/hot200-extra/executions/276.js?v=e3e8ff5ead38"></script><script src="../../../assets/hot200-example.js?v=1eed5ebc2351"></script></body></html>
