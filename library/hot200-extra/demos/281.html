<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 281 · 锯齿迭代器 · 交互演示</title></head><body><div id="app"></div><script type="application/json" id="problemExample">{"no": "281", "title": "锯齿迭代器", "tag": "设计", "example": "两个输入 [4,9,8]、[2] 依次产生 4、2、9、8。读完第四项后 hasNext 返回 false。", "frames": [{"label": "第一组先出", "state": "A=[4,9,8]，B=[2]，先输出 4", "why": "A 还有 9、8，轮次交给 B。", "cells": ["输出 4", "A:9,8", "B:2"], "code": [" 9              for i in itertools.count():", "10                  for v in v1, v2:", "11                      if i \u003c len(v):", "12                          yield v[i]"]}, {"label": "第二组耗尽", "state": "已输出 [4,2]，B 没有下一项", "why": "下一轮只有 A 能提供元素。", "cells": ["输出 2", "A:9,8", "B:空"], "code": ["10                  for v in v1, v2:", "11                      if i \u003c len(v):", "12                          yield v[i]"]}, {"label": "读完余项", "state": "再输出 9、8，剩余数 0", "why": "此时 hasNext 为 false。", "cells": ["输出 9", "输出 8", "剩余 0"], "code": ["18          self.n -= 1", "19          return next(self.vals)", "22          return self.n > 0"]}]}</script><script src="../../../books/hot100/05-可视化/assets/demo-kit.js?v=4f7718dbde1a"></script><script src="../../../books/hot200-extra/executions/281.js?v=f570b4b49b20"></script><script src="../../../assets/hot200-example.js?v=1eed5ebc2351"></script></body></html>
