<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 288 · 单词的唯一缩写 · 交互演示</title></head><body><div id="app"></div><script type="application/json" id="problemExample">{"no": "288", "title": "单词的唯一缩写", "tag": "设计", "example": "词典 [\"stone\",\"stare\",\"at\",\"at\"] 中，stone 与 stare 都是 s3e，所以查询 stone 得 false；at 重复但属于同一个词，查询 at 得 true。", "frames": [{"label": "提取不同词", "state": "词典去重后为 {stone,stare,at}", "why": "两个 at 只拥有一个词的身份。", "cells": ["stone", "stare", "at"]}, {"label": "构造缩写桶", "state": "s3e 对应两词，at 对应一词", "why": "统计冲突时只算不同身份。", "cells": ["s3e:2种", "at:1种"]}, {"label": "查询原词", "state": "stone → false，at → true", "why": "stone 与 stare 冲突，at 没有别的竞争词。", "cells": ["stone:false", "at:true"]}]}</script><script src="../../../books/hot100/05-可视化/assets/demo-kit.js"></script><script src="../../../assets/hot200-example.js"></script></body></html>
