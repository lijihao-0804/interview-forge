<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 362 · 敲击计数器 · 交互演示</title></head><body><div id="app"></div><script type="application/json" id="problemExample">{"no": "362", "title": "敲击计数器", "tag": "设计", "example": "在 1 秒记录两次、300 秒记录一次。300 秒查询为 3，301 秒查询为 1，恰好相差 300 秒的敲击已经过期。", "frames": [{"label": "同秒合并", "state": "t=1 敲两次，槽 1 记录 (1,2)", "why": "第二次命中完整时间戳，只增加次数。", "cells": ["槽1:t1", "次数2"], "code": ["10          i = timestamp % 300", "12          if self.timestamps[i] == timestamp:", "13              self.hits[i] += 1", "14          else:", "15              self.timestamps[i] = timestamp", "16              self.hits[i] = 1"]}, {"label": "第 300 秒", "state": "槽 0 记录 (300,1)，查询结果 2+1=3", "why": "300−1=299，小于 300。", "cells": ["槽0:t300", "槽1:t1", "总3"], "code": ["15              self.timestamps[i] = timestamp", "16              self.hits[i] = 1", "19          return sum(h for t, h in zip(self.timestamps, self.hits) if timestamp - t \u003c 300)"]}, {"label": "第 301 秒", "state": "槽 1 年龄 300 被排除，结果 1", "why": "第 300 秒的那次敲击仍有效。", "cells": ["年龄300", "槽0计1", "总1"], "code": ["19          return sum(h for t, h in zip(self.timestamps, self.hits) if timestamp - t \u003c 300)"]}]}</script><script src="../../../books/hot100/05-可视化/assets/demo-kit.js?v=4f7718dbde1a"></script><script src="../../../books/hot200-extra/executions/362.js?v=1ac282baf210"></script><script src="../../../assets/hot200-example.js?v=1eed5ebc2351"></script></body></html>
