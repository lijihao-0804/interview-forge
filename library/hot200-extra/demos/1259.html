<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LC 1259 · 不相交的握手 · 交互演示</title></head><body><div id="app"></div><script type="application/json" id="problemExample">{"no": "1259", "title": "不相交的握手", "tag": "数学", "example": "六个人围成一圈。固定第一人的伙伴，左右两边分别剩 0 与 4、2 与 2、4 与 0 人，计数为 2+1+2=5。", "frames": [{"label": "建立小规模状态", "state": "dp[0]=1，dp[1]=1，dp[2]=2", "why": "空区域的一种完成方式是不用再配对。", "cells": ["dp[0]=1", "dp[1]=1", "dp[2]=2"], "code": [" 8          dp = [1] + [0] * (numPeople // 2)", "11          for i in range(1, numPeople // 2 + 1):", "12              for j in range(i):", "13                  dp[i] += dp[j] * dp[i - 1 - j]", "14                  dp[i] %= MOD"]}, {"label": "让 1 握 2", "state": "左右配对数为 0、2；累计 1×2=2", "why": "另外四人可按两种方式完成。", "cells": ["1↔2", "0对/2对", "累计2"], "code": ["12              for j in range(i):", "13                  dp[i] += dp[j] * dp[i - 1 - j]"]}, {"label": "让 1 握 4", "state": "左右配对数为 1、1；累计 2+1×1=3", "why": "两侧各剩一对，选择唯一。", "cells": ["1↔4", "1对/1对", "累计3"], "code": ["12              for j in range(i):", "13                  dp[i] += dp[j] * dp[i - 1 - j]"]}, {"label": "让 1 握 6", "state": "左右配对数为 2、0；累计 3+2×1=5", "why": "六人的三个合法伙伴均已覆盖。", "cells": ["1↔6", "2对/0对", "累计5"], "code": ["12              for j in range(i):", "13                  dp[i] += dp[j] * dp[i - 1 - j]", "14                  dp[i] %= MOD", "16          return dp[numPeople // 2]"]}]}</script><script src="../../../books/hot100/05-可视化/assets/demo-kit.js?v=4f7718dbde1a"></script><script src="../../../books/hot200-extra/executions/1259.js?v=2fafb16c861e"></script><script src="../../../assets/hot200-example.js?v=1eed5ebc2351"></script></body></html>
