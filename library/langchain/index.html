<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>LangChain 入门与工程实践 · 学习书架</title><link rel="stylesheet" href="../assets/library.css?v=20260830-mobile1"></head><body><div class="shell"><header class="topbar"><a class="brand" href="../index.html">学习书架</a><nav aria-label="主导航"><a href="../search.html">全文搜索</a><a href="../../index.html">Hot 100</a></nav></header>
<header class="module-hero">
  <div>
    <h1>LangChain 入门与工程实践</h1>
    <div class="module-sub">大模型应用 · 33 章 · 支持多轮学习记录</div>
    <div class="module-about">从第一次调用模型到消息与 Runnable、工具调用、Agent、RAG 与 LangGraph，覆盖记忆、评估、生产部署和常见误区。</div>
    <div id="connection" class="connection">正在连接本地数据库</div>
  </div>
  <div class="module-stats">
    <div class="stat"><span>章数</span><strong>33</strong></div>
    <div class="stat"><span>已完成</span><strong id="completedCount">0</strong></div>
    <div class="stat"><span>累计轮次</span><strong id="totalRounds">0</strong></div>
  </div>
</header>
<div id="serverNotice" class="notice" hidden>数据库没有启动。请通过根目录中的“启动学习站.cmd”进入，记录才会写入 SQLite。</div>
<section class="module-progress" aria-labelledby="progressLabel"><div class="progress-head"><span id="progressLabel">至少完成一轮的章</span><strong id="progressText">0 / 33</strong></div><div id="progressBar" class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="33" aria-valuenow="0"><div id="progress"></div></div></section>
<section id="moduleDue" class="module-due" aria-labelledby="moduleDueTitle"><div class="due-head"><h2 id="moduleDueTitle">本模块待复习</h2><span id="moduleDueSummary" class="due-summary">正在读取…</span></div><div id="moduleDueList" class="due-list"></div></section>
<section class="module-controls" aria-label="筛选章节">
  <div class="field"><label for="search">搜索</label><input id="search" type="search" placeholder="标题、方法或简介" autocomplete="off"></div>
  <div class="field" id="topicWrap"><label for="topic">专题</label><select id="topic"><option value="">全部专题</option></select></div>
  <div class="field"><label for="status">学习轮次</label><select id="status"><option value="">全部轮次</option><option value="due">待复习</option><option value="new">尚未完成</option><option value="once">完成 1 轮</option><option value="repeat">完成 2 轮以上</option></select></div>
</section>
<section class="chapter-grid" id="chapterGrid"></section>
<div id="empty" class="empty" hidden>没有匹配的内容，请调整搜索词或筛选条件。</div>
<div id="toast" class="toast" aria-live="polite"></div></div>
<script>
const moduleId="langchain";
const chapters=[{"id": "langchain:01", "title": "LangChain 是什么", "url": "langchain/chapter-01.html", "intro": "LangChain 是一个用于构建大语言模型（LLM）应用的开源框架。它的价值不是“替代模型”，而是把模型、消息…", "href": "chapter-01.html"}, {"id": "langchain:02", "title": "安装与环境准备", "url": "langchain/chapter-02.html", "intro": "python -m venv .venv .\\.venv\\Scripts\\Activate.ps1 python…", "href": "chapter-02.html"}, {"id": "langchain:03", "title": "第一次调用模型", "url": "langchain/chapter-03.html", "intro": "from langchain.chatmodels import initchatmodel。", "href": "chapter-03.html"}, {"id": "langchain:04", "title": "消息、提示词与 Runnable", "url": "langchain/chapter-04.html", "intro": "核心消息类型如下。", "href": "chapter-04.html"}, {"id": "langchain:05", "title": "结构化输出", "url": "langchain/chapter-05.html", "intro": "业务程序通常需要可靠字段，而不是从自然语言中用正则表达式“猜 JSON”。推荐用 Pydantic 定义结构。", "href": "chapter-05.html"}, {"id": "langchain:06", "title": "工具调用", "url": "langchain/chapter-06.html", "intro": "工具是带有名称、说明和参数 schema 的可调用函数。模型只负责提出调用请求；真正执行函数的是应用或 Agen…", "href": "chapter-06.html"}, {"id": "langchain:07", "title": "Agent：让模型自主选择工具", "url": "langchain/chapter-07.html", "intro": "Agent 本质上是“模型调用工具，获得结果，再决定下一步”的循环，直到完成任务或触发停止条件。", "href": "chapter-07.html"}, {"id": "langchain:08", "title": "记忆与多轮对话", "url": "langchain/chapter-08.html", "intro": "“模型有上下文窗口”不等于“应用自动有记忆”。应用必须保存并在下一次调用时重新提供历史。", "href": "chapter-08.html"}, {"id": "langchain:09", "title": "RAG：让模型基于自己的资料回答", "url": "langchain/chapter-09.html", "intro": "RAG（Retrieval-Augmented Generation，检索增强生成）的核心是：先找到与问题相关的…", "href": "chapter-09.html"}, {"id": "langchain:10", "title": "流式输出、异步与批处理", "url": "langchain/chapter-10.html", "intro": "for chunk in model.stream(\"用三句话解释 Agent。\"): print(chunk.…", "href": "chapter-10.html"}, {"id": "langchain:11", "title": "调试、测试与安全", "url": "langchain/chapter-11.html", "intro": "启用 LangSmith 追踪后，LangChain 调用通常无需改业务代码。", "href": "chapter-11.html"}, {"id": "langchain:12", "title": "常见误区与旧教程迁移", "url": "langchain/chapter-12.html", "intro": "互联网上仍有大量 v0.x 教程使用以下名称。", "href": "chapter-12.html"}, {"id": "langchain:13", "title": "推荐学习路线", "url": "langchain/chapter-13.html", "intro": "前置要求：能运行第 3～4 章的模型调用代码，理解消息与 Runnable 管道（见 4.1、4.3）。先按第…", "href": "chapter-13.html"}, {"id": "langchain:14", "title": "深入理解 LangChain 的抽象层", "url": "langchain/chapter-14.html", "intro": "只会调用 createagent() 还不等于理解 LangChain。真正掌握它，需要看清数据在每个抽象层之间…", "href": "chapter-14.html"}, {"id": "langchain:15", "title": "Agent 内部机制与停止条件", "url": "langchain/chapter-15.html", "intro": "伪代码可以概括 createagent 的核心行为。", "href": "chapter-15.html"}, {"id": "langchain:16", "title": "上下文工程：可靠性的核心", "url": "langchain/chapter-16.html", "intro": "上下文工程不是“写一段很长的 system prompt”，而是为每一步提供正确的信息、工具与格式。", "href": "chapter-16.html"}, {"id": "langchain:17", "title": "Middleware：控制 Agent 生命周期", "url": "langchain/chapter-17.html", "intro": "Middleware 是 createagent 的生命周期扩展机制。它能在模型调用和工具执行前后读取或修改请求…", "href": "chapter-17.html"}, {"id": "langchain:18", "title": "长期记忆与状态建模", "url": "langchain/chapter-18.html", "intro": "不要把业务数据库复制成“模型记忆”。订单和余额应实时查询权威系统。", "href": "chapter-18.html"}, {"id": "langchain:19", "title": "深入 RAG：从能检索到检索正确", "url": "langchain/chapter-19.html", "intro": "RAG 的离线建库与在线问答有不同的失败模式。", "href": "chapter-19.html"}, {"id": "langchain:20", "title": "完整项目：可追踪的知识库助手", "url": "langchain/chapter-20.html", "intro": "下面给出一个最小但结构合理的项目。它索引本地 Markdown，通过检索工具回答，并支持线程级记忆、重试和调用限…", "href": "chapter-20.html"}, {"id": "langchain:21", "title": "评估、性能与生产部署", "url": "langchain/chapter-21.html", "intro": "LLM 输出具有非确定性，集成测试应更多断言结构和行为。", "href": "chapter-21.html"}, {"id": "langchain:22", "title": "建立完整心智模型：对象、数据流与选型", "url": "langchain/chapter-22.html", "intro": "前面的章节已经分别介绍了模型、Prompt、Tool、Agent、Memory 与 RAG。要形成完整知识体系…", "href": "chapter-22.html"}, {"id": "langchain:23", "title": "模型层进阶：参数、能力、多模态与降级", "url": "langchain/chapter-23.html", "intro": "Model 是整个系统中最昂贵、最不确定的依赖之一。正确做法不是只记住 invoke()，而是明确“初始化参数”…", "href": "chapter-23.html"}, {"id": "langchain:24", "title": "Prompt 工程：从字符串模板到可维护上下文", "url": "langchain/chapter-24.html", "intro": "Prompt 工程的核心不是寻找一条“万能咒语”，而是构建清楚、可测试、可版本化的上下文。好的 Prompt 让…", "href": "chapter-24.html"}, {"id": "langchain:25", "title": "Runnable 组合进阶：并行、透传、分支与容错", "url": "langchain/chapter-25.html", "intro": "Runnable 是 LangChain 最值得掌握的基础抽象。它让 Prompt、Model、Parser、R…", "href": "chapter-25.html"}, {"id": "langchain:26", "title": "LangGraph 入门：把隐式循环变成显式状态图", "url": "langchain/chapter-26.html", "intro": "createagent 已经能解决常见 Tool Agent 问题。直接使用 LangGraph 的理由不是“更…", "href": "chapter-26.html"}, {"id": "langchain:27", "title": "LangGraph 工程化：持久化、人工审批与可恢复执行", "url": "langchain/chapter-27.html", "intro": "状态图的工程价值不只在画分支，还在于把任务进度保存下来，并能在失败、人工等待或进程重启后继续。", "href": "chapter-27.html"}, {"id": "langchain:28", "title": "数据摄取与检索工程：把文档真正变成知识库", "url": "langchain/chapter-28.html", "intro": "最小 RAG 示例把几段文本直接放入内存向量库，适合学习数据流。真实知识库更困难的部分通常不是“调用向量库”，而…", "href": "chapter-28.html"}, {"id": "langchain:29", "title": "Agent 架构模式：如何控制自主性与复杂度", "url": "langchain/chapter-29.html", "intro": "Agent 不是单一架构。它只是把部分下一步决策交给模型。设计时应明确模型能决定什么、代码固定什么，以及失败后如…", "href": "chapter-29.html"}, {"id": "langchain:30", "title": "服务化与并发：把 Demo 变成可调用后端", "url": "langchain/chapter-30.html", "intro": "命令行中成功调用一次 Agent，只能证明基本链路可用。服务化还要处理输入校验、并发、超时、取消、会话隔离、错误…", "href": "chapter-30.html"}, {"id": "langchain:31", "title": "测试实战与分阶段练习", "url": "langchain/chapter-31.html", "intro": "LLM 输出有随机性，但 LLM 应用并非不可测试。应把确定性逻辑、组件契约、检索质量、Agent 轨迹和端到端…", "href": "chapter-31.html"}, {"id": "langchain:32", "title": "附录 A：如何读懂前面的 LangChain 代码", "url": "langchain/chapter-32.html", "intro": "这一附录不增加新的框架 API，而是把前面分散的代码重新翻译成自然语言。如果阅读代码时经常出现“每一行好像都认识…", "href": "chapter-32.html"}, {"id": "langchain:33", "title": "权威参考资料", "url": "langchain/chapter-33.html", "intro": "本文以以下官方页面为主要依据；LangChain 更新较快，升级依赖前应重新核对。", "href": "chapter-33.html"}];
const topics=[];
const hasTopics=topics.length>0;
const grid=document.getElementById('chapterGrid');
const empty=document.getElementById('empty');
const search=document.getElementById('search');
const topic=document.getElementById('topic');
const status=document.getElementById('status');
const toast=document.getElementById('toast');
const topicWrap=document.getElementById('topicWrap');
const connection=document.getElementById('connection');
const serverNotice=document.getElementById('serverNotice');
const moduleDue=document.getElementById('moduleDue');
const moduleDueList=document.getElementById('moduleDueList');
const state={online:false,data:{modules:{},contents:{}},due:{today:'',items:{}}};
if(!hasTopics){topicWrap.hidden=true;topicWrap.style.display='none'}
topics.forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;topic.appendChild(option)});
function esc(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function localTime(value){if(!value)return '尚无记录';const date=new Date(value);return `${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`}
function moduleInfo(){return state.data.modules[moduleId]||{completed:0,total:chapters.length}}
function contentInfo(id){return state.data.contents[id]||{rounds:0,last_activity_at:null}}
function dueInfo(id){return state.due.items[id]||null}
function renderDue(){
  if(!moduleDue)return;
  const due=state.due.items;
  const items=chapters.filter(c=>due[c.id]).map(c=>({...c,due:due[c.id],overdue:due[c.id]<state.due.today}));
  const overdueCount=items.filter(item=>item.overdue).length;
  const head=moduleDue.querySelector('.due-summary');
  if(head)head.textContent=items.length?`本模块 ${items.length} 章到期${overdueCount?`（逾期 ${overdueCount}）`:''}，完成一轮后自动推进下次复习。`:'';
  moduleDueList.innerHTML=items.length?items.map(item=>`<div class="due-item ${item.overdue?'due-overdue':''}"><a href="${esc(item.href)}" title="${esc(item.title)}">${esc(item.title)}</a><span class="due-date">${item.overdue?`逾期 ${esc(item.due)}`:`今日 ${esc(item.due)}`}</span></div>`).join(''):'<div class="due-empty">本模块暂无到期章节，完成一轮后会自动出现在这里。</div>';
}
function updateStats(){
  const info=moduleInfo();
  const rounds=chapters.reduce((sum,c)=>sum+Number(contentInfo(c.id).rounds||0),0);
  document.getElementById('completedCount').textContent=info.completed;
  document.getElementById('totalRounds').textContent=rounds;
  const percent=Math.round(info.completed/info.total*100);
  document.getElementById('progress').style.width=`${percent}%`;
  document.getElementById('progressText').textContent=`${info.completed} / ${info.total}`;
  document.getElementById('progressBar').setAttribute('aria-valuenow',String(info.completed));
}
function renderCards(){
  const query=search.value.trim().toLowerCase();
  const list=chapters.filter(c=>{
    const rounds=Number(contentInfo(c.id).rounds||0);
    const due=dueInfo(c.id);
    const isDue=Boolean(due);
    const text=`${c.title} ${c.intro||''} ${c.method||''} ${c.category||''}`.toLowerCase();
    const matchesText=!query||text.includes(query);
    const matchesTopic=!hasTopics||!topic.value||c.category===topic.value;
    const matchesStatus=!status.value||(status.value==='new'&&rounds===0)||(status.value==='once'&&rounds===1)||(status.value==='repeat'&&rounds>=2)||(status.value==='due'&&isDue);
    return matchesText&&matchesTopic&&matchesStatus;
  });
  grid.innerHTML=list.map(c=>{
    const info=contentInfo(c.id);const rounds=Number(info.rounds||0);
    const due=dueInfo(c.id);const overdue=due&&due<state.due.today;
    const meta=[];
    if(c.category)meta.push(`<span class="pill">${esc(c.category)}</span>`);
    if(c.difficulty)meta.push(`<span class="difficulty-${c.difficulty}">${esc(c.difficulty)}</span>`);
    const dueBadge=due?`<span class="due-pill ${overdue?'overdue':''}">${overdue?'逾期':'待复习'}</span>`:'';
    return `<article class="chapter-card ${rounds?'studied':''}"><div class="card-head"><h2><a href="${esc(c.href)}">${esc(c.title)}</a></h2><span class="round-count">${rounds} 轮</span>${dueBadge}</div>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}<div class="card-actions"><span class="last-study">最近：${localTime(info.last_activity_at)}</span><button class="round-button" type="button" data-chapter="${esc(c.id)}">完成一轮</button></div></article>`;
  }).join('');
  empty.hidden=list.length!==0;
  grid.querySelectorAll('[data-chapter]').forEach(button=>button.addEventListener('click',()=>completeChapter(button)));
}
async function completeChapter(button){
  const chapter=chapters.find(item=>item.id===button.dataset.chapter);
  if(!chapter){button.disabled=false;return}
  button.disabled=true;button.textContent='记录中…';toast.textContent='';
  try{
    const isProblem=Boolean(chapter.problem_id);
    const payload=isProblem?{problem_id:Number(chapter.problem_id)}:{module_id:moduleId,content_id:chapter.id};
    const response=await fetch(isProblem?'/api/complete':'/api/content/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'记录失败');
    toast.textContent=`已记录「${chapter.title}」的第 ${result.round_no} 轮`;
    await refresh();
  }catch(error){toast.textContent=`记录失败：${error.message}`;button.disabled=false;button.textContent='完成一轮'}
}
async function refresh(){
  try{
    const [libraryResponse,dailyResponse]=await Promise.all([
      fetch('/api/library',{cache:'no-store'}),
      fetch(`/api/daily?module=${encodeURIComponent(moduleId)}`,{cache:'no-store'})
    ]);
    if(!libraryResponse.ok||!dailyResponse.ok)throw new Error('database unavailable');
    state.data=await libraryResponse.json();
    const daily=await dailyResponse.json();
    state.due.today=daily.today;
    state.due.items={};
    daily.contents.forEach(item=>{state.due.items[item.content_id]=item.due_date});
    state.online=true;
    connection.classList.add('online');connection.textContent='SQLite 数据库已连接';serverNotice.hidden=true;
  }catch(error){
    state.online=false;
    state.due.today='';state.due.items={};
    connection.classList.remove('online');connection.textContent='当前是静态浏览模式';serverNotice.hidden=false;
  }
  updateStats();renderDue();renderCards();
}
search.addEventListener('input',renderCards);
[topic,status].forEach(control=>control.addEventListener('change',renderCards));
refresh();
</script></body></html>
