<header class="module-hero">

    <div class="module-about">从语法、容器与类型标注讲到调用大模型 API、FastAPI 服务和并发，最后落到完整 AI 项目结构；想用 Python 做 AI 开发可一路顺读。</div>

<div id="serverNotice" class="notice" hidden>数据库没有启动。请通过根目录中的“启动学习站.cmd”进入，记录才会写入 SQLite。</div>

<script>
const moduleId="python";
const chapters=[{"id": "python:01", "title": "准备工作：安装 Python 与开发环境", "url": "python/chapter-01.html", "intro": "很多初学者卡在“第一行代码”之前：不知道装哪个版本、用哪个编辑器、报错怎么处理。先把环境准备好，后面的学习才会顺…", "href": "chapter-01.html"}, {"id": "python:02", "title": "从第一行代码理解 Python", "url": "python/chapter-02.html", "intro": "学习 Python 时，先不要急着记 API。需要先看懂：一行代码由什么组成、解释器按什么顺序执行、名字和值是什…", "href": "chapter-02.html"}, {"id": "python:03", "title": "变量、对象、基本类型与运算符", "url": "python/chapter-03.html", "intro": "Python 的变量更准确地说是“名字”。赋值让名字绑定到对象。", "href": "chapter-03.html"}, {"id": "python:04", "title": "字符串：从创建到文本处理", "url": "python/chapter-04.html", "intro": "str 表示 Unicode 文本。字符串是不可变序列：可以读取字符、切片和调用方法，但这些操作不会原地修改原字…", "href": "chapter-04.html"}, {"id": "python:05", "title": "容器：list、tuple、dict、set", "url": "python/chapter-05.html", "intro": "容器用于把多个对象组织在一起。选择容器前先问。", "href": "chapter-05.html"}, {"id": "python:06", "title": "条件、循环与模式匹配", "url": "python/chapter-06.html", "intro": "控制流决定“哪些代码执行、执行多少次、何时停止”。", "href": "chapter-06.html"}, {"id": "python:07", "title": "函数：定义、调用、参数、返回值与作用域", "url": "python/chapter-07.html", "intro": "函数把一段有明确职责的逻辑命名，便于重复调用、测试和组合。", "href": "chapter-07.html"}, {"id": "python:08", "title": "推导式、迭代器与生成器", "url": "python/chapter-08.html", "intro": "推导式是“用一条表达式从可迭代对象生成新容器”的语法。先看最常见的形式。", "href": "chapter-08.html"}, {"id": "python:09", "title": "异常与资源管理", "url": "python/chapter-09.html", "intro": "程序执行到 raise 或运行时错误时，会创建一个异常对象并沿调用栈向上传播。若某层用 try/except 处…", "href": "chapter-09.html"}, {"id": "python:10", "title": "类、dataclass 与协议", "url": "python/chapter-10.html", "intro": "类是创建对象的模板：类定义里写“每个实例应有哪些属性和方法”，调用类时创建独立实例。", "href": "chapter-10.html"}, {"id": "python:11", "title": "类型标注", "url": "python/chapter-11.html", "intro": "类型标注不改变普通 Python 的运行行为，主要帮助 IDE、静态检查和读者理解接口。例如 def add(a…", "href": "chapter-11.html"}, {"id": "python:12", "title": "模块、包与虚拟环境", "url": "python/chapter-12.html", "intro": "import json from pathlib import Path from collections.ab…", "href": "chapter-12.html"}, {"id": "python:13", "title": "文件、路径、JSON 和 CSV", "url": "python/chapter-13.html", "intro": "from pathlib import Path。", "href": "chapter-13.html"}, {"id": "python:14", "title": "常用标准库", "url": "python/chapter-14.html", "intro": "from collections import Counter, defaultdict, deque。", "href": "chapter-14.html"}, {"id": "python:15", "title": "装饰器、闭包与上下文管理器", "url": "python/chapter-15.html", "intro": "from collections.abc import Callable from functools impo…", "href": "chapter-15.html"}, {"id": "python:16", "title": "Python 中容易踩的坑", "url": "python/chapter-16.html", "intro": "matrix = [[0, 0]] 3 matrix[0][0] = 1 print(matrix)。", "href": "chapter-16.html"}, {"id": "python:17", "title": "HTTP 与 API 基础", "url": "python/chapter-17.html", "intro": "HTTP 是客户端与服务端之间传输数据的协议：客户端发请求，服务端回响应。调用模型 API 的本质，就是向一个…", "href": "chapter-17.html"}, {"id": "python:18", "title": "调用大模型 API", "url": "python/chapter-18.html", "intro": "不同厂商 SDK 不同，但核心数据流相似。", "href": "chapter-18.html"}, {"id": "python:19", "title": "数据校验：Pydantic", "url": "python/chapter-19.html", "intro": "Pydantic 根据类型标注校验、转换和序列化外部数据。它常用于 FastAPI、配置和模型结构化输出。", "href": "chapter-19.html"}, {"id": "python:20", "title": "使用 FastAPI 编写 AI 服务", "url": "python/chapter-20.html", "intro": "安装并启动。", "href": "chapter-20.html"}, {"id": "python:21", "title": "并发模型总览", "url": "python/chapter-21.html", "intro": "并发表示多个任务在时间上重叠；并行表示同一时刻真正执行多个任务。", "href": "chapter-21.html"}, {"id": "python:22", "title": "多线程", "url": "python/chapter-22.html", "intro": "适合并发调用同步 HTTP、读取文件等 I/O 任务。", "href": "chapter-22.html"}, {"id": "python:23", "title": "多进程", "url": "python/chapter-23.html", "intro": "多进程拥有独立解释器和内存，可利用多核处理 CPU 密集任务。", "href": "chapter-23.html"}, {"id": "python:24", "title": "asyncio 异步编程", "url": "python/chapter-24.html", "intro": "事件循环在任务执行到可等待 I/O 时切换其他任务。异步适合大量网络请求，不会让 CPU 密集 Python 自…", "href": "chapter-24.html"}, {"id": "python:25", "title": "并发控制、超时、重试与限流", "url": "python/chapter-25.html", "intro": "import asyncio。", "href": "chapter-25.html"}, {"id": "python:26", "title": "流式响应与生成器", "url": "python/chapter-26.html", "intro": "流式模型常使用 Server-Sent Events（SSE）或 WebSocket。客户端不能假设每个网络分块…", "href": "chapter-26.html"}, {"id": "python:27", "title": "AI 数据处理常用工具", "url": "python/chapter-27.html", "intro": "import numpy as np。", "href": "chapter-27.html"}, {"id": "python:28", "title": "配置、日志与 Secret", "url": "python/chapter-28.html", "intro": "import os。", "href": "chapter-28.html"}, {"id": "python:29", "title": "测试、Mock 与质量工具", "url": "python/chapter-29.html", "intro": "业务函数。", "href": "chapter-29.html"}, {"id": "python:30", "title": "AI 项目结构", "url": "python/chapter-30.html", "intro": "ai-service/ ├─ pyproject.toml ├─ README.md ├─ .env.examp…", "href": "chapter-30.html"}, {"id": "python:31", "title": "完整小项目：并发模型客户端", "url": "python/chapter-31.html", "intro": "目标：并发处理多个 Prompt，同时限制并发、设置超时、重试临时错误，并保持输出顺序。示例使用模拟调用，可直接…", "href": "chapter-31.html"}, {"id": "python:32", "title": "理解大模型 API 的核心概念", "url": "python/chapter-32.html", "intro": "调用模型 API 之前，先理解几个高频概念。它们出现在几乎所有模型的文档、账单和报错里。", "href": "chapter-32.html"}, {"id": "python:33", "title": "RAG 入门：用 Python 搭建文档问答", "url": "python/chapter-33.html", "intro": "RAG（Retrieval-Augmented Generation，检索增强生成）解决“模型不知道你的私有资料…", "href": "chapter-33.html"}, {"id": "python:34", "title": "Agent 入门：工具调用与循环", "url": "python/chapter-34.html", "intro": "Agent（智能体）= 大模型 + 工具 + 循环：模型决定“下一步调用哪个工具”，程序执行工具，把结果交回模型…", "href": "chapter-34.html"}, {"id": "python:35", "title": "语法速查表", "url": "python/chapter-35.html", "intro": "label = \"yes\" if score = 0.5 else \"no\"。", "href": "chapter-35.html"}, {"id": "python:36", "title": "学习路线与关联笔记", "url": "python/chapter-36.html", "intro": "先按顺序读完第 0~12 章，重点掌握字符串、容器、函数、异常、文件、类、dataclass 和类型标注。练习…", "href": "chapter-36.html"}, {"id": "python:37", "title": "AI 术语表", "url": "python/chapter-37.html", "intro": "", "href": "chapter-37.html"}, {"id": "python:38", "title": "常见问题与故障排查", "url": "python/chapter-38.html", "intro": "ModuleNotFoundError: No module named 'httpx'。", "href": "chapter-38.html"}, {"id": "python:39", "title": "最后的判断", "url": "python/chapter-39.html", "intro": "面向 AI 开发，Python 最重要的不是记住所有语法，而是具备四层能力。", "href": "chapter-39.html"}];
const topics=[];
const hasTopics=topics.length>0;
const grid=document.getElementById('chapterGrid');
const empty=document.getElementById('empty');
const search=document.getElementById('search');
const topic=document.getElementById('topic');
const status=document.getElementById('status');
const toast=document.getElementById('toast');
const topicWrap=document.getElementById('topicWrap');
const connection=document.getElementById('connection');
const serverNotice=document.getElementById('serverNotice');
const moduleDue=document.getElementById('moduleDue');
const moduleDueList=document.getElementById('moduleDueList');
const state={online:false,data:{modules:{},contents:{}},due:{today:'',items:{}}};
if(!hasTopics){topicWrap.hidden=true;topicWrap.style.display='none'}
topics.forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;topic.appendChild(option)});
function esc(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function localTime(value){if(!value)return '尚无记录';const date=new Date(value);return `${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`}
function moduleInfo(){return state.data.modules[moduleId]||{completed:0,total:chapters.length}}
function contentInfo(id){return state.data.contents[id]||{rounds:0,last_activity_at:null}}
function dueInfo(id){return state.due.items[id]||null}
function renderDue(){
  if(!moduleDue)return;
  const due=state.due.items;
  const items=chapters.filter(c=>due[c.id]).map(c=>({...c,due:due[c.id],overdue:due[c.id]<state.due.today}));
  const overdueCount=items.filter(item=>item.overdue).length;
  const head=moduleDue.querySelector('.due-summary');
  if(head)head.textContent=items.length?`本模块 ${items.length} 章到期${overdueCount?`（逾期 ${overdueCount}）`:''}，完成一轮后自动推进下次复习。`:'';
  moduleDueList.innerHTML=items.length?items.map(item=>`<div class="due-item ${item.overdue?'due-overdue':''}"><a href="${esc(item.href)}" title="${esc(item.title)}">${esc(item.title)}</a><span class="due-date">${item.overdue?`逾期 ${esc(item.due)}`:`今日 ${esc(item.due)}`}</span></div>`).join(''):'<div class="due-empty">本模块暂无到期章节，完成一轮后会自动出现在这里。</div>';
}
function updateStats(){
  const info=moduleInfo();
  const rounds=chapters.reduce((sum,c)=>sum+Number(contentInfo(c.id).rounds||0),0);
  document.getElementById('completedCount').textContent=info.completed;
  document.getElementById('totalRounds').textContent=rounds;
  const percent=Math.round(info.completed/info.total*100);
  document.getElementById('progress').style.width=`${percent}%`;
  document.getElementById('progressText').textContent=`${info.completed} / ${info.total}`;
  document.getElementById('progressBar').setAttribute('aria-valuenow',String(info.completed));
}
function renderCards(){
  const query=search.value.trim().toLowerCase();
  const list=chapters.filter(c=>{
    const rounds=Number(contentInfo(c.id).rounds||0);
    const due=dueInfo(c.id);
    const isDue=Boolean(due);
    const text=`${c.title} ${c.intro||''} ${c.method||''} ${c.category||''}`.toLowerCase();
    const matchesText=!query||text.includes(query);
    const matchesTopic=!hasTopics||!topic.value||c.category===topic.value;
    const matchesStatus=!status.value||(status.value==='new'&&rounds===0)||(status.value==='once'&&rounds===1)||(status.value==='repeat'&&rounds>=2)||(status.value==='due'&&isDue);
    return matchesText&&matchesTopic&&matchesStatus;
  });
  grid.innerHTML=list.map(c=>{
    const info=contentInfo(c.id);const rounds=Number(info.rounds||0);
    const due=dueInfo(c.id);const overdue=due&&due<state.due.today;
    const meta=[];
    if(c.category)meta.push(`<span class="pill">${esc(c.category)}</span>`);
    if(c.difficulty)meta.push(`<span class="difficulty-${c.difficulty}">${esc(c.difficulty)}</span>`);
    const dueBadge=due?`<span class="due-pill ${overdue?'overdue':''}">${overdue?'逾期':'待复习'}</span>`:'';
    return `<article class="chapter-card ${rounds?'studied':''}"><div class="card-head"><h2><a href="${esc(c.href)}">${esc(c.title)}</a></h2><span class="round-count">${rounds} 轮</span>${dueBadge}</div>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}<div class="card-actions"><span class="last-study">最近：${localTime(info.last_activity_at)}</span><button class="round-button" type="button" data-chapter="${esc(c.id)}">完成一轮</button></div></article>`;
  }).join('');
  empty.hidden=list.length!==0;
  grid.querySelectorAll('[data-chapter]').forEach(button=>button.addEventListener('click',()=>completeChapter(button)));
}
async function completeChapter(button){
  const chapter=chapters.find(item=>item.id===button.dataset.chapter);
  if(!chapter){button.disabled=false;return}
  button.disabled=true;button.textContent='记录中…';toast.textContent='';
  try{
    const isProblem=Boolean(chapter.problem_id);
    const payload=isProblem?{problem_id:Number(chapter.problem_id)}:{module_id:moduleId,content_id:chapter.id};
    const response=await fetch(isProblem?'/api/complete':'/api/content/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'记录失败');
    toast.textContent=`已记录「${chapter.title}」的第 ${result.round_no} 轮`;
    await refresh();
  }catch(error){toast.textContent=`记录失败：${error.message}`;button.disabled=false;button.textContent='完成一轮'}
}
async function refresh(){
  try{
    const [libraryResponse,dailyResponse]=await Promise.all([
      fetch('/api/library',{cache:'no-store'}),
      fetch(`/api/daily?module=${encodeURIComponent(moduleId)}`,{cache:'no-store'})
    ]);
    if(!libraryResponse.ok||!dailyResponse.ok)throw new Error('database unavailable');
    state.data=await libraryResponse.json();
    const daily=await dailyResponse.json();
    state.due.today=daily.today;
    state.due.items={};
    daily.contents.forEach(item=>{state.due.items[item.content_id]=item.due_date});
    state.online=true;
    connection.classList.add('online');connection.textContent='SQLite 数据库已连接';serverNotice.hidden=true;
  }catch(error){
    state.online=false;
    state.due.today='';state.due.items={};
    connection.classList.remove('online');connection.textContent='当前是静态浏览模式';serverNotice.hidden=false;
  }
  updateStats();renderDue();renderCards();
}
search.addEventListener('input',renderCards);
[topic,status].forEach(control=>control.addEventListener('change',renderCards));
refresh();
</script></body></html>
