<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>小林：AI 编程面试题 · InterviewForge</title><link rel="stylesheet" href="../assets/library.css?v=20261118-reader-column"><script src="../../assets/time-utils.js?v=2"></script><script src="../../assets/guest-auth.js?v=3"></script><script src="../../assets/ui.js?v=20261112-guest-python" defer></script><script src="../../assets/navigation-policy.js?v=2" defer></script><link rel="stylesheet" data-interviewforge-ai href="../assets/ai-launcher.css?v=6"><script src="../assets/ai-page-context.js?v=4" defer data-interviewforge-ai></script><script src="../assets/ai-launcher.js?v=6" defer data-interviewforge-ai></script></head><body class="auth-checking"><div class="shell"><header class="topbar"><a class="topbar-back" href="../../cockpit.html" target="_blank" rel="noopener noreferrer">← 中控台</a><a class="brand" href="../index.html" aria-current="page" target="_blank" rel="noopener noreferrer">学习书架</a><nav aria-label="主导航"><a href="../../pages/favorites.html" target="_blank" rel="noopener noreferrer">我的收藏</a><a href="../search.html" target="_blank" rel="noopener noreferrer">全文搜索</a><a href="../../index.html" target="_blank" rel="noopener noreferrer">Hot 100</a></nav></header>

<section id="moduleDue" class="module-due auth-private" aria-labelledby="moduleDueTitle"><div class="due-head"><h2 id="moduleDueTitle">本模块待复习</h2><span id="moduleDueSummary" class="due-summary">正在读取…</span></div><div id="moduleDueList" class="due-list"></div></section>

<script>
const moduleId="xiaolin-coding";
const chapters=[{"id": "xiaolin-coding:01", "title": "AI 编程有哪些常见方式？代码补全、对话生成和 Agent 编程有什么区别？", "url": "xiaolin-coding/chapter-01.html", "intro": "👔面试官：你平时怎么用 AI 编程？代码补全、对话生成和 Agent 编程有什么区别？", "href": "chapter-01.html"}, {"id": "xiaolin-coding:02", "title": "如何向 AI 描述开发需求、约束条件和验收标准？", "url": "xiaolin-coding/chapter-02.html", "intro": "👔面试官：让 AI 帮你开发一个功能，你会怎样描述需求、约束和验收标准？", "href": "chapter-02.html"}, {"id": "xiaolin-coding:03", "title": "使用 AI 编程时，应该提供哪些代码上下文？", "url": "xiaolin-coding/chapter-03.html", "intro": "👔面试官：让 AI 修改项目代码，你会提供哪些上下文？", "href": "chapter-03.html"}, {"id": "xiaolin-coding:04", "title": "Coding Agent 如何在大型代码仓库中定位相关代码？", "url": "xiaolin-coding/chapter-04.html", "intro": "👔面试官：一个大型仓库有几十万行代码，Coding Agent 怎么找到与当前需求相关的实现？", "href": "chapter-04.html"}, {"id": "xiaolin-coding:05", "title": "Vibe Coding 和 Spec 驱动开发有什么区别？分别适合什么场景？", "url": "xiaolin-coding/chapter-05.html", "intro": "👔面试官：你怎么理解 Vibe Coding 和 Spec 驱动开发？分别适合什么场景？", "href": "chapter-05.html"}, {"id": "xiaolin-coding:06", "title": "复杂开发需求如何拆分，才能让 AI 更可靠地完成？", "url": "xiaolin-coding/chapter-06.html", "intro": "👔面试官：一个需求涉及前端、接口和数据查询，你会怎样拆给 AI 做？", "href": "chapter-06.html"}, {"id": "xiaolin-coding:07", "title": "如何保证 AI 生成代码的质量？", "url": "xiaolin-coding/chapter-07.html", "intro": "👔面试官：用 AI 生成了一段代码，怎么判断它已经达到交付要求？", "href": "chapter-07.html"}, {"id": "xiaolin-coding:08", "title": "如何审查 AI 生成的代码，发现看起来合理但实际错误的实现？", "url": "xiaolin-coding/chapter-08.html", "intro": "👔面试官：AI 写出来的代码看着挺顺，测试也通过了，你会怎样审查？", "href": "chapter-08.html"}, {"id": "xiaolin-coding:09", "title": "如何利用报错、日志和测试结果，让 AI 排查并修复问题？", "url": "xiaolin-coding/chapter-09.html", "intro": "👔面试官：AI 写的用户资料接口报错了，你会怎样让它排查和修复？", "href": "chapter-09.html"}, {"id": "xiaolin-coding:10", "title": "如何保证 AI 生成的测试用例覆盖关键业务场景？", "url": "xiaolin-coding/chapter-10.html", "intro": "👔面试官：AI 生成了一批测试，怎么判断它们覆盖了关键业务场景？", "href": "chapter-10.html"}, {"id": "xiaolin-coding:11", "title": "AI 编程的上下文越来越长时，如何保留关键信息？", "url": "xiaolin-coding/chapter-11.html", "intro": "👔面试官：一个开发需求聊了几十轮，代码、日志和方案越来越多，你怎么让 AI 继续做对？", "href": "chapter-11.html"}, {"id": "xiaolin-coding:12", "title": "Coding Agent 如何避免被过期的代码描述误导？", "url": "xiaolin-coding/chapter-12.html", "intro": "👔面试官：Coding Agent 会用函数摘要、目录说明来理解仓库，代码改了以后，怎么避免旧描述误导它？", "href": "chapter-12.html"}, {"id": "xiaolin-coding:13", "title": "跨会话继续开发时，如何让 AI 接续需求、代码状态和任务进度？", "url": "xiaolin-coding/chapter-13.html", "intro": "👔面试官：一个功能今天没做完，明天换个会话接着做，你怎么让 AI 接上？", "href": "chapter-13.html"}, {"id": "xiaolin-coding:14", "title": "AI 修改文件、执行命令和读取外部内容时，应该如何控制权限与风险？", "url": "xiaolin-coding/chapter-14.html", "intro": "👔面试官：AI 能改文件、跑命令、读网页，你怎样控制它的权限和风险？", "href": "chapter-14.html"}];
const topics=[];
const hasTopics=topics.length>0;
const grid=document.getElementById('chapterGrid');
const empty=document.getElementById('empty');
const search=document.getElementById('search');
const topic=document.getElementById('topic');
const difficulty=document.getElementById('difficulty');
const status=document.getElementById('status');
const toast=document.getElementById('toast');
const topicWrap=document.getElementById('topicWrap');
const connection=document.getElementById('connection');
const serverNotice=document.getElementById('serverNotice');
const serverRetry=document.getElementById('serverRetry');
const moduleDue=document.getElementById('moduleDue');
const moduleDueList=document.getElementById('moduleDueList');
const guestAuth=window.InterviewForgeGuestAuth;
let authStatus='checking';
const state={online:false,data:{modules:{},contents:{}},due:{today:'',items:{}}};
function fetchWithTimeout(input,options,timeout=12000){
  const controller=new AbortController();
  const request=Object.assign({},options||{},{signal:controller.signal});
  const timer=setTimeout(()=>controller.abort(),timeout);
  return fetch(input,request).finally(()=>clearTimeout(timer));
}
function paintAuthState(session){
  authStatus=session&&session.status||'error';
  document.body.classList.remove('auth-checking','is-authenticated','is-guest','auth-error');
  document.body.classList.add(authStatus==='authenticated'?'is-authenticated':authStatus==='guest'?'is-guest':'auth-error');
  const guestMode=document.getElementById('guestMode');
  guestMode.hidden=authStatus==='authenticated';
  document.getElementById('guestModeTitle').textContent=authStatus==='error'?'登录状态暂未确认':'游客模式';
  document.getElementById('guestModeCopy').textContent=authStatus==='error'
    ?'章节内容仍可直接阅读。当前网络暂时无法确认账号状态，可稍后重试，或先登录/注册；完成后会回到本页。'
    :'本模块所有章节均可直接阅读；登录后可记录轮次、收藏、安排复习并使用 AI。';
  const page=location.pathname+location.search+location.hash;
  document.getElementById('guestLoginLink').href=guestAuth.authHref('../../pages/login.html',page);
  document.getElementById('guestRegisterLink').href=guestAuth.authHref('../../pages/register.html',page);
  status.disabled=authStatus!=='authenticated';
  if(authStatus!=='authenticated'){
    state.online=false;
    connection.classList.remove('online');
    connection.textContent=authStatus==='error'?'账号状态未确认 · 章节可阅读':'游客模式 · 章节可阅读';
    renderCards();
  }
}
async function requireAuthenticated(feature){
  try{await guestAuth.requireUser(feature);return true}catch(_){return false}
}
if(!hasTopics){topicWrap.hidden=true;topicWrap.style.display='none'}
topics.forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;topic.appendChild(option)});
function esc(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function localTime(value){if(!value)return '尚无记录';return InterviewForgeTime.formatDateTime(value,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function moduleInfo(){return state.data.modules[moduleId]||{completed:0,total:chapters.length}}
function contentInfo(id){return state.data.contents[id]||{rounds:0,last_activity_at:null}}
function dueInfo(id){return state.due.items[id]||null}
function renderDue(){
  if(!moduleDue)return;
  const due=state.due.items;
  const items=chapters.filter(c=>due[c.id]).map(c=>({...c,due:due[c.id],overdue:due[c.id]<state.due.today}));
  const overdueCount=items.filter(item=>item.overdue).length;
  const head=moduleDue.querySelector('.due-summary');
  if(head)head.textContent=items.length?`本模块 ${items.length} 章到期${overdueCount?`（逾期 ${overdueCount}）`:''}，完成一轮后自动推进下次复习。`:'';
  moduleDueList.className='due-list'+(items.length>3?' is-scrollable':'');
  moduleDueList.innerHTML=items.length?items.map(item=>`<div class="due-item ${item.overdue?'due-overdue':''}"><a href="${esc(item.href)}" target="_blank" rel="noopener noreferrer" title="${esc(item.title)}">${esc(item.title)}</a><span class="due-date">${item.overdue?`逾期 ${esc(item.due)}`:`今日 ${esc(item.due)}`}</span></div>`).join(''):'<div class="due-empty">本模块暂无到期章节，完成一轮后会自动出现在这里。</div>';
}
function updateStats(){
  const info=moduleInfo();
  const rounds=chapters.reduce((sum,c)=>sum+Number(contentInfo(c.id).rounds||0),0);
  document.getElementById('completedCount').textContent=info.completed;
  document.getElementById('totalRounds').textContent=rounds;
  const percent=Math.round(info.completed/info.total*100);
  document.getElementById('progress').style.width=`${percent}%`;
  document.getElementById('progressText').textContent=`${info.completed} / ${info.total}`;
  document.getElementById('progressBar').setAttribute('aria-valuenow',String(info.completed));
}
function renderCards(){
  const query=search.value.trim().toLowerCase();
  const personal=authStatus==='authenticated'&&state.online;
  const list=chapters.filter(c=>{
    const rounds=Number(contentInfo(c.id).rounds||0);
    const due=dueInfo(c.id);
    const isDue=Boolean(due);
    const text=`${c.title} ${c.intro||''} ${c.method||''} ${c.category||''}`.toLowerCase();
    const matchesText=!query||text.includes(query);
    const matchesTopic=!hasTopics||!topic.value||c.category===topic.value;
    const matchesStatus=!status.value||(status.value==='new'&&rounds===0)||(status.value==='once'&&rounds===1)||(status.value==='repeat'&&rounds>=2)||(status.value==='due'&&isDue);
    const matchesDifficulty=!difficulty||!difficulty.value||c.difficulty===difficulty.value;
    return matchesText&&matchesTopic&&matchesStatus&&matchesDifficulty;
  });
  grid.innerHTML=list.map(c=>{
    const info=contentInfo(c.id);const rounds=Number(info.rounds||0);
    const due=dueInfo(c.id);const overdue=due&&due<state.due.today;
    const meta=[];
    if(c.category)meta.push(`<span class="pill">${esc(c.category)}</span>`);
    if(c.difficulty)meta.push(`<span class="difficulty-${c.difficulty}">${esc(c.difficulty)}</span>`);
    const dueBadge=personal&&due?`<span class="due-pill ${overdue?'overdue':''}">${overdue?'逾期':'待复习'}</span>`:'';
    const personalStatus=personal?`<span class="round-count">${rounds} 轮</span>${dueBadge}`:'<span class="guest-read-note">公开阅读</span>';
    const actions=personal
      ?`<div class="card-actions"><span class="last-study">最近：${localTime(info.last_activity_at)}</span><button class="round-button" type="button" data-chapter="${esc(c.id)}" ${state.online?'':'disabled'}>完成一轮</button></div>`
      :`<div class="card-actions"><span class="last-study">登录后可记录学习轮次与复习。</span><a class="round-button" href="${guestAuth.authHref('../../pages/login.html')}">登录后记录</a></div>`;
    return `<article class="chapter-card ${personal&&rounds?'studied':''}"><div class="card-head"><h2><a href="${esc(c.href)}" target="_blank" rel="noopener noreferrer">${esc(c.title)}</a></h2>${personalStatus}</div>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}${actions}</article>`;
  }).join('');
  empty.hidden=list.length!==0;
  grid.querySelectorAll('[data-chapter]').forEach(button=>button.addEventListener('click',()=>completeChapter(button)));
}
async function completeChapter(button,rating){
  if(!await requireAuthenticated('记录本章学习进度'))return;
  if(rating===undefined){
    const host=button.parentNode;
    if(!host)return;
    const picker=document.createElement('div');picker.className='review-rating-picker';picker.setAttribute('role','group');picker.setAttribute('aria-label','本次复习记忆情况');
    const prompt=document.createElement('span');prompt.textContent='回忆得怎样？';picker.appendChild(prompt);
    [['1','忘了'],['2','有点困难'],['3','记得'],['4','很轻松']].forEach(([grade,label])=>{
      const choice=document.createElement('button');choice.type='button';choice.textContent=label;choice.dataset.rating=grade;
      choice.addEventListener('click',()=>{picker.remove();button.hidden=false;completeChapter(button,Number(grade))});picker.appendChild(choice)
    });
    button.hidden=true;host.appendChild(picker);return
  }
  const chapter=chapters.find(item=>item.id===button.dataset.chapter);
  if(!chapter){button.disabled=false;return}
  const previousInfo=state.data.contents[chapter.id]?{...state.data.contents[chapter.id]}:null;
  const previousDue=state.due.items[chapter.id]||null;
  const currentRounds=Number(previousInfo&&previousInfo.rounds||0);
  state.data.contents[chapter.id]={...(previousInfo||{}),rounds:currentRounds+1,last_activity_at:new Date().toISOString()};
  delete state.due.items[chapter.id];
  updateStats();renderDue();renderCards();
  button.disabled=true;button.textContent='记录中…';toast.textContent='正在保存学习记录…';
  try{
    const isProblem=Boolean(chapter.problem_id);
    const payload=isProblem?{problem_id:Number(chapter.problem_id),rating}:{module_id:moduleId,content_id:chapter.id,rating};
    const response=await guestAuth.request(isProblem?'/api/complete':'/api/content/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)},'记录本章学习进度');
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'记录失败');
    const ratingName={again:'忘了',hard:'有点困难',good:'记得',easy:'很轻松'}[result.rating_name]||{1:'忘了',2:'有点困难',3:'记得',4:'很轻松'}[rating];
    toast.textContent=result.already_reviewed_today
      ?`今天已记录过「${chapter.title}」评分，沿用「${ratingName}」（${result.interval_days} 天后复习）`
      :`已记录「${chapter.title}」第 ${result.round_no} 轮（${ratingName}，${result.interval_days} 天后复习）`;
    await refresh();
  }catch(error){
    if(previousInfo)state.data.contents[chapter.id]=previousInfo;else delete state.data.contents[chapter.id];
    if(previousDue)state.due.items[chapter.id]=previousDue;
    updateStats();renderDue();renderCards();
    toast.textContent=`记录失败：${error.message}`;button.disabled=false;button.textContent='完成一轮'
  }
}
async function refresh(){
  if(authStatus!=='authenticated'){
    paintAuthState(guestAuth.getState());
    return;
  }
  try{
    const [libraryResponse,dailyResponse]=await Promise.all([
      guestAuth.request('/api/library',{cache:'no-store'},'查看学习进度'),
      guestAuth.request(`/api/daily?module=${encodeURIComponent(moduleId)}`,{cache:'no-store'},'查看复习计划')
    ]);
    if(!libraryResponse.ok||!dailyResponse.ok)throw new Error('database unavailable');
    state.data=await libraryResponse.json();
    const daily=await dailyResponse.json();
    state.due.today=daily.today;
    state.due.items={};
    daily.contents.forEach(item=>{state.due.items[item.content_id]=item.due_date});
    state.online=true;
    connection.classList.add('online');connection.textContent='学习服务已连接';serverNotice.hidden=true;
  }catch(error){
    if(error&&error.category==='unauthorized'){
      paintAuthState(guestAuth.getState());
      return;
    }
    state.online=false;
    state.due.today='';state.due.items={};
    connection.classList.remove('online');connection.textContent='暂时无法连接学习服务';serverNotice.hidden=false;
  }
  updateStats();renderDue();renderCards();
}
search.addEventListener('input',renderCards);
[topic,status,difficulty].filter(Boolean).forEach(control=>control.addEventListener('change',renderCards));
if(serverRetry)serverRetry.addEventListener('click',refresh);
let moduleSessionKey='';
function activateModuleSession(session){
  if(!session||session.status==='checking')return;
  paintAuthState(session);
  if(session.status!=='authenticated'){moduleSessionKey='';return}
  const key=String(session.user&&(session.user.id||session.user.username)||'authenticated');
  if(moduleSessionKey===key)return;
  moduleSessionKey=key;
  refresh();
}
document.addEventListener('interviewforge:auth-change',event=>{
  if(event&&event.detail&&event.detail.status!=='checking')activateModuleSession(event.detail);
});
renderCards();
guestAuth.ready().then(activateModuleSession).catch(()=>paintAuthState({status:'error',reason:'session_check_failed'}));
</script>
<script>
/* Esc 返回上级：章节→模块→书架→中控台。输入框/弹窗内不触发。 */
(function(){
  function parentOf(){
    var path=location.pathname;
    // 顺序很重要：先匹配更具体的章节页，再搜模块页，最后才是搜索页
    // 章节页：/library/<module>/chapter-NN.html → 同目录模块首页
    if(/\/library\/[^/]+\/chapter-\d+\.html$/.test(path))return 'index.html';
    // 搜索页：/library/search.html → 书架
    if(/\/library\/search\.html$/.test(path))return 'index.html';
    // 模块首页：/library/<module>/index.html → 书架（注意是两层）
    if(/\/library\/[^/]+\/index\.html$/.test(path))return '../index.html';
    return null;
  }
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(document.querySelector('[role="dialog"]:not([hidden])'))return;
    var el=document.activeElement,tag=el?(el.tagName||'').toLowerCase():'';
    if(tag==='input'||tag==='textarea'||tag==='select'||(el&&el.isContentEditable))return;
    var target=parentOf();
    if(target){e.preventDefault();location.href=target;}
  });
})();
</script>
